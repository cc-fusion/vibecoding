<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>mpm.js | Plain JavaScript Example</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f4ee;
        color: #242720;
        font:
          15px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 1050px;
        margin: 50px auto;
        padding: 0 24px;
      }
      h1 {
        font-size: 42px;
        letter-spacing: -2px;
        margin-bottom: 0;
      }
      p {
        color: #6c7067;
      }
      canvas {
        display: block;
        width: 100%;
        height: 480px;
        background: #20231e;
        border-radius: 8px;
      }
      nav {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 24px 0;
      }
      button,
      select {
        font: inherit;
        padding: 9px 15px;
        border: 1px solid #d8d9d0;
        border-radius: 5px;
        background: #fff;
        color: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #eaeae0;
      }
      #status {
        font-family: monospace;
        font-size: 12px;
      }
      a {
        color: #c65a38;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>mpm.js</h1>
      <p>
        Real material physics. Plain HTML and JavaScript. Click and drag to
        pour.
      </p>
      <nav aria-label="Simulation controls">
        <select id="scene" aria-label="Scene"></select>
        <button id="play">Pause</button>
        <button id="reset">Reset</button>
        <button id="wheel">Add automatic wheel</button>
        <button id="gravity">Toggle gravity</button>
      </nav>
      <canvas id="world" aria-label="Interactive material simulation"></canvas>
      <p id="status" role="status">
        Initializing the original WebAssembly solver...
      </p>
      <p>
        <a href="../downloads/DOCUMENTATION.md"
          >Read the Markdown documentation</a
        >
      </p>
    </main>
    <script src="../downloads/mpm.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
