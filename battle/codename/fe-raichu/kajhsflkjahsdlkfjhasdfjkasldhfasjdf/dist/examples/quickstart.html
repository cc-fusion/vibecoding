<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaichiMPM — Script tag example</title><style>body{font-family:system-ui;margin:0;background:#f7f6fb;color:#343047;padding:28px}h1{font-size:25px;letter-spacing:-.8px}p{color:#83788b;font-size:13px}#simulation{height:440px;width:100%;max-width:1000px;border-radius:12px;overflow:hidden;background:#101722;margin-top:20px}canvas{display:block;width:100%;height:100%}button{border:1px solid #d8c9e9;border-radius:6px;background:#f8f3ff;color:#8762a7;padding:9px 12px;cursor:pointer;margin:4px}#stats{font-family:monospace;font-size:11px;color:#93819d;margin-top:15px}</style></head>
<body><h1>A little physics. One script tag.</h1><p>Click or drag to emit particles. Change the world while it runs.</p><div id="simulation"></div><div><button id="pause">Pause</button><button id="reset">Reset</button><button id="wheel">Reverse wheel</button><button id="gravity">Zero gravity</button></div><div id="stats">Preparing WebAssembly…</div>
<script src="../taichi-mpm.js"></script>
<script type="module">
const scene = {...TaichiMPM.starterScene, id:'quickstart', name:'Your first scene'};
const sim = await TaichiMPM.create({ container:'#simulation', scene, autoPlay:true, quality:'low' });
window.sim = sim;
sim.on('stats',s=>{document.querySelector('#stats').textContent=`${s.particles.toLocaleString()} particles · ${s.t.toFixed(2)} s · ${Math.round(s.memoryMB)} MB`;});
sim.on('state',({running})=>{document.querySelector('#pause').textContent=running?'Pause':'Play';});
sim.on('error',error=>{document.querySelector('#stats').textContent=error.message;});
document.querySelector('#pause').onclick=()=>sim.running?sim.pause():sim.play();
document.querySelector('#reset').onclick=()=>sim.reset({autoPlay:true});
let direction=90;document.querySelector('#wheel').onclick=()=>{direction=-direction;sim.update({wheelSpeed:direction,automaticWheel:true});};
document.querySelector('#gravity').onclick=()=>sim.update({gravity:0});
</script>
</body></html>
