<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff;
    --fg: #171717;
    --muted: #8a8a8a;
    --ghost: #9a9a9a;
    --bar: rgba(248, 248, 248, .94);
    --chip: #ececec;
    --chip-hover: #e2e2e2;
    --chip-active: #d9e6ff;
    --border: rgba(0, 0, 0, .1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --fg: #eee;
      --muted: #858585;
      --ghost: #707070;
      --bar: rgba(24, 24, 24, .95);
      --chip: #292929;
      --chip-hover: #333;
      --chip-active: #263b61;
      --border: rgba(255, 255, 255, .11);
    }
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
  }

  #editor {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--bg);
  }

  #mirror,
  #text {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 18px 18px 64px;
    border: 0;
    outline: 0;
    resize: none;
    tab-size: 4;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: normal;
    font: 16px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
      "Liberation Mono", "Courier New", monospace;
  }

  #mirror {
    z-index: 0;
    overflow: hidden;
    color: transparent;
    pointer-events: none;
  }

  #mirror .ghost {
    color: var(--ghost);
    opacity: .78;
  }

  #text {
    z-index: 1;
    display: block;
    color: var(--fg);
    background: transparent;
    caret-color: var(--fg);
    scrollbar-color: var(--muted) transparent;
  }

  #bar {
    position: fixed;
    z-index: 5;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: 3px;
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--bar);
    border-top: 1px solid transparent;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  #bar.has-items {
    border-top-color: var(--border);
  }

  #strip {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    padding: 6px 9px;
    touch-action: pan-x;
  }

  #strip:empty {
    display: none;
  }

  #strip::-webkit-scrollbar {
    display: none;
  }

  .chip {
    flex: 0 0 auto;
    min-height: 34px;
    max-width: min(520px, 78vw);
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--fg);
    background: var(--chip);
    font: 13px/1.3 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
      "Liberation Mono", "Courier New", monospace;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .chip:hover {
    background: var(--chip-hover);
  }

  .chip.selected {
    background: var(--chip-active);
  }

  .chip-inner {
    display: flex;
    align-items: baseline;
    min-width: 0;
    gap: 7px;
  }

  .chip-equation {
    display: block;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .chip .typed {
    color: var(--muted);
  }

  .chip .inserted {
    color: var(--fg);
    font-weight: 700;
  }

  .chip .tag {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: .03em;
  }

  #hint {
    flex: 0 0 auto;
    margin-left: 4px;
    padding: 0 9px 0 3px;
    color: var(--muted);
    font: 10px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
      "Liberation Mono", "Courier New", monospace;
    white-space: nowrap;
    opacity: .7;
  }

  @media (pointer: coarse) {
    .chip {
      min-height: 42px;
      padding: 10px 14px;
    }

    #strip {
      padding-block: 8px;
    }
  }
</style>
</head>
<body>
<div id="editor">
  <div id="mirror" aria-hidden="true"></div>
  <textarea id="text" aria-label="Notes" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
</div>
<div id="bar">
  <div id="strip"></div>
</div>

<script type="module">
import Decimal from "https://cdn.jsdelivr.net/npm/decimal.js@10.4.3/+esm";

Decimal.set({
  precision: 60,
  rounding: Decimal.ROUND_HALF_UP,
  maxE: 1000000,
  minE: -1000000
});

const D = Decimal;
const ZERO_DIMS = Object.freeze([0, 0, 0, 0, 0, 0, 0]);
const PI = new D(-1).acos();
const DIM = {
  LENGTH: 0,
  MASS: 1,
  TIME: 2,
  CURRENT: 3,
  TEMPERATURE: 4,
  DATA: 5,
  ANGLE: 6
};

const cloneDims = d => d.slice();
const dimsEqual = (a, b) => a.every((v, i) => v === b[i]);
const dimsZero = d => dimsEqual(d, ZERO_DIMS);
const addDims = (a, b, sign = 1) => a.map((v, i) => v + sign * b[i]);
const scaleDims = (a, n) => a.map(v => v * n);
const dimsKey = d => d.join(",");

function bigintAbs(n) {
  return n < 0n ? -n : n;
}

function bigintGcd(a, b) {
  a = bigintAbs(a);
  b = bigintAbs(b);
  while (b) [a, b] = [b, a % b];
  return a || 1n;
}

class Fraction {
  constructor(n, d = 1n) {
    if (d === 0n) throw new Error("division by zero");
    if (d < 0n) {
      n = -n;
      d = -d;
    }
    const g = bigintGcd(n, d);
    this.n = n / g;
    this.d = d / g;
  }

  static from(value) {
    if (value instanceof Fraction) return value;
    let s = String(value).trim();
    if (!s) return null;

    let sign = 1n;
    if (s[0] === "-") {
      sign = -1n;
      s = s.slice(1);
    } else if (s[0] === "+") {
      s = s.slice(1);
    }

    const m = s.match(/^(\d*)(?:\.(\d*))?(?:e([+-]?\d+))?$/i);
    if (!m) return null;

    const a = m[1] || "0";
    const b = m[2] || "";
    const exp = Number(m[3] || 0);
    let n = BigInt((a + b) || "0") * sign;
    let scale = b.length - exp;

    if (scale >= 0) return new Fraction(n, 10n ** BigInt(scale));
    return new Fraction(n * 10n ** BigInt(-scale), 1n);
  }

  add(x) {
    x = Fraction.from(x);
    return x ? new Fraction(this.n * x.d + x.n * this.d, this.d * x.d) : null;
  }

  sub(x) {
    x = Fraction.from(x);
    return x ? new Fraction(this.n * x.d - x.n * this.d, this.d * x.d) : null;
  }

  mul(x) {
    x = Fraction.from(x);
    if (!x) return null;
    if (
      bigintAbs(this.n).toString().length +
      bigintAbs(x.n).toString().length > 240
    ) return null;
    return new Fraction(this.n * x.n, this.d * x.d);
  }

  div(x) {
    x = Fraction.from(x);
    if (!x || x.n === 0n) return null;
    return new Fraction(this.n * x.d, this.d * x.n);
  }

  neg() {
    return new Fraction(-this.n, this.d);
  }

  pow(n) {
    if (!Number.isInteger(n) || Math.abs(n) > 10000) return null;
    if (n === 0) return new Fraction(1n);
    if (n < 0) {
      if (this.n === 0n) return null;
      return new Fraction(this.d, this.n).pow(-n);
    }
    if (
      bigintAbs(this.n).toString().length * n > 240 ||
      this.d.toString().length * n > 240
    ) return null;
    return new Fraction(this.n ** BigInt(n), this.d ** BigInt(n));
  }

  mod(x) {
    x = Fraction.from(x);
    if (!x || x.n === 0n) return null;
    const left = this.n * x.d;
    const right = x.n * this.d;
    return new Fraction(left % right, this.d * x.d);
  }

  toDecimal() {
    return new D(this.n.toString()).div(this.d.toString());
  }

  terminatingString() {
    let d = this.d;
    let twos = 0;
    let fives = 0;

    while (d % 2n === 0n) {
      d /= 2n;
      twos++;
    }
    while (d % 5n === 0n) {
      d /= 5n;
      fives++;
    }
    if (d !== 1n) return null;

    const scale = Math.max(twos, fives);
    if (scale > 200) return null;

    let n = this.n;
    if (twos < scale) n *= 2n ** BigInt(scale - twos);
    if (fives < scale) n *= 5n ** BigInt(scale - fives);

    const negative = n < 0n;
    let digits = bigintAbs(n).toString();

    if (scale) {
      digits = digits.padStart(scale + 1, "0");
      digits =
        digits.slice(0, -scale) + "." + digits.slice(-scale);
      digits = digits.replace(/\.?0+$/, "");
    }

    if (!digits || digits === "-0") digits = "0";
    return (negative && digits !== "0" ? "-" : "") + digits;
  }
}

function safeFracOp(fn) {
  try {
    return fn();
  } catch {
    return null;
  }
}

function decimalFactor(value) {
  const decimal = value instanceof D ? value : new D(value);
  return { decimal, fraction: Fraction.from(decimal.toString()) };
}

class UnitEngine {
  constructor() {
    this.units = [];
    this.symbolMap = new Map();
    this.nameMap = new Map();
    this.generated = [];
    this.phrases = [];
    this.curated = new Map();

    this.prefixesAll = [
      ["q", "quecto", "1e-30"],
      ["r", "ronto", "1e-27"],
      ["y", "yocto", "1e-24"],
      ["z", "zepto", "1e-21"],
      ["a", "atto", "1e-18"],
      ["f", "femto", "1e-15"],
      ["p", "pico", "1e-12"],
      ["n", "nano", "1e-9"],
      ["µ", "micro", "1e-6"],
      ["m", "milli", "1e-3"],
      ["c", "centi", "1e-2"],
      ["d", "deci", "1e-1"],
      ["da", "deca", "1e1"],
      ["h", "hecto", "1e2"],
      ["k", "kilo", "1e3"],
      ["M", "mega", "1e6"],
      ["G", "giga", "1e9"],
      ["T", "tera", "1e12"],
      ["P", "peta", "1e15"],
      ["E", "exa", "1e18"],
      ["Z", "zetta", "1e21"],
      ["Y", "yotta", "1e24"],
      ["R", "ronna", "1e27"],
      ["Q", "quetta", "1e30"]
    ];

    this.prefixesLarge = this.prefixesAll.filter(
      p => ["k", "M", "G", "T", "P", "E", "Z", "Y", "R", "Q"].includes(p[0])
    );

    this.build();
  }

  addUnit({
    key,
    names = [],
    symbols = [],
    dims = ZERO_DIMS,
    factor = "1",
    factorFraction = null,
    offset = "0",
    offsetFraction = null,
    prefixable = "none",
    temperature = false,
    longName = null,
    aliases = []
  }) {
    const factorD = factor instanceof D ? factor : new D(factor);
    const offsetD = offset instanceof D ? offset : new D(offset);

    const unit = {
      key,
      names,
      symbols,
      aliases,
      dims: cloneDims(dims),
      factor: factorD,
      factorFraction:
        factorFraction ?? Fraction.from(factorD.toString()),
      offset: offsetD,
      offsetFraction:
        offsetFraction ?? Fraction.from(offsetD.toString()),
      prefixable,
      temperature,
      symbol: symbols[0] || key,
      name: longName || names[0] || symbols[0] || key,
      styleLong: false,
      generated: false
    };

    this.units.push(unit);

    for (const s of symbols) {
      if (!this.symbolMap.has(s)) this.symbolMap.set(s, []);
      this.symbolMap.get(s).push(unit);
    }

    for (const n of [...names, ...aliases]) {
      this.addName(n, unit);
    }

    return unit;
  }

  addName(name, unit) {
    const normalized = this.normalizeName(name);
    if (!this.nameMap.has(normalized)) this.nameMap.set(normalized, []);
    this.nameMap.get(normalized).push(unit);

    if (/\s/.test(name)) {
      this.phrases.push({
        text: name,
        lower: name.toLowerCase(),
        unit
      });
    }
  }

  normalizeName(name) {
    return name
      .trim()
      .toLowerCase()
      .replace(/metres/g, "meters")
      .replace(/litres/g, "liters")
      .replace(/feet/g, "foot")
      .replace(/inches/g, "inch")
      .replace(/ounces/g, "ounce")
      .replace(/(\w)ies$/g, "$1y")
      .replace(/s$/g, "");
  }

  cloneUnit(unit, changes = {}) {
    return {
      ...unit,
      dims: cloneDims(unit.dims),
      ...changes
    };
  }

  build() {
    const L = [1, 0, 0, 0, 0, 0, 0];
    const M = [0, 1, 0, 0, 0, 0, 0];
    const T = [0, 0, 1, 0, 0, 0, 0];
    const I = [0, 0, 0, 1, 0, 0, 0];
    const TEMP = [0, 0, 0, 0, 1, 0, 0];
    const DATA = [0, 0, 0, 0, 0, 1, 0];
    const ANGLE = [0, 0, 0, 0, 0, 0, 1];

    const AREA = [2, 0, 0, 0, 0, 0, 0];
    const VOLUME = [3, 0, 0, 0, 0, 0, 0];
    const SPEED = [1, 0, -1, 0, 0, 0, 0];
    const FREQ = [0, 0, -1, 0, 0, 0, 0];
    const FORCE = [1, 1, -2, 0, 0, 0, 0];
    const PRESSURE = [-1, 1, -2, 0, 0, 0, 0];
    const ENERGY = [2, 1, -2, 0, 0, 0, 0];
    const POWER = [2, 1, -3, 0, 0, 0, 0];
    const VOLT = [2, 1, -3, -1, 0, 0, 0];
    const OHM = [2, 1, -3, -2, 0, 0, 0];
    const DATA_RATE = [0, 0, -1, 0, 0, 1, 0];
    const FUEL = [-2, 0, 0, 0, 0, 0, 0];

    const m = this.addUnit({
      key: "meter",
      names: ["meter", "metre"],
      symbols: ["m"],
      dims: L,
      factor: "1",
      prefixable: "all"
    });

    const inch = this.addUnit({
      key: "inch",
      names: ["inch"],
      symbols: ["in"],
      dims: L,
      factor: "0.0254"
    });

    const foot = this.addUnit({
      key: "foot",
      names: ["foot", "feet"],
      symbols: ["ft"],
      dims: L,
      factor: "0.3048"
    });

    const yard = this.addUnit({
      key: "yard",
      names: ["yard"],
      symbols: ["yd"],
      dims: L,
      factor: "0.9144"
    });

    const mile = this.addUnit({
      key: "mile",
      names: ["mile"],
      symbols: ["mi"],
      dims: L,
      factor: "1609.344"
    });

    const gram = this.addUnit({
      key: "gram",
      names: ["gram"],
      symbols: ["g"],
      dims: M,
      factor: "0.001",
      prefixable: "all"
    });

    const ounce = this.addUnit({
      key: "ounce",
      names: ["ounce"],
      symbols: ["oz"],
      dims: M,
      factor: "0.028349523125"
    });

    const pound = this.addUnit({
      key: "pound",
      names: ["pound"],
      symbols: ["lb"],
      dims: M,
      factor: "0.45359237"
    });

    const second = this.addUnit({
      key: "second",
      names: ["second"],
      symbols: ["s"],
      dims: T,
      factor: "1",
      prefixable: "all"
    });

    const minute = this.addUnit({
      key: "minute",
      names: ["minute"],
      symbols: ["min"],
      dims: T,
      factor: "60"
    });

    const hour = this.addUnit({
      key: "hour",
      names: ["hour"],
      symbols: ["h", "hr"],
      dims: T,
      factor: "3600"
    });

    const day = this.addUnit({
      key: "day",
      names: ["day"],
      symbols: ["d"],
      dims: T,
      factor: "86400"
    });

    this.addUnit({
      key: "week",
      names: ["week"],
      symbols: ["wk"],
      dims: T,
      factor: "604800"
    });

    this.addUnit({
      key: "month",
      names: ["month"],
      symbols: ["mo"],
      dims: T,
      factor: "2629800"
    });

    this.addUnit({
      key: "year",
      names: ["year"],
      symbols: ["yr"],
      dims: T,
      factor: "31557600"
    });

    this.addUnit({
      key: "decade",
      names: ["decade"],
      symbols: [],
      dims: T,
      factor: "315576000"
    });

    this.addUnit({
      key: "century",
      names: ["century"],
      symbols: [],
      dims: T,
      factor: "3155760000"
    });

    const amp = this.addUnit({
      key: "ampere",
      names: ["ampere", "amp"],
      symbols: ["A"],
      dims: I,
      factor: "1",
      prefixable: "all"
    });

    const kelvin = this.addUnit({
      key: "kelvin",
      names: ["kelvin"],
      symbols: ["K"],
      dims: TEMP,
      factor: "1",
      prefixable: "all",
      temperature: true
    });

    const celsius = this.addUnit({
      key: "celsius",
      names: ["celsius", "degree celsius"],
      symbols: ["°C"],
      dims: TEMP,
      factor: "1",
      offset: "273.15",
      temperature: true
    });

    const fahrenheitFactor = new D(5).div(9);
    const fahrenheitOffset = new D("273.15").sub(new D(32).mul(fahrenheitFactor));
    const fahrenheit = this.addUnit({
      key: "fahrenheit",
      names: ["fahrenheit", "degree fahrenheit"],
      symbols: ["°F"],
      dims: TEMP,
      factor: fahrenheitFactor,
      factorFraction: new Fraction(5n, 9n),
      offset: fahrenheitOffset,
      offsetFraction: new Fraction(45967n, 180n),
      temperature: true
    });

    const rad = this.addUnit({
      key: "radian",
      names: ["radian"],
      symbols: ["rad"],
      dims: ANGLE,
      factor: "1"
    });

    const deg = this.addUnit({
      key: "degree",
      names: ["degree"],
      symbols: ["deg", "°"],
      dims: ANGLE,
      factor: PI.div(180),
      factorFraction: null
    });

    const grad = this.addUnit({
      key: "gradian",
      names: ["gradian", "gon"],
      symbols: ["grad"],
      dims: ANGLE,
      factor: PI.div(200),
      factorFraction: null
    });

    const hz = this.addUnit({
      key: "hertz",
      names: ["hertz"],
      symbols: ["Hz"],
      dims: FREQ,
      factor: "1",
      prefixable: "all"
    });

    const joule = this.addUnit({
      key: "joule",
      names: ["joule"],
      symbols: ["J"],
      dims: ENERGY,
      factor: "1",
      prefixable: "all"
    });

    const calorie = this.addUnit({
      key: "calorie",
      names: ["calorie"],
      symbols: ["cal"],
      dims: ENERGY,
      factor: "4.184",
      prefixable: "all"
    });

    const foodCalorie = this.addUnit({
      key: "food-calorie",
      names: ["food calorie"],
      symbols: ["Cal"],
      dims: ENERGY,
      factor: "4184"
    });

    const wattHour = this.addUnit({
      key: "watt-hour",
      names: ["watt-hour", "watt hour"],
      symbols: ["Wh"],
      dims: ENERGY,
      factor: "3600",
      prefixable: "all"
    });

    const watt = this.addUnit({
      key: "watt",
      names: ["watt"],
      symbols: ["W"],
      dims: POWER,
      factor: "1",
      prefixable: "all"
    });

    const newton = this.addUnit({
      key: "newton",
      names: ["newton"],
      symbols: ["N"],
      dims: FORCE,
      factor: "1",
      prefixable: "all"
    });

    const lbf = this.addUnit({
      key: "pound-force",
      names: ["pound-force", "pound force"],
      symbols: ["lbf"],
      dims: FORCE,
      factor: "4.4482216152605"
    });

    const pascal = this.addUnit({
      key: "pascal",
      names: ["pascal"],
      symbols: ["Pa"],
      dims: PRESSURE,
      factor: "1",
      prefixable: "all"
    });

    const bar = this.addUnit({
      key: "bar",
      names: ["bar"],
      symbols: ["bar"],
      dims: PRESSURE,
      factor: "100000",
      prefixable: "all"
    });

    const atm = this.addUnit({
      key: "atmosphere",
      names: ["atmosphere"],
      symbols: ["atm"],
      dims: PRESSURE,
      factor: "101325"
    });

    const psiFactor = lbf.factor.div(inch.factor.pow(2));
    const psiFrac = safeFracOp(() =>
      lbf.factorFraction.div(inch.factorFraction.pow(2))
    );

    const psi = this.addUnit({
      key: "psi",
      names: ["psi", "pounds per square inch"],
      symbols: ["PSI", "psi"],
      dims: PRESSURE,
      factor: psiFactor,
      factorFraction: psiFrac
    });

    const volt = this.addUnit({
      key: "volt",
      names: ["volt"],
      symbols: ["V"],
      dims: VOLT,
      factor: "1",
      prefixable: "all"
    });

    const ohm = this.addUnit({
      key: "ohm",
      names: ["ohm"],
      symbols: ["Ω"],
      dims: OHM,
      factor: "1",
      prefixable: "all"
    });

    const bit = this.addUnit({
      key: "bit",
      names: ["bit"],
      symbols: ["b"],
      dims: DATA,
      factor: "1",
      prefixable: "large"
    });

    const byte = this.addUnit({
      key: "byte",
      names: ["byte"],
      symbols: ["B"],
      dims: DATA,
      factor: "8",
      prefixable: "large"
    });

    const bps = this.addUnit({

    ]);
