<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff;
    --fg: #191919;
    --ghost: rgba(70, 70, 70, .42);
    --bar: rgba(248, 248, 248, .96);
    --bar-border: rgba(0, 0, 0, .09);
    --chip: rgba(0, 0, 0, .055);
    --chip-hover: rgba(0, 0, 0, .09);
    --chip-active: rgba(75, 110, 220, .14);
    --chip-border: rgba(0, 0, 0, .09);
    --muted: rgba(0, 0, 0, .48);
    --accent: #315fca;
    --selection: rgba(75, 115, 225, .25);
    --pad-x: 16px;
    --pad-y: 14px;
    --bar-height: 48px;
    --font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
            "Liberation Mono", "Courier New", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214;
      --fg: #e8e8e8;
      --ghost: rgba(220, 220, 220, .34);
      --bar: rgba(24, 25, 28, .97);
      --bar-border: rgba(255, 255, 255, .09);
      --chip: rgba(255, 255, 255, .07);
      --chip-hover: rgba(255, 255, 255, .11);
      --chip-active: rgba(105, 145, 255, .18);
      --chip-border: rgba(255, 255, 255, .09);
      --muted: rgba(255, 255, 255, .5);
      --accent: #9bb5ff;
      --selection: rgba(100, 145, 255, .28);
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
  }

  #editor-shell {
    position: fixed;
    inset: 0;
    background: var(--bg);
  }

  #mirror,
  #editor {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: var(--pad-y) var(--pad-x);
    padding-bottom: calc(var(--bar-height) + var(--pad-y));
    border: 0;
    outline: 0;
    resize: none;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
    tab-size: 4;
    font: 16px/1.55 var(--font);
    letter-spacing: 0;
  }

  #mirror {
    z-index: 1;
    pointer-events: none;
    color: transparent;
    scrollbar-width: none;
  }

  #mirror::-webkit-scrollbar {
    display: none;
  }

  #mirror .ghost {
    color: var(--ghost);
  }

  #editor {
    z-index: 2;
    color: var(--fg);
    caret-color: var(--fg);
    background: transparent;
  }

  #editor::selection {
    background: var(--selection);
  }

  #suggestion-bar {
    position: fixed;
    z-index: 3;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: 0;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    overflow-x: auto;
    overflow-y: hidden;
    background: var(--bar);
    border-top: 1px solid var(--bar-border);
    scrollbar-width: thin;
    overscroll-behavior-x: contain;
  }

  #suggestion-bar.visible {
    display: flex;
  }

  #chips {
    display: flex;
    flex: 0 0 auto;
    gap: 7px;
    align-items: center;
  }

  .chip {
    min-height: 34px;
    max-width: min(560px, 76vw);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
    padding: 7px 11px;
    border: 1px solid var(--chip-border);
    border-radius: 999px;
    background: var(--chip);
    color: var(--fg);
    font: 13px/1.2 var(--font);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .chip:hover {
    background: var(--chip-hover);
  }

  .chip.selected {
    border-color: color-mix(in srgb, var(--accent) 48%, transparent);
    background: var(--chip-active);
  }

  .chip .equation {
    display: inline-flex;
    min-width: 0;
    align-items: baseline;
  }

  .chip .dim {
    color: var(--muted);
  }

  .chip .insert {
    color: var(--fg);
    font-weight: 700;
  }

  .chip .tag {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .04em;
    text-transform: lowercase;
  }

  #key-hint {
    position: sticky;
    right: 0;
    flex: 0 0 auto;
    margin-left: 4px;
    padding: 4px 7px;
    color: var(--muted);
    background: var(--bar);
    font: 10px/1 var(--font);
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="editor-shell">
  <div id="mirror" aria-hidden="true"></div>
  <textarea
    id="editor"
    aria-label="Scratchpad"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
  ></textarea>
</div>

<div id="suggestion-bar" aria-live="polite">
  <div id="chips"></div>
  <div id="key-hint">Tab/Enter accept · ←→ switch</div>
</div>

<script type="module">
const { default: Decimal } =
  await import("https://cdn.jsdelivr.net/npm/decimal.js@10.4.3/+esm");

Decimal.set({
  precision: 50,
  rounding: Decimal.ROUND_HALF_UP,
  minE: -1000,
  maxE: 1000
});

/* -------------------------------------------------------------------------- */
/* Constants and utilities                                                    */
/* -------------------------------------------------------------------------- */

const editor = document.querySelector("#editor");
const mirror = document.querySelector("#mirror");
const bar = document.querySelector("#suggestion-bar");
const chipsEl = document.querySelector("#chips");

const STORAGE_KEY = "math-scratchpad-content-v1";
const MAX_CHARS = 500;
const MAX_TOKENS = 200;
const MAX_DEPTH = 80;
const MAX_BRANCHES = 12;
const POLE_LIMIT = new Decimal("1e15");

const ZERO_DIMS = Object.freeze([0, 0, 0, 0, 0, 0, 0]);
const DIM = Object.freeze({
  L: 0,
  M: 1,
  T: 2,
  I: 3,
  TEMP: 4,
  DATA: 5,
  ANGLE: 6
});

const cloneDims = d => d.slice();
const dimsEqual = (a, b) => a.every((v, i) => v === b[i]);
const dimsZero = d => d.every(v => v === 0);
const dimsAdd = (a, b) => a.map((v, i) => v + b[i]);
const dimsSub = (a, b) => a.map((v, i) => v - b[i]);
const dimsScale = (a, n) => a.map(v => v * n);
const dimsKey = d => d.join(",");

const DIMS = Object.freeze({
  dimensionless: ZERO_DIMS.slice(),
  length:        [1, 0, 0, 0, 0, 0, 0],
  mass:          [0, 1, 0, 0, 0, 0, 0],
  time:          [0, 0, 1, 0, 0, 0, 0],
  current:       [0, 0, 0, 1, 0, 0, 0],
  temperature:   [0, 0, 0, 0, 1, 0, 0],
  data:          [0, 0, 0, 0, 0, 1, 0],
  angle:         [0, 0, 0, 0, 0, 0, 1],
  area:          [2, 0, 0, 0, 0, 0, 0],
  volume:        [3, 0, 0, 0, 0, 0, 0],
  speed:         [1, 0, -1, 0, 0, 0, 0],
  acceleration:  [1, 0, -2, 0, 0, 0, 0],
  frequency:     [0, 0, -1, 0, 0, 0, 0],
  force:         [1, 1, -2, 0, 0, 0, 0],
  pressure:      [-1, 1, -2, 0, 0, 0, 0],
  energy:        [2, 1, -2, 0, 0, 0, 0],
  power:         [2, 1, -3, 0, 0, 0, 0],
  voltage:       [2, 1, -3, -1, 0, 0, 0],
  resistance:    [2, 1, -3, -2, 0, 0, 0],
  dataRate:      [0, 0, -1, 0, 0, 1, 0],
  fuelEconomy:   [-2, 0, 0, 0, 0, 0, 0]
});

const isFiniteDecimal = value =>
  value instanceof Decimal &&
  value.isFinite() &&
  Math.abs(value.e || 0) <= 1000;

const dec = value => value instanceof Decimal ? value : new Decimal(value);

function uniqueBy(items, keyFn) {
  const seen = new Set();
  return items.filter(item => {
    const key = keyFn(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function middleEllipsis(text, max = 82) {
  if (text.length <= max) return text;
  const left = Math.ceil((max - 1) / 2);
  const right = Math.floor((max - 1) / 2);
  return text.slice(0, left) + "…" + text.slice(text.length - right);
}

/* -------------------------------------------------------------------------- */
/* Exact rational arithmetic                                                  */
/* -------------------------------------------------------------------------- */

function bigintAbs(n) {
  return n < 0n ? -n : n;
}

function bigintGcd(a, b) {
  a = bigintAbs(a);
  b = bigintAbs(b);
  while (b) {
    const t = a % b;
    a = b;
    b = t;
  }
  return a || 1n;
}

function rat(n, d = 1n) {
  if (typeof n === "number") n = BigInt(n);
  if (typeof d === "number") d = BigInt(d);
  if (d === 0n) return null;
  if (d < 0n) {
    n = -n;
    d = -d;
  }
  const g = bigintGcd(n, d);
  n /= g;
  d /= g;

  if (n.toString().length + d.toString().length > 1000) return null;
  return { n, d };
}

function ratAdd(a, b) {
  if (!a || !b) return null;
  return rat(a.n * b.d + b.n * a.d, a.d * b.d);
}

function ratSub(a, b) {
  if (!a || !b) return null;
  return rat(a.n * b.d - b.n * a.d, a.d * b.d);
}

function ratMul(a, b) {
  if (!a || !b) return null;
  return rat(a.n * b.n, a.d * b.d);
}

function ratDiv(a, b) {
  if (!a || !b || b.n === 0n) return null;
  return rat(a.n * b.d, a.d * b.n);
}

function ratNeg(a) {
  return a ? { n: -a.n, d: a.d } : null;
}

function ratPow(a, exponent) {
  if (!a || !Number.isInteger(exponent) || Math.abs(exponent) > 10000) {
    return null;
  }
  if (exponent === 0) return rat(1n);
  if (exponent < 0) {
    if (a.n === 0n) return null;
    return ratPow(rat(a.d, a.n), -exponent);
  }

  try {
    return rat(a.n ** BigInt(exponent), a.d ** BigInt(exponent));
  } catch {
    return null;
  }
}

function ratFromDecimalString(raw) {
  let text = String(raw).trim().toLowerCase();
  if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/.test(text)) {
    return null;
  }

  let sign = 1n;
  if (text.startsWith("-")) {
    sign = -1n;
    text = text.slice(1);
  } else if (text.startsWith("+")) {
    text = text.slice(1);
  }

  let exponent = 0;
  const eIndex = text.indexOf("e");
  if (eIndex >= 0) {
    exponent = Number(text.slice(eIndex + 1));
    text = text.slice(0, eIndex);
  }

  const dot = text.indexOf(".");
  let fractionDigits = 0;
  if (dot >= 0) {
    fractionDigits = text.length - dot - 1;
    text = text.slice(0, dot) + text.slice(dot + 1);
  }

  text = text.replace(/^0+(?=\d)/, "") || "0";
  let numerator = sign * BigInt(text);
  let denominator = 10n ** BigInt(fractionDigits);

  if (exponent > 0) {
    numerator *= 10n ** BigInt(exponent);
  } else if (exponent < 0) {
    denominator *= 10n ** BigInt(-exponent);
  }

  return rat(numerator, denominator);
}

function ratToDecimal(r) {
  return new Decimal(r.n.toString()).div(r.d.toString());
}

function integerNthRoot(value, n) {
  if (value < 0n || n < 1) return null;
  if (value < 2n) return value;

  let low = 0n;
  let high = 1n;
  const nn = BigInt(n);

  while (high ** nn < value) high *= 2n;

  while (low + 1n < high) {
    const mid = (low + high) / 2n;
    const p = mid ** nn;
    if (p === value) return mid;
    if (p < value) low = mid;
    else high = mid;
  }

  return low ** nn === value ? low : null;
}

function ratRoot(r, n) {
  if (!r || n < 1) return null;
  const negative = r.n < 0n;
  if (negative && n % 2 === 0) return null;

  const rn = integerNthRoot(bigintAbs(r.n), n);
  const rd = integerNthRoot(r.d, n);
  if (rn == null || rd == null) return null;
  return rat(negative ? -rn : rn, rd);
}

function terminatingDecimalString(r) {
  if (!r) return null;

  let denominator = r.d;
  let twos = 0;
  let fives = 0;

  while (denominator % 2n === 0n) {
    denominator /= 2n;
    twos++;
  }
  while (denominator % 5n === 0n) {
    denominator /= 5n;
    fives++;
  }
  if (denominator !== 1n) return null;

  const places = Math.max(twos, fives);
  let numerator = bigintAbs(r.n);
  if (twos < places) numerator *= 2n ** BigInt(places - twos);
  if (fives < places) numerator *= 5n ** BigInt(places - fives);

  let digits = numerator.toString();
  if (places > 0) {
    digits = digits.padStart(places + 1, "0");
    digits =
      digits.slice(0, digits.length - places) +
      "." +
      digits.slice(digits.length - places);
    digits = digits.replace(/\.?0+$/, "");
  }

  if (digits.startsWith(".")) digits = "0" + digits;
  if (digits === "") digits = "0";
  return (r.n < 0n ? "-" : "") + digits;
}

/* -------------------------------------------------------------------------- */
/* Unit engine                                                                */
/* -------------------------------------------------------------------------- */

const exactSymbols = new Map();
const foldedSymbols = new Map();
const unitNames = new Map();
const unitsById = new Map();
const allUnits = [];

const PREFIXES_ALL = [
  ["Q", "quetta", 30], ["R", "ronna", 27], ["Y", "yotta", 24],
  ["Z", "zetta", 21], ["E", "exa", 18], ["P", "peta", 15],
  ["T", "tera", 12], ["G", "giga", 9], ["M", "mega", 6],
  ["k", "kilo", 3], ["h", "hecto", 2], ["da", "deca", 1],
  ["d", "deci", -1], ["c", "centi", -2], ["m", "milli", -3],
  ["µ", "micro", -6], ["n", "nano", -9], ["p", "pico", -12],
  ["f", "femto", -15], ["a", "atto", -18], ["z", "zepto", -21],
  ["y", "yocto", -24], ["r", "ronto", -27], ["q", "quecto", -30]
];

const PREFIXES_LARGE = PREFIXES_ALL.filter(([, , power]) => power >= 3);

function addMapList(map, key, value) {
  if (!map.has(key)) map.set(key, []);
  map.get(key).push(value);
}

function normalizeUnitName(name) {
  return name
    .toLowerCase()
    .replace(/[‐‑‒–—−]/g, "-")
    .replace(/\s+/g, " ")
    .trim();
}

function registerUnit(spec) {
  const factorRat =
    spec.factorRat ||
    (typeof spec.factor === "object" && spec.factor?.n != null
      ? spec.factor
      : ratFromDecimalString(spec.factor ?? "1"));

  const unit = {
    id: spec.id,
    family: spec.family || spec.id,
    names: spec.names || [],
    symbols: spec.symbols || [],
    symbol: spec.symbol || spec.symbols?.[0] || spec.id,
    singular: spec.singular || spec.names?.[0] || spec.id,
    plural:
      spec.plural ||
      (spec.names?.[0]
        ? spec.names[0].endsWith("s")
          ? spec.names[0]
          : spec.names[0] + "s"
        : spec.id),
    dims: cloneDims(spec.dims || ZERO_DIMS),
    factorRat,
    factor: factorRat ? ratToDecimal(factorRat) : dec(spec.factor || 1),
    offsetRat: spec.offsetRat || ratFromDecimalString(spec.offset || "0"),
    offset: dec(spec.offset || 0),
    prefixable: spec.prefixable || "none",
    prefixDepth: spec.prefixDepth || 0,
    prefixPower: spec.prefixPower ?? null,
    isTemperature: !!spec.isTemperature,
    variant: spec.variant || null,
    powerBase: spec.powerBase || null,
    powerExponent: spec.powerExponent || null
  };

  unitsById.set(unit.id, unit);
  allUnits.push(unit);

  for (const symbol of unit.symbols) {
    addMapList(exactSymbols, symbol, unit);
    addMapList(foldedSymbols, symbol.toLowerCase(), unit);
  }

  for (const name of unit.names) {
    unitNames.set(normalizeUnitName(name), unit);
    if (!name.endsWith("s")) {
      unitNames.set(normalizeUnitName(name + "s"), unit);
    }
  }

  return unit;
}

function registerPrefixedUnits(base) {
  const prefixes =
    base.prefixable === "large" ? PREFIXES_LARGE :
    base.prefixable === "all" ? PREFIXES_ALL : [];

  for (const [symbolPrefix, namePrefix, power] of prefixes) {
    const factor = ratMul(base.factorRat, ratFromDecimalString(`1e${power}`));
    if (!factor) continue;

    const symbolBase = base.symbols[0];
    const singular = namePrefix + base.singular;
    const plural = singular + "s";

    const symbolPrefixes =
      symbolPrefix === "µ" ? ["µ", "μ", "u"] : [symbolPrefix];

    for (const actualPrefix of symbolPrefixes) {
      registerUnit({
        id: `${base.id}@${actualPrefix}${power}`,
        family: base.family,
        names: actualPrefix === symbolPrefix ? [singular, plural] : [],
        symbols: [actualPrefix + symbolBase],
        symbol: symbolPrefix + symbolBase,
        singular,
        plural,
        dims: base.dims,
        factorRat: factor,
        prefixable: "none",
        prefixDepth: 1,
        prefixPower: power,
        isTemperature: base.isTemperature
      });
    }
  }
}

function unitById(id) {
  return unitsById.get(id);
}

function registerBaseAndPrefixes(spec) {
  const base = registerUnit(spec);
  registerPrefixedUnits(base);
  return base;
}

const U = {};

U.m = registerBaseAndPrefixes({
  id: "meter",
  family: "meter",
  names: ["meter", "metre"],
  symbols: ["m"],
  symbol: "m",
  singular: "meter",
  plural: "meters",
  dims: DIMS.length,
  factor: "1",
  prefixable: "all"
});

U.g = registerBaseAndPrefixes({
  id: "gram",
  family: "gram",
  names: ["gram"],
  symbols: ["g"],
  symbol: "g",
  singular: "gram",
  plural: "grams",
  dims: DIMS.mass,
  factor: "0.001",
  prefixable: "all"
});

U.s = registerBaseAndPrefixes({
  id: "second",
  family: "second",
  names: ["second", "sec"],
  symbols: ["s"],
  symbol: "s",
  singular: "second",
  plural: "seconds",
  dims: DIMS.time,
  factor: "1",
  prefixable: "all"
});

U.Hz = registerBaseAndPrefixes({
  id: "hertz",
  family: "hertz",
  names: ["hertz"],
  symbols: ["Hz"],
  symbol: "Hz",
  singular: "hertz",
  plural: "hertz",
  dims: DIMS.frequency,
  factor: "1",
  prefixable: "all"
});

U.J = registerBaseAndPrefixes({
  id: "joule",
  family: "joule",
  names: ["joule"],
  symbols: ["J"],
  symbol: "J",
  singular: "joule",
  plural: "joules",
  dims: DIMS.energy,
  factor: "1",
  prefixable: "all"
});

U.Wh = registerBaseAndPrefixes({
  id: "watt-hour",
  family: "watt-hour",
  names: ["watt hour", "watt-hour"],
  symbols: ["Wh"],
  symbol: "Wh",
  singular: "watt-hour",
  plural: "watt-hours",
  dims: DIMS.energy,
  factor: "3600",
  prefixable: "all"
});

U.cal = registerBaseAndPrefixes({
  id: "calorie",
  family: "calorie",
  names: ["calorie"],
  symbols: ["cal"],
  symbol: "cal",
  singular: "calorie",
  plural: "calories",
  dims: DIMS.energy,
  factor: "4.184",
  prefixable: "all"
});

U.Cal = registerUnit({
  id: "food-calorie",
  family: "calorie",
  names: ["food calorie"],
  symbols: ["Cal"],
  symbol: "Cal",
  singular: "Calorie",
  plural: "Calories",
  dims: DIMS.energy,
  factor: "4184"
});

U.Pa = registerBaseAndPrefixes({
  id: "pascal",
  family: "pascal",
  names: ["pascal"],
  symbols: ["Pa"],
  symbol: "Pa",
  singular: "pascal",
  plural: "pascals",
  dims: DIMS.pressure,
  factor: "1",
  prefixable: "all"
});

U.bar = registerBaseAndPrefixes({
  id: "bar",
  family: "bar",
  names: ["bar"],
  symbols: ["bar"],
  symbol: "bar",
  singular: "bar",
  plural: "bar",
  dims: DIMS.pressure,
  factor: "100000",
  prefixable: "all"
});

U.L = registerBaseAndPrefixes({
  id: "liter",
  family: "liter",
  names: ["liter", "litre"],
  symbols: ["L", "l"],
  symbol: "L",
  singular: "liter",
  plural: "liters",
  dims: DIMS.volume,
  factor: "0.001",
  prefixable: "all"
});

U.W = registerBaseAndPrefixes({
  id: "watt",
  family: "watt",
  names: ["watt"],
  symbols: ["W"],
  symbol: "W",
  singular: "watt",
  plural: "watts",
  dims: DIMS.power,
  factor: "1",
  prefixable: "all"
});

U.A = registerBaseAndPrefixes({
  id: "ampere",
  family: "ampere",
  names: ["ampere", "amp"],
  symbols: ["A"],
  symbol: "A",
  singular: "ampere",
  plural: "amperes",
  dims: DIMS.current,
  factor: "1",
  prefixable: "all"
});

U.V = registerBaseAndPrefixes({
  id: "volt",
  family: "volt",
  names: ["volt"],
  symbols: ["V"],
  symbol: "V",
  singular: "volt",
  plural: "volts",
  dims: DIMS.voltage,
  factor: "1",
  prefixable: "all"
});

U.N = registerBaseAndPrefixes({
  id: "newton",
  family: "newton",
  names: ["newton"],
  symbols: ["N"],
  symbol: "N",
  singular: "newton",
  plural: "newtons",
  dims: DIMS.force,
  factor: "1",
  prefixable: "all"
});

function dynamicPowerUnit(base, exponent) {
  const id = `${base.id}^${exponent}`;
  if (unitsById.has(id)) return unitsById.get(id);

  const factorRat = ratPow(base.factorRat, exponent);
  return registerUnit({
    id,
    family: `${base.family}^${exponent}`,
    names: [
      exponent === 2 ? `square ${base.singular}` : `cubic ${base.singular}`
    ],
    symbols: [],
    symbol: `${base.symbol}^${exponent}`,
    singular:
      exponent === 2 ? `square ${base.singular}` : `cubic ${base.singular}`,
    plural:
      exponent === 2 ? `square ${base.plural}` : `cubic ${base.plural}`,
    dims: dimsScale(base.dims, exponent),
    factorRat,
    factor: base.factor.pow(exponent),
    powerBase: base,
    powerExponent: exponent
  });
}
