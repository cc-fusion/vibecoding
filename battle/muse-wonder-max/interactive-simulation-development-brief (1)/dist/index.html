<body>
<header class="topbar">
  <div class="logo">◈</div>
  <div class="brand"><b>PLANET FORGE</b><small>Tectonic Planet Builder</small></div>
  <span class="pill">Deep time <b id="clockTop">0 Myr</b></span>
  <span class="pill">Era <b id="eraTop">Primordial</b></span>
  <div class="spacer"></div>
  <div class="seg" aria-label="Simulation speed">
    <button data-speed="0" id="btnPauseTop">Pause</button><button data-speed="0.5">0.5×</button><button data-speed="1" class="active">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
  </div>
  <button class="btn small" id="btnHelpTop">Help</button>
  <button class="btn small" id="btnSettingsTop">Settings</button>
  <button class="btn small" id="btnMenuTop">Menu</button>
</header>

\x3C!-- TITLE -->
<main id="titleScreen" class="screen">
  <div class="hero">
    <div class="hero-grid">
      <section class="card">
        <div class="eyebrow">Simulation 21 · Deep-time geology</div>
        <h1>Forge a planet.<br>Split it in two.</h1>
        <p>Command drifting tectonic plates across hundreds of millions of years. Raise mountain belts where continents collide, open oceans at rifts, steer hotspot island chains, and balance volcanism, weathering, ice and sea level while the living surface responds.</p>
        <p><strong style="color:#fff">Capstone:</strong> assemble a supercontinent — then tear it apart again to complete the supercontinent cycle.</p>
        <div class="featuregrid">
          <div class="feature"><b>Moving plates</b><span>Continents really drift, collide, subduct and rift on a wrapped world map.</span></div>
          <div class="feature"><b>Coupled climate</b><span>Eruptions add CO₂, mountain weathering removes it, ice changes sea level.</span></div>
          <div class="feature"><b>Erosion & sediment</b><span>Rain wears peaks down and builds shelves, deltas and new lowlands.</span></div>
          <div class="feature"><b>Ocean & biomes</b><span>Currents, moisture, temperature and elevation paint a changing living planet.</span></div>
        </div>
        <div class="compactrow" style="margin-top:18px">
          <button class="btn primary" id="btnContinue" style="display:none">Continue saved planet</button>
          <button class="btn teal" id="btnHowTitle">How to play</button>
          <button class="btn" id="btnSettingsTitle">Settings</button>
        </div>
        <div id="bestScores" class="smalltxt muted" style="margin-top:14px"></div>
      </section>
      <section class="card">
        <div class="eyebrow">Choose a scenario</div>
        <h2 class="serif" style="font-size:28px;margin:8px 0 14px">New planet</h2>
        <div class="scenariogrid" id="scenarioList"></div>
        <p class="smalltxt muted">Every world is generated from a reproducible seed. Scenario rules change plate speed, mantle heat, climate volatility, deadlines and the victory test — the geology underneath stays consistent.</p>
      </section>
    </div>
  </div>
</main>

\x3C!-- GAME -->
<main id="gameScreen" class="screen hidden">
  <div class="layout">
    <aside class="panel" id="leftPanel">
      <h2>Forge tools</h2>
      <div class="toolgrid" id="toolGrid"></div>
      <label class="lab" for="brushRange">Brush size · <span id="brushVal">2</span></label>
      <input id="brushRange" type="range" min="1" max="5" step="1" value="2">
      <label class="lab" for="overlaySelect">Map overlay</label>
      <select id="overlaySelect">
        <option value="elev">Elevation &amp; sea level</option><option value="biome">Biomes &amp; ice</option><option value="plates">Tectonic plates</option><option value="age">Crustal age</option><option value="moist">Rainfall &amp; moisture</option><option value="currents">Ocean currents</option>
      </select>
      <div class="legend" id="overlayLegend"></div>
      <div id="tutorialBox" style="margin-top:14px"></div>
      <h3 style="margin-top:18px">Selected ground</h3>
      <div id="probeInfo" class="smalltxt muted">Click the planet to inspect crust, climate and the plate beneath your cursor.</div>
      <h3 style="margin-top:18px">Session</h3>
      <div class="compactrow">
        <button class="btn small" id="btnSave">Save</button><button class="btn small" id="btnRestart">Restart</button><button class="btn small danger" id="btnQuit">Title</button>
      </div>
      <p class="smalltxt muted">Shortcuts: <span class="kbd">Space</span> pause · <span class="kbd">1</span>–<span class="kbd">0</span> tools · <span class="kbd">O</span> overlay · <span class="kbd">H</span> help · <span class="kbd">Esc</span> pause menu</p>
    </aside>

    <section>
      <div class="hudgrid" id="hudGrid"></div>
      <div id="alertBar"></div>
      <div class="mapwrap" id="mapWrap">
        <canvas id="map" width="1080" height="620"></canvas>
        <div class="maplabels"><span class="mapchip">Time <b id="hudTime">0 Myr</b></span><span class="mapchip" id="hudPhase">Phase 1 · Assemble</span><span class="mapchip">Largest landmass <b id="hudPang">0%</b></span></div>
        <div class="toaststack" id="toastStack"></div>
      </div>
      <div class="footerbar"><span id="mapHint">Inspect mode: click any cell. Drag with Plate Nudge to throw a plate in a new direction.</span><span>Wrapped world · west edge joins east edge · poles at top/bottom</span></div>
      <div class="panel" style="margin-top:12px">
        <div class="compactrow" style="justify-content:space-between"><h3 style="margin:0">Cross-section &amp; mantle</h3><span class="smalltxt muted">Latitude row <b id="crossRowLabel" style="color:#fff">31</b> · click Inspect to move it</span></div>
        <canvas id="cross" class="cross" width="1080" height="260" style="margin-top:10px"></canvas>
        <div class="legend"><span><i style="background:#8a5a35"></i>Crust</span><span><i style="background:#4b2c20"></i>Subducting slab</span><span><i style="background:#e2724f"></i>Hot mantle upwelling</span><span><i style="background:#31556e"></i>Ocean</span><span>Convection cells turn beneath the plates; slabs dive where oceanic crust converges.</span></div>
      </div>
    </section>

    <aside class="panel" id="rightPanel">
      <div class="tabs" id="rightTabs">
        <button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="plates">Plates</button><button class="tab" data-tab="climate">Climate</button><button class="tab" data-tab="charts">Charts</button><button class="tab" data-tab="events">Events</button><button class="tab" data-tab="goals">Goals</button>
      </div>
      <div data-pane="overview">
        <div class="objective" id="objectiveBox"></div>
        <h3 style="margin-top:16px">Planet vitals</h3><div id="vitals"></div>
        <h3 style="margin-top:16px">Why is this happening?</h3><div id="explainer" class="smalltxt muted"></div>
      </div>
      <div data-pane="plates" class="hidden">
        <h3>Plates</h3><div id="plateList"></div>
        <h3 style="margin-top:16px">Selected plate</h3><div id="plateDetail" class="smalltxt muted">Select a plate in the list or click the map.</div>
        <label class="lab">Plate speed multiplier · <span id="plateSpeedVal">1.00×</span></label><input id="mantleSpeed" type="range" min="0" max="2" step="0.05" value="1">
        <label class="lab">Mantle heat · <span id="mantleHeatVal">1.00×</span></label><input id="mantleHeat" type="range" min="0.4" max="1.8" step="0.05" value="1">
        <div class="compactrow" style="margin-top:10px"><button class="btn small gold" id="btnSplitSelected">Rift selected plate</button><button class="btn small" id="btnStopSelected">Stop plate</button></div>
      </div>
      <div data-pane="climate" class="hidden">
        <h3>Climate forcing</h3>
        <label class="lab">Solar output · <span id="solarVal">0</span></label><input id="solarRange" type="range" min="-3" max="3" step="0.1" value="0">
        <label class="lab">Greenhouse forcing · <span id="ghgVal">0</span></label><input id="ghgRange" type="range" min="-2" max="4" step="0.1" value="0">
        <label class="lab">Rainfall multiplier · <span id="rainVal">1.0×</span></label><input id="rainRange" type="range" min="0.3" max="2" step="0.1" value="1">
        <label class="lab">Sea-level offset · <span id="seaVal">0 m</span></label><input id="seaRange" type="range" min="-80" max="80" step="5" value="0">
        <div class="okbar" style="margin-top:14px">Volcanoes naturally raise CO₂. Rain on high land weathers rock and draws CO₂ back down — build mountains to cool a hot world, rift them apart to slow the drawdown.</div>
        <h3>Live feedback loops</h3><div id="feedbackList" class="smalltxt muted"></div>
      </div>
      <div data-pane="charts" class="hidden">
        <h3>Deep-time history</h3>
        <div class="seg" id="chartSeg"><button data-chart="climate" class="active">Climate</button><button data-chart="land">Land &amp; ice</button><button data-chart="assembly">Assembly</button></div>
        <canvas id="chart" class="chart" width="640" height="300" style="margin-top:10px"></canvas>
        <div id="chartStats" class="smalltxt muted" style="margin-top:10px"></div>
      </div>
      <div data-pane="events" class="hidden"><h3>Geological record</h3><div class="log" id="eventLog"></div></div>
      <div data-pane="goals" class="hidden"><h3>Milestones &amp; unlocks</h3><div id="milestoneList"></div><h3 style="margin-top:16px">Run statistics</h3><div id="runStats"></div></div>
    </aside>
  </div>
</main>

<div id="modalRoot"></div>

function generateWorld(seed){

 const seeds=[]; const np=11;

 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let best=1e9,bi=0;for(let i=0;i<np;i++){let dx=Math.abs(x-seeds[i].x);dx=Math.min(dx,W-dx);const dy=(y-seeds[i].y)*1.25,d=dx*dx+dy*dy;if(d<best){best=d;bi=i}}const id=idx(x,y);plateField[id]=bi;crust[id]=0;elev[id]=-.55+(rnd()-.5)*.16;age[id]=20+rnd()*120;volc[id]=0;moistA[id]=.4;wetBoost[id]=0;}
 const blobs=6+Math.floor(rnd()*3);
 for(let b=0;b<blobs;b++){const cx=rnd()*W,cy=10+rnd()*(H-20),rx=5+rnd()*10,ry=3.5+rnd()*5.5,rot=rnd()*Math.PI;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let dx=Math.abs(x-cx);dx=Math.min(dx,W-dx);const dy=y-cy;const lx=dx*Math.cos(rot)-dy*Math.sin(rot),ly=dx*Math.sin(rot)+dy*Math.cos(rot);const d=(lx*lx)/(rx*rx)+(ly*ly)/(ry*ry)+ (rnd()-.5)*.18;if(d<1){const id=idx(x,y);crust[id]=1;elev[id]=.18+ (1-d)*.38+(rnd()-.5)*.12;age[id]=500+rnd()*1800;}}}
 // a few starter ranges where blobs overlap plates naturally vary
 for(let i=0;i<N;i++){if(crust[i]&&elev[i]>G0max()){} }
 computePlateCounts(); computeClimate(0,true); computeDerived(true);

function shiftPlate(p,dx,dy){
 const src=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y);if(plateField[i]===p.id)src.push([x,y,i]);}
 if(!src.length)return;
 const old={plate:plateField.slice(),crust:crust.slice(),elev:elev.slice(),age:age.slice(),volc:volc.slice()};
 // vacate: trailing edge becomes young oceanic crust of same plate
 for(const [x,y,i] of src){crust[i]=0;elev[i]=-0.38;age[i]=0;volc[i]=Math.max(volc[i],.12);}
 // continents first so they override oceanic crust in collisions
 src.sort((a,b)=>old.crust[b[2]]-old.crust[a[2]]);
 for(const [x,y,i] of src){const nx=x+dx,ny=clamp(y+dy,0,H-1);if(ny!==y+dy)continue;const t=idx(nx,ny);const targetPlate=old.plate[t];
   if(targetPlate!==p.id&&old.crust[i]===0&&old.crust[t]===1){ // oceanic dives under continent
     elev[t]+= .18; volc[t]=Math.min(2,volc[t]+.8); G.stats.quakes++; continue;}
   if(targetPlate!==p.id&&old.crust[i]===1&&old.crust[t]===1){elev[t]=Math.max(old.elev[t],old.elev[i])+.32;volc[t]=Math.min(1.6,volc[t]+.35);G.stats.collisions++;pulse(nx,ny,"#e9c46a");logEvent("Continents collide","warn",PLATE_NAMES[p.id]+" crust crumples into "+PLATE_NAMES[targetPlate]+". A new range rises and weathering will slowly draw down CO₂.");}
   plateField[t]=p.id;crust[t]=old.crust[i];elev[t]=old.elev[i]+(targetPlate!==p.id&&old.crust[i]===1&&old.crust[t]===0?.12:0);age[t]=old.age[i];volc[t]=Math.max(volc[t],old.volc[i]);}
 computePlateCounts();
}
function boundaryStep(dt){
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y),p=plates[plateField[i]];if(!p)continue;
  for(let dir=0;dir<2;dir++){const dx=dir===0?1:0,dy=dir===0?0:1;const j=idx(x+dx,y+dy),q=plates[plateField[j]];if(!q||q.id===p.id)continue;
   const rel = dx? (q.vx-p.vx) : (q.vy-p.vy); const conv=-rel; const f=dt*G.mantleHeat;
   if(conv>0.015){ // convergence
     if(crust[i]!==crust[j]){const cont=crust[i]?i:j, oce=crust[i]?j:i; elev[cont]+=conv*f*1.5; volc[cont]=Math.min(2,volc[cont]+conv*f*2.2); elev[oce]-=conv*f*.7;}
     else if(crust[i]===1){elev[i]+=conv*f*1.35;elev[j]+=conv*f*1.35;volc[i]=Math.min(1.4,volc[i]+conv*f*.5);}
     else {elev[i]+=conv*f*.55;elev[j]+=conv*f*.55;volc[i]=Math.min(1.5,volc[i]+conv*f*1.1);}
   } else if(conv<-0.015){const div=-conv; // divergence: ridge / rift valley
     const target=crust[i]===1?0.02:-0.28; elev[i]+=(target-elev[i])*Math.min(.25,div*f*.8); elev[j]+=(target-elev[j])*Math.min(.25,div*f*.8); age[i]*=.92;age[j]*=.92; if(crust[i]===0)volc[i]=Math.min(.8,volc[i]+div*f*.4);
   }
  }}
}
function erosionStep(dt){
 const delta=new Float32Array(N);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y);let low=i,lv=elev[i];
  const n1=idx(x+1,y),n2=idx(x-1,y),n3=idx(x,y+1),n4=idx(x,y-1);if(elev[n1]<lv){lv=elev[n1];low=n1}if(elev[n2]<lv){lv=elev[n2];low=n2}if(elev[n3]<lv){lv=elev[n3];low=n3}if(elev[n4]<lv){lv=elev[n4];low=n4}
  if(low!==i){const diff=elev[i]-lv;const wet=clamp(moistA[i]*G.rainMul,0,2);const rate=elev[i]>G.seaLevel? .055*wet : .012;const amt=diff*rate*dt;delta[i]-=amt;delta[low]+=amt*(elev[low]<=G.seaLevel?.82:.96);} }

function computeClimate(dt,force){

 for(let y=0;y<H;y++){const lat=Math.abs((y/(H-1))-.5)*2;for(let x=0;x<W;x++){const i=idx(x,y);const lapse=Math.max(0,elev[i]-Math.max(0,G?G.seaLevel:0))*6.5;tempA[i]=(G?G.globalTemp:14.5)+15-lat*34-lapse+(crust[i]?1.2:-.4);}}

function biomeName(i){if(elev[i]<=G.seaLevel)return elev[i]<-.35?"Deep ocean":"Ocean"; if(tempA[i]<-2)return"Ice cap"; if(elev[i]>1.05)return"Alpine rock"; if(tempA[i]<3)return"Tundra"; if(moistA[i]<.28)return tempA[i]>22?"Hot desert":"Dry steppe"; if(moistA[i]>.82&&tempA[i]>20)return"Rainforest"; if(moistA[i]>.55)return"Forest"; return"Grassland"}
function stepSim(dt){
 G.time+=dt; for(let i=0;i<N;i++){age[i]+=dt; volc[i]*=Math.exp(-dt/7);}

function cellColor(i){
 if(overlay==="plates"){const base=PLATE_COLORS[plateField[i]%PLATE_COLORS.length];return crust[i]?base:shade(base,-28);}
 if(overlay==="age"){if(crust[i])return"#77806f"; const a=clamp(age[i]/180,0,1); return a<.33?"#e9c46a":a<.66?"#c97b4a":"#713f35";}
 if(overlay==="moist"){const m=clamp(moistA[i],0,1.2)/1.2; if(elev[i]<=G.seaLevel)return"#24485e"; return m<.25?"#c2a15c":m<.5?"#8ba75f":m<.75?"#4f9673":"#2d7f86";}
 if(overlay==="biome"){const b=biomeName(i);return{"Deep ocean":"#1b3a4f","Ocean":"#33718f","Ice cap":"#eef4f2","Alpine rock":"#8d8378","Tundra":"#a8b39a","Hot desert":"#d3a95c","Dry steppe":"#b8a967","Rainforest":"#2e7d4f","Forest":"#4d8f57","Grassland":"#93b465"}[b]||"#777";}
 return elevColor(i);
}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;return"rgb("+clamp(r,0,255)+","+clamp(g,0,255)+","+clamp(b,0,255)+")"}
function render(){
 if(!G)return; mctx.clearRect(0,0,map.width,map.height);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y);mctx.fillStyle=cellColor(i);mctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  if(volc[i]>.55&&elev[i]>G.seaLevel){mctx.fillStyle=volc[i]>1.1?"#e05252":"#e9c46a";mctx.beginPath();mctx.moveTo(x*CELL+5,y*CELL+2);mctx.lineTo(x*CELL+8.5,y*CELL+8);mctx.lineTo(x*CELL+1.5,y*CELL+8);mctx.fill();}
  if(x<W-1&&plateField[idx(x+1,y)]!==plateField[i]){mctx.fillStyle="rgba(8,10,9,.55)";mctx.fillRect((x+1)*CELL-1,y*CELL,2,CELL);}
  if(y<H-1&&plateField[idx(x,y+1)]!==plateField[i]){mctx.fillStyle="rgba(8,10,9,.55)";mctx.fillRect(x*CELL,(y+1)*CELL-1,CELL,2);}
 }
 if(overlay==="currents")drawCurrents();
 // plate velocity arrows at centroids
 const sums={};for(let y=0;y<H;y++)for(let x=0;x<W;x++){const p=plateField[idx(x,y)];sums[p]=sums[p]||[0,0,0];sums[p][0]+=x;sums[p][1]+=y;sums[p][2]++;}
 mctx.strokeStyle="#fff";mctx.fillStyle="#fff";mctx.lineWidth=2;
 for(const p of plates){const s=sums[p.id];if(!s)continue;const cx=s[0]/s[2]*CELL,cy=s[1]/s[2]*CELL;const vx=p.vx*260,vy=p.vy*260;if(Math.hypot(vx,vy)<3)continue;mctx.beginPath();mctx.moveTo(cx,cy);mctx.lineTo(cx+vx,cy+vy);mctx.stroke();mctx.beginPath();mctx.arc(cx+vx,cy+vy,3,0,7);mctx.fill(); if(selected.plate===p.id){mctx.strokeStyle="#e9c46a";mctx.beginPath();mctx.arc(cx,cy,15,0,7);mctx.stroke();mctx.strokeStyle="#fff";}}
 // hotspots
 for(const hs of hotspots){mctx.strokeStyle="#ffdf8a";mctx.lineWidth=2;mctx.beginPath();mctx.arc(hs.x*CELL+5,hs.y*CELL+5,8+Math.sin(performance.now()/280)*2,0,7);mctx.stroke();}
 // selection
 mctx.strokeStyle="#fff";mctx.lineWidth=2;mctx.strokeRect(selected.x*CELL+1,selected.y*CELL+1,CELL-2,CELL-2);
 // pulses & particles
 for(let i=pulses.length-1;i>=0;i--){const pu=pulses[i];pu.r+=.7;pu.a-=.018;mctx.strokeStyle=pu.color;mctx.globalAlpha=Math.max(0,pu.a);mctx.beginPath();mctx.arc(pu.x*CELL+5,pu.y*CELL+5,pu.r,0,7);mctx.stroke();mctx.globalAlpha=1;if(pu.a<=0)pulses.splice(i,1);}
 if(settings.particles){for(let i=particles.length-1;i>=0;i--){const pa=particles[i];pa.x+=pa.vx;pa.y+=pa.vy;pa.vy-=.012;pa.life--;mctx.fillStyle=pa.color;mctx.globalAlpha=clamp(pa.life/45,0,1);mctx.fillRect(pa.x,pa.y,pa.s,pa.s);mctx.globalAlpha=1;if(pa.life<=0)particles.splice(i,1);}}
 if(nudgeStart){mctx.strokeStyle="#e9c46a";mctx.lineWidth=3;mctx.beginPath();mctx.moveTo(nudgeStart.px,nudgeStart.py);mctx.lineTo(nudgeStart.cx,nudgeStart.cy);mctx.stroke();}
 drawCross();
}
function drawCurrents(){mctx.strokeStyle="rgba(255,255,255,.8)";mctx.fillStyle="rgba(255,255,255,.8)";mctx.lineWidth=1.4;for(let gy=2;gy<H;gy+=4)for(let gx=2;gx<W;gx+=4){const i=idx(gx,gy);if(elev[i]>G.seaLevel)continue;const lat=Math.abs(gy/H-.5)*2;let u=lat<.3?-1:lat<.65?1:-.7;let v=Math.sin(gx/W*Math.PI*4+gy*.08)*.45; // gyre swirl
 const ahead=idx(gx+Math.sign(u)*3,gy);if(elev[ahead]>G.seaLevel){const t=u;u=0;v=t>0?1:-1;} const len=11,x=gx*CELL,y=gy*CELL;mctx.beginPath();mctx.moveTo(x,y);mctx.lineTo(x+u*len,y+v*len);mctx.stroke();mctx.beginPath();mctx.arc(x+u*len,y+v*len,2,0,7);mctx.fill();}}
function drawCross(){const c=$("#cross");if(!c||!G)return;const x=c.getContext("2d");const yRow=selected.row;x.clearRect(0,0,c.width,c.height);x.fillStyle="#14100d";x.fillRect(0,0,c.width,c.height);
 // mantle convection
 const t=G.time*.15;for(let k=0;k<6;k++){const cx=(k+.5)*c.width/6,cy=190;x.strokeStyle=k%2?"#6e3a28":"#31556e";x.lineWidth=2;x.beginPath();x.arc(cx,cy,42, t+k, t+k+4.4);x.stroke();x.fillStyle="#e2724f";x.beginPath();x.arc(cx+Math.cos(t+k)*42,cy+Math.sin(t+k)*42,4,0,7);x.fill();}
 x.fillStyle="#31556e";x.fillRect(0,54,c.width,26); // ocean baseline guide
 // profile
 x.beginPath();let started=false;for(let gx=0;gx<W;gx++){const i=idx(gx,yRow);const px=gx/W*c.width;const py=82-clamp(elev[i],-0.9,1.8)*46;if(!started){x.moveTo(px,py);started=true}else x.lineTo(px,py);}x.strokeStyle="#e9c46a";x.lineWidth=2;x.stroke();x.lineTo(c.width,150);x.lineTo(0,150);x.closePath();x.fillStyle="#6b4a2f";x.fill();
 // sea level line
 const sy=82-G.seaLevel*46;x.strokeStyle="#7fd4e8";x.setLineDash([6,5]);x.beginPath();x.moveTo(0,sy);x.lineTo(c.width,sy);x.stroke();x.setLineDash([]);
 // plate segments + slabs
 for(let gx=1;gx<W;gx++){const a=idx(gx-1,yRow),b=idx(gx,yRow);if(plateField[a]!==plateField[b]){const px=gx/W*c.width;x.strokeStyle="#fff";x.beginPath();x.moveTo(px,35);x.lineTo(px,92);x.stroke(); if(crust[a]!==crust[b]){x.strokeStyle="#4b2c20";x.lineWidth=7;x.beginPath();x.moveTo(px,88);x.lineTo(px+34,180);x.stroke();x.lineWidth=2;}}}
 x.fillStyle="#fff";x.font="12px system-ui";x.fillText("Surface",10,48);x.fillText("Mantle convection",10,238);x.fillText("Sea level",c.width-70,sy-6);
 $("#crossRowLabel").textContent=yRow;
}
function spawnEruption(gx,gy){pulse(gx,gy,"#e2724f");if(!settings.particles)return;for(let k=0;k<22;k++)particles.push({x:gx*CELL+5,y:gy*CELL+4,vx:(Math.random()-.5)*1.6,vy:-Math.random()*2.2,s:2+Math.random()*3,life:28+Math.random()*35,color:Math.random()<.5?"#e2724f":"#4a4a4a"});}
function pulse(x,y,color){pulses.push({x,y,color,r:4,a:1});}
/* ============ UI ============ */
function toast(msg,kind=""){const el=document.createElement("div");el.className="toast "+kind;el.textContent=msg;$("#toastStack").appendChild(el);setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .4s";setTimeout(()=>el.remove(),420)},5200);while($("#toastStack").children.length>4)$("#toastStack").firstChild.remove();}
function logEvent(title,kind,body){events.unshift({t:G?G.time:0,title,kind,body});if(events.length>90)events.pop();renderLog();}
function renderLog(){$("#eventLog").innerHTML=events.map(e=>'<div class="event '+e.kind+'"><small>'+fmt(e.t,0)+' Myr · '+e.title+'</small>'+e.body+'</div>').join("")||'<p class="muted smalltxt">No events yet. Start time and geology will write its record here.</p>';}
function floatText(gx,gy,txt){const el=document.createElement("div");el.className="floatval";el.textContent=txt;el.style.left=(gx*CELL+4)+"px";el.style.top=(gy*CELL-4)+"px";$("#mapWrap").appendChild(el);setTimeout(()=>el.remove(),1250);}
function renderScenarios(){$("#scenarioList").innerHTML=SCENARIOS.map(sc=>'<button class="scenario" data-scenario="'+sc.id+'"><div class="eyebrow">'+sc.diff+'</div><h3>'+sc.name+'</h3><p>'+sc.desc+'</p><div class="tags">'+sc.tags.map(t=>'<span class="tag">'+t+'</span>').join("")+'</div></button>').join("");$$("#scenarioList [data-scenario]").forEach(b=>b.onclick=()=>startGame(SCENARIOS.find(s=>s.id===b.dataset.scenario)));}
function renderBest(){const best=readJSON("planetforge.best",{});const lines=Object.entries(best).map(([k,v])=>{const sc=SCENARIOS.find(s=>s.id===k);return (sc?sc.name:k)+": score "+v.score+" · "+fmt(v.time,0)+" Myr · "+(v.won?"completed":"ended")});$("#bestScores").innerHTML=lines.length?"<b style='color:#fff'>Forge record</b><br>"+lines.join("<br>"):"No completed planets yet. Your best runs will be remembered here.";const has=safeStore("planetforge.save");$("#btnContinue").style.display=has?"":"none";}
function renderTools(){$("#toolGrid").innerHTML=TOOLS.map(t=>{const un=isUnlocked(t.id);return'<button class="tool '+(tool===t.id?"active":"")+'" data-tool="'+t.id+'" '+(un?"":"disabled")+'><span class="tic">'+t.icon+'</span><b>'+t.name+'</b><small>'+(un?t.hint:'<span class="lock">'+t.unlock+'</span>')+'</small></button>'}).join("");$$("#toolGrid [data-tool]").forEach(b=>b.onclick=()=>{tool=b.dataset.tool;renderTools();updateHint();playSound("click")});}
function updateHint(){const h={inspect:"Inspect: click ground to probe it and move the cross-section.",uplift:"Uplift: drag across crust to raise it. High wet land weathers CO₂ away.",lower:"Subsidence: drag to sink crust, open basins and inland seas.",continent:"Continental crust: buoyant and old. Paint new cratons onto a plate.",ocean:"Oceanic crust: thin and dense. Paint young seafloor or future subduction zones.",nudge:"Plate Nudge: press on a plate, drag an arrow, release to set its velocity.",rain:"Rain brush: soak land to accelerate erosion and silicate weathering.",hotspot:"Hotspot: click seafloor and let the moving plate draw an island chain.",rift:"Rift Split: click a plate to tear it along that longitude.",plume:"Superplume: click for a flood-basalt plume head — islands, CO₂ and drama."};$("#mapHint").textContent=h[tool]||"";}
const LEGENDS={elev:'<span><i style="background:#1b3a4f"></i>Deep ocean</span><span><i style="background:#3f7f9c"></i>Shelf</span><span><i style="background:#7fae62"></i>Lowland</span><span><i style="background:#b2814e"></i>Highland</span><span><i style="background:#f0eee8"></i>Peaks / ice</span>',biome:'<span><i style="background:#33718f"></i>Ocean</span><span><i style="background:#2e7d4f"></i>Rainforest</span><span><i style="background:#d3a95c"></i>Desert</span><span><i style="background:#a8b39a"></i>Tundra</span><span><i style="background:#eef4f2"></i>Ice</span>',plates:"Each colour is one rigid plate. White arrows show its velocity; dark seams are plate boundaries.",age:'<span><i style="background:#e9c46a"></i>Young seafloor</span><span><i style="background:#713f35"></i>Old seafloor</span><span><i style="background:#77806f"></i>Ancient continental crust</span>',moist:'<span><i style="background:#c2a15c"></i>Arid</span><span><i style="background:#8ba75f"></i>Seasonal</span><span><i style="background:#2d7f86"></i>Wet</span>',currents:"Schematic gyres: trade-wind drift, westerlies and currents deflected by continents. Wet coasts feed rain and erosion."};
function renderHUD(){
 if(!G)return; const sc=G.scenario; const remain=sc.deadline?Math.max(0,sc.deadline-G.time):null;
 $("#clockTop").textContent=fmt(G.time,0)+" Myr"; $("#eraTop").textContent=eraName(); $("#hudTime").textContent=fmt(G.time,1)+" / "+(sc.deadline?sc.deadline+" Myr":"endless");
 $("#hudPhase").textContent=sc.id==="tutorial"?"Tutorial world":sc.id==="sandbox"?"Sandbox":("Phase "+G.phase+(G.phase===1?" · Assemble":" · Break apart")); $("#hudPang").textContent=fmt(G.pang*100,0)+"%";

 $("#hudGrid").innerHTML=metrics.map(m=>'<div class="metric"><small>'+m[0]+'</small><b>'+m[1]+'</b><span>'+m[2]+'</span><div class="gauge"><i class="'+(m[4]||"")+'" style="width:'+m[3]+'%"></i></div></div>').join("");
 $("#objectiveBox").innerHTML=objectiveText()+'<div class="progress"><i style="width:'+objectiveProgress()+'%"></i></div><div class="kv"><span>Objective progress</span><b>'+fmt(objectiveProgress(),0)+'%</b></div>'+(remain!==null?'<div class="kv"><span>Time remaining</span><b>'+fmt(remain,0)+' Myr</b></div>':"")+'<div class="kv"><span>Largest connected continent</span><b>'+fmt(G.pang*100,0)+'% of crust</b></div>';
 $("#vitals").innerHTML=[["Sea level",fmt(G.seaLevel*900,0)+" m"],["Volcanic index",fmt(G.volcIndex*100,2)],["Biome diversity",G.biomeDiversity+" biome types"],["Supercontinent stress",fmt(G.stress,0)+"%"],["Eruptions",G.stats.eruptions],["Collisions",G.stats.collisions],["Hotspots active",hotspots.length]].map(v=>'<div class="kv"><span>'+v[0]+'</span><b>'+v[1]+'</b></div>').join("");
 const loops=[]; if(G.volcIndex>.012)loops.push("Volcanism is high: CO₂ is rising, pushing temperature up even as ash briefly cools it."); if(G.stats.maxElev>1)loops.push("High ranges are exposed to rain: erosion is moving sediment offshore while weathering draws down CO₂."); if(G.iceFrac>.3)loops.push("Ice albedo is amplifying cooling and locking water up — sea level falls, exposing shelves."); if(G.pang>.65)loops.push("Continents are clustering: coastlines and rainfall interiors will dry as assembly proceeds."); if(!loops.length)loops.push("The planet is near balance. Nudge a plate or raise a range and watch CO₂, ice and sea level answer.");

}
function objectiveProgress(){if(!G)return 0;const sc=G.scenario;if(sc.id==="tutorial")return clamp((G.landFrac/.28)*30+(G.stats.maxElev>1?25:0)+(G.tutorial.hotspot?20:0)+(G.hab/45)*25,0,100); if(sc.id==="sandbox")return clamp(G.stats.maxPang/.78*60+(G.phase===2?(1-G.pang/.48)*40:0),0,100); return G.phase===1? clamp(G.pang/.78*55,0,55): clamp(55+(.78-G.pang)/(.78-.48)*45,0,100);}
function score(){if(!G)return 0;return Math.round(clamp(G.hab,0,100)*4 + (G.biomeDiversity||0)*35 + objectiveProgress()*3 + clamp(100-Math.abs(G.globalTemp-15)*4,0,100) + G.stats.eruptions*2);}
function renderProbe(){const i=idx(selected.x,selected.y);const p=plates[plateField[i]];if(!p)return;$("#probeInfo").innerHTML='<div class="kv"><span>Location</span><b>'+selected.x+", "+selected.y+'</b></div><div class="kv"><span>Plate</span><b>'+p.name+'</b></div><div class="kv"><span>Crust</span><b>'+(crust[i]?"Continental":"Oceanic")+'</b></div><div class="kv"><span>Elevation</span><b>'+fmt(elev[i]*8,1)+' km</b></div><div class="kv"><span>Crustal age</span><b>'+fmt(age[i],0)+' Myr</b></div><div class="kv"><span>Temperature</span><b>'+fmt(tempA[i],1)+'°C</b></div><div class="kv"><span>Moisture</span><b>'+fmt(moistA[i],2)+'</b></div><div class="kv"><span>Biome</span><b>'+biomeName(i)+'</b></div><div class="kv"><span>Volcanic heat</span><b>'+fmt(volc[i],2)+'</b></div>';}
function renderPlates(){$("#plateList").innerHTML=plates.filter(p=>p.cells>0).map(p=>{const sp=Math.hypot(p.vx,p.vy);const deg=Math.round(Math.atan2(-p.vy,p.vx)*180/Math.PI);return'<button class="platerow '+(selected.plate===p.id?"active":"")+'" data-plate="'+p.id+'"><span class="swatch" style="background:'+p.color+'"></span><span><b>'+p.name+'</b><small>'+p.cells+' cells · '+fmt(sp*52,1)+' cm/yr · heading '+((deg+360)%360)+'°</small></span><span>›</span></button>'}).join("");$$("#plateList [data-plate]").forEach(b=>b.onclick=()=>{selected.plate=+b.dataset.plate;renderPlates();renderPlateDetail();playSound("click")});renderPlateDetail();}
function renderPlateDetail(){const p=plates[selected.plate];if(!p)return;const sp=Math.hypot(p.vx,p.vy);$("#plateDetail").innerHTML='<div class="kv"><span>Plate</span><b>'+p.name+'</b></div><div class="kv"><span>Velocity</span><b>'+fmt(p.vx,3)+", "+fmt(p.vy,3)+' cells/Myr</b></div><div class="kv"><span>Speed</span><b>'+fmt(sp*52,1)+' cm/yr</b></div><p>Use Plate Nudge on the map for a new vector, Rift to split it, or stop it to let neighbours crash into it.</p>';}
function renderMilestones(){$("#milestoneList").innerHTML=MILESTONES.map(m=>'<div class="mile '+(G.milestones[m.id]?"done":"")+'"><span class="dot">'+(G.milestones[m.id]?"✓":"·")+'</span><span><b style="color:#fff">'+m.name+'</b><span>'+m.desc+'</span></span></div>').join("")}
function renderStats(){$("#runStats").innerHTML=[["Elapsed",fmt(G.time,0)+" Myr"],["Highest peak",fmt(G.stats.maxElev*8,1)+" km"],["Worst ice age",fmt(G.stats.maxIce*100,0)+"% ice"],["Best assembly",fmt(G.stats.maxPang*100,0)+"%"],["Eruptions / quakes",G.stats.eruptions+" / "+G.stats.quakes],["Impacts / plumes",G.stats.meteors+" / "+G.stats.plumes],["Rifts opened",G.stats.rifts],["Score",score()]].map(v=>'<div class="kv"><span>'+v[0]+'</span><b>'+v[1]+'</b></div>').join("");}
function renderTutorial(){const box=$("#tutorialBox");if(!G||G.scenario.id!=="tutorial"){box.innerHTML="";return;}const steps=[["Start time with the speed controls",G.tutorial.played],["Inspect any continent (tool 1, click)",G.tutorial.inspected],["Uplift at least 8 cells",G.tutorial.uplifted>=8],["Place a hotspot (unlocks early)",G.tutorial.hotspot],["Reach the tutorial objective",objectiveProgress()>=100]];box.innerHTML='<h3>Guided first forge</h3>'+steps.map(s=>'<div class="check '+(s[1]?"done":"")+'"><span class="box">'+(s[1]?"✓":"")+'</span><span>'+s[0]+'</span></div>').join("");}
function drawChart(){const c=$("#chart");if(!c||!G)return;const x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);x.fillStyle="#0d100e";x.fillRect(0,0,c.width,c.height);if(history.length<2){x.fillStyle="#a9b4aa";x.fillText("History will appear as deep time accumulates…",18,30);return;}
 const series= chartMode==="climate"?[{k:"temp",label:"Temp °C",color:"#e2724f",min:-5,max:35},{k:"co2",label:"CO₂ (÷60 ppm)",color:"#e9c46a",min:0,max:60}] : chartMode==="land"?[{k:"land",label:"Land %",color:"#7fb069",min:0,max:.7},{k:"ice",label:"Ice %",color:"#9fd8e8",min:0,max:1}] : [{k:"pang",label:"Largest continent %",color:"#e9c46a",min:0,max:1},{k:"hab",label:"Habitability %",color:"#57a99b",min:0,max:100}];
 x.strokeStyle="#2b332d";for(let gy=0;gy<5;gy++){x.beginPath();x.moveTo(42,20+gy*58);x.lineTo(c.width-12,20+gy*58);x.stroke();}
 for(const s of series){x.strokeStyle=s.color;x.lineWidth=2;x.beginPath();history.forEach((h,i)=>{let v=h[s.k];if(s.k==="co2")v/=60;const px=42+i/(Math.max(1,history.length-1))*(c.width-58);const py=250-clamp((v-s.min)/(s.max-s.min),0,1)*225; i?x.lineTo(px,py):x.moveTo(px,py);});x.stroke();}
 x.fillStyle="#edf2ec";x.font="12px system-ui";series.forEach((s,i)=>x.fillText("— "+s.label,48+i*190,18));
 $("#chartStats").innerHTML="Samples: "+history.length+" · Span "+fmt(history[0].t,0)+"–"+fmt(history[history.length-1].t,0)+" Myr · Peak land "+fmt(Math.max(...history.map(h=>h.land))*100,1)+"% · Warmest "+fmt(Math.max(...history.map(h=>h.temp)),1)+"°C";

function splitPlate(pid,cx,cy){

}

let AC=null,master=null,ambientNodes=null;
function audio(){if(AC){if(AC.state==="suspended")AC.resume();return AC;}try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=settings.muted?0:settings.volume;master.connect(AC.destination);}catch(e){}return AC;}
function startAmbient(){if(!settings.ambient||!audio()||ambientNodes)return;const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type="sine";o.frequency.value=48;f.type="lowpass";f.frequency.value=160;g.gain.value=.035;o.connect(f);f.connect(g);g.connect(master);o.start();ambientNodes={o,g};}
function stopAmbient(){if(ambientNodes){try{ambientNodes.o.stop()}catch(e){}ambientNodes=null;}}
function tone(freq,dur,type="sine",vol=.12,when=0){if(!audio()||settings.muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,AC.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+when+dur);o.connect(g);g.connect(master);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+dur+.02);}
function noiseBurst(dur=.5,vol=.25,freq=300){if(!audio()||settings.muted)return;const len=AC.sampleRate*dur,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type="lowpass";f.frequency.value=freq;g.gain.value=vol;src.buffer=buf;src.connect(f);f.connect(g);g.connect(master);src.start();}
function playSound(k){if(settings.muted)return; if(k==="click")tone(620,.06,"triangle",.05); if(k==="place"){tone(220,.12,"sine",.1);tone(440,.16,"sine",.07,.05);} if(k==="chime"||k==="milestone"){tone(523,.18,"sine",.09);tone(659,.18,"sine",.09,.09);tone(784,.28,"sine",.09,.18);} if(k==="eruption")noiseBurst(.7,.28,240); if(k==="quake")noiseBurst(.9,.2,90); if(k==="meteor"){noiseBurst(.8,.3,900);tone(90,.7,"sine",.16);} if(k==="rift"){noiseBurst(.45,.16,500);tone(160,.3,"triangle",.09);} if(k==="win"){tone(392,.3,"sine",.1);tone(523,.3,"sine",.1,.15);tone(659,.45,"sine",.1,.3);tone(784,.7,"sine",.1,.45);} if(k==="lose"){tone(220,.5,"sine",.12);tone(174,.8,"sine",.12,.25);}}

function modal(html){$("#modalRoot").innerHTML='<div class="modalback"><div class="modal">'+html+'</div></div>';}

function showHelp(){modal('<div class="eyebrow">Field guide</div><h2>How Planet Forge works</h2><div class="modalgrid"><div><h3 style="color:#e9c46a">The 60-second loop</h3><ol><li>Pick a scenario and press <b>1×</b> in the top bar.</li><li>Watch white arrows: plates drag continents with them.</li><li>Where arrows collide, land rises and volcanoes appear. Where they separate, young ocean opens.</li><li>Click ground to inspect it. Drag with <b>Plate Nudge</b> to change history.</li><li>Assemble a supercontinent, then unlock and use <b>Rift Split</b> on it.</li></ol><h3 style="color:#e9c46a">Reading the map</h3><p>Dark seams are plate boundaries. Triangles are volcanic heat. Rings are hotspots fixed in the mantle — plates slide across them, drawing island chains. Switch overlays for biomes, crustal age, rainfall and ocean gyres.</p></div><div><h3 style="color:#e9c46a">The coupled systems</h3><ul><li><b>Plates → mountains:</b> convergence uplifts; continent-continent crashes rise fastest.</li><li><b>Mountains + rain → cooling:</b> wet highlands erode and weather, drawing CO₂ down.</li><li><b>Volcanoes → warming:</b> eruptions add CO₂ (ash cools only briefly).</li><li><b>Ice → sea level:</b> more ice cools the planet further and exposes continental shelves.</li><li><b>Erosion → oceans:</b> sediment fills basins and builds new lowlands at coasts.</li></ul><h3 style="color:#e9c46a">Winning &amp; losing</h3><p>Complete each scenario objective before its deadline. Sustained runaway heat (25 Myr) or a snowball Earth ends the run — the warning bar tells you while there is still time to act.</p></div></div><div class="compactrow" style="margin-top:16px"><button class="btn primary" onclick="document.querySelector(\\'#modalRoot\\').innerHTML=\\'\\'">Back to the forge</button></div>');}
