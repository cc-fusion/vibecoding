<body>
<div id="title">
 <div class="titleCard">
  <div class="eyebrow">Emergent Systems Laboratory · 15</div>
  <h1>Swarm Intelligence<br>Lab</h1>
  <p class="sub">Tune three simple rules — <b style="color:#5eead4">separation, alignment, cohesion</b> — and watch murmuration, schooling, foraging, optimization and herding emerge. Outsmart learning predators, ride shifting winds, solve a landscape with particle swarm optimization, and graduate to the timed Sheepdog Capstone.</p>
  <div class="row" id="saveSummary"></div>
  <h3>1 · Choose a scenario</h3>
  <div class="scenGrid" id="scenGrid"></div>
  <h3>2 · Conditions</h3>
  <div class="row">
    <label style="margin:0">Difficulty
      <select id="diffSel"><option value="calm">Calm — gentle predators, long timers</option><option value="breezy" selected>Breezy — balanced lab standard</option><option value="tempest">Tempest — fast hawks, wild wind, short timers</option></select></label>
    <label style="margin:0">Species
      <select id="speciesSel"><option value="starling">Starlings — balanced murmuration</option><option value="fish">Fish — tight silver schools</option><option value="bee">Bees — buzzy, wide spacing</option><option value="mixed">Mixed flock — all three</option></select></label>
    <label style="margin:0">Flock size <input id="flockSize" type="range" min="40" max="240" step="10" value="130" style="width:130px"><b id="flockSizeVal">130</b></label>
  </div>
  <div class="row" style="margin-top:20px">
    <button class="primary" id="startBtn" style="font-size:17px;padding:13px 22px">▶ Enter the Lab</button>
    <button id="howBtn">How to Play</button><button id="titleSettingsBtn">Settings</button><button id="resetSaveBtn">Reset Progress</button>
  </div>
  <p class="small">Keyboard: Space pause · 1–6 tools · WASD steer dog / hawk · F food · G gust · M mute · H help. Progress, badges, upgrades and settings save locally.</p>
 </div>
</div>

<div id="lab">
 <header>
  <div class="logo">SWARM<i>LAB</i></div>
  <div class="hudStat"><small>Scenario</small><b id="hudScenario">Free</b></div>
  <div class="hudStat"><small>Clock</small><b id="hudClock">0:00</b></div>
  <div class="hudStat"><small>Objective</small><b id="hudObjective">Explore</b></div>
  <div class="hudStat"><small>Research</small><b id="hudRP">0 RP</b></div>
  <div class="hudStat"><small>Score</small><b id="hudScore">0</b></div>
  <div style="flex:1"></div>
  <button id="pauseBtn">⏸ Pause</button>
  <select id="speedSel" title="Simulation speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
  <button id="muteBtn">🔊</button>
  <input id="volSlider" type="range" min="0" max="100" value="70" style="width:80px" title="Volume">
  <button id="helpBtn">Help</button><button id="menuBtn">Menu</button>
 </header>
 <main>
  <section id="stage">
   <canvas id="view"></canvas>
   <div id="toolbar">
     <button data-tool="inspect" class="active" title="Inspect (1)">👁<br>Look</button>
     <button data-tool="food" title="Place food (2)">●<br>Food</button>
     <button data-tool="obstacle" title="Place rock (3)">▲<br>Rock</button>
     <button data-tool="roost" title="Place roost / goal (4)">⌂<br>Roost</button>
     <button data-tool="burst" title="Scare burst (5)">✦<br>Scare</button>
     <button data-tool="erase" title="Erase (6)">⌫<br>Erase</button>
   </div>
   <div id="missionBar"><div class="missionCard"><b id="missionTitle">Free Murmuration</b><br><span id="missionText"></span><div class="progress" style="margin-top:7px"><div id="missionProg" style="width:0%"></div></div></div>
   <div id="windBox">WIND<br><b id="windArrow" style="font-size:20px">→</b><br><span id="windTxt">4 m/s</span></div></div>
   <div id="tutorial" style="display:none"><div class="eyebrow">Guided first flight</div><h3 id="tutTitle"></h3><p id="tutText"></p><div class="row"><button id="tutPrev">Back</button><button class="primary" id="tutNext">Next</button><button id="tutSkip">Skip tutorial</button></div><div class="small" id="tutStep"></div></div>
   <div id="toastBox"></div>
  </section>
  <aside>
   <div class="tabs"><button data-tab="control" class="active">Control</button><button data-tab="species">Species</button><button data-tab="tasks">Tasks</button><button data-tab="upgrades">Upgrade</button><button data-tab="stats">Stats</button></div>

   <div class="panel on" id="panel-control">
     <div class="card"><h2>Flocking Rules</h2><p class="helpTxt">These three forces interact with wind, food, energy and predators. Small changes create visibly different collective behaviour.</p>
       <label>Separation <b id="vSep">1.15</b></label><input id="sSep" type="range" min="0" max="3" step="0.05" value="1.15">
       <label>Alignment <b id="vAli">1.00</b></label><input id="sAli" type="range" min="0" max="3" step="0.05" value="1">
       <label>Cohesion <b id="vCoh">0.85</b></label><input id="sCoh" type="range" min="0" max="3" step="0.05" value="0.85">
       <label>Perception radius <b id="vPer">46</b></label><input id="sPer" type="range" min="18" max="110" step="1" value="46">
       <label>Max speed <b id="vSpd">128</b></label><input id="sSpd" type="range" min="45" max="240" step="1" value="128">
       <div class="row" style="margin-top:10px"><button id="presetMurmur">Murmuration</button><button id="presetSchool">School</button><button id="presetChaos">Chaos</button><button id="presetTorus">Torus</button></div>
     </div>
     <div class="card"><h2>Environment</h2>
       <label>Wind strength <b id="vWind">18</b></label><input id="sWind" type="range" min="0" max="70" step="1" value="18">
       <label>Predators <b id="vPred">1</b></label><input id="sPred" type="range" min="0" max="4" step="1" value="1">
       <label>Food abundance <b id="vFood">1.0×</b></label><input id="sFood" type="range" min="0" max="2.5" step="0.1" value="1">
       <div class="row" style="margin-top:10px"><button id="gustBtn">🌬 Gust (G)</button><button id="bloomBtn">Food bloom</button><button id="addPredBtn">Release hawk</button></div>
       <div class="row" style="margin-top:8px"><button id="spawnBtn">+20 agents</button><button id="cullBtn">Cull weakest 10</button><button id="clearObsBtn">Clear rocks</button></div>
     </div>
     <div class="card"><h2>Selected Agent</h2><div id="inspectBox" class="helpTxt">Use Look tool and click/tap any agent. In Sheepdog mode WASD moves the dog; hold on the field to guide it.</div></div>
   </div>

   <div class="panel" id="panel-species">
     <div class="card"><h2>Species in the Lab</h2>
       <p class="helpTxt"><span class="legendDot" style="background:#5eead4"></span><b>Starlings</b> — balanced rules, dramatic murmurations, medium energy use.<br><br><span class="legendDot" style="background:#93c5fd"></span><b>Fish</b> — strong cohesion & alignment, tight flashing schools, panic waves.<br><br><span class="legendDot" style="background:#fbbf24"></span><b>Bees</b> — wide separation, jittery turns, superb foragers, fragile.<br><br><span class="legendDot" style="background:#f8fafc"></span><b>Sheep</b> — capstone only: cohesive, dog-fearing, drawn to the pen when calm.<br><br><span class="legendDot" style="background:#ef4444"></span><b>Hawks</b> — learning predators. Each catch makes them slightly faster and they target isolated stragglers.</p></div>
     <div class="card"><h2>Live Behaviour Metrics</h2><div class="kpiGrid">
       <div class="kpi"><small>Order parameter Φ</small><b id="kOrder">0.00</b></div><div class="kpi"><small>Nearest neighbour</small><b id="kNND">0 px</b></div>
       <div class="kpi"><small>Mean energy</small><b id="kEnergy">0%</b></div><div class="kpi"><small>Clusters</small><b id="kClusters">0</b></div>
       <div class="kpi"><small>Food eaten</small><b id="kFood">0</b></div><div class="kpi"><small>Hawk catches</small><b id="kCatch">0</b></div></div>
       <p class="helpTxt">Φ near 1 = one disciplined flock. Φ near 0 = milling chaos. Order feeds score; tight spacing invites hawk success, loose spacing wastes energy searching for food.</p></div>
   </div>

   <div class="panel" id="panel-tasks">
     <div class="card"><h2>Campaign & Badges</h2><div id="badgeList"></div></div>
     <div class="card"><h2>Scenario Actions</h2><div class="row"><button class="primary" id="completeBtn">Finish / Evaluate</button><button id="restartBtn">Restart scenario</button><button class="danger" id="failBtn">Abandon run</button></div><p class="helpTxt">Capstone unlocks after any <b>2 badges</b>. Badges and Research Points persist. Earn RP from food, sustained order, optimization and penned sheep — spend it in Upgrades.</p></div>
     <div class="card"><h2>Event Log</h2><div id="log"></div></div>
   </div>

   <div class="panel" id="panel-upgrades"><div class="card"><h2>Research Upgrades</h2><p class="helpTxt">Persistent between sessions. Each visibly changes the simulation.</p><div id="upgList"></div></div></div>

   <div class="panel" id="panel-stats">
     <div class="card"><h2>Order & Spacing</h2><canvas class="chart" id="chart1" width="640" height="160"></canvas><p class="small">Teal = order Φ · Amber = nearest-neighbour distance (scaled)</p></div>
     <div class="card"><h2>Energy & Population</h2><canvas class="chart" id="chart2" width="640" height="160"></canvas><p class="small">Green = mean energy · Red = population</p></div>
     <div class="card"><h2>Session Statistics</h2><table class="statTable" id="statTable"></table></div>
   </div>
  </aside>
 </main>
</div>

<div class="modalWrap" id="helpModal"><div class="modal"><div class="row" style="justify-content:space-between"><h2>How the Lab Works</h2><button data-close="helpModal">✕</button></div>
<p class="helpTxt"><b style="color:#fff">Goal loop (60 seconds):</b> pick Food tool → click field to feed → drag Separation/Alignment sliders → watch order Φ and spacing react → dodge the hawk with a Scare burst.<br><br>
<b style="color:#fff">Systems:</b> ① Flocking rules create order/clusters. ② Energy falls with speed & turning, rises at food/roosts — tired agents slow down, changing the flock shape. ③ Hawks learn and hunt stragglers, so spacing trades safety vs. efficiency. ④ Wind & gusts push everyone, breaking/forming streams. ⑤ Food depletes and blooms move the flock. In PSO mode the same agents become optimizer particles pulled by personal/global bests. In Sheepdog mode your dog is a moving predator the sheep flock away from — position behind them relative to the pen.<br><br>
<b style="color:#fff">Tools:</b> Look, Food (golden = rich), Rock, Roost, Scare, Erase. Mouse/touch drag paints food/rocks. WASD/arrows steer the dog (or your hawk with Predator tool selected in free modes). Space pause, 1–6 tools, +/- speed, M mute, H help.<br><br>
<b style="color:#fff">Winning:</b> complete each scenario objective before its clock ends. Fail by losing too much of the flock or running out of time. Free Murmuration is an endless sandbox — press Finish/Evaluate after holding Φ ≥ 0.85 for 5 s to earn its badge.</p>
<div class="row"><button class="primary" data-close="helpModal">Got it</button><button id="startTutBtn">Replay guided tutorial</button></div></div></div>

<div class="modalWrap" id="pauseModal"><div class="modal"><h2>Paused</h2><p class="helpTxt">Simulation frozen safely. Tab blur auto-pauses too.</p><div class="row"><button class="primary" id="resumeBtn">Resume</button><button id="pauseRestartBtn">Restart scenario</button><button id="pauseSettingsBtn">Settings</button><button id="quitTitleBtn">Save & Title</button></div></div></div>

<div class="modalWrap" id="settingsModal"><div class="modal"><div class="row" style="justify-content:space-between"><h2>Settings</h2><button data-close="settingsModal">✕</button></div>
<label>Master volume <b id="setVolVal">70%</b></label><input id="setVol" type="range" min="0" max="100" value="70">
<label>Motion trails <b>on/off</b></label><input type="checkbox" id="setTrails" checked>
<label>Agent labels / vectors <b>on/off</b></label><input type="checkbox" id="setLabels">
<label>Reduce particles (performance) <b>on/off</b></label><input type="checkbox" id="setReduce">
<label>Ambient sound <b>on/off</b></label><input type="checkbox" id="setAmbient" checked>
<div class="row" style="margin-top:14px"><button id="setMuteBtn">Mute / Unmute</button><button class="danger" id="wipeBtn">Wipe saved progress</button><button class="primary" data-close="settingsModal">Done</button></div></div></div>

<div class="modalWrap" id="endModal"><div class="modal"><div class="eyebrow" id="endEyebrow">Scenario complete</div><h1 style="font-size:42px" id="endTitle">Success</h1><p class="sub" id="endText"></p><div class="row" id="endStars" style="font-size:28px;color:#fbbf24"></div><table class="statTable" id="endTable"></table><div class="row" style="margin-top:16px"><button class="primary" id="endNextBtn">Next scenario</button><button id="endRetryBtn">Play again</button><button id="endTitleBtn">Title screen</button></div></div></div>

<script>
"use strict";
// ---------- utilities / seeded RNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);
function safeStore(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
// ---------- persistent save ----------
const DEFAULT_SAVE={badges:{},bests:{},rp:0,upgrades:{perception:0,speed:0,metabolism:0,dog:0,pso:0},settings:{vol:70,muted:false,trails:true,labels:false,reduce:false,ambient:true},seenTut:false};
let SAVE=safeStore("swarmLabSaveV1")||structuredClone(DEFAULT_SAVE);
SAVE.settings=Object.assign({},DEFAULT_SAVE.settings,SAVE.settings||{});SAVE.upgrades=Object.assign({},DEFAULT_SAVE.upgrades,SAVE.upgrades||{});SAVE.badges=SAVE.badges||{};SAVE.bests=SAVE.bests||{};
function persist(){safeStore("swarmLabSaveV1",SAVE)}
// ---------- audio (fully synthesized) ----------
const AudioSys={ctx:null,master:null,windGain:null,windSrc:null,
 init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=SAVE.settings.muted?0:SAVE.settings.vol/100;this.master.connect(this.ctx.destination);
  const len=2*this.ctx.sampleRate,buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  this.windSrc=this.ctx.createBufferSource();this.windSrc.buffer=buf;this.windSrc.loop=true;const f=this.ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=420;this.windGain=this.ctx.createGain();this.windGain.gain.value=0.015;this.windSrc.connect(f);f.connect(this.windGain);this.windGain.connect(this.master);this.windSrc.start();}catch(e){}},
 tone(fr,dur,type,vol,slide){if(!this.ctx||SAVE.settings.muted)return;const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type||"sine";o.frequency.setValueAtTime(fr,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur)},
 click(){this.tone(660,.06,"triangle",.05)},eat(){this.tone(880+Math.random()*220,.09,"sine",.06,1400)},catchS(){this.tone(220,.25,"sawtooth",.09,60)},good(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,.22,"triangle",.09),i*90))},bad(){[330,262,196].forEach((f,i)=>setTimeout(()=>this.tone(f,.25,"sawtooth",.07),i*110))},pen(){this.tone(740,.12,"triangle",.08,1180)},setWind(v){if(this.windGain&&SAVE.settings.ambient)this.windGain.gain.value=clamp(v/2200,0.004,0.06)}};
// ---------- scenarios ----------
const SCEN=[
 {id:"free",name:"Free Murmuration",icon:"🌀",desc:"Sandbox. Hold order Φ ≥ 0.85 for 5 s, then Evaluate.",time:0},
 {id:"forage",name:"Foraging Frenzy",icon:"🌾",desc:"Eat 80 food before the clock ends. Golden food = 3.",time:180},
 {id:"pso",name:"PSO Peak Finder",icon:"🏔",desc:"Particles search a hidden landscape. Reach fitness ≥ 0.92.",time:120},
 {id:"gauntlet",name:"Predator Gauntlet",icon:"🦅",desc:"Survive the full clock keeping ≥ 60% of the flock alive.",time:150},

// PSO landscape: mixture of peaks + ripple, coordinates normalized by canvas
function fitness(x,y){const{w,h}=canvasSize(),nx=x/Math.max(1,w),ny=y/Math.max(1,h);
 let v=.72*Math.exp(-((nx-.74)**2+(ny-.30)**2)/.012)+.55*Math.exp(-((nx-.28)**2+(ny-.68)**2)/.02)+.38*Math.exp(-((nx-.55)**2+(ny-.78)**2)/.008)+.10*Math.sin(nx*22)*Math.cos(ny*18);return clamp(v,0,1);}

function step(dt){
 S.time+=dt;if(S.left>0){S.left-=dt;if(S.left<=0){S.left=0;return endByTime();}}
 S.windAng+=Math.sin(S.time*.07)*.08*dt*3;if(S.gust>0)S.gust-=dt;
 const windMag=(parseFloat($("sWind").value)+ (S.gust>0?55:0))*DIFF[S.diff].wind;

 // spatial hash
 const cell=60, grid=new Map();S.boids.forEach((b,i)=>{const k=Math.floor(b.x/cell)+":"+Math.floor(b.y/cell);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(i);});
 const sep=parseFloat($("sSep").value),ali=parseFloat($("sAli").value),coh=parseFloat($("sCoh").value);
 const per=(parseFloat($("sPer").value))*(1+.15*SAVE.upgrades.perception), maxSpBase=parseFloat($("sSpd").value)*(1+.08*SAVE.upgrades.speed);
 let sumOX=0,sumOY=0,nndSum=0;
 const{w,h}=canvasSize();

 S.boids.forEach((b,i)=>{
  const spec=SPECIES[b.sp];let cnt=0,ax=0,ay=0,cx=0,cy=0,sx=0,sy=0,nnd=1e9;
  const gx=Math.floor(b.x/cell),gy=Math.floor(b.y/cell);
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const arr=grid.get((gx+dx)+":"+(gy+dy));if(!arr)continue;
   for(const j of arr){if(j===i)continue;const o=S.boids[j],ddx=b.x-o.x,ddy=b.y-o.y,d2=ddx*ddx+ddy*ddy,r=per*spec.per;if(d2<r*r){const d=Math.sqrt(d2)||.1;cnt++;ax+=o.vx;ay+=o.vy;cx+=o.x;cy+=o.y;if(d<34){sx+=ddx/(d*d)*90;sy+=ddy/(d*d)*90;}if(d<nnd)nnd=d;}}}
  b.neighbors=cnt;if(nnd<1e8)nndSum+=nnd;
  let fx=0,fy=0;
  if(cnt>0){fx+=(ax/cnt-b.vx)*ali*.9+(cx/cnt-b.x)*coh*.012+sx*sep*spec.sep;fy+=(ay/cnt-b.vy)*ali*.9+(cy/cnt-b.y)*coh*.012+sy*sep*spec.sep;}
  // food seeking (not sheep/pso)
  if(S.mode!=="dog"&&S.mode!=="pso"){let best=null,bd=190;for(const f of S.foods){const d=Math.hypot(f.x-b.x,f.y-b.y);if(d<bd){bd=d;best=f;}}if(best&&b.energy<92){fx+=(best.x-b.x)*.55;fy+=(best.y-b.y)*.55;}}
  // roost when tired
  if(b.energy<28&&S.mode!=="pso"){fx+=(S.roost.x*w-b.x)*.35;fy+=(S.roost.y*h-b.y)*.35;}
  // flee predators & dog
  for(const p of S.preds){const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<130){fx+=(b.x-p.x)/(d+8)*620;fy+=(b.y-p.y)/(d+8)*620;}}
  if(S.mode==="dog"){const d=Math.hypot(b.x-S.dog.x,b.y-S.dog.y);if(d<165){fx+=(b.x-S.dog.x)/(d+8)*880;fy+=(b.y-S.dog.y)/(d+8)*880;}
    // gentle pen attraction only when dog is far (calm sheep drift to pen grass)
    const px=S.roost.x*w,py=S.roost.y*h;if(d>210) {fx+=(px-b.x)*.06;fy+=(py-b.y)*.06;}}
  // obstacles
  for(const o of S.obs){const d=Math.hypot(b.x-o.x,b.y-o.y);if(d<o.r+42){fx+=(b.x-o.x)/(d+5)*520;fy+=(b.y-o.y)/(d+5)*520;}}
  // wind + wander
  fx+=wx*.35+Math.sin(S.time*1.7+b.id*2.1)*(b.sp==="bee"?26:7);fy+=wy*.35+Math.cos(S.time*1.4+b.id*1.7)*(b.sp==="bee"?26:7);
  // soft bounds
  if(b.x<45)fx+=180;if(b.x>w-45)fx-=180;if(b.y<45)fy+=180;if(b.y>h-45)fy-=180;
  const tired=clamp(b.energy/55,.35,1), maxSp=maxSpBase*spec.spd*tired;
  b.vx+=fx*dt*spec.turn*.42;b.vy+=fy*dt*spec.turn*.42;
  const sp=Math.hypot(b.vx,b.vy)||.1, cap=maxSp, minSp=cap*.42;
  if(sp>cap){b.vx=b.vx/sp*cap;b.vy=b.vy/sp*cap} else if(sp<minSp){b.vx=b.vx/sp*minSp;b.vy=b.vy/sp*minSp}
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.x=clamp(b.x,8,w-8);b.y=clamp(b.y,8,h-8);
  b.energy=clamp(b.energy-dt*(0.55+sp/95)*(1-.18*SAVE.upgrades.metabolism)*(S.mode==="dog"?.35:1),0,100);
  S.distance+=sp*dt/1000;sumOX+=b.vx/(sp||1);sumOY+=b.vy/(sp||1);
  // eat
  if(S.mode!=="pso"&&S.mode!=="dog")for(let fi=S.foods.length-1;fi>=0;fi--){const f=S.foods[fi];if(Math.hypot(f.x-b.x,f.y-b.y)<13){S.foods.splice(fi,1);b.energy=clamp(b.energy+22*f.amt,0,100);S.foodEaten+=f.amt;S.score+=f.golden?30:10;SAVE.rp+=f.golden?2:0;floatText(f.x,f.y,"+"+(f.golden?30:10),f.golden?"#fbbf24":"#5eead4");burst(f.x,f.y,f.golden?"#fbbf24":"#34d399",5);AudioSys.eat();if(Math.random()<.7)spawnFood(Math.random()<.08);break;}}
 });
 // PSO update replaces velocity logic result (apply after flock move: steer particles)
 if(S.mode==="pso")stepPSO(dt);
 // metrics
 const n=Math.max(1,S.boids.length);S.order=Math.hypot(sumOX,sumOY)/n;S.nnd=nndSum/n;S.peakOrder=Math.max(S.peakOrder,S.order);
 if(S.order>=.85)orderHold+=dt;else orderHold=Math.max(0,orderHold-dt*2);
 // clusters approx: count agents with <2 neighbours isolated + groups estimate

 // predators
 for(const p of S.preds){p.cool-=dt;let tx=w/2,ty=h/2,bestScore=-1;
  for(const b of S.boids){const iso=1/((b.neighbors||0)+1),d=Math.hypot(b.x-p.x,b.y-p.y),sc=iso*900-d*.4;if(sc>bestScore){bestScore=sc;tx=b.x;ty=b.y;}}
  if(S.playerHawk){tx=pointer.x;ty=pointer.y;}
  const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1,sp=p.spd+p.learn*7;
  p.vx=lerp(p.vx,dx/d*sp,.06);p.vy=lerp(p.vy,dy/d*sp,.06);p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=clamp(p.x,10,w-10);p.y=clamp(p.y,10,h-10);
  if(p.cool<=0)for(let i=S.boids.length-1;i>=0;i--){const b=S.boids[i];if(Math.hypot(b.x-p.x,b.y-p.y)<13){S.boids.splice(i,1);S.catches++;p.learn++;p.cool=1.2;S.score=Math.max(0,S.score-15);burst(b.x,b.y,"#ef4444",14);floatText(b.x,b.y,"CAUGHT","#f87171");AudioSys.catchS();log("Hawk caught a straggler (catch #"+S.catches+"). Hawk speed increased — tighten cohesion or add separation balance.");checkFail();break;}}}
 // dog
 if(S.mode==="dog"){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(pointer.down){const ddx=pointer.x-S.dog.x,ddy=pointer.y-S.dog.y,dd=Math.hypot(ddx,ddy);if(dd>14){dx=ddx/dd;dy=ddy/dd;}}
  const dsp=235*(1+.14*SAVE.upgrades.dog);S.dog.vx=lerp(S.dog.vx,dx*dsp,.18);S.dog.vy=lerp(S.dog.vy,dy*dsp,.18);S.dog.x=clamp(S.dog.x+S.dog.vx*dt,14,w-14);S.dog.y=clamp(S.dog.y+S.dog.vy*dt,14,h-14);
  let penned=0;const px=S.roost.x*w,py=S.roost.y*h;for(const b of S.boids)if(Math.abs(b.x-px)<95&&Math.abs(b.y-py)<72)penned++;
  if(penned!==S.penned&&penned>S.penned)AudioSys.pen();S.penned=penned;if(S.penned>=Math.ceil(S.sheepTotal*.8))return endRun(true,"You penned "+S.penned+" of "+S.sheepTotal+" sheep with "+fmtTime(S.left)+" to spare. Positioning — not chasing — is the whole art.");}
 // food spawn
 foodTimer-=dt;const abund=parseFloat($("sFood").value);if(foodTimer<=0&&S.mode!=="pso"&&S.mode!=="dog"){foodTimer=2.4/Math.max(.1,abund);if(S.foods.length<34*abund)spawnFood(Math.random()<.07);}
 // score from sustained order
 if(S.order>.8&&S.mode!=="pso")S.score+=dt*4;
 // particles/floats
 for(let i=S.parts.length-1;i>=0;i--){const p=S.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)S.parts.splice(i,1);}
 for(let i=S.floats.length-1;i>=0;i--){const f=S.floats[i];f.y-=28*dt;f.life-=dt;if(f.life<=0)S.floats.splice(i,1);}
 // events
 eventTimer-=dt;if(eventTimer<=0){eventTimer=26+Math.random()*18;randomEvent();}
 // charts
 chartTimer-=dt;if(chartTimer<=0){chartTimer=.5;S.hist.order.push(S.order);S.hist.nnd.push(S.nnd);S.hist.energy.push(S.boids.reduce((a,b)=>a+b.energy,0)/Math.max(1,S.boids.length));S.hist.pop.push(S.boids.length);["order","nnd","energy","pop"].forEach(k=>{if(S.hist[k].length>140)S.hist[k].shift()});drawCharts();renderStats();}
 updateHUD();
 if(S.mode==="forage"&&S.foodEaten>=80)return endRun(true,"Feast complete: "+S.foodEaten+" food eaten. Energy management and food placement kept the flock productive.");
 if(S.mode==="free"&&orderHold>=5){/* badge available via evaluate */}
 if(S.mode==="gauntlet")checkFail();
}
function stepPSO(dt){
 const{w,h}=canvasSize();let gbest=-1,gb=null;for(const b of S.boids){const f=fitness(b.x,b.y);if(f>b.pb){b.pb=f;b.pbx=b.x;b.pby=b.y;}if(b.pb>gbest){gbest=b.pb;gb=b;}}
 S.psoBest=gbest;S.psoBestPos=gb?{x:gb.pbx,y:gb.pby}:null;S.psoIter++;
 const inertia=.72-.05*SAVE.upgrades.pso, cog=1.45+.12*SAVE.upgrades.pso, soc=1.55+.15*SAVE.upgrades.pso;
 const r=mulberry32(S.seed+S.psoIter);
 for(const b of S.boids){b.vx=inertia*b.vx+cog*r()*(b.pbx-b.x)*.9+soc*r()*((gb?gb.pbx:b.x)-b.x)*.9;b.vy=inertia*b.vy+cog*r()*(b.pby-b.y)*.9+soc*r()*((gb?gb.pby:b.y)-b.y)*.9;
  const sp=Math.hypot(b.vx,b.vy),cap=230;if(sp>cap){b.vx=b.vx/sp*cap;b.vy=b.vy/sp*cap}b.x=clamp(b.x+b.vx*dt*1.6,6,w-6);b.y=clamp(b.y+b.vy*dt*1.6,6,h-6);b.energy=80;}
 S.score=Math.max(S.score,Math.round(gbest*1000));
 if(gbest>=.92)return endRun(true,"Global best fitness "+gbest.toFixed(3)+" found in "+S.psoIter+" iterations. Personal memory + social pull balanced exploration and convergence.");}
function randomEvent(){const ev=["gust","bloom","hawk","calm"][Math.floor(Math.random()*4)];
 if(ev==="gust"){S.gust=4;S.windAng+=(Math.random()-.5)*1.4;toast("🌬 Weather event: a 4-second gust shears across the field!","warn");log("Wind gust changed flow direction.");AudioSys.tone(180,.5,"sine",.05,420);}
 if(ev==="bloom"){for(let i=0;i<10;i++)spawnFood(i===0);toast("🌾 Food bloom! A rich patch appeared.","good");log("Food bloom: 10 pellets spawned.");}
 if(ev==="hawk"&&S.mode!=="dog"&&S.mode!=="pso"&&S.preds.length<4){spawnPred();toast("🦅 Predator surge: another hawk joins.","bad");}
 if(ev==="calm"){S.boids.forEach(b=>b.energy=clamp(b.energy+12,0,100));toast("☀ Calm air: every agent recovers energy.","good");log("Calm event restored flock energy.");}}
function checkFail(){if(!S||S.over)return;if((S.mode==="gauntlet"||S.mode==="forage")&&S.boids.length<Math.ceil(parseInt($("flockSize").value)*.35))endRun(false,"Too much of the flock was lost ("+S.boids.length+" remain). Hawks target isolated agents — raise cohesion, scare hawks away, and avoid over-separating.");}
function endByTime(){if(S.mode==="gauntlet"&&S.boids.length>=Math.ceil(parseInt($("flockSize").value)*.6))return endRun(true,"Survived the gauntlet with "+S.boids.length+" agents ("+S.catches+" catches).");
 if(S.mode==="free")return;
 endRun(false,S.mode==="dog"?("Time expired with "+S.penned+"/"+S.sheepTotal+" sheep penned (need "+Math.ceil(S.sheepTotal*.8)+"). Work from behind the flock, wide arcs — pushing straight scatters them."):S.mode==="pso"?("Clock ended at best fitness "+S.psoBest.toFixed(3)+" (need 0.920). Raise upgrades, or use Cohesion as social pull."):"Time expired at "+S.foodEaten+"/80 food. Place food ahead of the flock's flow and keep energy high.");}
function objectiveProgress(){if(!S)return 0;if(S.mode==="forage")return S.foodEaten/80;if(S.mode==="pso")return S.psoBest/.92;if(S.mode==="dog")return S.penned/Math.ceil(S.sheepTotal*.8);if(S.mode==="gauntlet")return S.left>0?1-(S.left/(SCEN.find(s=>s.id==="gauntlet").time*DIFF[S.diff].timeMul)):0;if(S.mode==="free")return clamp(orderHold/5,0,1);return 0;}
function endRun(win,msg){if(!S||S.over)return;S.over=true;S.paused=true;
 let stars=win?(S.left>30||S.mode==="free"?3:S.left>8?2:1):0;let rp=win?30+stars*15+Math.floor(S.score/250):Math.floor(S.score/400);
 SAVE.rp+=rp;S.rpEarned=rp;if(win){SAVE.badges[S.mode]=true;SAVE.bests[S.mode]=Math.max(SAVE.bests[S.mode]||0,Math.round(S.score));}persist();
 $("endEyebrow").textContent=win?"Scenario complete":"Scenario failed";$("endTitle").textContent=win?"★ Objective Achieved":"✕ Run Collapsed";$("endText").textContent=msg+(win?" +"+rp+" Research Points earned.":" Consolation +"+rp+" RP.");

function draw(){
 const{w,h}=canvasSize();ctx.clearRect(0,0,w,h);ctx.fillStyle=S.mode==="pso"?"#11150f":"#0e1a14";ctx.fillRect(0,0,w,h);

 // roost / pen
 const px=S.roost.x*w,py=S.roost.y*h;
 if(S.mode==="dog"){ctx.fillStyle="rgba(245,158,11,.14)";ctx.fillRect(px-95,py-72,190,144);ctx.strokeStyle="#f59e0b";ctx.lineWidth=2;ctx.strokeRect(px-95,py-72,190,144);ctx.fillStyle="#fbbf24";ctx.font="700 13px system-ui";ctx.fillText("PEN · "+S.penned+"/"+S.sheepTotal,px-88,py-80);}
 else{ctx.strokeStyle="rgba(45,212,191,.5)";ctx.beginPath();ctx.arc(px,py,20,0,7);ctx.stroke();ctx.fillStyle="#5eead4";ctx.font="11px system-ui";ctx.fillText("ROOST",px-16,py-26);}
 for(const o of S.obs){ctx.fillStyle="#475569";ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();ctx.fillStyle="#64748b";ctx.beginPath();ctx.arc(o.x-o.r*.25,o.y-o.r*.25,o.r*.45,0,7);ctx.fill();}
 for(const f of S.foods){ctx.fillStyle=f.golden?"#fbbf24":"#34d399";ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();if(f.golden){ctx.strokeStyle="#fde68a";ctx.stroke();}}
 // wind streaks
 ctx.strokeStyle="rgba(148,197,255,.20)";ctx.beginPath();const wx=Math.cos(S.windAng),wy=Math.sin(S.windAng);for(let i=0;i<10;i++){const x=(i*137+S.time*30)%w,y=(i*89)%h;ctx.moveTo(x,y);ctx.lineTo(x+wx*26,y+wy*26);}ctx.stroke();
 // boids
 for(const b of S.boids){const a=Math.atan2(b.vy,b.vx),spec=SPECIES[b.sp],sz=6*spec.size;
  if(SAVE.settings.trails){ctx.strokeStyle=spec.col+"55";ctx.beginPath();ctx.moveTo(b.x-b.vx*.14,b.y-b.vy*.14);ctx.lineTo(b.x,b.y);ctx.stroke();}
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);ctx.fillStyle=b.energy<22?"#f87171":spec.col;ctx.beginPath();ctx.moveTo(sz,0);ctx.lineTo(-sz*.8,sz*.55);ctx.lineTo(-sz*.45,0);ctx.lineTo(-sz*.8,-sz*.55);ctx.closePath();ctx.fill();ctx.restore();
  if(S.selected===b){ctx.strokeStyle="#fff";ctx.beginPath();ctx.arc(b.x,b.y,15+Math.sin(S.time*6)*2,0,7);ctx.stroke();}
  if(SAVE.settings.labels&&S.selected===b){ctx.fillStyle="#fff";ctx.font="10px system-ui";ctx.fillText("#"+b.id+" "+Math.round(b.energy)+"%",b.x+10,b.y-8);}}
 if(S.psoBestPos&&S.mode==="pso"){ctx.strokeStyle="#fbbf24";ctx.lineWidth=2;ctx.beginPath();ctx.arc(S.psoBestPos.x,S.psoBestPos.y,16+Math.sin(S.time*5)*3,0,7);ctx.stroke();ctx.fillStyle="#fbbf24";ctx.fillText("BEST "+S.psoBest.toFixed(3),S.psoBestPos.x+18,S.psoBestPos.y);}
 for(const p of S.preds){const a=Math.atan2(p.vy,p.vx);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(a);ctx.fillStyle="#ef4444";ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-9,9);ctx.lineTo(-4,0);ctx.lineTo(-9,-9);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle="#fca5a5";ctx.font="10px system-ui";ctx.fillText("HAWK Lv"+(1+p.learn),p.x+10,p.y-10);}
 if(S.mode==="dog"){ctx.fillStyle="#111827";ctx.beginPath();ctx.arc(S.dog.x,S.dog.y,11,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(S.dog.x+3,S.dog.y-3,4,0,7);ctx.fill();ctx.strokeStyle="#f8fafc";ctx.stroke();ctx.fillStyle="#fff";ctx.font="700 10px system-ui";ctx.fillText("DOG",S.dog.x-10,S.dog.y-15);}
 for(const p of S.parts){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1;}
 for(const f of S.floats){ctx.globalAlpha=clamp(f.life,0,1);ctx.fillStyle=f.col;ctx.font="800 13px system-ui";ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;}
 // compass arrow rotation
 $("windArrow").style.transform=\`rotate(\${S.windAng}rad)\`;$("windArrow").textContent="➤";$("windTxt").textContent=Math.round(parseFloat($("sWind").value)*DIFF[S.diff].wind+(S.gust>0?55:0))+" m/s";
}
function drawPSO(w,h){if(!PSO_BG){PSO_BG=document.createElement("canvas");PSO_BG.width=w;PSO_BG.height=h;const c=PSO_BG.getContext("2d"),img=c.createImageData(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const f=fitness(x,y),i=(y*w+x)*4;img.data[i]=30+f*220;img.data[i+1]=45+f*165;img.data[i+2]=25+f*55;img.data[i+3]=255;}c.putImageData(img,0,0);}ctx.drawImage(PSO_BG,0,0,w,h);}

function loop(ts){if(!S)return;const rawDt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;
 if(!S.paused&&!S.over){let simDt=rawDt*S.speed;let steps=S.speed>=4?2:1;for(let i=0;i<steps;i++)step(simDt/steps);}
 draw();updateHUD();rafId=requestAnimationFrame(loop);}

 $("hudObjective").textContent=S.mode==="forage"?S.foodEaten+"/80 food":S.mode==="pso"?("Fit "+S.psoBest.toFixed(2)+"/0.92"):S.mode==="dog"?(S.penned+"/"+Math.ceil(S.sheepTotal*.8)+" penned"):S.mode==="gauntlet"?("Flock "+S.boids.length):("Φ hold "+orderHold.toFixed(1)+"/5s");
 $("kOrder").textContent=(S.order||0).toFixed(2);$("kNND").textContent=Math.round(S.nnd||0)+" px";$("kEnergy").textContent=Math.round(S.boids.reduce((a,b)=>a+b.energy,0)/Math.max(1,S.boids.length))+"%";$("kClusters").textContent=S.clusters||0;$("kFood").textContent=S.foodEaten;$("kCatch").textContent=S.catches;
 $("missionProg").style.width=(objectiveProgress()*100)+"%";}

 if(tool==="inspect"&&!paint){let best=null,bd=28;for(const b of S.boids){const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<bd){bd=d;best=b;}}S.selected=best;

 if(tool==="food"){S.foods.push({x:p.x,y:p.y,amt:Math.random()<.1?3:1,golden:Math.random()<.1,r:6});burst(p.x,p.y,"#34d399",3);}

 if(tool==="roost"&&!paint){S.roost={x:p.x/canvasSize().w,y:p.y/canvasSize().h};toast("Roost / attractor moved.","good");}
 if(tool==="burst"&&!paint){burst(p.x,p.y,"#e7f0ea",18);for(const b of S.boids){const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<130){b.vx+=(b.x-p.x)/(d+6)*260;b.vy+=(b.y-p.y)/(d+6)*260;}}for(const pr of S.preds){const d=Math.hypot(pr.x-p.x,pr.y-p.y);if(d<170){pr.vx+=(pr.x-p.x)/(d+6)*300;pr.vy+=(pr.y-p.y)/(d+6)*300;}}AudioSys.tone(300,.18,"square",.05,900);}
 if(tool==="erase"){S.obs=S.obs.filter(o=>Math.hypot(o.x-p.x,o.y-p.y)>o.r+8);S.foods=S.foods.filter(f=>Math.hypot(f.x-p.x,f.y-p.y)>16);}}

$("presetMurmur").onclick=()=>setRules(1.15,1.35,.75);$("presetSchool").onclick=()=>setRules(.8,.9,1.5);$("presetChaos").onclick=()=>setRules(2.4,.25,.2);$("presetTorus").onclick=()=>setRules(1.0,1.8,.35);
function applySpeciesPreset(){const sp=$("speciesSel").value;if(S&&S.mode==="dog")return;if(sp==="fish")setRules(.75,1.1,1.35);else if(sp==="bee")setRules(1.7,.7,.8);else if(sp==="starling")setRules(1.15,1.2,.85);}
$("gustBtn").onclick=()=>{if(S){S.gust=4;AudioSys.tone(180,.5,"sine",.05,420);}};
$("bloomBtn").onclick=()=>{if(S){for(let i=0;i<10;i++)spawnFood(i===0);toast("Food bloom placed.","good");}};
$("addPredBtn").onclick=()=>{if(S&&S.preds.length<5){spawnPred();AudioSys.catchS();}};
$("spawnBtn").onclick=()=>{if(S&&S.boids.length<260){for(let i=0;i<20;i++){const{w,h}=canvasSize();S.boids.push({id:1000+S.boids.length,x:w/2+(Math.random()-.5)*80,y:h/2+(Math.random()-.5)*80,vx:60,vy:20,sp:["starling","fish","bee"][i%3],energy:80,pb:0,pbx:0,pby:0});}}};
$("cullBtn").onclick=()=>{if(S){S.boids.sort((a,b)=>a.energy-b.energy);S.boids.splice(0,Math.min(10,S.boids.length));toast("Weakest 10 culled. Population pressure eased.","warn");}};
$("clearObsBtn").onclick=()=>{if(S)S.obs=[];};
// tabs
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".panel").forEach(p=>p.classList.remove("on"));$("panel-"+b.dataset.tab).classList.add("on");AudioSys.click();drawCharts();renderStats();});
// resize
new ResizeObserver(()=>{resizeCanvas();}).observe($("stage"));window.addEventListener("resize",resizeCanvas);
// init
syncSettings();renderScen();resizeCanvas();
