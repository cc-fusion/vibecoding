  function titleHTML(){return `<main class="title-screen"><div class="halo"></div><div class="crest">✺</div><div class="eyebrow">Three souls. Three acts. One final heartbeat.</div><h1>ASHEN <span>ASCENT</span></h1><p>Climb a dying spire. Forge a deck from its ruins. Every choice is a weapon; every wound is a lesson.</p><div class="title-actions"><button class="btn" data-action="select">Begin Ascent</button><button class="btn alt" data-action="help">How to Play</button></div><div class="small muted">${save.wins} ascents completed · ${save.best} best score · ${save.shards} legacy embers</div></main>`}
  function selectHTML(){return `<main class="panel-content center"><div class="eyebrow">Prepare for the climb</div><h1 class="sectiontitle">Choose your vessel</h1><p class="muted">Each path has 60 unique cards to discover.</p><div class="select-grid">${classes.map((c,i)=>`<button class="character ${s.selectedClass===i?'selected':''}" data-action="chooseClass" data-index="${i}" ${save.unlocks[i]?'':'disabled'}><div class="sigil" style="color:${c.color}">${c.icon}</div><h3>${c.name}${!save.unlocks[i]?' · LOCKED':''}</h3><p>${c.desc}</p><div class="trait">${save.unlocks[i]?c.trait:'Unlock by reaching Act '+(i+1)}</div><div class="small muted" style="margin-top:9px">Legacy: +${save.boosts[i]*5} starting HP</div></button>`).join('')}</div><div class="setup"><label>Difficulty <select id="difficulty" class="settingselect">${['Wanderer','Veteran','Nightmare'].map(x=>`<option ${settings.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></label><span class="muted small">${settings.difficulty==='Nightmare'?'Enemies have 35% more HP and damage':settings.difficulty==='Veteran'?'Enemies have 17% more HP and damage':'A balanced ascent'}</span></div><div class="title-actions"><button class="btn" data-action="start">Start Run</button><button class="btn alt" data-action="legacy">Legacy Forge · ${save.shards} embers</button></div></main>`}
  function sideHTML(){return `<aside class="sidebar"><div class="portrait"><span style="color:${classes[s.selectedClass].color}">${classes[s.selectedClass].icon}</span></div><h3 class="side-name">${classes[s.selectedClass].name}</h3><div class="small muted">${s.difficulty} · Act ${s.act+1}</div><div class="meter"><i style="width:${100*s.hp/s.maxHp}%"></i></div><div class="small">♥ ${s.hp} / ${s.maxHp} HP ${s.block?` · ⬡ ${s.block} Block`:''}</div><div class="sideblock"><h4>Relics · ${s.relics.length}</h4><div class="relic-list">${s.relics.map(id=>{let r=relicBy(id);return `<div class="relic" title="${r[1]}: ${r[2]}">${r[3]}</div>`}).join('')}</div></div><div class="sideblock"><h4>Potions · ${s.potions.length}/3</h4>${s.potions.length?s.potions.map((id,i)=>{let p=potions.find(x=>x[0]===id);return `<button class="potion" data-action="potion" data-index="${i}" ${s.screen!=='battle'?'disabled':''} title="${p[2]}">${p[3]} ${p[1]}</button>`}).join(''):'<span class="small muted">Your pouch is empty.</span>'}</div></aside>`}
  function statusHTML(o){return [['strength','⚔'],['dex','✧'],['focus','✺'],['weak','↓'],['vuln','!'],['frail','◌'],['poison','☣'],['thorns','♠'],['regen','♥']].filter(([k])=>o[k]>0).map(([k,ic])=>`<span class="badge" title="${k}">${ic}${o[k]}</span>`).join('')}
  function battleHTML(){return `<div class="game-layout">${sideHTML()}<main class="battle-main"><div class="battle-heading"><div class="eyebrow">${names[s.act]} · ${s.nodeType.toUpperCase()}</div><h2>TURN ${s.turn}</h2></div><div class="battlefield"><div class="fighter player"><div class="intent">${s.energy} / ${3+(has('crown')?1:0)} ENERGY</div><span class="figure" style="color:${classes[s.selectedClass].color}">${classes[s.selectedClass].icon}</span><div class="f-name">${classes[s.selectedClass].name}</div><div class="f-hp">${s.hp} / ${s.maxHp} HP</div><div class="statuses">${statusHTML(s)}</div>${s.block?`<span class="blockbubble">⬡ ${s.block}</span>`:''}</div><div class="eyebrow" style="font-size:18px;opacity:.4">VS</div>${s.enemies.filter(e=>e.hp>0).map(e=>{let i=s.enemies.indexOf(e);return `<div class="fighter target" data-enemy="${i}" data-action="target" data-index="${i}"><div class="intent">${e.intent?.type==='attack'?`⚔ ${e.intent.damage+e.strength}${e.intent.hits>1?' × '+e.intent.hits:''}`:e.intent?.type==='defend'?`⬡ ${e.intent.block}`:e.intent?.label||'✧ '+e.intent?.type}</div><span class="figure" style="color:${e.elite?'#e6a587':'#a9b9a2'}">${e.icon}</span><div class="f-name">${e.name}</div><div class="meter" style="width:100px;margin:5px auto"><i style="width:${100*e.hp/e.maxHp}%"></i></div><div class="f-hp">${e.hp} / ${e.maxHp}</div><div class="statuses">${statusHTML(e)}</div>${e.block?`<span class="blockbubble">⬡ ${e.block}</span>`:''}</div>`}).join('')}</div><div class="hand-zone"><div class="hand-header"><div class="small muted">DRAW ${s.drawPile.length} · DISCARD ${s.discard.length} · EXHAUST ${s.exhaust.length}<br><span style="color:var(--teal)">Click a card to play it. Attacks target the first enemy; click an enemy first to aim.</span></div><button class="btn" data-action="endTurn" ${transitioning?'disabled':''}>End Turn ↵</button></div><div class="hand">${s.hand.map((c,i)=>cardHTML(c,i)).join('')}</div></div></main><aside class="sidebar right"><div class="sideblock" style="margin-top:0;border:0;padding:0"><h4>Battle Notes</h4><p class="small muted" style="line-height:1.7">Poison damages at end of turn and decays by 1. Weak reduces attacks. Vulnerable increases damage taken by 50%. Block fades next turn.</p></div><div class="sideblock"><h4>Current Target</h4><p class="small" style="color:var(--teal)">${s.enemies[s.target||0]?.hp>0?s.enemies[s.target||0].name:'First living enemy'}</p></div><div class="sideblock"><h4>Quick Keys</h4><p class="small muted">1–9 cards · Enter end turn<br>Esc pause · H help</p></div></aside></div>`}
  function mapHTML(){return `<main class="panel-content"><div class="panel-head"><div class="eyebrow">Act ${s.act+1} / 3 · ${s.difficulty}</div><h1 class="sectiontitle">${names[s.act]}</h1><p>Choose your path. Adjacent routes remain open; the past does not.</p></div><div class="route">${[...s.map].reverse().map((row,idx)=>{let r=4-idx;return `<div class="route-row">${row.map((type,l)=>{if(r===4&&l!==1)return '';let n=nodeInfo[type],avail=r===s.row+1&&Math.abs(l-s.lane)<=1&&(r!==4||l===1);return `<button class="node ${type==='boss'?'boss':''} ${r<=s.row?'past':avail?'available':'locked'}" data-action="node" data-row="${r}" data-lane="${l}" ${avail?'':'disabled'}><span class="glyph">${n[1]}</span><span>${n[0]}</span></button>`}).join('')}</div>`}).join('')}</div><p class="center small muted">Routes move upward · Battle ⚔ · Elite ♛ · Shop ◆ · Rest ♨ · Event ✧ · Relic ◈</p></main>`}
  function rewardHTML(){return `<main class="panel-content center"><div class="eyebrow">Victory claimed</div><h1 class="sectiontitle">The ashes yield</h1><p class="muted">+${s.rewardGold} gold · ${s.hp}/${s.maxHp} HP remaining</p>${s.rewardRelic?`<div class="choices"><button class="choice" data-action="rewardRelic"><div class="big">${relicBy(s.rewardRelic)[3]}</div><h3>${relicBy(s.rewardRelic)[1]}</h3><p>${relicBy(s.rewardRelic)[2]}</p></button></div>`:''}<div class="rule"></div><div class="eyebrow">Choose one card for your deck</div><div class="choices">${s.rewardCards.map((c,i)=>cardHTML(c,i,'rewardCard')).join('')}</div><button class="btn alt" data-action="skipReward">Skip card · +12 gold</button></main>`}
  function shopHTML(){if(!s.shopStock){let first=randomRelic();s.shopStock={relics:[first,randomRelic([first])],cards:Array.from({length:4},()=>pick(cards[s.selectedClass])),potions:[pick(potions)[0],pick(potions)[0]]}}return `<main class="panel-content center"><div class="eyebrow">The Peddler's Lantern</div><h1 class="sectiontitle">A price for every miracle</h1><p class="muted">Your purse: ◆ ${s.gold}</p><div class="shop-grid">${s.shopStock.relics.map((id,i)=>{let r=relicBy(id);return `<button class="shop-item" data-action="buyRelic" data-index="${i}" ${!id||has(id)||s.gold<140?'disabled':''}><div style="font-size:35px">${r?.[3]||'·'}</div><b>${r?.[1]||'Sold'}</b><p>${r?.[2]||''}</p><small>◆ 140</small></button>`}).join('')}${s.shopStock.cards.map((c,i)=>`<button class="shop-item" data-action="buyCard" data-index="${i}" ${!c||s.gold<65?'disabled':''}><div style="font-size:35px">${c?.icon||'·'}</div><b>${c?.name||'Sold'}</b><p>${c?cardDesc(c):''}</p><small>◆ 65</small></button>`).join('')}${s.shopStock.potions.map((id,i)=>{let p=potions.find(x=>x[0]===id);return `<button class="shop-item" data-action="buyPotion" data-index="${i}" ${!id||s.gold<45||s.potions.length>=3?'disabled':''}><div style="font-size:35px">${p?.[3]||'·'}</div><b>${p?.[1]||'Sold'}</b><p>${p?.[2]||''}</p><small>◆ 45</small></button>`}).join('')}<button class="shop-item" data-action="removeCard" ${s.gold<75||s.deck.length<=5?'disabled':''}><div style="font-size:35px">✂</div><b>Purify Deck</b><p>Remove one card permanently.</p><small>◆ 75</small></button></div><div class="divider"></div><button class="btn" data-action="leave">Continue Ascent</button></main>`}
  function restHTML(){return `<main class="panel-content center"><div class="eyebrow">A quiet place between storms</div><h1 class="sectiontitle">Sanctuary</h1><p class="muted">A moment to mend what the climb has broken.</p><div class="choices"><button class="choice" data-action="restHeal"><div class="big">♨</div><h3>Rest</h3><p>Restore ${Math.ceil(s.maxHp*.3)} HP.</p></button><button class="choice" data-action="restUpgrade"><div class="big">✧</div><h3>Temper</h3><p>Upgrade one card in your deck. Its effects improve.</p></button><button class="choice" data-action="restTrain"><div class="big">♥</div><h3>Endure</h3><p>Gain 5 maximum HP and heal 5.</p></button></div>${has('map')?'<p class="small muted">Seer Map: +20 gold on departure.</p>':''}</main>`}
  function eventHTML(){let event=s.eventChoice??R(4);s.eventChoice=event;const data=[['The Crimson Shrine','A voice in the stone offers a bargain.',[['Offer blood','Lose 10 HP. Gain a relic.','blood'],['Leave an offering','Pay 50 gold. Gain a relic.','offering'],['Walk away','No effect.','nothing']]],['Forgotten Library','Pages whisper of futures that have not happened.',[['Study the text','Add a rare card. Lose 6 HP.','study'],['Sell the pages','Gain 65 gold.','sell'],['Burn the book','Heal 12 HP.','burn']]],['The Wounded Pilgrim','A stranger reaches toward your lantern.',[['Share supplies','Lose 30 gold. Gain a relic.','share'],['Take their satchel','Gain 45 gold. Lose 8 HP.','steal'],['Offer comfort','Heal 10 HP.','comfort']]],['The Mirror Well','Your reflection holds a sharper blade.',[['Touch the water','Upgrade a card. Lose 5 HP.','mirror'],['Drink deeply','Gain 8 max HP. Lose 8 gold.','drink'],['Move on','Gain a potion.','move']]]][event];return `<main class="panel-content center"><div class="eyebrow">Uncharted encounter</div><h1 class="sectiontitle">${data[0]}</h1><p class="muted">${data[1]}</p><div class="choices">${data[2].map(([title,desc,id])=>`<button class="choice" data-action="eventChoice" data-id="${id}" ${id==='offering'&&s.gold<50||id==='share'&&s.gold<30?'disabled':''}><h3>${title}</h3><p>${desc}</p></button>`).join('')}</div></main>`}
  function treasureHTML(){let r=relicBy(s.treasureRelic);return `<main class="panel-content center"><div class="eyebrow">Forgotten relic vault</div><h1 class="sectiontitle">A glimmer in the dark</h1><div style="font-size:90px;color:var(--gold);margin:25px">${r[3]}</div><h2 class="display" style="color:var(--gold)">${r[1]}</h2><p class="muted">${r[2]}</p><button class="btn" data-action="takeTreasure">Claim Relic</button></main>`}
  function heartHTML(){return `<main class="panel-content center" style="padding-top:55px"><div class="eyebrow">Beyond the third gate</div><div style="font-size:110px;color:var(--red);animation:float 3s infinite;text-shadow:0 0 60px #e97565">♥</div><h1 class="sectiontitle">The Last Pulse</h1><p class="muted">The spire has a heart. It has heard every step you took.</p><div class="choices"><button class="choice" data-action="heartFight"><h3>Face the Heart</h3><p>One final battle. Claim true victory.</p></button><button class="choice" data-action="heartLeave"><h3>Leave with the Dawn</h3><p>End your ascent victorious, leaving the spire's secret untouched.</p></button></div></main>`}
  function endHTML(){let win=s.screen==='victory';return `<main class="panel-content center" style="padding-top:45px"><div style="font-size:75px;color:${win?'var(--gold)':'var(--red)'}">${win?'✺':'♜'}</div><div class="eyebrow">${win?'The dawn remembers you':'The spire claims another'}</div><h1 class="sectiontitle">${win?'ASCENT COMPLETE':'YOUR FLAME FADES'}</h1><p class="muted">${win?'You emerged from the ashes with a new story to tell.':'Even in defeat, an ember remains.'}</p><div class="rule"></div><div class="choices" style="gap:35px"><div><div class="eyebrow">Score</div><div class="statnum">${s.score}</div></div><div><div class="eyebrow">Battles</div><div class="statnum">${s.battles}</div></div><div><div class="eyebrow">Enemies</div><div class="statnum">${s.kills}</div></div><div><div class="eyebrow">Turns</div><div class="statnum">${s.turns}</div></div><div><div class="eyebrow">Legacy Embers</div><div class="statnum">+${s.earned}</div></div></div><p class="small muted">${classes[s.selectedClass].name} · ${s.difficulty} · ${Math.floor((Date.now()-s.started)/60000)} min · Act ${Math.min(4,s.act+1)}</p><div class="title-actions"><button class="btn" data-action="retry">New Ascent</button><button class="btn alt" data-action="title">Title Screen</button></div></main>`}
  function modalHTML(){let inner='';if(s.modal==='pause')inner=`<div class="eyebrow">The spire waits</div><h2>Paused</h2><p>Your path remains where you left it.</p><div class="title-actions"><button class="btn" data-action="close">Resume</button><button class="btn alt" data-action="settings">Settings</button><button class="btn alt" data-action="help">How to Play</button><button class="btn danger" data-action="abandon">Abandon Run</button></div>`;
    if(s.modal==='settings')inner=`<div class="eyebrow">Tune the ascent</div><h2>Settings</h2><p>Sound is generated live. There are no downloaded audio files.</p><p>Volume <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="${settings.volume}"> <span id="volumeValue">${Math.round(settings.volume*100)}%</span></p><p>Difficulty <select id="modalDifficulty" class="settingselect">${['Wanderer','Veteran','Nightmare'].map(x=>`<option ${settings.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></p><p class="small muted">Difficulty changes take effect on enemies generated in the next battle. Current enemies keep their stats.</p><button class="btn" data-action="close">Done</button>`;
    if(s.modal==='help')inner=`<div class="eyebrow">Field manual</div><h2>How to Play</h2><p>Climb three branching acts, defeat their guardians, then face the Heart. Choose a node to travel. In battle, play cards using energy, then end your turn. Enemy actions are shown above their heads. Build a deck through rewards, strengthen it at rest sites, and use shops and events to survive.</p><p><b>Combat:</b> Block absorbs damage before HP. Strength boosts attacks; Dexterity boosts Block. Poison ticks at the end of your turn. Weak reduces attacks. Vulnerable amplifies incoming damage. Relics provide permanent run bonuses; potions are single-use.</p><p><b>Controls:</b> Mouse / touch to interact. <span class="kbd">1</span>–<span class="kbd">9</span> play cards; click an enemy to set a target. <span class="kbd">Enter</span> ends turn. <span class="kbd">Esc</span> pauses. <span class="kbd">H</span> opens help.</p><p>Unlock the Veil by reaching Act 2 and the Oracle by reaching Act 3. Earn legacy embers each run to buy starting HP at the Legacy Forge.</p><button class="btn" data-action="close">Understood</button>`;
    if(s.modal==='deck'||s.modal==='upgrade'||s.modal==='remove')inner=`<div class="eyebrow">${s.modal==='deck'?'Your collection':s.modal==='upgrade'?'Choose a card to temper':'Choose a card to remove'}</div><h2>${s.modal==='deck'?'The Deck':s.modal==='upgrade'?'Temper a Card':'Purify the Deck'}</h2><p>${s.deck.length} cards. ${s.modal==='deck'?'Build a focused deck to draw your best cards more often.':'Select one card below.'}</p><div class="deck-grid">${s.deck.map((c,i)=>s.modal==='upgrade'&&c.upgraded?'':cardHTML(c,i,s.modal==='deck'?'inspect':s.modal==='upgrade'?'upgradeCard':'removeChosen')).join('')}</div>`;
    if(s.modal==='legacy')inner=`<div class="eyebrow">Persistent progression</div><h2>Legacy Forge</h2><p>You have <b style="color:var(--gold)">${save.shards} embers</b>. Temper a vessel to start all future runs with +5 maximum HP per level. Cost: ${10+(save.boosts[s.selectedClass]||0)*10} embers.</p><p>Selected: ${classes[s.selectedClass].name} · Level ${save.boosts[s.selectedClass]||0}/5</p><button class="btn" data-action="buyLegacy" ${save.shards<10+save.boosts[s.selectedClass]*10||save.boosts[s.selectedClass]>=5?'disabled':''}>Forge +5 HP</button>`;
    return `<div class="modal-wrap" data-action="overlay"><div class="modal" onclick="event.stopPropagation()"><button class="iconbtn close" data-action="close">×</button>${inner}</div></div>`}
  function eventEffect(id){s.events++;switch(id){case 'blood':s.hp=Math.max(1,s.hp-10);gainRelic(randomRelic());break;case 'offering':s.gold-=50;gainRelic(randomRelic());break;case 'study':s.hp=Math.max(1,s.hp-6);s.deck.push({...pick(cards[s.selectedClass].filter(c=>c.tier===2)),uid:cryptoId()});break;case 'sell':s.gold+=65;break;case 'burn':s.hp=Math.min(s.maxHp,s.hp+12);break;case 'share':s.gold-=30;gainRelic(randomRelic());break;case 'steal':s.gold+=45;s.hp=Math.max(1,s.hp-8);break;case 'comfort':s.hp=Math.min(s.maxHp,s.hp+10);break;case 'mirror':s.hp=Math.max(1,s.hp-5);let c=pick(s.deck.filter(x=>!x.upgraded));if(c)c.upgraded=true;break;case 'drink':s.gold=Math.max(0,s.gold-8);s.maxHp+=8;s.hp+=8;break;case 'move':addPotion();break}delete s.eventChoice;showToast('The path changes.');nextNode()}
  function clickAction(el){let a=el.dataset.action,i=Number(el.dataset.index),id=el.dataset.id;if(a==='help'||a==='settings'||a==='pause'||a==='deck'||a==='legacy'){s.modal=a;render();return}if(a==='close'||a==='overlay'){s.modal=null;render();return}if(a==='select'){s.screen='select'}else if(a==='chooseClass'){if(save.unlocks[i])s.selectedClass=i}else if(a==='start')startRun();else if(a==='node')chooseNode(Number(el.dataset.row),Number(el.dataset.lane));else if(a==='target'){s.target=i;showToast('Targeting '+s.enemies[i].name)}else if(a==='card')playCard(i,s.target||0);else if(a==='endTurn')endTurn();else if(a==='potion')usePotion(i);else if(a==='rewardRelic'){gainRelic(s.rewardRelic);s.rewardRelic=null}else if(a==='rewardCard'){s.deck.push({...s.rewardCards[i],uid:cryptoId()});s.shopStock=null;nextNode()}else if(a==='skipReward'){s.gold+=12;s.shopStock=null;nextNode()}else if(a==='buyRelic'){if(s.gold>=140&&s.shopStock.relics[i]){s.gold-=140;gainRelic(s.shopStock.relics[i]);s.shopStock.relics[i]=null}}else if(a==='buyCard'){if(s.gold>=65&&s.shopStock.cards[i]){s.gold-=65;s.deck.push({...s.shopStock.cards[i],uid:cryptoId()});s.shopStock.cards[i]=null;sfx('reward')}}else if(a==='buyPotion'){if(s.gold>=45&&s.potions.length<3&&s.shopStock.potions[i]){s.gold-=45;s.potions.push(s.shopStock.potions[i]);s.shopStock.potions[i]=null;sfx('reward')}}else if(a==='removeCard'){s.modal='remove'}else if(a==='removeChosen'){if(s.gold>=75&&s.deck.length>5){s.gold-=75;s.deck.splice(i,1);s.modal=null;sfx('reward')}}else if(a==='restHeal'){s.hp=Math.min(s.maxHp,s.hp+Math.ceil(s.maxHp*.3));if(has('map'))s.gold+=20;nextNode()}else if(a==='restUpgrade'){s.modal='upgrade'}else if(a==='restTrain'){s.maxHp+=5;s.hp+=5;if(has('map'))s.gold+=20;nextNode()}else if(a==='upgradeCard'){s.deck[i].upgraded=true;s.modal=null;if(has('map'))s.gold+=20;nextNode()}else if(a==='eventChoice')eventEffect(id);else if(a==='takeTreasure'){gainRelic(s.treasureRelic);nextNode()}else if(a==='leave'){s.shopStock=null;nextNode()}else if(a==='heartFight'){s.row=4;s.nodeType='boss';beginBattle('boss')}else if(a==='heartLeave')finish(true);else if(a==='retry'){s.screen='select';s.modal=null}else if(a==='title'){s={screen:'title',modal:null,selectedClass:s.selectedClass||0}}else if(a==='abandon'){s.modal=null;finish(false)}else if(a==='buyLegacy'){let cost=10+save.boosts[s.selectedClass]*10;if(save.shards>=cost&&save.boosts[s.selectedClass]<5){save.shards-=cost;save.boosts[s.selectedClass]++;persist();sfx('reward')}}else if(a==='inspect')return;render()}
  document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el&&!el.disabled){clickAction(el);if(el.dataset.action==='target'){document.querySelectorAll('.fighter.target').forEach(x=>x.classList.toggle('active',Number(x.dataset.index)===s.target))}}});
  document.addEventListener('change',e=>{if(e.target.id==='difficulty'||e.target.id==='modalDifficulty'){settings.difficulty=e.target.value;if(s.hp!==undefined)s.difficulty=settings.difficulty;render()}});
  document.addEventListener('input',e=>{if(e.target.id==='volume'){settings.volume=Number(e.target.value);let v=$('#volumeValue');if(v)v.textContent=Math.round(settings.volume*100)+'%'}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(s.modal){s.modal=null;render()}else if(!['title','select','victory','gameover'].includes(s.screen)){s.modal='pause';render()}return}if(e.key.toLowerCase()==='h'&&e.target.tagName!=='INPUT'){s.modal='help';render();return}if(s.modal||s.screen!=='battle'||transitioning)return;if(e.key==='Enter'){e.preventDefault();endTurn()}else if(/^[1-9]$/.test(e.key)){e.preventDefault();playCard(Number(e.key)-1,s.target||0)}});
  window.addEventListener('blur',()=>{if(s.screen==='battle'&&!s.modal){s.modal='pause';render()}});
  render();raf=requestAnimationFrame(loop);
})();
</script>
</body>
</html>
