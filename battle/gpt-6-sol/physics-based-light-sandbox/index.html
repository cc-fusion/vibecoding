<body>
<div class="app">
  <header class="top"><div class="brand"><button id="menu" class="ghost mobile-toggle" aria-label="Open tools">☰</button><span class="brand-mark"></span><span>Lumen Lab</span><span>Optics sandbox</span></div><div class="top-actions"><button class="ghost" id="resetView">Reset view</button><button class="ghost" id="clearScene">Clear scene</button></div></header>

      <button class="tool" data-add="laser"><svg viewBox="0 0 24 24"><path d="M3 9h8v6H3zM11 12h11M5 6V4h5v2"/></svg>Laser</button>
    </div>
    <div class="tool-group"><p class="section-label">Shape the light</p>
      <button class="tool" data-add="polarizer"><svg viewBox="0 0 24 24"><path d="M12 2v20M5 5l14 14M5 19l14-14"/></svg>Polarizing filter</button>
      <button class="tool" data-add="convex"><svg viewBox="0 0 24 24"><path d="M9 2q6 10 0 20M15 2q-6 10 0 20"/></svg>Convex lens</button>
      <button class="tool" data-add="concave"><svg viewBox="0 0 24 24"><path d="M6 2q6 10 0 20M18 2q-6 10 0 20"/></svg>Concave lens</button>
      <button class="tool" data-add="mirror"><svg viewBox="0 0 24 24"><path d="M7 2v20M10 2v20M14 5h5M14 10h5M14 15h5M14 20h5"/></svg>Straight mirror</button>
      <button class="tool" data-add="curved"><svg viewBox="0 0 24 24"><path d="M9 2q12 10 0 20M15 4l4 2M16 10l5 1M16 16l5-1"/></svg>Curved mirror</button>

      <button class="tool" data-add="prism"><svg viewBox="0 0 24 24"><path d="M3 19 12 3l9 16z"/></svg>Prism</button>
      <button class="tool" data-add="glass"><svg viewBox="0 0 24 24"><path d="M6 2v20M18 2v20M6 2h12M6 22h12"/></svg>Colored glass</button>

    <div class="tool-group"><p class="section-label">Measure</p><button class="tool" data-add="sensor"><svg viewBox="0 0 24 24"><path d="M5 3v18M9 5h9v14H9M12 15l2-5 2 3 1-2"/></svg>Sensor</button></div>

</div>
<script>

  function resize(){let rect=stage.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);invalidate()}

  function render(){if(!dirty)return;dirty=false;let w=stage.clientWidth,h=stage.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0b0e13';ctx.fillRect(0,0,w,h);
    let grid=50*view.scale;if(grid>12){let ox=((view.x*view.scale+w/2)%grid+grid)%grid,oy=((view.y*view.scale+h/2)%grid+grid)%grid;ctx.fillStyle='#202630';for(let x=ox;x<w;x+=grid)for(let y=oy;y<h;y+=grid){ctx.beginPath();ctx.arc(x,y,1,0,TAU);ctx.fill()}}
    let segments=trace();ctx.save();ctx.globalCompositeOperation='lighter';for(let s of segments){let a=toScreen(s.a),b=toScreen(s.b),rgb=color(s.nm),alpha=clamp(.035+Math.sqrt(s.power)*.17,.015,.7);ctx.strokeStyle=`rgba(${rgb.join(',')},${alpha})`;ctx.lineWidth=clamp(1.5+Math.sqrt(s.power)*2.2,1.5,6);ctx.shadowBlur=9;ctx.shadowColor=`rgba(${rgb.join(',')},${alpha*.8})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.restore();
    for(let o of objects)drawObject(o);if(getSelected()?.type==='sensor')updateSensorReadout();
  }
  function drawObject(o){let sel=o.id===selected,stroke=sel?'#d1f486':'#acbac9',p=toScreen(o),s=view.scale;ctx.save();ctx.strokeStyle=stroke;ctx.fillStyle='#151c25';ctx.lineWidth=sel?2.5:2;ctx.lineCap='round';ctx.lineJoin='round';
    function path(points,close=false,fill=false){ctx.beginPath();points.forEach((v,i)=>{let q=toScreen(world(v,o));i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});if(close)ctx.closePath();if(fill)ctx.fill();ctx.stroke()}
    if(o.type==='flashlight'||o.type==='laser'){path([{x:-18,y:-9},{x:12,y:-9},{x:18,y:-5},{x:18,y:5},{x:12,y:9},{x:-18,y:9}],true,true);if(o.type==='laser')drawLine(toScreen(world({x:-10,y:0},o)),toScreen(world({x:18,y:0},o)),'#ed7977',2);else path([{x:7,y:-8},{x:7,y:8}]);}
    else if(o.type==='prism'){let h=2*o.width*Math.tan(rad(o.apex)/2);ctx.fillStyle='rgba(115,161,188,.11)';path([{x:o.width/2,y:0},{x:-o.width/2,y:-h/2},{x:-o.width/2,y:h/2}],true,true)}
    else if(o.type==='curved'){let R=Math.max(Math.abs(o.focal)*2,o.length/2+1),sign=o.focal>=0?-1:1,points=[];for(let i=0;i<=24;i++){let y=o.length*(i/24-.5);points.push({x:sign*(R-Math.sqrt(Math.max(0,R*R-y*y))),y})}path(points)}
    else{let a=toScreen(world({x:0,y:-o.length/2},o)),b=toScreen(world({x:0,y:o.length/2},o));if(o.type==='glass'){ctx.strokeStyle='rgba(222,153,119,.68)';ctx.lineWidth=7*s;drawLine(a,b,'rgba(179,110,85,.25)',8*s);ctx.lineWidth=2}drawLine(a,b,stroke,o.type==='blocker'?5:2.5);if(o.type==='convex'||o.type==='concave'){for(let v of [-1,1]){let q=toScreen(world({x:0,y:v*o.length/2},o));ctx.beginPath();ctx.arc(q.x,q.y,3.5,0,TAU);ctx.stroke()}}if(o.type==='grating'){for(let i=-4;i<=4;i++){let q=toScreen(world({x:0,y:i*o.length/10},o));drawLine({x:q.x-4,y:q.y-2},{x:q.x+4,y:q.y+2},stroke,1)}}if(o.type==='sensor'){let q=toScreen(world({x:0,y:-o.length/2},o));ctx.fillStyle=stroke;ctx.fillRect(q.x-3,q.y-3,6,6)}}
    if(sel){let handle=toScreen(world({x:0,y:-(o.length||o.width||70)/2-28},o));let start=toScreen(world({x:0,y:-(o.length||o.width||70)/2-4},o));drawLine(start,handle,'#92a66d',1);ctx.beginPath();ctx.arc(handle.x,handle.y,7,0,TAU);ctx.fillStyle='#d1f486';ctx.fill();ctx.strokeStyle='#0b0e13';ctx.stroke();}
    ctx.restore();
  }
  function loop(){render();requestAnimationFrame(loop)}
  function field(o,key,label,min,max,step,unit=''){let v=o[key];return `<div class="field"><label for="f-${key}">${label}<span class="value" id="v-${key}">${v}${unit}</span></label><input id="f-${key}" data-key="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-unit="${unit}"></div>`}
  function selectField(o,key,label,options){return `<div class="field"><label for="f-${key}">${label}</label><select id="f-${key}" data-key="${key}">${options.map(([v,t])=>`<option value="${v}" ${o[key]===v?'selected':''}>${t}</option>`).join('')}</select></div>`}
  function textField(o,key,label,help){return `<div class="field"><label for="f-${key}">${label}</label><textarea id="f-${key}" data-key="${key}" spellcheck="false">${o[key]}</textarea><div class="field-help">${help}</div></div>`}
  function renderInspector(){let o=getSelected();if(!o){inspector.innerHTML='<div class="eyebrow">Inspector</div><div class="empty"><strong>Select an object</strong>Add an element from the left or click one in the scene to adjust its properties.</div>';return}
    let html=`<div class="inspector-head"><div><div class="eyebrow">Inspector</div><h2>${names[o.type]}</h2></div><button class="icon-btn" id="deleteObject" title="Delete object" aria-label="Delete object">×</button></div>`;
    if(o.type==='sensor')html+='<div class="readout" id="sensorValue">0.00</div><div class="readout-caption">Relative incident light</div><canvas class="spectrum sensor-spectrum" id="sensorChart"></canvas><div class="divider"></div>';
    html+='<div class="subhead">Placement</div>'+field(o,'angle','Rotation',-180,180,1,'°');
    if(o.type==='flashlight'||o.type==='laser')html+='<div class="divider"></div><div class="subhead">Emission</div>'+field(o,'intensity','Brightness',.05,3,.05,'×');
    if(o.type==='flashlight'){html+=field(o,'divergence','Beam divergence',0,160,1,'°')+field(o,'rays','Angular samples',3,45,2)+selectField(o,'preset','Spectrum preset',[['whiteLED','White LED'],['sunlight','Sunlight (5778 K)'],['incandescent','Incandescent (2700 K)'],['RGB','RGB blend'],['custom','Custom spectrum']]);if(o.preset==='custom')html+=textField(o,'spectrum','Spectral power (nm : level)','Comma-separated wavelength:power points from 380 to 780 nm; levels from 0 to 1. Values between points are interpolated.');html+='<canvas class="spectrum" id="sourceChart"></canvas>'}
    if(o.type==='laser')html+=field(o,'wavelength','Wavelength',380,780,1,' nm');
    if('length'in o&&!['flashlight','laser'].includes(o.type))html+=field(o,'length','Length',40,260,1,' mm');
    if(o.type==='convex'||o.type==='concave')html+=field(o,'focal','Focal length',o.type==='convex'?30:-400,o.type==='convex'?400:-30,1,' mm');
    if(o.type==='curved')html+=field(o,'focal','Focal length',-400,400,1,' mm')+field(o,'reflectance','Reflectance',0,1,.01);
    if(o.type==='mirror')html+=field(o,'reflectance','Reflectance',0,1,.01);
    if(o.type==='polarizer')html+=field(o,'axis','Axis relative to filter',-90,90,1,'°');
    if(o.type==='grating')html+=selectField(o,'mode','Grating type',[['transmission','Transmission'],['reflection','Reflective']])+field(o,'spacing','Groove spacing',.5,10,.1,' µm')+field(o,'orders','Maximum order',0,5,1)+field(o,'duty','Open fraction',.1,.9,.01)+field(o,'efficiency','Total efficiency',0,1,.01);
    if(o.type==='prism')html+=field(o,'width','Width',65,250,1,' mm')+field(o,'apex','Apex angle',25,100,1,'°')+field(o,'index','Refractive index at 589 nm',1,2,.001)+field(o,'dispersion','Silica dispersion scale',0,4,.05)+`<label class="toggle-row">Fresnel reflections <input type="checkbox" data-key="reflections" ${o.reflections?'checked':''}></label><div class="field-help">Total internal reflection is always simulated when the critical angle is exceeded.</div>`;
    if(o.type==='glass')html+=field(o,'reflectance','Reflectance',0,1,.01)+textField(o,'blocked','Blocked spectrum (nm : fraction)','0 transmits fully; 1 blocks fully. Interpolated between wavelength points.');
    html+='<div class="divider"></div><div class="small-actions"><button id="duplicateObject">Duplicate</button><button id="removeObject">Remove</button></div>';
    inspector.innerHTML=html;inspector.querySelectorAll('[data-key]').forEach(el=>{el.addEventListener('input',()=>{let key=el.dataset.key;if(key==='preset'&&el.value==='custom'&&!o.spectrum)o.spectrum=Array.from({length:21},(_,i)=>{let nm=380+i*20;return `${nm}:${clamp(spectrum(o,nm),0,1).toFixed(2)}`}).join(', ');o[key]=el.type==='checkbox'?el.checked:el.type==='range'?Number(el.value):el.value;if(key==='focal'&&o.type==='curved'&&Math.abs(o.focal)<31)o.focal=o.focal<0?-31:31;let val=document.getElementById('v-'+key);if(val)val.textContent=o[key]+(el.dataset.unit||'');if(key==='preset'){renderInspector()}else{drawCharts();invalidate()}})});
    for(let id of ['deleteObject','removeObject'])document.getElementById(id).onclick=removeSelected;
    document.getElementById('duplicateObject').onclick=()=>{let {id,x,y,type,...settings}=o;create(type,x+25,y+25,settings)};drawCharts();
  }
  function drawCharts(){let o=getSelected();if(!o)return;let chart=document.getElementById('sourceChart');if(chart){let c=chart.getContext('2d'),w=chart.width=260,h=chart.height=51;c.clearRect(0,0,w,h);for(let nm=380;nm<=780;nm+=2){let x=(nm-380)/400*w;c.fillStyle=`rgb(${color(nm).join(',')})`;c.globalAlpha=.18+.78*clamp(spectrum(o,nm),0,1);c.fillRect(x,h*(1-clamp(spectrum(o,nm),0,1)),2,h*clamp(spectrum(o,nm),0,1))}c.globalAlpha=1}updateSensorReadout()}
  function updateSensorReadout(){let o=getSelected(),el=document.getElementById('sensorValue');if(!o||o.type!=='sensor'||!el)return;let r=readings.get(o.id);el.textContent=(r?.total||0).toFixed(2);let chart=document.getElementById('sensorChart');if(!chart)return;let c=chart.getContext('2d'),w=chart.width=260,h=chart.height=75;c.clearRect(0,0,w,h);let max=Math.max(...(r?.bins||[0]),.01);for(let i=0;i<41;i++){let v=r?.bins[i]||0;c.fillStyle=`rgb(${color(380+i*10).join(',')})`;c.fillRect(i*w/41,h-v/max*(h-5),w/41+1,v/max*(h-5))}}
  function removeSelected(){objects=objects.filter(o=>o.id!==selected);selected=null;renderInspector();invalidate()}
  function hitObject(p){for(let o of [...objects].reverse()){let q=local(p,o);if(o.type==='flashlight'||o.type==='laser'){if(q.x>=-23&&q.x<=22&&Math.abs(q.y)<16)return o}else if(o.type==='prism'){let vs=prismVerts(o),area=(a,b,c)=>cross(sub(b,a),sub(c,a));let signs=vs.map((v,i)=>area(v,vs[(i+1)%3],p));if(signs.every(x=>x>=-5)||signs.every(x=>x<=5))return o}else if(o.type==='curved'){let h=o.length/2,R=Math.max(Math.abs(o.focal)*2,h+1),x=(o.focal>=0?-1:1)*(R-Math.sqrt(Math.max(0,R*R-q.y*q.y)));if(Math.abs(q.y)<h+9&&Math.abs(q.x-x)<11)return o}else if(Math.abs(q.x)<12&&Math.abs(q.y)<o.length/2+9)return o}return null}
  function pos(e){let r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  stage.addEventListener('pointerdown',e=>{if(e.target!==canvas)return;let sp=pos(e),wp=toWorld(sp),o=getSelected();if(o){let handle=toScreen(world({x:0,y:-(o.length||o.width||70)/2-28},o));if(norm(sub(sp,handle))<17)drag={kind:'rotate',o,offset:Math.atan2(wp.y-o.y,wp.x-o.x)-rad(o.angle)}}if(!drag){o=hitObject(wp);if(o){selected=o.id;drag={kind:'object',o,offset:sub(wp,o)};renderInspector()}else{selected=null;renderInspector();drag={kind:'pan',start:sp,x:view.x,y:view.y}}}stage.classList.add('dragging');stage.setPointerCapture(e.pointerId);invalidate()});
  stage.addEventListener('pointermove',e=>{if(!drag)return;let p=pos(e),w=toWorld(p);if(drag.kind==='object'){drag.o.x=w.x-drag.offset.x;drag.o.y=w.y-drag.offset.y}else if(drag.kind==='rotate'){drag.o.angle=Math.round((Math.atan2(w.y-drag.o.y,w.x-drag.o.x)-drag.offset)*180/Math.PI);let el=document.getElementById('f-angle'),v=document.getElementById('v-angle');if(el)el.value=drag.o.angle;if(v)v.textContent=drag.o.angle+'°'}else{view.x=drag.x+(p.x-drag.start.x)/view.scale;view.y=drag.y+(p.y-drag.start.y)/view.scale}invalidate()});
  stage.addEventListener('pointerup',()=>{drag=null;stage.classList.remove('dragging')});stage.addEventListener('pointercancel',()=>{drag=null;stage.classList.remove('dragging')});
  function zoom(amount,p={x:stage.clientWidth/2,y:stage.clientHeight/2}){let before=toWorld(p);view.scale=clamp(view.scale*amount,.35,3);let after=toWorld(p);view.x+=after.x-before.x;view.y+=after.y-before.y;invalidate()}
  stage.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.001),pos(e))},{passive:false});document.getElementById('zoomIn').onclick=()=>zoom(1.2);document.getElementById('zoomOut').onclick=()=>zoom(1/1.2);document.getElementById('resetView').onclick=resetView;
  document.getElementById('clearScene').onclick=()=>{if(objects.length&&confirm('Clear all objects from the scene?')){objects=[];selected=null;renderInspector();invalidate()}};
  document.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>{let center=toWorld({x:stage.clientWidth/2,y:stage.clientHeight/2});create(btn.dataset.add,center.x+(Math.random()-.5)*30,center.y+(Math.random()-.5)*30);document.getElementById('tools').classList.remove('open')});document.getElementById('menu').onclick=()=>document.getElementById('tools').classList.toggle('open');
  document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if((e.key==='Delete'||e.key==='Backspace')&&getSelected())removeSelected();if(e.key.toLowerCase()==='r'&&getSelected()){getSelected().angle=(getSelected().angle+15)%360;renderInspector();invalidate()}});
  new ResizeObserver(resize).observe(stage);
  create('flashlight',-280,-25,{preset:'whiteLED',divergence:24,intensity:1.4});create('prism',0,0,{angle:0});create('sensor',255,45,{angle:0,length:140});selected=null;renderInspector();resize();requestAnimationFrame(loop);
})();
</script>
