    function renderMap(){
      const m=run.map,act=ACTS[run.act],avail=getAvailableNodes();
      const edges=[];for(const n of m.nodes)for(const id of n.links){const to=m.nodes.find(x=>x.id===id);if(!to)continue;const a=nodePos(n,run.act),b=nodePos(to,run.act);const traversed=n.visited||to.visited;edges.push(`<path class="map-edge ${traversed?'traversed':''}" d="M${a.x} ${a.y} C${a.x} ${(a.y+b.y)/2} ${b.x} ${(a.y+b.y)/2} ${b.x} ${b.y}"/>`);}
      const nodes=m.nodes.map(n=>{const p=nodePos(n,run.act),available=avail.some(x=>x.id===n.id),visited=n.visited,cl=n.type==='heart'?'heart':n.type==='boss'?'boss':'';return `<div class="map-node-wrap ${n.type==='heart'?'heart-wrap':''}" style="left:${p.x/7}% ;top:${p.y/5.2}%"><button class="map-node ${cl} ${available?'available':''} ${visited?'visited':''} ${available?'':'locked'}" data-action="enter-node" data-node="${n.id}" ${available?'':'disabled'} aria-label="${NODE_NAMES[n.type]||n.type}">${nodeSvg(n.type)}</button><span class="map-label">${n.type==='boss'?safeText(ENEMIES[act.boss].name):n.type==='heart'?'THE HEART':NODE_NAMES[n.type]}</span></div>`;}).join('');

      return `<section class="screen"><div class="map-head"><div class="act-mark"><div class="act-number"><span>${run.act===4?'IV':`0${run.act}`}</span></div><div><div class="eyebrow">The path is not a promise</div><h1 class="section-title" style="margin:3px 0 3px">${act.name}</h1><div class="small muted">${act.sub}</div></div></div><div class="btn-row"><button class="mini-btn" data-action="deck">Deck <strong>${run.deck.length}</strong></button><button class="mini-btn" data-action="relics">Relics <strong>${run.relics.length}</strong></button><button class="mini-btn" data-action="help">Field guide</button></div></div><div class="map-layout"><div class="map-graphic"><svg class="map-svg" viewBox="0 0 700 520" preserveAspectRatio="none" aria-hidden="true">${edges.join('')}</svg>${nodes}</div><aside class="map-aside"><div class="eyebrow">The climb continues</div><h2 class="aside-act">${run.act===4?'One pulse left':`Act ${run.act} · ${act.name}`}</h2><p class="aside-line">${rowText}<br>Every branch changes what you can afford to survive.</p><div class="hairline"></div><div class="aside-meta"><span class="overline">Health<strong>${run.hp} <small style="font:11px ui-sans-serif;color:#8d887d">/ ${run.maxHp}</small></strong></span><span class="overline">Gold<strong>${run.gold}</strong></span><span class="overline">Difficulty<strong style="font-size:14px">${DIFFICULTIES[run.difficulty].label}</strong></span><span class="overline">Cards<strong>${run.deck.length}</strong></span></div><div class="overline">Route key</div><div class="route-legend"><span class="legend-item"><i class="legend-symbol">×</i> Combat</span><span class="legend-item"><i class="legend-symbol">!</i> Elite</span><span class="legend-item"><i class="legend-symbol">+</i> Rest</span><span class="legend-item"><i class="legend-symbol">$</i> Merchant</span><span class="legend-item"><i class="legend-symbol">?</i> Unknown</span><span class="legend-item"><i class="legend-symbol">✦</i> Cache</span></div><div class="deck-peek"><button data-action="deck">Inspect deck →</button><button data-action="potions">Potions ${run.potions.length}/3</button></div></aside></div></section>`;
    }

    function renderCombat(){

      const potionHTML=Array.from({length:3},(_,i)=>{const id=run.potions[i],p=id&&POTIONS[id];return `<button class="potion-slot" data-action="use-potion" data-index="${i}" ${p?'':'disabled'} title="${p?`${p.name}: ${p.desc}`:'Empty potion slot'}"><span>${p?p.mark:'·'}</span>${p?`<small>${i+1}</small>`:''}</button>`;}).join('');

button class="mini-btn" data-action="relics">Relics<strong>${run.relics.length}</strong></button></div><div class="hand">${c.hand.length?c.hand.map((card,i)=>cardHTML(card,'hand',i)).join(''):'<div class="hand-empty">Draw pile empty. End the turn to reshuffle.</div>'}</div><div class="bottom-actions"><div class="potion-row"><span class="overline" style="margin-right:2px">Vials</span>${potionHTML}</div><div class="btn-row"><button class="mini-btn" data-action="deck">Deck <strong>${run.deck.length}</strong></button><button class="btn btn-primary end-turn" data-action="end-turn">End turn <span aria-hidden="true">↵</span></button></div></div></section>`;

    function modalHead(title,subtitle=''){return `<div class="modal-head"><div><div class="eyebrow">Ashen Ascent</div><h2>${title}</h2>${subtitle?`<div class="small muted">${subtitle}</div>`:''}</div><button class="modal-close" data-action="close-modal" aria-label="Close">×</button></div>`;}
    function renderHelp(){
      return `<div class="modal-box wide">${modalHead('Field guide','A clear turn is worth more than a clever mistake.')}<div class="help-grid"><section><h3>The battle loop</h3><p>Draw five cards and spend Energy to play them. Attack cards need an enemy target; skills build Block, draw, apply debuffs, or channel orbs. Enemy intent is visible before you end your turn.</p><ul><li>Block absorbs incoming damage and resets on your next turn.</li><li>Vulnerable increases incoming damage. Weak softens attacks.</li><li>Poison ticks before an enemy acts. Kill it before that turn to stop the hit.</li><li>Defect orbs trigger passive effects each turn; evoke them for a stronger burst.</li><li>After a fight, choose a card or skip. A smaller deck is often a stronger deck.</li></ul></section><section><h3>Routes &amp; progression</h3><p>Choose only lit nodes. Combat pays gold and a card choice; elites award relics; rest sites heal or upgrade; shops trade gold for cards, relics, potions, or a deck removal. Events are one-off bargains.</p><p>Beat the first three act guardians to claim a boss relic and open the next act. The fourth route ends at the Ashen Heart. Death and victory both award Ember Shards for permanent workshop upgrades.</p><h3 style="margin-top:17px">Controls</h3><div class="help-controls"><span class="keycap">1-5</span><span class="small muted">Play a visible hand card</span><span class="keycap">Mouse / tap</span><span class="small muted">Select cards, targets, and route nodes</span><span class="keycap">E / Space</span><span class="small muted">End the turn</span><span class="keycap">D</span><span class="small muted">Inspect your deck</span><span class="keycap">H</span><span class="small muted">Open this field guide</span><span class="keycap">Esc</span><span class="small muted">Pause or resume a climb</span></div></section></div><div class="rule"></div><div class="small muted">Touch support: every button and card is tap-ready. A targeted card or potion waits for you to tap an enemy; tap Cancel to return to your hand.</div><div class="btn-row" style="justify-content:flex-end;margin-top:16px"><button class="btn btn-primary" data-action="close-modal">Understood</button></div></div>`;
    }
    function renderSettings(){
      const d=run?.difficulty||prefs.difficulty;
      return `<div class="modal-box">${modalHead('Settings','Difficulty changes apply immediately, even during a run.')}<div class="setting-row"><div><strong>Sound effects &amp; ambience</strong><small>Synthesized live with Web Audio.</small></div><button class="btn" data-action="toggle-sound">${synth.muted?'Unmute':'Mute sound'}</button></div><div class="setting-row"><div><strong>Volume</strong><small>Ambient drones and reactive battle notes.</small></div><div class="range-wrap"><input id="volume-range" type="range" min="0" max="1" step=".01" value="${synth.volume}" aria-label="Volume"><span class="tiny muted">${Math.round(synth.volume*100)}%</span></div></div><div class="setting-row" style="display:block"><div><strong>Difficulty</strong><small>Rebalances enemy health, enemy attacks, and gold.</small></div><div class="difficulty-select" style="margin-top:10px">${Object.entries(DIFFICULTIES).map(([id,x])=>`<button class="difficulty-button ${d===id?'active':''}" data-action="difficulty" data-mode="${id}"><strong>${x.label}</strong><span>${x.copy}</span></button>`).join('')}</div></div><div class="setting-row"><div><strong>Controls</strong><small>1-5 cards · E/Space end turn · D deck · H help · Esc pause</small></div><button class="btn btn-quiet" data-action="help">Field guide</button></div><div class="btn-row" style="justify-content:flex-end;margin-top:17px"><button class="btn btn-primary" data-action="close-modal">Close</button></div></div>`;
    }
    function renderMeta(){
      return `<div class="modal-box">${modalHead('Ember workshop',`You have ${profile.shards} Ember Shards. These upgrades persist between climbs.`)}<div class="meta-list">${Object.entries(META).map(([id,m])=>{const level=profile.upgrades[id],cost=m.costs[level];return `<div class="meta-item"><div><h3>${m.name} <span style="font:10px ui-sans-serif;color:#d6ae6a">${level}/3</span></h3><p>${m.desc}</p><div class="meta-level">${[0,1,2].map(i=>`<i class="${i<level?'on':''}"></i>`).join('')}</div></div><button class="btn ${cost!==undefined&&profile.shards>=cost?'btn-primary':''}" data-action="meta-buy" data-upgrade="${id}" ${cost===undefined||profile.shards<cost?'disabled':''}>${cost===undefined?'MAXED':`Improve · ${cost}`}</button></div>`;}).join('')}</div><div class="rule"></div><p class="modal-note">Shards are earned at the end of every run. Reaching the Heart pays a larger bounty; Ascendant difficulty grants extra shards. Upgrades apply to your next climb.</p><div class="btn-row" style="justify-content:flex-end;margin-top:15px"><button class="btn btn-primary" data-action="close-modal">Return</button></div></div>`;
    }
    function renderPause(){return `<div class="modal-box">${modalHead('The climb holds its breath','No battle timer runs while the game is paused.')}<div class="btn-row" style="flex-direction:column;align-items:stretch"><button class="btn btn-primary" data-action="resume">Resume climb</button><button class="btn" data-action="settings">Settings &amp; difficulty</button><button class="btn" data-action="help">Field guide &amp; controls</button><button class="btn btn-danger" data-action="confirm-restart">Restart this run</button><button class="btn btn-quiet" data-action="abandon">Abandon to title</button></div></div>`;}
    function renderRestartConfirm(){return `<div class="modal-box">${modalHead('Start this climb over?')}<p class="section-copy">The current path, deck, and rewards will be lost. Your Ember Shards and workshop upgrades remain.</p><div class="btn-row" style="justify-content:flex-end;margin-top:20px"><button class="btn btn-quiet" data-action="resume">Keep this run</button><button class="btn btn-danger" data-action="restart">Restart climb</button></div></div>`;}
    function renderDeckModal(){
      const mode=modal.mode||'view';const choosing=['upgrade','eventUpgrade','shopRemove','eventRemove'].includes(mode);
      const cards=run.deck.slice().sort((a,b)=>cardDef(a).name.localeCompare(cardDef(b).name));
      return `<div class="modal-box wide">${modalHead(choosing?(mode.includes('upgrade')?'Choose a card to temper':'Choose a card to remove'):'Your deck',choosing?'This choice is permanent for the current climb.':'Click a card to read its effect. Upgraded cards carry a gold mark.')}<div class="deck-list">${cards.map(c=>{const d=cardDef(c),valid=mode.includes('upgrade')?!c.upgraded:true;return `<div class="deck-row"><button ${choosing&&valid?`data-action="deck-pick" data-uid="${c.uid}"`:''} ${choosing&&!valid?'disabled':''}><span style="color:${d.type==='attack'?'#df9d7b':d.type==='power'?'#c2a3d6':'#aad0ba'}">${d.type==='attack'?'A':d.type==='power'?'✧':'◇'}</span> &nbsp;${safeText(d.name)} ${c.upgraded?'<span style="color:#dda85c">+</span>':''}<br><span class="tiny muted">${safeText(describeCard(c))}</span></button><span class="rarity-tag">${safeText(d.rarity)}</span></div>`;}).join('')||'<p class="modal-note">Your deck is empty.</p>'}</div><div class="btn-row" style="justify-content:flex-end;margin-top:16px"><button class="btn btn-primary" data-action="close-modal">Close</button></div></div>`;
    }
    function renderRelicModal(){return `<div class="modal-box wide">${modalHead('Relics carried','Every relic is live. Hover or tap an emblem to read its rule.')}<div class="relics-strip" style="justify-content:flex-start">${run.relics.map(relicHTML).join('')||'<span class="modal-note">No relics yet.</span>'}</div><div class="deck-list">${run.relics.map(id=>`<div class="deck-row"><span><span style="color:#dcb46d">${RELICS[id].mark}</span> &nbsp;${safeText(RELICS[id].name)}</span><span class="tiny muted">${safeText(RELICS[id].desc)}</span></div>`).join('')}</div><div class="btn-row" style="justify-content:flex-end;margin-top:16px"><button class="btn btn-primary" data-action="close-modal">Close</button></div></div>`;}
    function renderPileModal(){const key=modal.pile;const arr=run.combat?.[key]||[];return `<div class="modal-box">${modalHead(`${key[0].toUpperCase()+key.slice(1)} pile`,`${arr.length} cards`)}<div class="deck-list">${arr.map(c=>`<div class="deck-row"><span>${safeText(cardDef(c).name)} ${c.upgraded?' +':''}</span><span class="rarity-tag">${safeText(cardDef(c).type)}</span></div>`).join('')||'<p class="modal-note">Nothing here.</p>'}</div><div class="btn-row" style="justify-content:flex-end;margin-top:16px"><button class="btn btn-primary" data-action="close-modal">Close</button></div></div>`;}
    function renderPotionsModal(){return `<div class="modal-box">${modalHead('Potion belt',`${run.potions.length} / 3 vials`)}${run.potions.map(id=>`<div class="deck-row"><span><strong style="color:#d9b776">${POTIONS[id].mark}</strong> &nbsp;${POTIONS[id].name}</span><span class="tiny muted">${POTIONS[id].desc}</span></div>`).join('')||'<p class="modal-note">Your belt is empty. Potions drop from battles and can be found in shops.</p>'}<div class="btn-row" style="justify-content:flex-end;margin-top:16px"><button class="btn btn-primary" data-action="close-modal">Close</button></div></div>`;}
    function renderModal(){
      const root=$('modal-root');if(!modal){root.classList.remove('open');root.innerHTML='';return;}
      let html='';switch(modal.kind){case'help':html=renderHelp();break;case'settings':html=renderSettings();break;case'meta':html=renderMeta();break;case'pause':html=renderPause();break;case'restartConfirm':html=renderRestartConfirm();break;case'deck':html=renderDeckModal();break;case'relics':html=renderRelicModal();break;case'pile':html=renderPileModal();break;case'potions':html=renderPotionsModal();break;}
      root.innerHTML=`<div class="modal-backdrop" id="modal-backdrop"></div>${html}`;root.classList.add('open');
    }
    function openModal(kind,extra={}){modal={kind,...extra};renderModal();}
    function closeModal(){modal=null;render();}
    function setDifficulty(id){
      if(!DIFFICULTIES[id])return;prefs.difficulty=id;profile.prefs.difficulty=id;saveProfile();
      if(run&&!run.ended){run.difficulty=id;for(const e of run.combat?.enemies||[]){const pct=e.hp/e.maxHp;e.maxHp=Math.max(1,Math.round(e.baseHp*e.hpScaleNoDiff*DIFFICULTIES[id].hp));e.hp=Math.max(1,Math.round(e.maxHp*pct));}}
      if(run?.combat)toast(`Difficulty set to ${DIFFICULTIES[id].label}.`);render();
    }
    function buyMeta(id){
      const level=profile.upgrades[id],cost=META[id]?.costs[level];if(cost===undefined||profile.shards<cost)return;
      profile.shards-=cost;profile.upgrades[id]++;saveProfile();sfx('relic');renderModal();
    }
    function restartCurrent(){const character=run?.character||lastCharacter;newRun(character);}
    function handleAction(action,el){
      switch(action){
        case'begin':screen='select';synth.unlock();render();break;
        case'back-title':if(run&&!run.ended){modal={kind:'pause'};renderModal();}else{run=null;screen='title';synth.setMood('title');render();}break;
        case'home':if(run&&!run.ended)openModal('pause');else{screen='title';render();}break;
        case'select-character':newRun(el.dataset.char);break;
        case'help':openModal('help');break;
        case'settings':openModal('settings');break;
        case'meta':openModal('meta');break;
        case'toggle-sound':synth.setMuted(!synth.muted);renderHeader();if(modal)renderModal();break;
        case'difficulty':setDifficulty(el.dataset.mode);break;
        case'pause':if(!modal)openModal('pause');else closeModal();break;
        case'resume':closeModal();break;
        case'close-modal':closeModal();break;
        case'confirm-restart':openModal('restartConfirm');break;
        case'restart':restartCurrent();break;
        case'abandon':run=null;modal=null;screen='title';synth.setMood('title');render();break;
        case'meta-buy':buyMeta(el.dataset.upgrade);break;
        case'enter-node':enterNode(el.dataset.node);break;
        case'play-card':playCard(el.dataset.uid);break;
        case'select-enemy':selectEnemy(Number(el.dataset.index));break;
        case'cancel-target':if(run?.combat){run.combat.pendingCardUid=null;run.combat.pendingPotion=null;render();}break;
        case'end-turn':endTurn();break;
        case'use-potion':usePotion(Number(el.dataset.index));break;
        case'deck':openDeckMode('view');break;
        case'relics':openModal('relics');break;
        case'potions':openModal('potions');break;
        case'pile':openModal('pile',{pile:el.dataset.pile});break;
        case'choose-reward':{
          const c=run?.reward?.cards[Number(el.dataset.index)];if(!c)return;addDeckCard(c.id,c.upgraded);run.reward=null;finishNode();break;
        }
        case'skip-reward':if(relicOwned('bowl')){run.maxHp+=2;run.hp+=2;}run.reward=null;finishNode();break;
        case'boss-relic':chooseBossRelic(el.dataset.id);break;
        case'event-choice':chooseEvent(Number(el.dataset.index));break;
        case'buy':buyShopItem(el.dataset.item);break;
        case'shop-remove':if(run.gold<75||run.shop.removeUsed)return;openDeckMode('shopRemove');break;
        case'rest-heal':restHeal();break;
        case'rest-upgrade':openDeckMode('upgrade');break;
        case'deck-pick':handleDeckPick(el.dataset.uid);break;
        case'leave-node':finishNode();break;
        case'run-again':screen='select';run=null;render();break;
        default:break;
      }
    }
    document.addEventListener('click',e=>{
      if(e.target===$('modal-root')||e.target.id==='modal-backdrop'){if(modal?.kind==='pause')return;closeModal();return;}
      const el=e.target.closest('[data-action]');if(!el)return;
      synth.unlock();handleAction(el.dataset.action,el);
    });
    document.addEventListener('input',e=>{if(e.target.id==='volume-range'){synth.setVolume(e.target.value);const span=e.target.parentElement.querySelector('span');if(span)span.textContent=`${Math.round(synth.volume*100)}%`;}});
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'){if(modal){if(modal.kind!=='pause')closeModal();else closeModal();}else if(run&&!run.ended)openModal('pause');return;}
      if(modal)return;
      if(!run||run.ended)return;
      if((e.key==='e'||e.key==='E'||e.code==='Space')&&screen==='combat'){e.preventDefault();endTurn();return;}
      if((e.key==='d'||e.key==='D')&&screen==='combat'){openDeckMode('view');return;}
      if((e.key==='h'||e.key==='H')){openModal('help');return;}
      if(/^[1-5]$/.test(e.key)&&screen==='combat'){const card=run.combat.hand[Number(e.key)-1];if(card)playCard(card.uid);}
    });
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&synth.ctx){try{synth.ctx.suspend();}catch(_){}}else if(synth.ctx&&synth.started){try{synth.ctx.resume();}catch(_){}}});

    // Ambient field and combat particles share one bounded requestAnimationFrame loop.
    const canvas=$('ambience'),ctx=canvas.getContext('2d');let W=0,H=0,DPR=1,lastFrame=0,particles=[];const stars=Array.from({length:105},()=>({x:Math.random(),y:Math.random(),r:.35+Math.random()*1.15,a:.08+Math.random()*.33,phase:Math.random()*8}));
    function resizeCanvas(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=`${W}px`;canvas.style.height=`${H}px`;ctx.setTransform(DPR,0,0,DPR,0,0);}
    function burst(x,y,color,count=16){for(let i=0;i<count;i++){const angle=Math.random()*Math.PI*2,speed=25+Math.random()*135;particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-24,life:.35+Math.random()*.65,max:.35+Math.random()*.65,size:1+Math.random()*2.7,color});}if(particles.length>500)particles.splice(0,particles.length-500);}
    function frame(now){const dt=Math.min(.05,(now-lastFrame||16)/1000);lastFrame=now;ctx.clearRect(0,0,W,H);for(const s of stars){const flicker=.7+.3*Math.sin(now/1100+s.phase);ctx.fillStyle=`rgba(224,202,159,${s.a*flicker})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=28*dt;p.vx*=.988;ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;synth.update(now);requestAnimationFrame(frame);}
    window.addEventListener('resize',resizeCanvas,{passive:true});resizeCanvas();requestAnimationFrame(frame);
    render();
  })();
  </script>
</body>
</html>
