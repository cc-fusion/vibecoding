      context.stroke();
      context.fillStyle = rgbString(color);
      context.beginPath();
      context.arc(12, 0, 2.4, 0, Math.PI * 2);
      context.fill();
    }

    function drawPolarizer(context, object) {
      const half = object.length / 2;
      context.fillStyle = 'rgba(97,154,171,.13)';
      context.strokeStyle = '#78aebe';
      context.lineWidth = 1.8;
      context.fillRect(-4, -half, 8, object.length);
      context.strokeRect(-4, -half, 8, object.length);
      context.strokeStyle = 'rgba(187,226,235,.64)';
      context.lineWidth = 1;
      for (let y = -half + 9; y < half; y += 12) {
        context.beginPath();
        context.moveTo(-2, y);
        context.lineTo(2, y + 5);
        context.stroke();
      }
    }

    function drawLens(context, object) {
      const half = object.length / 2;
      const bulge = object.lensKind === 'convex' ? 12 : -9;
      context.beginPath();
      context.moveTo(0, -half);
      context.quadraticCurveTo(bulge, 0, 0, half);
      context.quadraticCurveTo(-bulge, 0, 0, -half);
      context.closePath();
      context.fillStyle = 'rgba(124,187,207,.13)';
      context.fill();
      context.strokeStyle = '#9bc9d7';
      context.lineWidth = 1.8;
      context.stroke();
      context.beginPath();
      context.moveTo(bulge * 0.34, -half * 0.58);
      context.quadraticCurveTo(bulge * 0.55, 0, bulge * 0.34, half * 0.58);
      context.strokeStyle = 'rgba(196,229,237,.54)';
      context.lineWidth = 1;
      context.stroke();
    }

    function drawMirror(context, object) {
      const half = object.length / 2;
      context.strokeStyle = '#53616d';
      context.lineWidth = 6;
      context.beginPath(); context.moveTo(-4, -half); context.lineTo(-4, half); context.stroke();
      context.strokeStyle = '#c6d5dc';
      context.lineWidth = 2.2;
      context.beginPath(); context.moveTo(0, -half); context.lineTo(0, half); context.stroke();
      context.strokeStyle = 'rgba(168,184,194,.68)';
      context.lineWidth = 1;
      for (let y = -half + 8; y < half; y += 13) {
        context.beginPath(); context.moveTo(-7, y + 4); context.lineTo(-2, y - 1); context.stroke();
      }
    }

    function drawCurvedMirror(context, object) {
      const radius = object.curvature === 'concave' ? -object.radius : object.radius;
      context.beginPath();
      for (let index = 0; index <= 30; index += 1) {
        const y = -object.length / 2 + object.length * index / 30;
        const x = Math.sign(radius) * (Math.abs(radius) - Math.sqrt(Math.max(0, radius * radius - y * y)));
        if (index === 0) context.moveTo(x - 4, y);
        else context.lineTo(x - 4, y);
      }
      context.strokeStyle = '#53616d';
      context.lineWidth = 6;
      context.stroke();
      context.beginPath();
      for (let index = 0; index <= 30; index += 1) {
        const y = -object.length / 2 + object.length * index / 30;
        const x = Math.sign(radius) * (Math.abs(radius) - Math.sqrt(Math.max(0, radius * radius - y * y)));
        if (index === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      }
      context.strokeStyle = '#c6d5dc';
      context.lineWidth = 2.2;
      context.stroke();
    }

    function drawGrating(context, object) {
      const half = object.length / 2;
      context.strokeStyle = object.mode === 'reflection' ? '#ddb995' : '#9acbd7';
      context.lineWidth = 2;
      context.beginPath(); context.moveTo(0, -half); context.lineTo(0, half); context.stroke();
      context.strokeStyle = object.mode === 'reflection' ? 'rgba(228,190,151,.72)' : 'rgba(170,217,229,.72)';
      context.lineWidth = 1;
      for (let y = -half + 4; y < half; y += 7) {
        context.beginPath(); context.moveTo(-3, y); context.lineTo(3, y + 4); context.stroke();
      }
      if (object.mode === 'reflection') {
        context.strokeStyle = 'rgba(205,171,137,.7)';
        context.lineWidth = 3;
        context.beginPath(); context.moveTo(-3, -half); context.lineTo(-3, half); context.stroke();
      }
    }

    function drawPrism(context, object) {
      const vertices = prismVertices(object).map(point => localCoordinates(object, point));
      context.beginPath();
      vertices.forEach((point, index) => index === 0 ? context.moveTo(point.x, point.y) : context.lineTo(point.x, point.y));
      context.closePath();
      context.fillStyle = 'rgba(83,143,162,.22)';
      context.fill();
      context.strokeStyle = '#8ebbc8';
      context.lineWidth = 1.8;
      context.stroke();
    }

    function glassTint(object) {
      let red = 0;
      let green = 0;
      let blue = 0;
      let total = 0;
      for (let i = 0; i < BIN_COUNT; i += 1) {
        const transmission = object.transmission[i] || 0;
        const color = wavelengthRgb(wavelengthAt(i));
        const weight = transmission * color.photopic;
        red += color.r * weight;
        green += color.g * weight;
        blue += color.b * weight;
        total += weight;
      }
      if (total <= 0) return { r: 130, g: 145, b: 155 };
      const values = [red / total, green / total, blue / total];
      const max = Math.max(...values, 1);
      return { r: Math.round(values[0] / max * 220), g: Math.round(values[1] / max * 220), b: Math.round(values[2] / max * 220) };
    }

    function drawGlass(context, object) {
      const tint = glassTint(object);
      const halfWidth = object.thicknessMm / 2;
      const halfHeight = object.heightMm / 2;
      context.fillStyle = `rgba(${tint.r},${tint.g},${tint.b},.2)`;
      context.strokeStyle = `rgb(${tint.r},${tint.g},${tint.b})`;
      context.lineWidth = 1.8;
      context.beginPath();
      context.rect(-halfWidth, -halfHeight, object.thicknessMm, object.heightMm);
      context.fill();
      context.stroke();
      context.strokeStyle = 'rgba(220,235,241,.24)';
      context.lineWidth = 1;
      context.beginPath();
      context.moveTo(-halfWidth + 5, -halfHeight + 6);
      context.lineTo(halfWidth - 5, -halfHeight + 6);
      context.moveTo(-halfWidth + 5, halfHeight - 6);
      context.lineTo(halfWidth - 5, halfHeight - 6);
      context.stroke();
    }

    function drawBlocker(context, object) {
      const half = object.length / 2;
      context.strokeStyle = '#2b343c';
      context.lineWidth = 10;
      context.beginPath(); context.moveTo(0, -half); context.lineTo(0, half); context.stroke();
      context.strokeStyle = '#82909a';
      context.lineWidth = 1.4;
      context.beginPath(); context.moveTo(0, -half); context.lineTo(0, half); context.stroke();
      context.strokeStyle = 'rgba(174,188,198,.48)';
      context.lineWidth = 1;
      for (let y = -half + 8; y < half; y += 14) {
        context.beginPath(); context.moveTo(-4, y + 4); context.lineTo(4, y - 4); context.stroke();
      }
    }

    function drawSensor(context, object) {
      const half = object.length / 2;
      context.strokeStyle = 'rgba(104,196,157,.28)';
      context.lineWidth = 8;
      context.beginPath(); context.moveTo(0, -half); context.lineTo(0, half); context.stroke();
      context.strokeStyle = '#82d5ae';
      context.lineWidth = 1.8;
      context.beginPath(); context.moveTo(0, -half); context.lineTo(0, half); context.stroke();
      context.fillStyle = '#a4e2c3';
      for (let y = -half; y <= half; y += 14) {
        context.beginPath(); context.arc(0, y, 1.8, 0, Math.PI * 2); context.fill();
      }
      context.beginPath(); context.moveTo(-6, -half - 4); context.lineTo(0, -half - 9); context.lineTo(6, -half - 4); context.stroke();
    }

    function objectPolygon(object) {
      return solidVertices(object);
    }

    function pointInPolygon(point, vertices) {
      let inside = false;
      for (let i = 0, j = vertices.length - 1; i < vertices.length; j = i, i += 1) {
        const a = vertices[i];
        const b = vertices[j];
        const crosses = ((a.y > point.y) !== (b.y > point.y))
          && point.x < (b.x - a.x) * (point.y - a.y) / ((b.y - a.y) || 1e-12) + a.x;
        if (crosses) inside = !inside;
      }
      return inside;
    }

    function distanceToSegment(point, start, end) {
      const segment = sub(end, start);
      const lengthSquared = dot(segment, segment);
      const fraction = lengthSquared > 0 ? clamp(dot(sub(point, start), segment) / lengthSquared, 0, 1) : 0;
      return magnitude(sub(point, add(start, mul(segment, fraction))));
    }

    function distanceToCurvedMirror(object, point) {
      let distance = Infinity;
      const signedRadius = object.curvature === 'concave' ? -object.radius : object.radius;
      for (let index = 0; index < 30; index += 1) {
        const y1 = -object.length / 2 + object.length * index / 30;
        const y2 = -object.length / 2 + object.length * (index + 1) / 30;
        const x1 = Math.sign(signedRadius) * (Math.abs(signedRadius) - Math.sqrt(Math.max(0, signedRadius * signedRadius - y1 * y1)));
        const x2 = Math.sign(signedRadius) * (Math.abs(signedRadius) - Math.sqrt(Math.max(0, signedRadius * signedRadius - y2 * y2)));
        distance = Math.min(distance, distanceToSegment(point, elementPoint(object, x1, y1), elementPoint(object, x2, y2)));
      }
      return distance;
    }

    function objectHitTest(object, point) {
      const local = localCoordinates(object, point);
      if (object.type === 'flashlight' || object.type === 'laser') return magnitude(sub(point, vec(object.x, object.y))) < 22;
      if (object.type === 'prism' || object.type === 'glass') {
        const polygon = objectPolygon(object);
        if (pointInPolygon(point, polygon)) return true;
        for (let i = 0; i < polygon.length; i += 1) {
          if (distanceToSegment(point, polygon[i], polygon[(i + 1) % polygon.length]) < 11) return true;
        }
        return false;
      }
      if (object.type === 'lens') return Math.abs(local.y) <= object.length / 2 + 10 && Math.abs(local.x) <= 17;
      if (object.type === 'curvedMirror') return distanceToCurvedMirror(object, point) < 12;
      const [start, end] = surfaceSegment(object);
      return distanceToSegment(point, start, end) < 11;
    }

    function rotationHandle(object) {
      const distance = object.type === 'flashlight' || object.type === 'laser' ? 37 : 57;
      return add(vec(object.x, object.y), mul(normalFor(object), distance));
    }

    function drawSelection(context, object) {
      context.save();
      context.strokeStyle = 'rgba(141,209,232,.85)';
      context.fillStyle = '#a9d7ea';
      context.lineWidth = 1.2;
      context.setLineDash([4, 4]);
      if (object.type === 'flashlight' || object.type === 'laser') {
        context.beginPath(); context.arc(object.x, object.y, 23, 0, Math.PI * 2); context.stroke();
      } else if (object.type === 'prism' || object.type === 'glass') {
        const polygon = objectPolygon(object);
        context.beginPath();
        polygon.forEach((point, index) => index === 0 ? context.moveTo(point.x, point.y) : context.lineTo(point.x, point.y));
        context.closePath(); context.stroke();
      } else if (object.type === 'lens') {
        context.beginPath();
        context.moveTo(object.x - 15 * Math.cos(object.angle), object.y - 15 * Math.sin(object.angle));
        context.lineTo(object.x + 15 * Math.cos(object.angle), object.y + 15 * Math.sin(object.angle));
        context.stroke();
      } else if (object.type === 'curvedMirror') {
        const [start, end] = surfaceSegment(object);
        context.beginPath(); context.moveTo(start.x, start.y); context.lineTo(end.x, end.y); context.stroke();
      } else {
        const [start, end] = surfaceSegment(object);
        context.beginPath(); context.moveTo(start.x, start.y); context.lineTo(end.x, end.y); context.stroke();
      }
      context.setLineDash([]);
      const handle = rotationHandle(object);
      context.beginPath(); context.moveTo(object.x, object.y); context.lineTo(handle.x, handle.y); context.stroke();
      context.beginPath(); context.arc(handle.x, handle.y, 7, 0, Math.PI * 2); context.fill();
      context.strokeStyle = '#0b1015';
      context.lineWidth = 1.5;
      context.stroke();
      context.restore();
    }

    function worldPointFromEvent(event) {
      const bounds = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - bounds.left - view.offsetX) / view.scale,
        y: (event.clientY - bounds.top - view.offsetY) / view.scale
      };
    }

    canvas.addEventListener('pointerdown', event => {
      const point = worldPointFromEvent(event);
      const selected = getSelected();
      if (selected && magnitude(sub(point, rotationHandle(selected))) < 13) {
        pointerMode = 'rotate';
        pointerObjectId = selected.id;
        canvas.setPointerCapture(event.pointerId);
        event.preventDefault();
        return;
      }
      const hit = [...objects].reverse().find(object => objectHitTest(object, point));
      if (hit) {
        selectedId = hit.id;
        pointerMode = 'move';
        pointerObjectId = hit.id;
        pointerOffset = { x: point.x - hit.x, y: point.y - hit.y };
        renderInspector();
        renderScene();
        canvas.setPointerCapture(event.pointerId);
      } else {
        selectedId = null;
        pointerMode = null;
        pointerObjectId = null;
        renderInspector();
        renderScene();
      }
      event.preventDefault();
    });

    canvas.addEventListener('pointermove', event => {
      if (!pointerMode || !pointerObjectId) return;
      const object = objects.find(item => item.id === pointerObjectId);
      if (!object) return;
      const point = worldPointFromEvent(event);
      if (pointerMode === 'move') {
        object.x = clamp(point.x - pointerOffset.x, 5, WORLD.width - 5);
        object.y = clamp(point.y - pointerOffset.y, 5, WORLD.height - 5);
      } else if (pointerMode === 'rotate') {
        object.angle = Math.atan2(point.y - object.y, point.x - object.x);
      }
      renderScene();
    });

    function endCanvasPointer(event) {
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      pointerMode = null;
      pointerObjectId = null;
    }
    canvas.addEventListener('pointerup', endCanvasPointer);
    canvas.addEventListener('pointercancel', endCanvasPointer);

    document.querySelectorAll('[data-add]').forEach(button => {
      button.addEventListener('click', () => {
        const position = spawnPosition(button.dataset.add);
        const object = createObject(button.dataset.add, position.x, position.y);
        objects.push(object);
        selectedId = object.id;
        renderInspector();
        renderScene();
      });
    });

    function spawnPosition(toolType) {
      if (toolType === 'flashlight' || toolType === 'laser') {
        const sources = objects.filter(object => object.type === 'flashlight' || object.type === 'laser').length;
        return { x: 125 + sources * 30, y: clamp(310 + ((sources % 3) - 1) * 64, 80, 540) };
      }
      if (toolType === 'sensor') {
        const sensors = objects.filter(object => object.type === 'sensor').length;
        return { x: 835 - sensors * 34, y: clamp(310 + ((sensors % 3) - 1) * 66, 80, 540) };
      }
      const optics = objects.filter(object => !['flashlight', 'laser', 'sensor'].includes(object.type)).length;
      return { x: clamp(490 + (optics % 4 - 1.5) * 36, 100, 900), y: clamp(310 + (optics % 5 - 2) * 48, 100, 520) };
    }

    inspector.addEventListener('click', event => {
      if (event.target.closest('[data-action="remove"]')) removeSelected();
    });

    function removeSelected() {
      if (!selectedId) return;
      objects = objects.filter(object => object.id !== selectedId);
      selectedId = objects.length ? objects[objects.length - 1].id : null;
      renderInspector();
      renderScene();
    }

    document.getElementById('reset-scene').addEventListener('click', seedScene);

    document.addEventListener('keydown', event => {
      if (event.target instanceof HTMLInputElement || event.target instanceof HTMLSelectElement || event.target instanceof HTMLTextAreaElement) return;
      if (event.key === 'Delete' || event.key === 'Backspace') {
        event.preventDefault();
        removeSelected();
      } else if (event.key.toLowerCase() === 'r' && selectedId) {
        const object = getSelected();
        object.angle += degToRad(event.shiftKey ? -15 : 15);
        renderInspector();
        renderScene();
      } else if (event.key === 'Escape') {
        selectedId = null;
        renderInspector();
        renderScene();
      }
    });

    function resizeCanvas() {
      const bounds = canvas.getBoundingClientRect();
      if (bounds.width <= 0 || bounds.height <= 0) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(bounds.width * dpr);
      canvas.height = Math.round(bounds.height * dpr);
      const scale = Math.min(bounds.width / WORLD.width, bounds.height / WORLD.height);
      view = {
        width: bounds.width,
        height: bounds.height,
        dpr,
        scale,
        offsetX: (bounds.width - WORLD.width * scale) / 2,
        offsetY: (bounds.height - WORLD.height * scale) / 2
      };
      drawScene();
    }

    const resizeObserver = new ResizeObserver(resizeCanvas);
    resizeObserver.observe(canvas);
    window.addEventListener('resize', resizeCanvas);

    seedScene();
    resizeCanvas();
  </script>
</body>
</html>
