<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbfaf7">
  <title>Plainline</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/decimal.js@10.4.3/decimal.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #fbfaf7;
      --ink: #252522;
      --muted: #77766f;
      --ghost: #aaa9a2;
      --rule: rgba(37, 37, 34, .13);
      --chip: rgba(37, 37, 34, .055);
      --chip-hover: rgba(37, 37, 34, .11);
      --chip-active: rgba(37, 37, 34, .12);
      --accent: #252522;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #171715;
        --ink: #e8e7e1;
        --muted: #93928b;
        --ghost: #72716b;
        --rule: rgba(232, 231, 225, .15);
        --chip: rgba(232, 231, 225, .08);
        --chip-hover: rgba(232, 231, 225, .14);
        --chip-active: rgba(232, 231, 225, .15);
        --accent: #e8e7e1;
      }
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--paper); }
    body { color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    #editor-shell { position: fixed; inset: 0; overflow: hidden; background: var(--paper); }
    #mirror, #editor {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 28px 34px 82px;
      border: 0;
      outline: 0;
      font: 400 16px/1.72 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      letter-spacing: 0;
      tab-size: 4;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
      text-align: left;
    }
    #mirror { z-index: 0; overflow: hidden; color: var(--ink); pointer-events: none; }
    #editor {
      z-index: 1;
      resize: none;
      overflow: auto;
      background: transparent;
      color: transparent;
      caret-color: var(--ink);
      -webkit-text-fill-color: transparent;
      -webkit-tap-highlight-color: transparent;
      appearance: none;
      scrollbar-width: thin;
      scrollbar-color: var(--rule) transparent;
    }
    #editor::selection { background: rgba(128, 143, 161, .34); color: transparent; }
    .ghost-text { color: var(--ghost); }
    #suggestion-bar {
      position: fixed;
      z-index: 5;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 1px;
      padding: 0 12px;
      border-top: 1px solid var(--rule);
      background: var(--paper);
      opacity: 0;
      transform: translateY(4px);
      transition: height 180ms ease, opacity 180ms ease, transform 180ms ease;
    }
    #suggestion-bar.has-suggestions {
      height: 48px;
      padding-top: 5px;
      padding-bottom: 5px;
      opacity: 1;
      transform: translateY(0);
    }
    #chip-list {
      display: flex;
      min-width: 0;
      flex: 1 1 auto;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    #chip-list::-webkit-scrollbar { display: none; }
    .suggestion-chip {
      flex: 0 0 auto;
      max-width: min(520px, 72vw);
      height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 0;
      border-radius: 5px;
      background: var(--chip);
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      line-height: 1;
      text-align: left;
      cursor: pointer;
      transition: background-color 140ms ease, transform 140ms ease, opacity 140ms ease;
      animation: chip-in 180ms ease both;
    }
    .suggestion-chip:hover { background: var(--chip-hover); }
    .suggestion-chip.is-highlighted { background: var(--chip-active); box-shadow: inset 0 -1px 0 var(--accent); }
    .suggestion-chip:active { transform: translateY(1px); }
    .chip-equation { min-width: 0; overflow: hidden; white-space: nowrap; }
    .chip-dim { color: var(--muted); }
    .chip-strong { color: var(--ink); font-weight: 600; }
    .chip-tag { flex: 0 0 auto; color: var(--muted); font-size: 10px; letter-spacing: .02em; }
    #key-hint {
      flex: 0 0 auto;
      color: var(--muted);
      font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      white-space: nowrap;
      opacity: .72;
    }
    @keyframes chip-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 640px) {
      #mirror, #editor { padding: 22px 18px 76px; font-size: 15px; line-height: 1.68; }
      #suggestion-bar.has-suggestions { height: 50px; gap: 6px; padding-left: 8px; padding-right: 8px; }
      .suggestion-chip { height: 36px; padding: 0 10px; max-width: 74vw; }
      #key-hint { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main id="editor-shell" aria-label="Plainline expression editor">
    <div id="mirror" aria-hidden="true"></div>
    <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="Write notes and expressions"></textarea>
  </main>
  <footer id="suggestion-bar" aria-label="Suggestions">
    <div id="chip-list" role="listbox" aria-label="Calculation suggestions"></div>
    <span id="key-hint">Tab/Enter accept · ←→ switch</span>
  </footer>

  <script>
    (() => {
      'use strict';

      const editor = document.getElementById('editor');
      const mirror = document.getElementById('mirror');
      const chipList = document.getElementById('chip-list');
      const bar = document.getElementById('suggestion-bar');
      const keyHint = document.getElementById('key-hint');
      const STORAGE_KEY = 'plainline-notes-v1';
      const Decimal = window.Decimal;

      if (!Decimal) return;
      Decimal.set({ precision: 50, rounding: Decimal.ROUND_HALF_UP, maxE: 1000, minE: -1000 });
      const d = value => new Decimal(value);
      const PI = d(-1).acos();
      const E = d(1).exp();
      const DIM_ZERO = [0, 0, 0, 0, 0, 0, 0];
      const DIM_NAMES = ['length', 'mass', 'time', 'current', 'temperature', 'data', 'angle'];
      const DIMS = {
        length: [1, 0, 0, 0, 0, 0, 0],
        mass: [0, 1, 0, 0, 0, 0, 0],
        time: [0, 0, 1, 0, 0, 0, 0],
        current: [0, 0, 0, 1, 0, 0, 0],
        temperature: [0, 0, 0, 0, 1, 0, 0],
        data: [0, 0, 0, 0, 0, 1, 0],
        angle: [0, 0, 0, 0, 0, 0, 1]
      };

      const PREFIXES = [
        { name: 'quetta', symbol: 'Q', factor: '1e30', large: true },
        { name: 'ronna', symbol: 'R', factor: '1e27', large: true },
        { name: 'yotta', symbol: 'Y', factor: '1e24', large: true },
        { name: 'zetta', symbol: 'Z', factor: '1e21', large: true },
        { name: 'exa', symbol: 'E', factor: '1e18', large: true },
        { name: 'peta', symbol: 'P', factor: '1e15', large: true },
        { name: 'tera', symbol: 'T', factor: '1e12', large: true },
        { name: 'giga', symbol: 'G', factor: '1e9', large: true },
        { name: 'mega', symbol: 'M', factor: '1e6', large: true },
        { name: 'kilo', symbol: 'k', factor: '1e3', large: true },
        { name: 'hecto', symbol: 'h', factor: '1e2' },
        { name: 'deca', symbol: 'da', factor: '1e1' },
        { name: 'deci', symbol: 'd', factor: '1e-1' },
        { name: 'centi', symbol: 'c', factor: '1e-2' },
        { name: 'milli', symbol: 'm', factor: '1e-3' },
        { name: 'micro', symbol: 'µ', aliases: ['μ', 'u'], factor: '1e-6' },
        { name: 'nano', symbol: 'n', factor: '1e-9' },
        { name: 'pico', symbol: 'p', factor: '1e-12' },
        { name: 'femto', symbol: 'f', factor: '1e-15' },
        { name: 'atto', symbol: 'a', factor: '1e-18' },
        { name: 'zepto', symbol: 'z', factor: '1e-21' },
        { name: 'yocto', symbol: 'y', factor: '1e-24' },
        { name: 'ronto', symbol: 'r', factor: '1e-27' },
        { name: 'quecto', symbol: 'q', factor: '1e-30' }
      ].map(prefix => ({ ...prefix, value: d(prefix.factor) }));
      const LARGE_PREFIXES = PREFIXES.filter(prefix => prefix.large);

      const UNIT_DEFS = [];
      function addUnit(id, names, symbols, dims, factor, options = {}) {
        const def = {
          id, names: Array.isArray(names) ? names : [names], symbols: Array.isArray(symbols) ? symbols : [symbols],
          dims: dims.slice(), factor: d(factor || '1'), offset: d(options.offset || '0'),
          prefixable: options.prefixable || 'none', prefixPower: options.prefixPower || 1,
          temp: !!options.temp, longName: options.longName || (Array.isArray(names) ? names[0] : names),
          plural: options.plural || null, family: options.family || id
        };
        UNIT_DEFS.push(def);
        return def;
      }

      const U = {};
      U.g = addUnit('gram', ['gram', 'grams'], 'g', DIMS.mass, '0.001', { prefixable: 'all', longName: 'gram', plural: 'grams' });
      U.m = addUnit('meter', ['meter', 'meters', 'metre', 'metres'], 'm', DIMS.length, '1', { prefixable: 'all', longName: 'meter', plural: 'meters' });
      U.s = addUnit('second', ['second', 'seconds', 'sec', 'secs'], 's', DIMS.time, '1', { prefixable: 'all', longName: 'second', plural: 'seconds' });
      U.A = addUnit('ampere', ['ampere', 'amperes', 'amp', 'amps'], 'A', DIMS.current, '1', { prefixable: 'all', longName: 'ampere', plural: 'amperes' });
      U.K = addUnit('kelvin', ['kelvin', 'kelvins'], 'K', DIMS.temperature, '1', { prefixable: 'all', temp: true, longName: 'kelvin', plural: 'kelvins' });
      U.b = addUnit('bit', ['bit', 'bits'], 'b', DIMS.data, '1', { prefixable: 'large', longName: 'bit', plural: 'bits' });
      U.B = addUnit('byte', ['byte', 'bytes'], 'B', DIMS.data, '8', { prefixable: 'large', longName: 'byte', plural: 'bytes' });
      U.Hz = addUnit('hertz', ['hertz', 'hz'], 'Hz', [0, 0, -1, 0, 0, 0, 0], '1', { prefixable: 'all', longName: 'hertz', plural: 'hertz' });
      U.J = addUnit('joule', ['joule', 'joules'], 'J', [2, 1, -2, 0, 0, 0, 0], '1', { prefixable: 'all', longName: 'joule', plural: 'joules' });
      U.cal = addUnit('calorie', ['calorie', 'calories'], 'cal', [2, 1, -2, 0, 0, 0, 0], '4.184', { prefixable: 'all', longName: 'calorie', plural: 'calories' });
      U.Cal = addUnit('food-calorie', ['kilocalorie', 'kilocalories', 'large calorie', 'large calories'], 'Cal', [2, 1, -2, 0, 0, 0, 0], '4184', { longName: 'kilocalorie', plural: 'kilocalories' });
      U.Wh = addUnit('watt-hour', ['watt hour', 'watt hours', 'watt-hour', 'watt-hours'], 'Wh', [2, 1, -2, 0, 0, 0, 0], '3600', { prefixable: 'all', longName: 'watt-hour', plural: 'watt-hours' });
      U.W = addUnit('watt', ['watt', 'watts'], 'W', [2, 1, -3, 0, 0, 0, 0], '1', { prefixable: 'all', longName: 'watt', plural: 'watts' });
      U.N = addUnit('newton', ['newton', 'newtons'], 'N', [1, 1, -2, 0, 0, 0, 0], '1', { prefixable: 'all', longName: 'newton', plural: 'newtons' });
      U.Pa = addUnit('pascal', ['pascal', 'pascals'], 'Pa', [-1, 1, -2, 0, 0, 0, 0], '1', { prefixable: 'all', longName: 'pascal', plural: 'pascals' });
      U.bar = addUnit('bar', ['bar', 'bars'], 'bar', [-1, 1, -2, 0, 0, 0, 0], '100000', { prefixable: 'all', longName: 'bar', plural: 'bar' });
      U.V = addUnit('volt', ['volt', 'volts'], 'V', [2, 1, -3, -1, 0, 0, 0], '1', { prefixable: 'all', longName: 'volt', plural: 'volts' });
      U.ohm = addUnit('ohm', ['ohm', 'ohms', 'ohm resistance'], 'Ω', [2, 1, -3, -2, 0, 0, 0], '1', { prefixable: 'all', longName: 'ohm', plural: 'ohms' });

      U.mile = addUnit('mile', ['mile', 'miles', 'mi'], 'mi', DIMS.length, '1609.344', { longName: 'mile', plural: 'miles' });
      U.yard = addUnit('yard', ['yard', 'yards'], 'yd', DIMS.length, '0.9144', { longName: 'yard', plural: 'yards' });
      U.foot = addUnit('foot', ['foot', 'feet', 'ft'], 'ft', DIMS.length, '0.3048', { longName: 'foot', plural: 'feet' });
      U.inch = addUnit('inch', ['inch', 'inches', 'in'], 'in', DIMS.length, '0.0254', { longName: 'inch', plural: 'inches' });
      U.ounce = addUnit('ounce', ['ounce', 'ounces', 'oz'], 'oz', DIMS.mass, '0.028349523125', { longName: 'ounce', plural: 'ounces' });
      U.pound = addUnit('pound', ['pound', 'pounds', 'lb', 'lbs'], 'lb', DIMS.mass, '0.45359237', { longName: 'pound', plural: 'pounds' });

      const areaDims = [2, 0, 0, 0, 0, 0, 0];
      U.m2 = addUnit('square-meter', ['square meter', 'square meters', 'square metre', 'square metres', 'sq m', 'sq meter', 'sq meters'], 'm^2', areaDims, '1', { prefixable: 'all', prefixPower: 2, longName: 'square meter', plural: 'square meters' });
      U.km2 = addUnit('square-kilometer', ['square kilometer', 'square kilometers', 'square kilometre', 'square kilometres', 'sq km'], 'km^2', areaDims, '1e6', { longName: 'square kilometer', plural: 'square kilometers' });
      U.mi2 = addUnit('square-mile', ['square mile', 'square miles', 'sq mi'], 'mi^2', areaDims, '2589988.110336', { longName: 'square mile', plural: 'square miles' });
      U.ft2 = addUnit('square-foot', ['square foot', 'square feet', 'sq ft'], 'ft^2', areaDims, '0.09290304', { longName: 'square foot', plural: 'square feet' });
      U.yd2 = addUnit('square-yard', ['square yard', 'square yards', 'sq yd'], 'yd^2', areaDims, '0.83612736', { longName: 'square yard', plural: 'square yards' });
      U.in2 = addUnit('square-inch', ['square inch', 'square inches', 'sq in'], 'in^2', areaDims, '0.00064516', { longName: 'square inch', plural: 'square inches' });
      U.acre = addUnit('acre', ['acre', 'acres'], 'acre', areaDims, '4046.8564224', { longName: 'acre', plural: 'acres' });

      U.m3 = addUnit('cubic-meter', ['cubic meter', 'cubic meters', 'cubic metre', 'cubic metres'], 'm^3', [3, 0, 0, 0, 0, 0, 0], '1', { prefixable: 'all', prefixPower: 3, longName: 'cubic meter', plural: 'cubic meters' });
      U.liter = addUnit('liter', ['liter', 'liters', 'litre', 'litres', 'L', 'l'], 'L', [3, 0, 0, 0, 0, 0, 0], '0.001', { prefixable: 'all', longName: 'liter', plural: 'liters' });
      U.ft3 = addUnit('cubic-foot', ['cubic foot', 'cubic feet'], 'ft^3', [3, 0, 0, 0, 0, 0, 0], '0.028316846592', { longName: 'cubic foot', plural: 'cubic feet' });
      U.in3 = addUnit('cubic-inch', ['cubic inch', 'cubic inches'], 'in^3', [3, 0, 0, 0, 0, 0, 0], '0.000016387064', { longName: 'cubic inch', plural: 'cubic inches' });

      U.gal = addUnit('us-gallon', ['gallon', 'gallons', 'us gallon', 'us gallons', 'gal'], 'gal', [3, 0, 0, 0, 0, 0, 0], '0.003785411784', { longName: 'gallon', plural: 'gallons' });
      U.galImp = addUnit('imperial-gallon', ['imperial gallon', 'imperial gallons', 'imp gallon', 'imp gallons', 'uk gallon', 'uk gallons', 'imp gal', 'uk gal'], 'imp gal', [3, 0, 0, 0, 0, 0, 0], '0.00454609', { longName: 'imperial gallon', plural: 'imperial gallons' });
      U.qt = addUnit('us-quart', ['quart', 'quarts', 'qt'], 'qt', [3, 0, 0, 0, 0, 0, 0], '0.000946352946', { longName: 'quart', plural: 'quarts' });
      U.pt = addUnit('us-pint', ['pint', 'pints', 'pt'], 'pt', [3, 0, 0, 0, 0, 0, 0], '0.000473176473', { longName: 'pint', plural: 'pints' });
      U.cup = addUnit('us-cup', ['cup', 'cups'], 'cup', [3, 0, 0, 0, 0, 0, 0], '0.0002365882365', { longName: 'cup', plural: 'cups' });
      U.tbsp = addUnit('tablespoon', ['tablespoon', 'tablespoons', 'tbsp'], 'tbsp', [3, 0, 0, 0, 0, 0, 0], '0.00001478676478125', { longName: 'tablespoon', plural: 'tablespoons' });
      U.tsp = addUnit('teaspoon', ['teaspoon', 'teaspoons', 'tsp'], 'tsp', [3, 0, 0, 0, 0, 0, 0], '0.00000492892159375', { longName: 'teaspoon', plural: 'teaspoons' });
      U.floz = addUnit('us-fluid-ounce', ['fluid ounce', 'fluid ounces', 'fl oz', 'floz'], 'fl oz', [3, 0, 0, 0, 0, 0, 0], '0.0000295735295625', { longName: 'fluid ounce', plural: 'fluid ounces' });
      U.flozImp = addUnit('imperial-fluid-ounce', ['imperial fluid ounce', 'imperial fluid ounces', 'imp fl oz', 'uk fl oz'], 'imp fl oz', [3, 0, 0, 0, 0, 0, 0], '0.0000284130625', { longName: 'imperial fluid ounce', plural: 'imperial fluid ounces' });

      U.mpg = addUnit('mile-per-gallon', ['mile per gallon', 'miles per gallon', 'mpg'], 'mpg', [-2, 0, 0, 0, 0, 0, 0], d('1609.344').div('0.003785411784').toString(), { longName: 'mile per gallon', plural: 'miles per gallon' });
      U.kmL = addUnit('kilometer-per-liter', ['kilometer per liter', 'kilometers per liter', 'kilometre per litre', 'km/l', 'km per liter'], 'km/L', [-2, 0, 0, 0, 0, 0, 0], '1e6', { longName: 'kilometer per liter', plural: 'kilometers per liter' });
      U.mph = addUnit('mile-per-hour', ['mile per hour', 'miles per hour', 'mph'], 'mph', [1, 0, -1, 0, 0, 0, 0], d('1609.344').div(3600).toString(), { longName: 'mile per hour', plural: 'miles per hour' });
      U.kph = addUnit('kilometer-per-hour', ['kilometer per hour', 'kilometers per hour', 'kilometre per hour', 'kph', 'km/h', 'kmh'], 'km/h', [1, 0, -1, 0, 0, 0, 0], d(1000).div(3600).toString(), { longName: 'kilometer per hour', plural: 'kilometers per hour' });
      U.knot = addUnit('knot', ['knot', 'knots', 'kt', 'kn'], 'knot', [1, 0, -1, 0, 0, 0, 0], d('1.852').div(3.6).toString(), { longName: 'knot', plural: 'knots' });
      U.ms = addUnit('meter-per-second', ['meter per second', 'meters per second', 'metre per second', 'm/s', 'mps'], 'm/s', [1, 0, -1, 0, 0, 0, 0], '1', { longName: 'meter per second', plural: 'meters per second' });
      U.fts = addUnit('foot-per-second', ['foot per second', 'feet per second', 'ft/s', 'fps'], 'ft/s', [1, 0, -1, 0, 0, 0, 0], '0.3048', { longName: 'foot per second', plural: 'feet per second' });

      U.atm = addUnit('atmosphere', ['atmosphere', 'atmospheres', 'atm'], 'atm', [-1, 1, -2, 0, 0, 0, 0], '101325', { longName: 'atmosphere', plural: 'atmospheres' });
      U.psi = addUnit('psi', ['psi', 'pounds per square inch'], 'PSI', [-1, 1, -2, 0, 0, 0, 0], '6894.757293168', { longName: 'psi', plural: 'psi' });
      U.lbf = addUnit('pound-force', ['pound-force', 'pounds-force', 'lbf'], 'lbf', [1, 1, -2, 0, 0, 0, 0], '4.4482216152605', { longName: 'pound-force', plural: 'pounds-force' });
      U.hp = addUnit('horsepower-mechanical', ['horsepower', 'mechanical horsepower', 'hp'], 'hp', [2, 1, -3, 0, 0, 0, 0], '745.6998715822702', { longName: 'horsepower', plural: 'horsepower' });
      U.ps = addUnit('horsepower-metric', ['metric horsepower', 'pferdestarke', 'ps'], 'PS', [2, 1, -3, 0, 0, 0, 0], '735.49875', { longName: 'metric horsepower', plural: 'metric horsepower' });

      U.celsius = addUnit('celsius', ['celsius', 'degree celsius', 'degrees celsius', 'degc'], '°C', DIMS.temperature, '1', { offset: '273.15', temp: true, longName: 'degree Celsius', plural: 'degrees Celsius' });
      U.fahrenheit = addUnit('fahrenheit', ['fahrenheit', 'degree fahrenheit', 'degrees fahrenheit', 'degf'], '°F', DIMS.temperature, d(5).div(9).toString(), { offset: d('459.67').times(d(5).div(9)).toString(), temp: true, longName: 'degree Fahrenheit', plural: 'degrees Fahrenheit' });
      U.degree = addUnit('degree-angle', ['degree', 'degrees', 'deg'], '°', DIMS.angle, PI.div(180).toString(), { longName: 'degree', plural: 'degrees' });
      U.radian = addUnit('radian', ['radian', 'radians', 'rad'], 'rad', DIMS.angle, '1', { longName: 'radian', plural: 'radians' });
      U.gradian = addUnit('gradian', ['gradian', 'gradians', 'grad'], 'grad', DIMS.angle, PI.div(200).toString(), { longName: 'gradian', plural: 'gradians' });

      U.minute = addUnit('minute', ['minute', 'minutes', 'min', 'mins'], 'min', DIMS.time, '60', { longName: 'minute', plural: 'minutes' });
      U.hour = addUnit('hour', ['hour', 'hours', 'hr', 'hrs'], 'h', DIMS.time, '3600', { longName: 'hour', plural: 'hours' });
      U.day = addUnit('day', ['day', 'days'], 'd', DIMS.time, '86400', { longName: 'day', plural: 'days' });
      U.week = addUnit('week', ['week', 'weeks', 'wk', 'wks'], 'week', DIMS.time, '604800', { longName: 'week', plural: 'weeks' });
      U.month = addUnit('month', ['month', 'months'], 'month', DIMS.time, '2629800', { longName: 'month', plural: 'months' });
      U.year = addUnit('year', ['year', 'years', 'yr', 'yrs'], 'year', DIMS.time, '31557600', { longName: 'year', plural: 'years' });
      U.decade = addUnit('decade', ['decade', 'decades'], 'decade', DIMS.time, '315576000', { longName: 'decade', plural: 'decades' });
      U.century = addUnit('century', ['century', 'centuries'], 'century', DIMS.time, '3155760000', { longName: 'century', plural: 'centuries' });

      const ALIAS_MULTIPLE = [
        ['square foot', 'square feet', 'sq ft'], ['square inch', 'square inches', 'sq in'],

        for (const figures of [3, 4, 5, 6, 8, 10, 12]) {
          const rounded = clean.toSignificantDigits(figures, Decimal.ROUND_HALF_UP);
          if (sameIntegerPart(clean, rounded)) return trimDecimal(rounded);
        }
        return formatSignificant(clean, 12);
      }

      function unitSuffix(unit, magnitude, style = {}) {
        if (!unit) return '';
        if (style.longNames && unit.longName && !unit.symbol.includes('·') && !unit.symbol.includes('/')) {
          const abs = magnitude.abs();
          const name = abs.eq(1) || !unit.plural ? unit.longName : unit.plural;
          return ` ${name}`;
        }
        return `${style.unitSpace ? ' ' : ''}${unit.symbol}`;
      }

      function formatQuantityText(quantity, unit, style = {}, mode = 'primary') {
        const magnitude = unit ? cleanDecimal(quantityInUnit(quantity, unit)) : cleanDecimal(quantity.value);
        const suffix = unitSuffix(unit, magnitude, style);
        if (mode === 'alternate') return { primary: `${alternateNumber(magnitude)}${suffix}`, ladder: [], magnitude };
        const variants = numberVariants(magnitude);
        return {
          primary: `${variants.primary}${suffix}`,
          ladder: variants.ladder.map(item => ({ ...item, text: `${item.text}${suffix}` })),
          magnitude,
          exact: variants.exact
        };
      }

      function sameResultText(a, b) {
        return a.trim().replace(/\s+/g, ' ').toLowerCase() === b.trim().replace(/\s+/g, ' ').toLowerCase();
      }

      function isLoneNumber(node) {
        if (!node) return false;
        if (node.type === 'group') return isLoneNumber(node.value);
        if (node.type === 'unary') return isLoneNumber(node.value);
        return node.type === 'number';
      }

      function isLonePercent(node) {
        if (!node || node.type !== 'percent') return false;
        return isLoneNumber(node.value);
      }

      function isQuantityLiteral(node) {
        if (!node) return false;
        if (node.type === 'group' || node.type === 'unary') return isQuantityLiteral(node.value);
        if (node.type === 'unit') return true;
        if (node.type === 'number') return false;
        if (node.type === 'binary' && (node.op === 'implicit' || node.op === '*' || node.op === '/')) {
          return isQuantityLiteral(node.left) || isQuantityLiteral(node.right);
        }
        if (node.type === 'binary' && node.op === '^') return isQuantityLiteral(node.left) && node.right.type === 'number';
        return false;
      }

      function hasUnitAmbiguity(tokens) {
        return tokens.some(item => item.type === 'UNIT' && item.options?.length > 1);
      }

      function unitStyleFor(text, tokens) {
        const longNames = tokens.some(item => item.type === 'UNIT' && (item.named || item.raw.length > 3) && item.raw.length > item.selectedUnit.symbol.length + 1);
        let spacedUnits = 0;
        let compactUnits = 0;
        for (const item of tokens) {
          if (item.type !== 'UNIT') continue;
          const before = text.slice(0, item.start);
          const trimmed = before.replace(/\s+$/, '');
          const previous = trimmed[trimmed.length - 1] || '';
          if (!/[\d.)]/.test(previous)) continue;
          if (trimmed.length !== before.length) spacedUnits++;
          else compactUnits++;
        }
        const unitSpace = spacedUnits > 0 && compactUnits === 0;
        return { longNames, unitSpace };
      }

      function canonicalExpression(source, found, variantTokens, options = {}) {
        let text = source.slice(found.start, found.end);
        const replacements = [];
        for (const item of variantTokens) {
          if (item.type === 'UNIT') {
            const localStart = item.start - found.start;
            const localEnd = item.end - found.start;
            if (localStart < 0 || localEnd > text.length) continue;
            const long = item.named && item.raw.length > item.selectedUnit.symbol.length + 1;
            if (!long && item.raw !== item.selectedUnit.symbol) replacements.push({ start: localStart, end: localEnd, text: item.selectedUnit.symbol });
          }
          if (item.type === 'NUMBER' && item.sci && options.scientificNotation) {
            const exponent = item.sci.exponent.replace(/\d/g, digit => '⁰¹²³⁴⁵⁶⁷⁸⁹'[Number(digit)]).replace('-', '⁻');
            const coefficient = item.sci.base === '1' ? '' : `${item.sci.base}·`;
            replacements.push({ start: item.start - found.start, end: item.end - found.start, text: `${coefficient}10${exponent}` });
          }
          if (item.type === 'NUMBER' && item.sciOrigin && options.scientific) {
            const sci = item.sciOrigin;
            replacements.push({
              start: sci.start - found.start,
              end: sci.end - found.start,
              text: `${sci.base}·e − ${sci.exponent}`
            });
          }
        }
        replacements.sort((a, b) => b.start - a.start).forEach(item => {
          text = text.slice(0, item.start) + item.text + text.slice(item.end);
        });
        return text.trim();
      }

      function spacedEquationExpression(text) {
        return text
          .replace(/\s*([+*/])\s*/g, ' $1 ')
          .replace(/\s*-\s*/g, ' − ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function makeEquation(expression, result) { return `${expression} = ${result}`; }

      function prefixForInsertion(analysis) {
        if (analysis.shape === 'explicit' || analysis.shape === 'partial') return '';
        return /\s/.test(analysis.segmentSource) ? ' = ' : '=';
      }

      function makeChip({ insertText, equation, resultText, kind = 'primary', tag = '', inlineEligible = false, typedPrefixLen = 0, replaceRange = null, altReading = false }) {
        return { insertText, displayEquation: equation, resultText, kind, tag, inlineEligible, typedPrefixLen, replaceRange, altReading };
      }

      function buildGroups(analysis, found, selectedVariants, readingOptions = {}) {
        const groups = [];
        for (const variantTokens of selectedVariants) {
          let ast;
          try { ast = parseTokens(variantTokens); } catch (_) { continue; }
          const display = canonicalExpression(analysis.expression, found, variantTokens, {
            scientific: !!readingOptions.scientific,
            scientificNotation: !!readingOptions.scientificNotation
          });
          const ambigUnits = hasUnitAmbiguity(found.tokens) || (analysis.conversionTargetUnits?.length > 1);
          let radContext = { mode: 'rad', hasBareTrig: false };
          let radValue = null;
          try { radValue = evaluate(ast, radContext); } catch (_) { /* Continue in degrees if a bare trig input was seen. */ }
          const hasBareTrig = radContext.hasBareTrig;
          const modes = radValue ? [{ mode: 'rad', value: radValue, context: radContext }] : [];
          if (hasBareTrig) {
            const degContext = { mode: 'deg', hasBareTrig: false };
            try { modes.push({ mode: 'deg', value: evaluate(ast, degContext), context: degContext }); } catch (_) { /* A failed angle interpretation is omitted. */ }
          }
          if (!modes.length) continue;
          const style = unitStyleFor(analysis.segmentSource, variantTokens);
          for (const mode of modes) {
            const conversions = analysis.conversionTargetUnits || [null];
            for (const conversionTarget of conversions) {
              if (conversionTarget && !dimsEqual(conversionTarget.dims, mode.value.dims)) continue;
              const selectedUnit = conversionTarget || (mode.value.unit ? chooseSizedUnit(mode.value.unit, mode.value.value, mode.value.dims) : null);
              const primary = formatQuantityText(mode.value, selectedUnit, style, 'primary');
              const targets = conversionTarget ? [] : targetUnitsFor(mode.value).filter(unit => !selectedUnit || unit.id !== selectedUnit.id);
              const conversionDisplay = conversionTarget ? `${display} ${analysis.conversionPhrase || 'to'} ${conversionTarget.symbol}` : display;
              groups.push({
                quantity: mode.value,
                mode: mode.mode,
                hasBareTrig,
                selectedUnit,
                primary,
                displayExpr: ambigUnits ? spacedEquationExpression(conversionDisplay) : conversionDisplay,
                style,
                targets,
                ambiguousUnits: ambigUnits,
                scientific: !!readingOptions.scientific,
                scientificNotation: !!readingOptions.scientificNotation
              });
            }
          }
        }
        return groups;
      }

      function addUniqueChip(chips, chip) {
        if (!chip || !chip.insertText) return;
        const duplicate = chips.some(current => sameResultText(current.resultText || '', chip.resultText || '') && current.kind === chip.kind);
        if (!duplicate) chips.push(chip);
      }

      function primaryChipFor(group, analysis, lineClass, options = {}) {
        const result = group.primary.primary;
        const prefix = options.insertPrefix === undefined ? prefixForInsertion(analysis) : options.insertPrefix;
        const tag = group.hasBareTrig ? group.mode : '';
        return makeChip({
          insertText: `${prefix}${result}`,
          equation: makeEquation(group.displayExpr, result),
          resultText: result,
          kind: options.kind || 'primary',
          tag,
          inlineEligible: lineClass === 'inline' && !group.ambiguousUnits && !options.forceBar,
          typedPrefixLen: options.typedPrefixLen || 0,
          replaceRange: options.replaceRange || null,
          altReading: group.scientific
        });
      }

      function buildStandardChips(groups, analysis, lineClass, options = {}) {
        const chips = [];
        const hasMultipleModes = groups.some(group => group.hasBareTrig);
        const trigGroups = hasMultipleModes && !groups.some(group => group.ambiguousUnits || group.scientific);
        const primaryGroups = groups.filter(group => !group.ambiguousUnits && !group.scientific);

        if (groups.some(group => group.ambiguousUnits)) {
          for (const group of groups) {
            addUniqueChip(chips, primaryChipFor(group, analysis, 'chip-only', { forceBar: true, kind: 'ambiguous-reading' }));
          }
          return chips;
        }

        if (groups.some(group => group.scientific)) {
          for (const group of groups.filter(item => !item.scientific)) {
            addUniqueChip(chips, primaryChipFor(group, analysis, lineClass, { kind: 'primary' }));
          }
          for (const group of groups.filter(item => item.scientific)) {
            addUniqueChip(chips, primaryChipFor(group, analysis, 'chip-only', { forceBar: true, kind: 'reading' }));
          }
          return chips;
        }

        if (trigGroups) {
          const rad = primaryGroups.find(group => group.mode === 'rad');
          const deg = primaryGroups.find(group => group.mode === 'deg');
          if (rad) addUniqueChip(chips, primaryChipFor(rad, analysis, lineClass));
          if (deg) addUniqueChip(chips, primaryChipFor(deg, analysis, lineClass));
          for (const group of [rad, deg]) {
            if (!group) continue;
            for (const ladder of group.primary.ladder) {
              const tag = group.hasBareTrig ? group.mode : '';
              addUniqueChip(chips, makeChip({
                insertText: `${prefixForInsertion(analysis)}${ladder.text}`,
                equation: makeEquation(group.displayExpr, ladder.text), resultText: ladder.text,
                kind: 'ladder', tag, inlineEligible: false
              }));
            }
          }
          return chips;
        }

        const group = primaryGroups[0];
        if (!group) return chips;
        if (!options.omitPrimary) addUniqueChip(chips, primaryChipFor(group, analysis, lineClass, { forceBar: options.forceBar }));

        if (options.bareUnit) {
          chips.length = 0;
          const prefix = prefixForInsertion(analysis);
          for (const target of group.targets) {
            const formatted = formatQuantityText(group.quantity, target, group.style, 'alternate');
            const result = formatted.primary;
            addUniqueChip(chips, makeChip({
              insertText: `${prefix}${result}`,
              equation: makeEquation(group.displayExpr, result), resultText: result,
              kind: 'alternate', inlineEligible: false
            }));
          }
          return chips;
        }

        for (const target of group.targets) {
          const formatted = formatQuantityText(group.quantity, target, group.style, 'alternate');
          const result = formatted.primary;
          addUniqueChip(chips, makeChip({
            insertText: `${prefixForInsertion(analysis)}${result}`,
            equation: makeEquation(group.displayExpr, result), resultText: result,
            kind: 'alternate', inlineEligible: false
          }));
        }
        for (const ladder of group.primary.ladder) {
          const result = ladder.text;
          addUniqueChip(chips, makeChip({
            insertText: `${prefixForInsertion(analysis)}${result}`,
            equation: makeEquation(group.displayExpr, result), resultText: result,
            kind: 'ladder', inlineEligible: false
          }));
        }
        return chips;
      }

      const PHONE_DATE_PATTERNS = [
        /^\d{3}-\d{4}$/,
        /^\d{3}-\d{3}-\d{4}$/,
        /^\(?\d{3}\)?[ -]?\d{3}-\d{4}$/,
        /^\d{4}-\d{1,2}-\d{1,2}$/,
        /^\d{1,2}[/.\-]\d{1,2}[/.\-]\d{2,4}$/
      ];

      function isPartialResultText(text) {
        return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?(?:\s*(?:[A-Za-zµμΩ°]+(?:\^?-?\d+)?|°[CF]|%))?$/.test(text.trim());
      }

      function hasSyntacticExpression(text) { return !!findLongestValid(text.trim()); }

      function splitConversion(source) {
        const arrow = source.match(/^(.*?)\s*->\s*([A-Za-zµμΩ°][A-Za-zµμΩ°A-Za-z0-9 ^²³-]*)\s*$/);
        if (arrow) return { expression: arrow[1], target: arrow[2].trim(), phrase: '->' };
        const named = source.match(/^(.*?)\s+(to|in)\s+([A-Za-zµμΩ°][A-Za-zµμΩ°A-Za-z0-9 ^²³-]*)\s*$/i);
        if (named) return { expression: named[1], target: named[3].trim(), phrase: named[2].toLowerCase() };
        return null;
      }

      function findLineAnalysis() {
        const value = editor.value;
        const caret = editor.selectionStart;
        if (editor.selectionStart !== editor.selectionEnd || composing) return null;
        const lineStart = value.lastIndexOf('\n', Math.max(0, caret - 1)) + 1;
        const nextBreak = value.indexOf('\n', caret);
        const lineEnd = nextBreak < 0 ? value.length : nextBreak;
        const afterCaret = value.slice(caret, lineEnd);
        if (afterCaret.trim() !== '') return null;
        const line = value.slice(lineStart, lineEnd);
        const beforeCaret = line.slice(0, caret - lineStart);
        const trailingWhitespace = (beforeCaret.match(/\s*$/) || [''])[0];
        const core = beforeCaret.slice(0, beforeCaret.length - trailingWhitespace.length);
        if (!core.trim()) return null;

        const bulletMatch = core.match(/^(\s*)([-*+•–])\s+/);
        const bullet = !!bulletMatch;
        const bulletLength = bulletMatch ? bulletMatch[0].length : 0;
        const content = core.slice(bulletLength);
        if (!content.trim()) return null;
        const hasEquals = content.includes('=');
        const endsWithEquals = content.trimEnd().endsWith('=');
        let shape = 'noEquals';
        let expression = content;
        let partialText = '';
        let replaceRange = null;

        if (endsWithEquals) {
          shape = 'explicit';
          const end = content.lastIndexOf('=');
          const previous = content.lastIndexOf('=', end - 1);
          expression = content.slice(previous + 1, end);
        } else if (hasEquals) {
          const lastEquals = content.lastIndexOf('=');
          const candidateResult = content.slice(lastEquals + 1).trim();
          const earlier = content.slice(0, lastEquals);
          if (isPartialResultText(candidateResult) && hasSyntacticExpression(earlier)) {
            shape = 'partial';
            expression = earlier;
            partialText = candidateResult;
            const resultRaw = content.slice(lastEquals + 1);
            const leadSpace = (resultRaw.match(/^\s*/) || [''])[0].length;
            replaceRange = {
              start: lineStart + bulletLength + lastEquals + 1 + leadSpace,
              end: lineStart + bulletLength + content.length
            };
          } else {
            expression = content.slice(lastEquals + 1);
          }
        }

        const segmentSource = expression;
        const conversion = splitConversion(expression);
        let expressionForEval = expression;
        let conversionTargetUnits = null;
        if (conversion) {
          const target = resolveUnit(conversion.target);
          if (target.length) {
            expressionForEval = conversion.expression;
            conversionTargetUnits = target;
          }
        }

        const found = findLongestValid(expressionForEval);
        if (!found) return null;
        const chosenText = expressionForEval.slice(found.start, found.end).trim();
        if (!chosenText) return null;
        const loneLiteral = isLoneNumber(found.ast);
        const lonePercent = isLonePercent(found.ast);
        const bareUnit = isQuantityLiteral(found.ast);
        const phoneOrDate = PHONE_DATE_PATTERNS.some(pattern => pattern.test(chosenText));
        const ambiguousUnit = hasUnitAmbiguity(found.tokens);
        let lineClass = 'inline';
        if (bareUnit && !conversionTargetUnits) lineClass = 'bare-unit';
        else if (ambiguousUnit || (bullet && !hasEquals) || (phoneOrDate && !hasEquals)) lineClass = 'chip-only';

        return {
          lineStart, lineEnd, caret, line, content, bullet, bulletLength,
          shape, hasEquals, lineHasExplicitEquals: hasEquals, partialText, replaceRange,
          segmentSource, expression: expressionForEval, found, chosenText,
          loneLiteral, lonePercent, bareUnit: bareUnit && !conversionTargetUnits,
          phoneOrDate, ambiguousUnit, lineClass, conversionTargetUnits,
          expressionForDisplay: conversionTargetUnits ? `${chosenText} ${conversion.phrase} ${conversion.target}` : chosenText,
          trailingWhitespace
        };
      }

      function partialResultChips(groups, analysis, lineClass) {
        if (!groups.length) return [];
        const typed = analysis.partialText.trim();
        const hasTrig = groups.some(group => group.hasBareTrig);
        const ordered = [];
        if (hasTrig) {
          for (const group of groups) ordered.push({ group, text: group.primary.primary, kind: 'primary' });
          for (const group of groups) for (const ladder of group.primary.ladder) ordered.push({ group, text: ladder.text, kind: 'ladder' });
        } else {
          for (const group of groups) {
            ordered.push({ group, text: group.primary.primary, kind: 'primary' });
            for (const ladder of group.primary.ladder) ordered.push({ group, text: ladder.text, kind: 'ladder' });
          }
        }
        const matching = ordered.filter(item => item.text.toLowerCase().startsWith(typed.toLowerCase()));
        if (!matching.length) {
          const group = groups[0];
          const result = group.primary.primary;
          return [makeChip({
            insertText: result,
            equation: makeEquation(group.displayExpr, result), resultText: result,
            kind: 'replace', tag: group.hasBareTrig ? group.mode : '',
            inlineEligible: false, replaceRange: analysis.replaceRange
          })];
        }

        const chips = [];
        for (const item of matching) {
          if (item.text.length <= typed.length) continue;
          const remainder = item.text.slice(typed.length);
          const group = item.group;
          const eligible = item.kind === 'primary' && lineClass === 'inline' && !group.ambiguousUnits;
          addUniqueChip(chips, makeChip({
            insertText: remainder,
            equation: makeEquation(group.displayExpr, item.text), resultText: item.text,
            kind: item.kind === 'primary' ? 'partial' : 'ladder',
            tag: group.hasBareTrig ? group.mode : '',
            inlineEligible: eligible,
            typedPrefixLen: typed.length
          }));
        }
        return chips;
      }

      function createEvaluationGroups(analysis) {
        const variants = expandUnitReadings(analysis.found.tokens);
        const readings = [];
        for (const tokens of variants) {
          const alternative = scientificAlternative(tokens);
          readings.push({ tokens, scientific: false, scientificNotation: !!alternative });
          if (alternative) readings.push({ tokens: alternative, scientific: true, scientificNotation: false });
        }
        const groups = [];
        for (const reading of readings) {
          groups.push(...buildGroups(analysis, analysis.found, [reading.tokens], reading));
        }
        return groups;
      }

      const FUNCTION_COMPLETIONS = ['sqrt', 'cbrt', 'sin', 'cos', 'tan', 'csc', 'sec', 'cot', 'arcsin', 'asin', 'arccos', 'acos', 'arctan', 'atan', 'log', 'log2', 'log5', 'log_2', 'ln'];
      const CONSTANT_COMPLETIONS = ['pi', 'e'];
      const UNIT_COMPLETIONS = [...new Set([
        ...ALL_UNITS.map(unit => unit.longName),
        ...SYMBOL_UNITS.map(unit => unit.symbol),
        'mile', 'foot', 'inch', 'yard', 'ounce', 'pound', 'square meter', 'square kilometer', 'acre', 'gallon', 'pint', 'quart', 'liter', 'watt-hour', 'fluid ounce'
      ])].filter(Boolean);

      function linePrefixForCompletion() {
        const value = editor.value;
        const caret = editor.selectionStart;
        if (editor.selectionStart !== editor.selectionEnd || composing) return null;
        const lineStart = value.lastIndexOf('\n', Math.max(0, caret - 1)) + 1;
        const lineEndIndex = value.indexOf('\n', caret);
        const lineEnd = lineEndIndex < 0 ? value.length : lineEndIndex;
        const after = value.slice(caret, lineEnd);
        if (after.trim()) return null;
        return value.slice(lineStart, caret).replace(/\s+$/, '');
      }

      function autocompleteChips() {
        const line = linePrefixForCompletion();
        if (!line) return [];
        const conversion = line.match(/^(.*?)(?:\s+(?:to|in)\s+|\s*->\s*)([A-Za-zµμΩ°][A-Za-zµμΩ°0-9]*)$/i);
        let partial;
        let kind;
        let context;
        if (conversion) {
          partial = conversion[2];
          kind = 'conversion';
          context = 'unit';
        } else {
          const word = line.match(/([A-Za-zµμΩ°]+)$/);
          if (!word) return [];
          partial = word[1];
          const before = line.slice(0, line.length - partial.length);
          const lower = partial.toLowerCase();
          const functionContext = !before.trim() || /(?:[+*/^(-]|\b(?:sin|cos|tan|sqrt|cbrt|log|ln)\s*)\s*$/i.test(before);
          const unitContext = /\d\s*$/.test(before) || /[+*/(-]\s*$/.test(before) || /\b(?:sin|cos|tan|sqrt|cbrt|log|ln)\s+$/i.test(before);
          if (FUNCTION_COMPLETIONS.some(name => name.startsWith(lower)) && functionContext) {
            kind = 'function'; context = 'function';
          } else if (CONSTANT_COMPLETIONS.some(name => name.startsWith(lower)) && functionContext && lower !== 'pi' && lower !== 'e') {
            kind = 'constant'; context = 'constant';
          } else if (UNIT_COMPLETIONS.some(name => name.toLowerCase().startsWith(lower)) && unitContext) {
            kind = 'unit'; context = 'unit';
          } else return [];
          if (kind === 'unit' && resolveUnit(partial).length) return [];
          if (kind === 'constant' && CONSTANT_COMPLETIONS.includes(lower)) return [];
        }
        const lowerPartial = partial.toLowerCase();
        let candidates;
        if (context === 'function') {
          candidates = FUNCTION_COMPLETIONS.filter(name => name.toLowerCase().startsWith(lowerPartial)).map(name => ({ target: `${name}(`, full: name, kind: 'function' }));
          if (FUNCTION_COMPLETIONS.includes(lowerPartial)) candidates = candidates.map(item => ({ ...item, target: `${item.full}(` }));
        } else if (context === 'constant') {
          candidates = CONSTANT_COMPLETIONS.filter(name => name.toLowerCase().startsWith(lowerPartial)).map(name => ({ target: name, full: name, kind: 'constant' }));
        } else {
          candidates = UNIT_COMPLETIONS.filter(name => name.toLowerCase().startsWith(lowerPartial)).map(name => ({ target: name, full: name, kind: 'unit' }));
        }
        const unique = [];
        const seen = new Set();
        for (const item of candidates) {
          const key = item.target.toLowerCase();
          if (seen.has(key) || item.target.length <= partial.length) continue;
          seen.add(key); unique.push(item);
        }
        return unique.slice(0, 16).map(item => {
          const suffix = item.target.slice(partial.length);
          const chip = makeChip({
            insertText: suffix,
            equation: item.target,
            resultText: item.target,
            kind: 'completion',
            inlineEligible: true
          });
          chip.completionPrefix = partial;
          chip.completionFull = item.target;
          return chip;
        });
      }

      let composing = false;
      let suggestions = [];
      let highlighted = 0;
      let explicitlyMoved = false;
      let ghostText = '';
      let dismissed = false;
      let debounceTimer = 0;

      function setMirror() {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        mirror.replaceChildren();
        if (ghostText && start === end && !composing) {
          mirror.append(document.createTextNode(editor.value.slice(0, start)));
          const ghost = document.createElement('span');
          ghost.className = 'ghost-text';
          ghost.textContent = ghostText;
          mirror.append(ghost, document.createTextNode(editor.value.slice(end)));
        } else {
          mirror.textContent = editor.value;
        }
        mirror.scrollTop = editor.scrollTop;
        mirror.scrollLeft = editor.scrollLeft;
      }

      function middleEllipsis(runs, maxLength = 82) {
        const chars = [];
        for (const run of runs) for (const char of Array.from(run.text)) chars.push({ char, style: run.style });
        if (chars.length <= maxLength) return chars;
        const leftCount = Math.floor((maxLength - 3) / 2);
        const rightCount = maxLength - 3 - leftCount;
        return [...chars.slice(0, leftCount), { char: '...', style: 'dim' }, ...chars.slice(-rightCount)];
      }

      function renderChipLabel(button, chip) {
        const label = document.createElement('span');
        label.className = 'chip-equation';
        let runs;
        if (chip.kind === 'completion') {
          runs = [
            { text: chip.completionPrefix || '', style: 'dim' },
            { text: (chip.completionFull || '').slice((chip.completionPrefix || '').length), style: 'strong' }
          ];
        } else {
          const equation = chip.displayEquation || '';
          const split = equation.lastIndexOf(' = ');
          if (split >= 0) {
            const lhs = equation.slice(0, split + 3);
            const result = equation.slice(split + 3);
            const typedLength = Math.min(chip.typedPrefixLen || 0, result.length);
            runs = [
              { text: lhs, style: 'dim' },
              { text: result.slice(0, typedLength), style: 'dim' },
              { text: result.slice(typedLength), style: 'strong' }
            ];
          } else {
            runs = [{ text: equation, style: 'strong' }];
          }
        }
        for (const item of middleEllipsis(runs)) {
          const span = document.createElement('span');
          span.className = item.style === 'strong' ? 'chip-strong' : 'chip-dim';
          span.textContent = item.char;
          label.append(span);
        }
        button.append(label);
        if (chip.tag) {
          const tag = document.createElement('span');
          tag.className = 'chip-tag';
          tag.textContent = chip.tag;
          button.append(tag);
        }
      }

      function updateGhost() {
        const chip = suggestions[highlighted];
        ghostText = chip && chip.inlineEligible ? chip.insertText : '';
        setMirror();
      }

      function renderSuggestions() {
        chipList.replaceChildren();
        const hasSuggestions = suggestions.length > 0;
        bar.classList.toggle('has-suggestions', hasSuggestions);
        keyHint.hidden = !hasSuggestions;
        if (!hasSuggestions) {
          ghostText = '';
          setMirror();
          return;
        }
        suggestions.forEach((chip, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `suggestion-chip${index === highlighted ? ' is-highlighted' : ''}`;
          button.setAttribute('role', 'option');
          button.setAttribute('aria-selected', index === highlighted ? 'true' : 'false');
          button.setAttribute('aria-label', chip.displayEquation || chip.completionFull || chip.insertText);
          button.title = chip.displayEquation || chip.completionFull || chip.insertText;
          button.addEventListener('mousedown', event => event.preventDefault());
          button.addEventListener('click', () => acceptChip(index));
          renderChipLabel(button, chip);
          chipList.append(button);
        });
        updateGhost();
      }

      function setSuggestions(next, resetMovement = true) {
        suggestions = next || [];
        if (resetMovement) {
          highlighted = 0;
          explicitlyMoved = false;
          chipList.scrollLeft = 0;
        } else if (highlighted >= suggestions.length) highlighted = Math.max(0, suggestions.length - 1);
        renderSuggestions();
      }

      function clearSuggestions() {
        suggestions = [];
        highlighted = 0;
        explicitlyMoved = false;
        ghostText = '';
        renderSuggestions();
      }

      function analyzeNow() {
        if (dismissed || composing || editor.selectionStart !== editor.selectionEnd) {
          clearSuggestions();
          return;
        }
        const completions = autocompleteChips();
        if (completions.length) {
          setSuggestions(completions);
          return;
        }
        const analysis = findLineAnalysis();
        if (!analysis || analysis.loneLiteral || analysis.lonePercent) {
          clearSuggestions();
          return;
        }
        const groups = createEvaluationGroups(analysis);
        if (!groups.length) {
          clearSuggestions();
          return;
        }
        let chips;
        if (analysis.shape === 'partial') chips = partialResultChips(groups, analysis, analysis.lineClass);
        else chips = buildStandardChips(groups, analysis, analysis.lineClass, { bareUnit: analysis.bareUnit });
        setSuggestions(chips);
      }

      function scheduleAnalysis() {
        window.clearTimeout(debounceTimer);
        debounceTimer = window.setTimeout(analyzeNow, 30);
      }

      function saveContent() {
        try { localStorage.setItem(STORAGE_KEY, editor.value); } catch (_) { /* Storage can be disabled in private browsing. */ }
      }

      function insertText(text, range = null) {
        const start = range ? range.start : editor.selectionStart;
        const end = range ? range.end : editor.selectionEnd;
        editor.focus({ preventScroll: true });
        editor.setSelectionRange(start, end);
        const before = editor.value;
        let usedCommand = false;
        try { usedCommand = document.execCommand('insertText', false, text); } catch (_) { usedCommand = false; }
        if (!usedCommand || editor.value === before) {
          editor.setRangeText(text, start, end, 'end');
          editor.dispatchEvent(new Event('input', { bubbles: true }));
        }
        editor.scrollTop = editor.scrollTop;
        setMirror();
      }

      function acceptChip(index) {
        const chip = suggestions[index];
        if (!chip) return;
        const insertion = chip.insertText;
        const range = chip.replaceRange;
        clearSuggestions();
        insertText(insertion, range);
        dismissed = false;
        saveContent();
        scheduleAnalysis();
      }

      function moveHighlight(delta) {
        const next = highlighted + delta;
        if (next < 0 || next >= suggestions.length) return false;
        highlighted = next;
        explicitlyMoved = true;
        renderSuggestions();
        const selected = chipList.children[highlighted];
        if (selected) selected.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
        return true;
      }

      editor.addEventListener('keydown', event => {
        if (composing || event.isComposing) return;
        if (event.key === 'Escape') {
          event.preventDefault();
          dismissed = true;
          clearSuggestions();
          return;
        }
        if (dismissed) dismissed = false;

        if (event.altKey && /^[1-9]$/.test(event.key)) {
          const index = Number(event.key) - 1;
          if (suggestions[index]) {
            event.preventDefault();
            acceptChip(index);
          }
          return;
        }

        if (suggestions.length && ['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown'].includes(event.key)) {
          const backward = event.key === 'ArrowLeft' || event.key === 'ArrowUp';
          if (moveHighlight(backward ? -1 : 1)) {
            event.preventDefault();
            return;
          }
          clearSuggestions();
          dismissed = true;
          return;
        }

        if (event.key === 'Tab' || event.key === 'Enter') {
          const active = suggestions[highlighted];
          const acceptable = !!active && ((ghostText && active.inlineEligible) || explicitlyMoved);
          if (acceptable) {
            event.preventDefault();
            acceptChip(highlighted);
          } else {
            event.preventDefault();
            insertText(event.key === 'Tab' ? '\t' : '\n');
          }
        }
      });

      editor.addEventListener('input', () => {
        dismissed = false;
        saveContent();
        setMirror();
        scheduleAnalysis();
      });
      editor.addEventListener('keyup', () => { setMirror(); scheduleAnalysis(); });
      editor.addEventListener('click', () => { setMirror(); scheduleAnalysis(); });
      editor.addEventListener('select', () => { setMirror(); scheduleAnalysis(); });
      editor.addEventListener('scroll', setMirror, { passive: true });
      editor.addEventListener('compositionstart', () => {
        composing = true;
        clearSuggestions();
      });
      editor.addEventListener('compositionend', () => {
        composing = false;
        scheduleAnalysis();
      });
      window.addEventListener('resize', setMirror, { passive: true });

      try { editor.value = localStorage.getItem(STORAGE_KEY) || ''; } catch (_) { editor.value = ''; }
      setMirror();
      scheduleAnalysis();
    })();
  </script>
</body>
</html>
