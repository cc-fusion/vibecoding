<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optical Bench — Spectral Ray Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10;
    --panel:#101419;
    --panel-2:#151A21;
    --line:#222A33;
    --line-soft:#1A2029;
    --txt:#E8EDF4;
    --muted:#8B96A5;
    --dim:#5E6875;
    --accent:#FF7A2F;
    --accent-soft:rgba(255,122,47,.16);
    --good:#5FD3B2;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'Space Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);
    font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  #app{display:grid;grid-template-rows:52px 1fr 30px;height:100vh}

  /* ---------- top bar ---------- */
  #topbar{
    display:flex;align-items:center;gap:18px;padding:0 16px;
    background:linear-gradient(180deg,#12161C,#0D1116);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:212px}
  .brand svg{display:block}
  .brand .name{font-weight:600;letter-spacing:.16em;font-size:11.5px;text-transform:uppercase}
  .brand .sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;margin-top:1px}
  .tsep{width:1px;height:26px;background:var(--line)}
  .ctl{display:flex;align-items:center;gap:9px}
  .ctl label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  input[type=range]{
    -webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer;width:112px;
  }
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:#29323C;border-radius:2px}
  input[type=range]::-moz-range-track{height:3px;background:#29323C;border-radius:2px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--txt);
    margin-top:-5px;border:none;box-shadow:0 1px 3px rgba(0,0,0,.5)
  }
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--txt);border:none}
  input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
  .val{font-family:var(--mono);font-size:11px;color:var(--txt);min-width:42px;text-align:right}
  .spacer{flex:1}
  select, input[type=number]{
    background:var(--panel-2);color:var(--txt);border:1px solid var(--line);
    border-radius:5px;padding:5px 8px;font-family:var(--mono);font-size:11px;outline:none;
  }
  select:focus-visible,input[type=number]:focus-visible{border-color:var(--accent)}
  .btn{
    background:var(--panel-2);color:var(--txt);border:1px solid var(--line);border-radius:6px;
    padding:6px 11px;font-family:var(--sans);font-size:11.5px;font-weight:500;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s;
  }
  .btn:hover{background:#1B222B;border-color:#2E3844}
  .btn.ghost{background:transparent}
  .btn.danger:hover{border-color:#7A3030;color:#FF9E9E;background:rgba(180,60,60,.12)}
  .btn.accent{background:var(--accent-soft);border-color:rgba(255,122,47,.45);color:#FFB27A}
  .btn.accent:hover{background:rgba(255,122,47,.26)}

  /* ---------- layout ---------- */
  main{display:grid;grid-template-columns:76px 1fr 312px;min-height:0}
  #rail{
    background:var(--panel);border-right:1px solid var(--line);
    padding:10px 0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .rail-title{font-size:8.5px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin:6px 0 6px}
  .tool{
    width:60px;padding:8px 2px 6px;border-radius:8px;border:1px solid transparent;background:transparent;
    color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;
    transition:background .15s,color .15s,border-color .15s;
  }
  .tool:hover{background:#171D25;color:var(--txt)}
  .tool.active{background:var(--accent-soft);border-color:rgba(255,122,47,.4);color:#FFC09A}
  .tool span{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase}
  .tool svg{width:19px;height:19px;display:block}

  #stage{position:relative;background:#080A0D;min-width:0;overflow:hidden}
  canvas#scene{display:block;width:100%;height:100%;cursor:crosshair}
  #empty{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;pointer-events:none;text-align:center;
  }
  #empty .big{font-size:15px;letter-spacing:.02em;color:var(--muted);font-weight:500}
  #empty .small{font-family:var(--mono);font-size:11px;color:var(--dim)}

  /* ---------- properties ---------- */
  #panel{
    background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;
    display:flex;flex-direction:column;
  }
  .p-head{padding:15px 16px 13px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .p-head .t{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .p-head .m{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.06em;margin-top:3px}
  .p-body{padding:6px 0 22px}
  .sec{padding:13px 16px 5px}
  .sec-h{
    font-size:9px;letter-spacing:.19em;text-transform:uppercase;color:var(--dim);
    display:flex;align-items:center;gap:8px;margin-bottom:9px
  }
  .sec-h::after{content:'';flex:1;height:1px;background:var(--line-soft)}
  .row{display:flex;align-items:center;gap:10px;padding:5px 16px}
  .row>label{flex:0 0 96px;font-size:11px;color:var(--muted);line-height:1.25}
  .row .ctl2{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
  .row input[type=range]{flex:1;width:auto;min-width:0}
  .row .val{min-width:52px}
  .row select{flex:1}
  .xy{display:flex;gap:6px;flex:1}
  .xy input{width:100%;flex:1}
  .hint{font-family:var(--mono);font-size:9.5px;color:var(--dim);line-height:1.55;padding:7px 16px 2px;white-space:pre-line}
  .p-actions{display:flex;gap:8px;padding:16px}
  .p-actions .btn{flex:1}
  .empty-panel{padding:44px 22px;text-align:center;color:var(--dim)}
  .empty-panel .big{color:var(--muted);font-size:13px;margin-bottom:8px;font-weight:500}
  .empty-panel .small{font-family:var(--mono);font-size:10.5px;line-height:1.7}

  /* spectrum editor */
  .spec-ed{padding:2px 16px 8px}
  .spec-ed canvas{
    width:100%;height:82px;display:block;border-radius:6px;border:1px solid var(--line);
    background:#0C1015;cursor:crosshair;touch-action:none
  }
  .spec-ed .foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
  .spec-ed .foot .lbl{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.05em}
  .swatch{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);flex:0 0 auto}

  /* sensor readout */
  .readout{margin:2px 16px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0C1015}
  .readout canvas{display:block;width:100%;height:86px}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
  .rcell{padding:9px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .rcell:nth-child(2n){border-right:none}
  .rcell .k{font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
  .rcell .v{font-family:var(--mono);font-size:14px;margin-top:3px;color:var(--txt)}
  .rcell .v small{font-size:9.5px;color:var(--muted);letter-spacing:.04em}

  /* ---------- status bar ---------- */
  #status{
    display:flex;align-items:center;gap:16px;padding:0 14px;background:#0C1014;
    border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--dim);
  }
  #status .k{color:var(--muted)}
  #status .dot{width:3px;height:3px;border-radius:50%;background:#2C3540}

  .toggle{
    position:relative;width:34px;height:19px;border-radius:10px;background:#242D37;border:1px solid var(--line);
    cursor:pointer;flex:0 0 auto;transition:background .18s
  }
  .toggle::after{
    content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
    background:#7C8896;transition:transform .18s,background .18s
  }
  .toggle.on{background:var(--accent-soft);border-color:rgba(255,122,47,.5)}
  .toggle.on::after{transform:translateX(15px);background:var(--accent)}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#222B35;border-radius:5px;border:2px solid var(--panel)}
  ::-webkit-scrollbar-thumb:hover{background:#2E3A46}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <path d="M13 3.2 22.2 20.2H3.8L13 3.2Z" stroke="#FF7A2F" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M1.2 13h7.4" stroke="#E8EDF4" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M20.4 8.6 25 5.4M21 12.6h4.6M20.4 16.6 25 19.8" stroke="#FF7A2F" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="name">Optical Bench</div>
        <div class="sub">spectral ray sandbox</div>
      </div>
    </div>
    <div class="tsep"></div>
    <div class="ctl">
      <label>Exposure</label>
      <input type="range" id="exposure" min="0.15" max="5" step="0.05" value="1">
      <div class="val" id="exposureVal">1.00</div>
    </div>
    <div class="ctl">
      <label>Quality</label>
      <select id="quality">
        <option value="low">Low</option>
        <option value="med" selected>Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="ctl">
      <label>Grid</label>
      <div class="toggle on" id="gridToggle"></div>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost" id="resetScene">Reset bench</button>
    <button class="btn ghost danger" id="clearScene">Clear</button>
  </header>

  <main>
    <nav id="rail">
      <div class="rail-title">Sources</div>
      <button class="tool" data-add="flashlight" title="Flashlight — broad spectrum with adjustable divergence">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h5l3 3v2l-3 3H4z"/><path d="M16 9.5 20 8M17 12h4M16 14.5 20 16"/><path d="M4 6v12"/></svg>
        <span>Flash</span>
      </button>
      <button class="tool" data-add="laser" title="Laser — monochromatic, polarized">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="9" height="6" rx="1"/><path d="M12 12h9"/><path d="M15 9v6M18 9v6"/></svg>
        <span>Laser</span>
      </button>
      <div class="rail-title">Optics</div>
      <button class="tool" data-add="mirror" title="Mirror — flat or curved">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 19 5"/><path d="M7 20 20 7"/><path d="M6 12 9 15M10 8 13 11"/></svg>
        <span>Mirror</span>
      </button>
      <button class="tool" data-add="lens" title="Lens — convex / concave, set focal length">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3.2 2.6 4.6 5.6 4.6 9S15.2 18.4 12 21c-3.2-2.6-4.6-5.6-4.6-9S8.8 5.6 12 3Z"/><path d="M2 12h3M19 12h3"/></svg>
        <span>Lens</span>
      </button>
      <button class="tool" data-add="prism" title="Prism — dispersive, with internal reflection">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 21 20H3L12 4Z"/><path d="M2 13h6"/><path d="M17 15h5M17 17.5h5M17 12.5h5"/></svg>
        <span>Prism</span>
      </button>
      <button class="tool" data-add="grating" title="Diffraction grating — transmission or reflective">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v18"/><path d="M10 5v14M13 5v14M16 5v14M19 5v14"/><path d="M2 12h4"/></svg>
        <span>Grating</span>
      </button>
      <button class="tool" data-add="polarizer" title="Polarizer — linear, with extinction ratio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="1"/><path d="M8 8h8M8 11h8M8 14h8M8 17h8"/></svg>
        <span>Polar</span>
      </button>
      <button class="tool" data-add="glass" title="Colored glass — spectral filter with reflectance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="1"/><path d="M10 3v18M14 3v18" opacity=".55"/></svg>
        <span>Glass</span>
      </button>
      <button class="tool" data-add="blocker" title="Light blocker — opaque baffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="6" rx="1"/><path d="M6 9v6M9 9v6M12 9v6M15 9v6M18 9v6" opacity=".5"/></svg>
        <span>Block</span>
      </button>
      <div class="rail-title">Measure</div>
      <button class="tool" data-add="sensor" title="Sensor — spectral power meter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M7 15l2.5-4 2.5 3 2-5 2.5 6"/></svg>
        <span>Sensor</span>
      </button>
    </nav>

    <div id="stage">
      <canvas id="scene"></canvas>
      <div id="empty">
        <div class="big">The bench is empty</div>
        <div class="small">Add a source from the rail, then place optics in the beam.</div>
      </div>
    </div>

    <aside id="panel"></aside>
  </main>

  <footer id="status">
    <span><span class="k">rays</span> <span id="stRays">0</span></span>
    <div class="dot"></div>
    <span><span class="k">elements</span> <span id="stObjs">0</span></span>
    <div class="dot"></div>
    <span id="stSel">no selection</span>
    <div class="spacer"></div>
    <span>drag to move · drag the knob to rotate · wheel to zoom · R rotates · Del removes</span>
  </footer>
</div>

<script>
/* =====================================================================
   OPTICAL BENCH — 2D spectral ray tracer
   Physics: Sellmeier/Cauchy dispersion, exact Snell + Fresnel, Stokes /
   coherency-matrix polarization, grating equation (k-tangential
   conservation + blaze envelope), Planck blackbody spectra, Beer-Lambert
   absorption, CIE 1931 colour matching for spectral rendering.
   ===================================================================== */

/* ------------------------------ math ------------------------------ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const deg = r => r * 180 / Math.PI;
const rad = d => d * Math.PI / 180;
function halton(i, b) { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; }
function sinc(x) { return Math.abs(x) < 1e-9 ? 1 : Math.sin(x) / x; }

/* --------------------------- spectral colour --------------------------- */
const LAM_MIN = 380, LAM_MAX = 780, SRC_MIN = 390, SRC_MAX = 720;

function gauss(x, mu, s1, s2) {
  const s = x < mu ? s1 : s2;
  const t = (x - mu) / s;
  return Math.exp(-0.5 * t * t);
}
// Wyman et al. multi-lobe Gaussian fit to CIE 1931 2° CMFs
function cmf(wl) {
  const x = 1.056 * gauss(wl, 599.8, 37.9, 31.0) + 0.362 * gauss(wl, 442.0, 16.0, 26.7) - 0.065 * gauss(wl, 501.1, 20.4, 26.2);
  const y = 0.821 * gauss(wl, 568.8, 46.9, 40.5) + 0.286 * gauss(wl, 530.9, 16.3, 31.1);
  const z = 1.217 * gauss(wl, 437.0, 11.8, 36.0) + 0.681 * gauss(wl, 459.0, 26.0, 13.8);
  return [x, y, z];
}
function xyzToLinearRgb(x, y, z) {
  return [
    3.2406 * x - 1.5372 * y - 0.4986 * z,
    -0.9689 * x + 1.8758 * y + 0.0415 * z,
    0.0557 * x - 0.2040 * y + 1.0570 * z
  ];
}
// display colour per nanometre, white-balanced so equal radiant power across
// the visible renders as neutral white (illuminant E convention)
const SPEC_RGB = (() => {
  const n = LAM_MAX - LAM_MIN + 1;
  const lin = new Float64Array(n * 3);
  let sr = 0, sg = 0, sb = 0, cnt = 0;
  for (let i = 0; i < n; i++) {
    const wl = LAM_MIN + i;
    const c = xyzToLinearRgb(...cmf(wl));
    lin[i * 3] = Math.max(0, c[0]); lin[i * 3 + 1] = Math.max(0, c[1]); lin[i * 3 + 2] = Math.max(0, c[2]);
  }
  for (let wl = SRC_MIN; wl <= SRC_MAX; wl += 4) {
    const i = wl - LAM_MIN; sr += lin[i * 3]; sg += lin[i * 3 + 1]; sb += lin[i * 3 + 2]; cnt++;
  }
  const kr = cnt / (sr || 1), kg = cnt / (sg || 1), kb = cnt / (sb || 1);
  const out = new Float64Array(n * 3);
  for (let i = 0; i < n; i++) {
    out[i * 3] = Math.pow(clamp(lin[i * 3] * kr, 0, 1), 1 / 2.2);
    out[i * 3 + 1] = Math.pow(clamp(lin[i * 3 + 1] * kg, 0, 1), 1 / 2.2);
    out[i * 3 + 2] = Math.pow(clamp(lin[i * 3 + 2] * kb, 0, 1), 1 / 2.2);
  }
  return out;
})();
function specRGB(wl) {
  const i = clamp(Math.round(wl), LAM_MIN, LAM_MAX) - LAM_MIN;
  return [SPEC_RGB[i * 3], SPEC_RGB[i * 3 + 1], SPEC_RGB[i * 3 + 2]];
}
function wlCss(wl) {
  const c = specRGB(wl);
  return `rgb(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)})`;
}
// photopic luminous efficiency V(λ) (CIE 1924 analytic fit)
function vLambda(wl) {
  return 1.056 * gauss(wl, 559.0, 42.0, 60.0) + 0.362 * gauss(wl, 505.0, 18.0, 26.0) - 0.065 * gauss(wl, 530.0, 20.0, 26.0);
}

/* ------------------------- material models ------------------------- */
function sellmeier(B, C, wl) {
  const l2 = (wl / 1000) * (wl / 1000);
  let s = 1;
  for (let i = 0; i < 3; i++) s += B[i] * l2 / (l2 - C[i]);
  return Math.sqrt(Math.max(1, s));
}
const GLASSES = {
  bk7: { name: 'N-BK7 crown', sell: { B: [1.03961212, 0.231792344, 1.01046945], C: [0.00600069867, 0.0200179144, 103.560653] }, nd: 1.5168 },
  sf11: { name: 'N-SF11 flint', sell: { B: [1.73759695, 0.313747346, 1.89878101], C: [0.013188707, 0.0623068142, 155.23629] }, nd: 1.7847 },
  fsilica: { name: 'Fused silica', sell: { B: [0.6961663, 0.4079426, 0.8974794], C: [0.00467914826, 0.0135120631, 97.9340025] }, nd: 1.4585 },
  sapphire: { name: 'Sapphire', sell: { B: [1.4313493, 0.65054713, 5.3414021], C: [0.0052799261, 0.0142382647, 325.017834] }, nd: 1.7682 },
  water: { name: 'Water', cauchy: [1.324, 0.0032, 0], nd: 1.333 },
  diamond: { name: 'Diamond', cauchy: [2.385, 0.0128, 0], nd: 2.417 },
  acrylic: { name: 'Acrylic', cauchy: [1.485, 0.0040, 0], nd: 1.491 }
};
function glassN(key, wl) {
  const g = GLASSES[key] || GLASSES.bk7;
  if (g.sell) return sellmeier(g.sell.B, g.sell.C, wl);
  const [A, B, C] = g.cauchy;
  const l2 = (wl / 1000) * (wl / 1000);
  return A + B / l2 + C / (l2 * l2);
}
const METALS = {
  aluminum: { name: 'Aluminium', pts: [[380, .92], [420, .92], [480, .91], [550, .91], [620, .91], [700, .91], [780, .92]] },
  silver: { name: 'Silver', pts: [[380, .93], [420, .96], [480, .98], [550, .98], [620, .98], [700, .98], [780, .99]] },
  gold: { name: 'Gold', pts: [[380, .30], [420, .38], [480, .55], [520, .66], [560, .80], [600, .89], [650, .95], [700, .97], [780, .98]] },

// every element exposes boundary surfaces; a surface is flat (a→b) or a

function arcFromPole(obj, px, py, ox, oy, R, halfW, role, extra) {

  const cx = px - ox * R, cy = py - oy * R;
  const phi = Math.atan2(oy, ox) + (R > 0 ? 0 : Math.PI);
  const alpha = Math.asin(clamp(halfW / rr, 0, 0.999));
  return surfArc(obj, cx, cy, rr, phi - alpha, 2 * alpha, role, extra);
}

function surfacesOf(o) {
  const R = rad(o.rot), cs = Math.cos(R), sn = Math.sin(R);
  const T = (lx, ly) => ({ x: o.x + lx * cs - ly * sn, y: o.y + lx * sn + ly * cs });

    case 'mirror': {

      if (Math.abs(P.curvature) < 2) {
        const a = T(-w, 0), b = T(w, 0);
        out.push(surfSeg(o, a.x, a.y, b.x, b.y, 'mirror'));
      } else {

        // R > 0 : concave  (centre of curvature on the reflective side)
        // R < 0 : convex
        const rr = Math.abs(P.curvature);
        const sgn = P.curvature > 0 ? 1 : -1;
        const hw = Math.min(w, rr * 0.98);
        const phi = sgn > 0 ? Math.PI / 2 : -Math.PI / 2;
        const alpha = Math.asin(clamp(hw / rr, 0, 0.999));
        const loc = surfArc(o, 0, -sgn * rr, rr, phi - alpha, 2 * alpha, 'mirror');
        const c = T(loc.cx, loc.cy), a = T(loc.ax, loc.ay), b = T(loc.bx, loc.by);

      Rr = clamp(Rr, D * 1.02, 6000);
      const sgn = P.shape.includes('concave') ? -1 : 1;
      const sag = Rr - Math.sqrt(Math.max(0, Rr * Rr - D * D));
      const t = sgn > 0 ? 2 * sag : Math.max(1.2, P.diameter * 0.05);
      const half = t / 2;

      const r2 = P.shape.startsWith('plano') ? Infinity : (sgn > 0 ? Rr : -Rr);
      const rotArc = (s) => {
        const f = (x, y) => T(x, y);
        const c = f(s.cx, s.cy), a = f(s.ax, s.ay), b = f(s.bx, s.by);

        const ccx = polex - ox * r1, ccy = poley - oy * r1;
        const phi = Math.atan2(oy, ox) + (r1 > 0 ? 0 : Math.PI);
        const alpha = Math.asin(clamp(D / rr, 0, 0.999));
        out.push(rotArc(surfArc(o, ccx, ccy, rr, phi - alpha, 2 * alpha, 'dielectric')));
      }
      if (r2 === Infinity) {
        const a = T(half, -D), b = T(half, D);
        out.push(surfSeg(o, a.x, a.y, b.x, b.y, 'dielectric'));
      } else {
        const rr = Math.abs(r2);
        const polex = half, poley = 0, ox = 1, oy = 0;
        const ccx = polex - ox * r2, ccy = poley - oy * r2;
        const phi = Math.atan2(oy, ox) + (r2 > 0 ? 0 : Math.PI);
        const alpha = Math.asin(clamp(D / rr, 0, 0.999));
        out.push(rotArc(surfArc(o, ccx, ccy, rr, phi - alpha, 2 * alpha, 'dielectric')));
      }

      const rr2 = Math.abs(r1), rr3 = Math.abs(r2);

      const e2x = r2 === Infinity ? half : half + (r2 > 0 ? -(rr3 - rr3 * Math.cos(Math.asin(clamp(D / rr3, 0, .999)))) : (rr3 - rr3 * Math.cos(Math.asin(clamp(D / rr3, 0, .999)))));

        out.push(surfSeg(o, a.x, a.y, b.x, b.y, 'dielectric'));
        a = T(e1x, D); b = T(e2x, D);
        out.push(surfSeg(o, a.x, a.y, b.x, b.y, 'dielectric'));

    }

      const p0 = { x: 0, y: 0 };

      const p2 = { x: -L * Math.sin(A / 2), y: L * Math.cos(A / 2) };

      const pts = [p0, p1, p2].map(q => T(q.x - gc.x, q.y - gc.y));

      const w = P.width / 2, h = P.height / 2;
      const c = [T(-w, -h), T(w, -h), T(w, h), T(-w, h)];
      for (let i = 0; i < 4; i++) {
        const a = c[i], b = c[(i + 1) % 4];
        out.push(surfSeg(o, a.x, a.y, b.x, b.y, 'dielectric'));
      }
      break;
    }
    case 'polarizer':
    case 'grating':
    case 'blocker':
    case 'sensor': {
      const w = P.width / 2;

      const role = o.type;

        for (let i = 0; i < 4; i++) out.push(surfSeg(o, c[i].x, c[i].y, c[(i + 1) % 4].x, c[(i + 1) % 4].y, 'blocker'));
      } else {
        const a = T(-w, 0), b = T(w, 0);
        out.push(surfSeg(o, a.x, a.y, b.x, b.y, role));
      }

    }
  }

}

function allSurfaces() {
  const l = [];
  for (const o of objects) { const s = surfacesOf(o); for (const q of s) l.push(q); }

}

/* --------------------------- intersection --------------------------- */
function intersectSeg(r, s) {
  const ex = s.bx - s.ax, ey = s.by - s.ay;
  const den = r.dx * ey - r.dy * ex;
  if (Math.abs(den) < 1e-9) return null;
  const wx = s.ax - r.x, wy = s.ay - r.y;
  const t = (wx * ey - wy * ex) / den;
  if (t < 1e-4) return null;
  const u = (wx * r.dy - wy * r.dx) / den;
  if (u < -0.0005 || u > 1.0005) return null;
  const L = Math.hypot(ex, ey) || 1;
  let nx = -ey / L, ny = ex / L;
  if (nx * r.dx + ny * r.dy > 0) { nx = -nx; ny = -ny; }
  return { t, x: r.x + r.dx * t, y: r.y + r.dy * t, nx, ny, surf: s };

function normAng(a) { while (a > Math.PI) a -= TAU; while (a <= -Math.PI) a += TAU; return a; }

  const c = fx * fx + fy * fy - s.r * s.r;
  const disc = b * b - c;
  if (disc < 0) return null;
  const sq = Math.sqrt(disc);
  let t = -b - sq;
  if (t < 1e-4) t = -b + sq;
  if (t < 1e-4) return null;
  const x = r.x + r.dx * t, y = r.y + r.dy * t;
  const ang = Math.atan2(y - s.cy, x - s.cx);
  const d = normAng(ang - s.a0);
  if (s.sw > 0) { if (d < -0.002 || d > s.sw + 0.002) return null; }
  else { if (d > 0.002 || d < s.sw - 0.002) return null; }
  let nx = (x - s.cx) / s.r, ny = (y - s.cy) / s.r;
  if (nx * r.dx + ny * r.dy > 0) { nx = -nx; ny = -ny; }
  return { t, x, y, nx, ny, surf: s };

/* ---------------------------- polarization ----------------------------
   Each ray carries a Stokes vector (I,Q,U,V) in the basis

  return [Q * c - U * s, Q * s + U * c, V];

  const [q, u, v] = rotStokes(Q, U, V, dd);
  return {
    x: parent.x + dx * 0.03, y: parent.y + dy * 0.03,
    dx, dy, wl: parent.wl, I, Q: q, U: u, V: v,
    inObj: meta && meta.inObj !== undefined ? meta.inObj : parent.inObj,
    ix: meta && meta.ix !== undefined ? meta.ix : parent.ix,
    iy: meta && meta.iy !== undefined ? meta.iy : parent.iy

function fresnel(n1, n2, cosi) {

  if (s2 >= 1) return null;
  const cost = Math.sqrt(1 - s2);
  const rs = (n1 * cosi - n2 * cost) / (n1 * cosi + n2 * cost);
  const rp = (n1 * cost - n2 * cosi) / (n1 * cost + n2 * cosi);
  return { Rs: rs * rs, Rp: rp * rp, cost, s2 };

function interact(r, hit) {

        const dy = r.dy - 2 * (r.dx * hit.nx + r.dy * hit.ny) * hit.ny;

    }
    case 'sensor': {
      const cos = Math.abs(r.dx * hit.nx + r.dy * hit.ny);
      const e = r.I * cos;

      o.hist[bin] += e;
      o.total += e;

    }

    acc += 0.5 * (specVal(points, l0) + specVal(points, l1)) * (l1 - l0);
    cdf[i + 1] = acc;
  }

}

/* -------------------------------- tracing -------------------------------- */
const MAX_DEPTH = 16, MIN_I = 0.0035, MAX_DIST = 5200;
let rayCount = 0;

function drawSeg(g, r, t) {
  const c = specRGB(r.wl);
  const a = clamp(r.I * state.exposure, 0, 1.6);
  if (a < 0.0025) return;
  g.strokeStyle = `rgb(${Math.min(255, (c[0] * a * 255) | 0)},${Math.min(255, (c[1] * a * 255) | 0)},${Math.min(255, (c[2] * a * 255) | 0)})`;

  g.lineTo(r.x + r.dx * t, r.y + r.dy * t);
  g.stroke();
}

function traceScene(g) {
  const q = QUAL[state.quality];
  const surfs = allSurfaces();
  let rays = [];
  for (const o of objects) {
    if (o.type === 'flashlight') rays = rays.concat(emitFlashlight(o, q));
    else if (o.type === 'laser') rays = rays.concat(emitLaser(o, q));
  }
  for (const o of objects) if (o.type === 'sensor') {
    for (let i = 0; i < o.hist.length; i++) o.hist[i] *= 0.82;
    o.total *= 0.82;
  }
  g.lineCap = 'round';
  g.lineWidth = 1.35;
  rayCount = 0;
  for (let depth = 0; depth < MAX_DEPTH && rays.length; depth++) {
    const next = [];
    for (const r of rays) {
      if (r.I < MIN_I) continue;
      rayCount++;

      for (let i = 0; i < surfs.length; i++) {
        const h = intersect(r, surfs[i]);
        if (h && (!best || h.t < best.t)) best = h;
      }
      if (!best) { drawSeg(g, r, MAX_DIST); continue; }
      drawSeg(g, r, best.t);
      const produced = interact(r, best);
      for (const nr of produced) if (nr.I > MIN_I) next.push(nr);
    }
    rays = next;
    if (rays.length > 9000) rays.length = 9000;
  }
}

  return { x0: x0 - 6, y0: y0 - 6, x1: x1 + 6, y1: y1 + 6 };
}

/* ------------------------------- picking ------------------------------- */
function distToObj(o, wx, wy) {
  if (o.type === 'flashlight' || o.type === 'laser') return Math.hypot(wx - o.x, wy - o.y);
  let best = 1e9;
  for (const s of surfacesOf(o)) {
    const n = 12;
    for (let i = 0; i < n; i++) {
      let ax, ay, bx, by;
      if (s.kind === 'arc') {
        ax = s.cx + s.r * Math.cos(s.a0 + s.sw * i / n); ay = s.cy + s.r * Math.sin(s.a0 + s.sw * i / n);
        bx = s.cx + s.r * Math.cos(s.a0 + s.sw * (i + 1) / n); by = s.cy + s.r * Math.sin(s.a0 + s.sw * (i + 1) / n);
      } else {
        ax = s.ax; ay = s.ay; bx = s.bx; by = s.by;
      }
      const ex = bx - ax, ey = by - ay;
      const L2 = ex * ex + ey * ey || 1;
      const t = clamp(((wx - ax) * ex + (wy - ay) * ey) / L2, 0, 1);
      const d = Math.hypot(wx - (ax + ex * t), wy - (ay + ey * t));
      if (d < best) best = d;
    }
  }
  return best;
}
function pick(wx, wy) {
  for (let i = objects.length - 1; i >= 0; i--) {
    const o = objects[i];
    if (distToObj(o, wx, wy) < 15 / state.cam.zoom) return o;
  }
  return null;
}

/* ------------------------------ main loop ------------------------------ */
function frame() {
  const w = cv.width / DPR, h = cv.height / DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#080A0D';
  ctx.fillRect(0, 0, w, h);

  if (state.grid) drawGrid(ctx, w, h);

  // beams
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bctx.clearRect(0, 0, w, h);
  bctx.save();
  bctx.translate(state.cam.x, state.cam.y);
  bctx.scale(state.cam.zoom, state.cam.zoom);
  bctx.globalCompositeOperation = 'lighter';
  traceScene(bctx);
  bctx.restore();

  ctx.save();
  ctx.translate(state.cam.x, state.cam.y);
  ctx.scale(state.cam.zoom, state.cam.zoom);
  for (const o of objects) drawObject(ctx, o, o.id === state.selected);
  ctx.restore();

  // glow + core
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  try {
    ctx.filter = 'blur(5px)';
    ctx.globalAlpha = 0.5;
    ctx.drawImage(beam, 0, 0, w, h);
    ctx.filter = 'none';
    ctx.globalAlpha = 1;
  } catch (e) { ctx.globalAlpha = 1; }
  ctx.drawImage(beam, 0, 0, w, h);
  ctx.restore();

  document.getElementById('stRays').textContent = rayCount.toLocaleString();
  document.getElementById('stObjs').textContent = objects.length;
  document.getElementById('empty').style.display = objects.length ? 'none' : 'flex';
  if (sensorCanvas) drawSensorReadout();
  requestAnimationFrame(frame);
}

/* spectrum editor ------------------------------------------------------- */
function makeSpectrumEditor(points, onChange, opts) {
  opts = opts || {};
  const wrap = el('div', 'spec-ed');
  const c = document.createElement('canvas');
  const W = 280, H = 82;
  c.width = W * 2; c.height = H * 2;
  const g = c.getContext('2d');
  g.scale(2, 2);
  wrap.appendChild(c);
  const foot = el('div', 'foot');
  const lbl = el('div', 'lbl', opts.hint || 'drag points · right-click removes');
  foot.appendChild(lbl);
  wrap.appendChild(foot);

  let drag = -1;
  const pos = e => {
    const r = c.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * W,
      y: (e.clientY - r.top) / r.height * H
    };
  };
  const xToLam = x => LAM_MIN + clamp(x, 0, W) / W * (LAM_MAX - LAM_MIN);
  const yToVal = y => clamp(1 - y / H, 0, 1);
  const lamToX = l => (l - LAM_MIN) / (LAM_MAX - LAM_MIN) * W;

  function draw() {
    g.clearRect(0, 0, W, H);
    for (let x = 0; x < W; x += 2) {
      g.fillStyle = wlCss(LAM_MIN + x / W * (LAM_MAX - LAM_MIN));
      g.globalAlpha = 0.22;
      g.fillRect(x, H - 9, 2, 9);
      g.globalAlpha = 1;
    }
    g.strokeStyle = '#1A2129';
    for (let i = 1; i < 4; i++) {
      g.beginPath(); g.moveTo(0, H * i / 4); g.lineTo(W, H * i / 4); g.stroke();
      g.beginPath(); g.moveTo(W * i / 4, 0); g.lineTo(W * i / 4, H); g.stroke();
    }
    // curve
    const pts = points.slice().sort((a, b) => a[0] - b[0]);
    g.beginPath();
    for (let x = 0; x <= W; x += 2) {
      const v = specVal(pts, xToLam(x));
      const y = H - 9 - v * (H - 14);
      if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.lineTo(W, H - 9); g.lineTo(0, H - 9); g.closePath();
    g.fillStyle = 'rgba(255,122,47,.14)';
    g.fill();
    g.beginPath();
    for (let x = 0; x <= W; x += 2) {
      const v = specVal(pts, xToLam(x));
      const y = H - 9 - v * (H - 14);
      if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.strokeStyle = '#FF9B5C'; g.lineWidth = 1.6; g.stroke();
    for (let i = 0; i < points.length; i++) {
      const px = lamToX(points[i][0]), py = H - 9 - points[i][1] * (H - 14);
      g.beginPath(); g.arc(px, py, i === drag ? 4.6 : 3.4, 0, TAU);
      g.fillStyle = i === drag ? '#FFD9BE' : '#FF9B5C'; g.fill();
      g.strokeStyle = '#0C1015'; g.lineWidth = 1.2; g.stroke();
    }
    g.fillStyle = 'rgba(150,168,190,.55)';
    g.font = '8px "IBM Plex Mono", monospace';
    g.fillText('380', 2, H - 11);
    g.fillText('580', W / 2 - 6, H - 11);
    g.fillText('780 nm', W - 32, H - 11);
  }
  const nearest = p => {
    let bi = -1, bd = 12;
    for (let i = 0; i < points.length; i++) {
      const px = lamToX(points[i][0]), py = H - 9 - points[i][1] * (H - 14);
      const d = Math.hypot(px - p.x, py - p.y);
      if (d < bd) { bd = d; bi = i; }
    }
    return bi;
  };
  c.addEventListener('pointerdown', e => {
    const p = pos(e);
    if (e.button === 2) {
      const i = nearest(p);
      if (i >= 0 && points.length > 2) { points.splice(i, 1); onChange(); draw(); }
      return;
    }
    let i = nearest(p);
    if (i < 0 && e.altKey) {
      points.push([xToLam(p.x), yToVal(p.y)]);
      points.sort((a, b) => a[0] - b[0]);
      i = nearest(p);
    }
    drag = i;
    c.setPointerCapture(e.pointerId);
    draw();
  });
  c.addEventListener('pointermove', e => {
    if (drag < 0 || drag >= points.length) return;
    const p = pos(e);
    let lo = LAM_MIN, hi = LAM_MAX;
    if (drag > 0) lo = points[drag - 1][0] + 2;
    if (drag < points.length - 1) hi = points[drag + 1][0] - 2;
    points[drag] = [clamp(xToLam(p.x), lo, hi), yToVal(p.y)];
    onChange();
    draw();
  });
  c.addEventListener('pointerup', e => { drag = -1; draw(); });
  c.addEventListener('contextmenu', e => e.preventDefault());
  draw();
  return { el: wrap, draw };
}

    const c3 = el('div', 'rcell'); c3.appendChild(el('div', 'k', 'Luminous flux')); const v3 = el('div', 'v'); c3.appendChild(v3);
    const c4 = el('div', 'rcell'); c4.appendChild(el('div', 'k', 'Colour')); const v4 = el('div', 'v'); c4.appendChild(v4);
    grid.appendChild(c1); grid.appendChild(c2); grid.appendChild(c3); grid.appendChild(c4);
    rd.appendChild(grid);
    s3.appendChild(rd);
    body.appendChild(s3);
    body.appendChild(el('div', 'hint', 'Bars are the incident spectrum weighted by\nthe cosine of incidence. Flux uses the CIE\nphotopic curve, Km = 683 lm/W.'));
    sensorCanvas = sc; sensorObj = o;
    o._cells = { v1, v2, v3, v4 };
  }

  const act = el('div', 'p-actions');
  const dup = el('button', 'btn', 'Duplicate');
  dup.addEventListener('click', () => {
    const c = JSON.parse(JSON.stringify(o));
    c.id = uid(); c.x += 34; c.y += 34;
    c.hist = new Float64Array(48); c.total = 0;
    objects.push(attachPhysics(c));
    state.selected = c.id;
    buildPanel();
  });
  const del = el('button', 'btn danger', 'Delete');
  del.addEventListener('click', () => {
    objects = objects.filter(x => x.id !== o.id);
    state.selected = null;
    buildPanel();
  });
  act.appendChild(dup); act.appendChild(del);
  body.appendChild(act);
  panel.appendChild(body);
}

function drawSensorReadout() {
  const o = sensorObj;
  if (!o || !sensorCanvas) return;
  const g = sensorCanvas.getContext('2d');
  const W = sensorCanvas.width, H = sensorCanvas.height;
  g.clearRect(0, 0, W, H);
  g.fillStyle = '#0C1015'; g.fillRect(0, 0, W, H);
  const n = 48;
  let max = 1e-6;
  for (let i = 0; i < n; i++) max = Math.max(max, o.hist[i]);
  const bw = W / n;
  for (let i = 0; i < n; i++) {
    const h = (o.hist[i] / max) * (H - 26);
    g.fillStyle = wlCss(LAM_MIN + (LAM_MAX - LAM_MIN) * (i + .5) / n);
    g.fillRect(i * bw + 1, H - 22 - h, bw - 2, h);
    g.fillStyle = 'rgba(255,255,255,.05)';
    g.fillRect(i * bw + 1, H - 22, bw - 2, 3);
  }
  g.fillStyle = 'rgba(140,160,182,.6)';
  g.font = '500 17px "IBM Plex Mono", monospace';
  for (const wl of [400, 500, 600, 700]) {
    const x = (wl - LAM_MIN) / (LAM_MAX - LAM_MIN) * W;
    g.fillText(String(wl), clamp(x - 12, 2, W - 30), H - 5);
  }
  if (!o._cells) return;
  const lum = 683 * (() => {
    let s = 0;
    for (let i = 0; i < n; i++) {
      const wl = LAM_MIN + (LAM_MAX - LAM_MIN) * (i + .5) / n;
      s += o.hist[i] * vLambda(wl);
    }
    return s;
  })();
  let r = 0, gg = 0, b = 0, tot = 0, peakI = 0, peakV = 0;
  for (let i = 0; i < n; i++) {
    const wl = LAM_MIN + (LAM_MAX - LAM_MIN) * (i + .5) / n;
    const v = o.hist[i], c = specRGB(wl);
    r += c[0] * v; gg += c[1] * v; b += c[2] * v; tot += v;
    if (v > peakV) { peakV = v; peakI = wl; }
  }
  const m = Math.max(r, gg, b, 1e-6);
  o._cells.v1.innerHTML = `${o.total.toFixed(2)} <small>rel.</small>`;
  o._cells.v2.innerHTML = o.total > 0.001 ? `${peakI.toFixed(0)} <small>nm</small>` : '—';
  o._cells.v3.innerHTML = o.total > 0.001 ? `${(lum * 40).toFixed(1)} <small>lm</small>` : '—';
  o._cells.v4.innerHTML = `<span style="display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;background:${o.total > 0.001 ? `rgb(${Math.round(r / m * 255)},${Math.round(gg / m * 255)},${Math.round(b / m * 255)})` : '#1A2029'}"></span>`;
}

const TITLE = {
  flashlight: 'Flashlight', laser: 'Laser', mirror: 'Mirror', lens: 'Lens', prism: 'Prism',
  polarizer: 'Polarizer', grating: 'Diffraction grating', glass: 'Colored glass',
  blocker: 'Light blocker', sensor: 'Sensor'
};

/* ------------------------------ mouse ------------------------------ */
let panning = false, panStart = null, camStart = null;
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const w = toWorld(px, py);
  const o = objects.find(x => x.id === state.selected);
  // rotation handle
  if (o) {
    const R = rad(o.rot), cs = Math.cos(R), sn = Math.sin(R);
    const b = bboxOf(o);
    const hx = o.x + 0 * cs - (b.y0 - 30) * sn, hy = o.y + 0 * sn + (b.y0 - 30) * cs;
    if (Math.hypot(w.x - hx, w.y - hy) < 12 / state.cam.zoom) {
      state.drag = { mode: 'rotate', obj: o, start: Math.atan2(w.y - o.y, w.x - o.x), r0: o.rot };
      cv.setPointerCapture(e.pointerId);
      return;
    }
  }
  const hit = pick(w.x, w.y);
  if (hit) {
    state.selected = hit.id;
    state.drag = { mode: 'move', obj: hit, dx: w.x - hit.x, dy: w.y - hit.y };
    buildPanel();
    cv.setPointerCapture(e.pointerId);
  } else {
    state.selected = null;
    buildPanel();
    panning = true;
    panStart = { x: e.clientX, y: e.clientY };
    camStart = { x: state.cam.x, y: state.cam.y };
    cv.setPointerCapture(e.pointerId);
    cv.style.cursor = 'grabbing';
  }
});
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  const w = toWorld(e.clientX - r.left, e.clientY - r.top);
  if (state.drag) {
    const o = state.drag.obj;
    if (state.drag.mode === 'move') { o.x = w.x - state.drag.dx; o.y = w.y - state.drag.dy; }
    else {
      const a = Math.atan2(w.y - o.y, w.x - o.x);
      o.rot = state.drag.r0 + deg(a - state.drag.start);
    }
    return;
  }
  if (panning) {
    state.cam.x = camStart.x + (e.clientX - panStart.x);
    state.cam.y = camStart.y + (e.clientY - panStart.y);
    return;
  }
  cv.style.cursor = pick(w.x, w.y) ? 'move' : 'crosshair';
});
function endDrag(e) {
  if (state.drag) {
    state.drag = null;
    buildPanel();
  }
  if (panning) { panning = false; cv.style.cursor = 'crosshair'; }
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const before = toWorld(px, py);
  const f = Math.exp(-e.deltaY * 0.0015);
  state.cam.zoom = clamp(state.cam.zoom * f, 0.25, 4);
  state.cam.x = px - before.x * state.cam.zoom;
  state.cam.y = py - before.y * state.cam.zoom;
}, { passive: false });

window.addEventListener('keydown', e => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'SELECT') return;
  const o = objects.find(x => x.id === state.selected);
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (o) { objects = objects.filter(x => x.id !== o.id); state.selected = null; buildPanel(); }
    e.preventDefault();
  } else if (e.key === 'r' || e.key === 'R') {
    if (o) { o.rot += e.shiftKey ? -15 : 15; buildPanel(); }
  } else if (e.key === 'd' || e.key === 'D') {
    if (o) {
      const c = JSON.parse(JSON.stringify(o));
      c.id = uid(); c.x += 34; c.y += 34; c.hist = new Float64Array(48); c.total = 0;
      objects.push(attachPhysics(c)); state.selected = c.id; buildPanel();
    }
  } else if (e.key === 'Escape') { state.selected = null; buildPanel(); }
});

/* ------------------------------ controls ------------------------------ */
document.getElementById('exposure').addEventListener('input', e => {
  state.exposure = +e.target.value;
  document.getElementById('exposureVal').textContent = state.exposure.toFixed(2);
});
document.getElementById('quality').addEventListener('change', e => {
  state.quality = e.target.value;
});
document.getElementById('gridToggle').addEventListener('click', e => {
  state.grid = !state.grid;
  e.currentTarget.classList.toggle('on', state.grid);
});
document.getElementById('resetScene').addEventListener('click', () => {
  defaultScene(); buildPanel();
  state.cam = { x: 0, y: 0, zoom: 1 };
});
document.getElementById('clearScene').addEventListener('click', () => {
  emptyScene(); buildPanel();
});
document.querySelectorAll('.tool').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.dataset.add;
    const w = cv.width / DPR, h = cv.height / DPR;
    const c = toWorld(w / 2, h / 2);
    const o = makeObj(type, c.x, c.y, 0);
    if (type === 'sensor') o.rot = 0;
    objects.push(o);
    state.selected = o.id;
    buildPanel();
  });
});

/* ------------------------------ boot ------------------------------ */
defaultScene();
resize();
buildPanel();
requestAnimationFrame(frame);
</script>
