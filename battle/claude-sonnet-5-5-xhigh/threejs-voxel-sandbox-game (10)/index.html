<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockhaven – Voxel Sandbox</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%236b4a2b%27/%3E%3Crect width=%2716%27 height=%275%27 fill=%27%234fa63c%27/%3E%3Crect x=%274%27 y=%278%27 width=%272%27 height=%272%27 fill=%27%23543a21%27/%3E%3Crect x=%2710%27 y=%2711%27 width=%272%27 height=%272%27 fill=%27%23543a21%27/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <!-- full-screen effects -->
      <div id="fx-water" class="fx"></div>
      <div id="fx-lava" class="fx"></div>
      <div id="fx-hurt" class="fx"></div>
      <div id="fx-black" class="fx"></div>

      <!-- in-game HUD -->
      <div id="hud" class="hidden">
        <div id="crosshair"></div>
        <div id="status">
          <div id="item-name"></div>
          <div id="bars">
            <div id="hearts" class="bar"></div>
            <div id="hunger" class="bar"></div>
          </div>
          <div id="air" class="bar"></div>
          <div id="hotbar"></div>
        </div>
        <div id="toasts"></div>
        <div id="debug" class="hidden"></div>
        <div id="fps" class="hidden"></div>
        <div id="hint"></div>
      </div>

      <!-- title screen -->
      <section id="screen-menu" class="screen center">
        <div class="menu-col">
          <h1 class="logo"><span>BLOCK</span><span class="g">HAVEN</span></h1>
          <div class="btn-stack">
            <button class="btn primary" data-act="play">Play</button>
            <button class="btn" data-act="settings">Settings</button>
            <button class="btn" data-act="controls">How to Play</button>
          </div>
        </div>
      </section>

      <!-- world select -->
      <section id="screen-worlds" class="screen center hidden">
        <div class="panel wide">
          <div class="panel-head"><h2>Select World</h2></div>
          <div id="world-list" class="world-list"></div>
          <div class="panel-foot">
            <button class="btn" data-act="back-menu">Back</button>
            <button class="btn primary" data-act="new-world">Create New World</button>
          </div>
        </div>
      </section>

      <!-- create world -->
      <section id="screen-create" class="screen center hidden">
        <div class="panel">
          <div class="panel-head"><h2>New World</h2></div>
          <label class="field"><span>World name</span><input id="cw-name" type="text" maxlength="28" value="New World" autocomplete="off" /></label>
          <label class="field"><span>Seed</span><input id="cw-seed" type="text" maxlength="32" placeholder="Leave empty for random" autocomplete="off" /></label>
          <div class="field"><span>Game mode</span>
            <div class="seg" id="cw-mode">
              <button class="seg-btn active" data-v="survival">Survival</button>
              <button class="seg-btn" data-v="creative">Creative</button>
            </div>
            <small id="cw-mode-desc"></small>
          </div>
          <label class="check"><input id="cw-hostile" type="checkbox" checked /><span class="box"></span><span>Hostile mobs</span></label>
          <div class="panel-foot">
            <button class="btn" data-act="cancel-create">Cancel</button>
            <button class="btn primary" data-act="create-world">Create World</button>
          </div>
        </div>
      </section>

      <!-- settings -->
      <section id="screen-settings" class="screen center hidden">
        <div class="panel">
          <div class="panel-head"><h2>Settings</h2></div>
          <div id="settings-body" class="settings-body"></div>
          <div class="panel-foot"><button class="btn primary" data-act="close-settings">Done</button></div>
        </div>
      </section>

      <!-- controls -->
      <section id="screen-controls" class="screen center hidden">
        <div class="panel wide">
          <div class="panel-head"><h2>How to Play</h2></div>
          <div class="controls-grid" id="controls-grid"></div>
          <div class="panel-foot"><button class="btn primary" data-act="close-controls">Got it</button></div>
        </div>
      </section>

      <!-- pause -->
      <section id="screen-pause" class="screen center hidden">
        <div class="menu-col">
          <h2 class="pause-title">Game Paused</h2>
          <div id="pause-sub" class="pause-sub"></div>
          <div class="btn-stack">
            <button class="btn primary" data-act="resume">Resume</button>
            <button class="btn" data-act="achievements">Achievements <span id="adv-count" class="pill"></span></button>
            <button class="btn" data-act="settings">Settings</button>
            <button class="btn" data-act="controls">Controls</button>
            <button class="btn danger" data-act="quit">Save &amp; Quit</button>
          </div>
        </div>
      </section>

      <!-- achievements -->
      <section id="screen-adv" class="screen center hidden">
        <div class="panel wide">
          <div class="panel-head"><h2>Achievements</h2><span id="adv-summary" class="muted"></span></div>
          <div id="adv-list" class="adv-list"></div>
          <div id="adv-stats" class="adv-stats"></div>
          <div class="panel-foot"><button class="btn primary" data-act="close-adv">Back</button></div>
        </div>
      </section>

      <!-- death -->
      <section id="screen-death" class="screen center hidden">
        <div class="menu-col">
          <h2 class="death-title">You Died</h2>
          <div id="death-cause" class="pause-sub"></div>
          <div class="btn-stack">
            <button class="btn primary" data-act="respawn">Respawn</button>
            <button class="btn" data-act="quit">Save &amp; Quit</button>
          </div>
        </div>
      </section>

      <!-- loading -->
      <section id="screen-loading" class="screen center hidden">
        <div class="menu-col loading">
          <div id="loading-title" class="loading-title">Generating world</div>
          <div class="progress"><div id="loading-bar"></div></div>
          <div id="loading-tip" class="loading-tip"></div>
        </div>
      </section>

      <!-- inventory / crafting / furnace / chest -->
      <section id="screen-container" class="screen center hidden">
        <div id="container-window" class="window"></div>
      </section>

      <div id="tooltip" class="hidden"></div>
      <div id="cursor-item" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
