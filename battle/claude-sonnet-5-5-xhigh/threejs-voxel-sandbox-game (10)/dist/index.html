ot.out{width:58px;height:58px;background:#ffdc7814;border-color:#ffd25a66}.slot.dim .icon{opacity:.4}.craft-row{display:flex;align-items:center;gap:14px}.arrow{width:34px;height:22px;position:relative}.arrow:before{content:"";position:absolute;left:0;top:8px;width:22px;height:6px;background:#ffffff59;border-radius:3px}.arrow:after{content:"";position:absolute;right:2px;top:1px;border:10px solid transparent;border-left:14px solid rgba(255,255,255,.35);border-right:0}.arrow .fill{position:absolute;left:0;top:8px;height:6px;background:var(--accent-l);border-radius:3px;width:0;z-index:1}.flame{width:24px;height:24px;position:relative;background:#00000059;border-radius:4px;overflow:hidden}.flame i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#ffd34d,#ff6a1a)}.furnace-col{display:flex;flex-direction:column;align-items:center;gap:8px}.sep{height:1px;background:#ffffff1a;margin:2px 0}.recipes{display:flex;flex-direction:column;gap:6px;min-height:0}.recipes .grid{grid-template-columns:repeat(4,40px);gap:3px;overflow-y:auto;max-height:240px;padding-right:3px}.rslot{position:relative;width:40px;height:40px;border-radius:4px;background:#0000004d;border:2px solid rgba(255,255,255,.06);cursor:pointer}.rslot .icon{width:28px;height:28px}.rslot.can{background:#6fcf5a2e;border-color:#6fcf5a99}.rslot:not(.can) .icon{opacity:.38}.rslot:hover{border-color:#fff}.rslot .cnt{font-size:10px;right:2px}.tabs{display:flex;gap:4px}.tab{flex:1;height:32px;border-radius:6px 6px 0 0;border:1px solid var(--border);border-bottom:none;background:#00000040;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer}.tab.active{background:#ffffff24;color:#fff}.search{height:32px;border-radius:6px;border:1px solid var(--border);background:#00000059;color:#fff;padding:0 10px;font-size:14px;outline:none;width:150px;-webkit-user-select:text;user-select:text}.palette{overflow-y:auto;max-height:232px;padding:4px;border-radius:6px;background:#00000038}.trash{width:var(--slot);height:var(--slot);display:grid;place-items:center;font-size:22px;border-radius:4px;border:2px dashed rgba(255,255,255,.2);color:#ffffff73;cursor:pointer}.trash:hover{border-color:var(--danger);color:var(--danger)}#tooltip{position:fixed;z-index:70;pointer-events:none;padding:7px 10px;border-radius:6px;background:#100a1cf5;border:1px solid rgba(160,110,255,.55);font-size:14px;max-width:280px;box-shadow:0 6px 18px #00000080}#tooltip .tn{font-weight:700}#tooltip .td{color:var(--muted);font-size:12px;margin-top:2px}#cursor-item{position:fixed;z-index:80;pointer-events:none;width:40px;height:40px;margin:-20px 0 0 -20px}#cursor-item .icon{width:36px;height:36px}@media(max-width:880px){:root{--slot: 38px}.hslot{width:40px;height:40px}.icon{width:28px;height:28px}.window{flex-direction:column;overflow:auto}.window .side{width:auto}.set-row{grid-template-columns:110px 1fr 46px}.controls-grid,.adv-list{grid-template-columns:1fr}}</style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <!-- full-screen effects -->
      <div id="fx-water" class="fx"></div>
      <div id="fx-lava" class="fx"></div>
      <div id="fx-hurt" class="fx"></div>
      <div id="fx-black" class="fx"></div>

      <!-- in-game HUD -->
      <div id="hud" class="hidden">
        <div id="crosshair"></div>
        <div id="status">
          <div id="item-name"></div>
          <div id="bars">
            <div id="hearts" class="bar"></div>
            <div id="hunger" class="bar"></div>
          </div>
          <div id="air" class="bar"></div>
          <div id="hotbar"></div>
        </div>
        <div id="toasts"></div>
        <div id="debug" class="hidden"></div>
        <div id="fps" class="hidden"></div>
        <div id="hint"></div>
      </div>

      <!-- title screen -->
      <section id="screen-menu" class="screen center">
        <div class="menu-col">
          <h1 class="logo"><span>BLOCK</span><span class="g">HAVEN</span></h1>
          <div class="btn-stack">
            <button class="btn primary" data-act="play">Play</button>
            <button class="btn" data-act="settings">Settings</button>
            <button class="btn" data-act="controls">How to Play</button>
          </div>
        </div>
      </section>

      <!-- world select -->
      <section id="screen-worlds" class="screen center hidden">
        <div class="panel wide">
          <div class="panel-head"><h2>Select World</h2></div>
          <div id="world-list" class="world-list"></div>
          <div class="panel-foot">
            <button class="btn" data-act="back-menu">Back</button>
            <button class="btn primary" data-act="new-world">Create New World</button>
          </div>
        </div>
      </section>

      <!-- create world -->
      <section id="screen-create" class="screen center hidden">
        <div class="panel">
          <div class="panel-head"><h2>New World</h2></div>
          <label class="field"><span>World name</span><input id="cw-name" type="text" maxlength="28" value="New World" autocomplete="off" /></label>
          <label class="field"><span>Seed</span><input id="cw-seed" type="text" maxlength="32" placeholder="Leave empty for random" autocomplete="off" /></label>
          <div class="field"><span>Game mode</span>
            <div class="seg" id="cw-mode">
              <button class="seg-btn active" data-v="survival">Survival</button>
              <button class="seg-btn" data-v="creative">Creative</button>
            </div>
            <small id="cw-mode-desc"></small>
          </div>
          <label class="check"><input id="cw-hostile" type="checkbox" checked /><span class="box"></span><span>Hostile mobs</span></label>
          <div class="panel-foot">
            <button class="btn" data-act="cancel-create">Cancel</button>
            <button class="btn primary" data-act="create-world">Create World</button>
          </div>
        </div>
      </section>

      <!-- settings -->
      <section id="screen-settings" class="screen center hidden">
        <div class="panel">
          <div class="panel-head"><h2>Settings</h2></div>
          <div id="settings-body" class="settings-body"></div>
          <div class="panel-foot"><button class="btn primary" data-act="close-settings">Done</button></div>
        </div>
      </section>

      <!-- controls -->
      <section id="screen-controls" class="screen center hidden">
        <div class="panel wide">
          <div class="panel-head"><h2>How to Play</h2></div>
          <div class="controls-grid" id="controls-grid"></div>
          <div class="panel-foot"><button class="btn primary" data-act="close-controls">Got it</button></div>
        </div>
      </section>

      <!-- pause -->
      <section id="screen-pause" class="screen center hidden">
        <div class="menu-col">
          <h2 class="pause-title">Game Paused</h2>
          <div id="pause-sub" class="pause-sub"></div>
          <div class="btn-stack">
            <button class="btn primary" data-act="resume">Resume</button>
            <button class="btn" data-act="achievements">Achievements <span id="adv-count" class="pill"></span></button>
            <button class="btn" data-act="settings">Settings</button>
            <button class="btn" data-act="controls">Controls</button>
            <button class="btn danger" data-act="quit">Save &amp; Quit</button>
          </div>
        </div>
      </section>

      <!-- achievements -->
      <section id="screen-adv" class="screen center hidden">
        <div class="panel wide">
          <div class="panel-head"><h2>Achievements</h2><span id="adv-summary" class="muted"></span></div>
          <div id="adv-list" class="adv-list"></div>
          <div id="adv-stats" class="adv-stats"></div>
          <div class="panel-foot"><button class="btn primary" data-act="close-adv">Back</button></div>
        </div>
      </section>

      <!-- death -->
      <section id="screen-death" class="screen center hidden">
        <div class="menu-col">
          <h2 class="death-title">You Died</h2>
          <div id="death-cause" class="pause-sub"></div>
          <div class="btn-stack">
            <button class="btn primary" data-act="respawn">Respawn</button>
            <button class="btn" data-act="quit">Save &amp; Quit</button>
          </div>
        </div>
      </section>

      <!-- loading -->
      <section id="screen-loading" class="screen center hidden">
        <div class="menu-col loading">
          <div id="loading-title" class="loading-title">Generating world</div>
          <div class="progress"><div id="loading-bar"></div></div>
          <div id="loading-tip" class="loading-tip"></div>
        </div>
      </section>

      <!-- inventory / crafting / furnace / chest -->
      <section id="screen-container" class="screen center hidden">
        <div id="container-window" class="window"></div>
      </section>

      <div id="tooltip" class="hidden"></div>
      <div id="cursor-item" class="hidden"></div>
    </div>
  </body>
</html>
