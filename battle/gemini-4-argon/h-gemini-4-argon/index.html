<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Text Editor</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app-shell" class="app-shell">
      <main class="editor-stage">
        <pre id="editor-backdrop" class="editor-layer editor-backdrop" aria-hidden="true"></pre>
        <textarea
          id="editor"
          class="editor-layer editor-textarea"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          aria-label="Text editor"
          autofocus
        ></textarea>
      </main>

      <button
        id="settings-btn"
        class="settings-trigger"
        type="button"
        aria-label="Settings"
        title="Settings"
      >
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="10" cy="10" r="2.6"></circle>
          <path d="M16.2 12.3a1.3 1.3 0 0 0 .26 1.43l.05.05a1.58 1.58 0 1 1-2.23 2.23l-.05-.05a1.3 1.3 0 0 0-1.43-.26 1.3 1.3 0 0 0-.79 1.19v.14a1.58 1.58 0 1 1-3.16 0v-.07a1.3 1.3 0 0 0-.85-1.19 1.3 1.3 0 0 0-1.43.26l-.05.05a1.58 1.58 0 1 1-2.23-2.23l.05-.05a1.3 1.3 0 0 0 .26-1.43 1.3 1.3 0 0 0-1.19-.79h-.14a1.58 1.58 0 1 1 0-3.16h.07a1.3 1.3 0 0 0 1.19-.85 1.3 1.3 0 0 0-.26-1.43l-.05-.05a1.58 1.58 0 1 1 2.23-2.23l.05.05a1.3 1.3 0 0 0 1.43.26h.06a1.3 1.3 0 0 0 .79-1.19v-.14a1.58 1.58 0 1 1 3.16 0v.07a1.3 1.3 0 0 0 .79 1.19 1.3 1.3 0 0 0 1.43-.26l.05-.05a1.58 1.58 0 1 1 2.23 2.23l-.05.05a1.3 1.3 0 0 0-.26 1.43v.06a1.3 1.3 0 0 0 1.19.79h.14a1.58 1.58 0 1 1 0 3.16h-.07a1.3 1.3 0 0 0-1.19.79Z"></path>
        </svg>
      </button>

      <footer id="bottom-bar" class="bottom-bar">
        <div id="chips-container" class="chips-container" role="listbox" aria-label="Autocomplete suggestions"></div>

        <div class="bottom-bar-right">
          <div id="unit-dropdown-wrap" class="unit-dropdown-wrap hidden">
            <select id="unit-select" class="unit-select" aria-label="Target unit"></select>
          </div>
          <button
            id="angle-quick-btn"
            class="angle-quick-btn"
            type="button"
            aria-label="Toggle angle mode"
            title="Toggle radians / degrees"
          >rad</button>
        </div>
      </footer>
    </div>

    <!-- Partially sized Settings & Developer Overlay -->
    <div id="settings-overlay" class="settings-overlay hidden" role="dialog" aria-modal="true" aria-label="Settings">
      <div id="settings-card" class="settings-card">
        <div class="settings-section">
          <div class="setting-row">
            <span class="setting-label">Units</span>
            <div class="segmented" role="group" aria-label="Unit preference">
              <button id="pref-metric" class="seg-btn active" type="button" data-unit-pref="metric">Metric</button>
              <button id="pref-imperial" class="seg-btn" type="button" data-unit-pref="imperial">Imperial</button>
            </div>
          </div>

          <div class="setting-row">
            <span class="setting-label">Angles</span>
            <div class="segmented" role="group" aria-label="Angle mode">
              <button id="pref-rad" class="seg-btn active" type="button" data-angle-pref="rad">Radians</button>
              <button id="pref-deg" class="seg-btn" type="button" data-angle-pref="deg">Degrees</button>
            </div>
          </div>

          <div class="setting-row">
            <span class="setting-label">Theme</span>
            <div class="segmented" role="group" aria-label="Theme">
              <button id="pref-light" class="seg-btn active" type="button" data-theme-pref="light">Light</button>
              <button id="pref-dark" class="seg-btn" type="button" data-theme-pref="dark">Dark</button>
            </div>
          </div>

          <div class="setting-row">
            <label class="setting-label" for="font-size-range">
              Font Size <span id="font-size-val" class="setting-value">16px</span>
            </label>
            <input id="font-size-range" class="range-input" type="range" min="12" max="28" step="1" value="16" />
          </div>

          <div class="setting-row">
            <label class="setting-label" for="inline-toggle">Inline Suggestions</label>
            <input id="inline-toggle" class="switch-input" type="checkbox" checked />
          </div>
        </div>

        <div class="dev-divider">
          <button id="dev-toggle-btn" class="dev-toggle-btn" type="button" aria-expanded="false">
            <span>Developer Menu</span>
            <svg id="dev-chevron" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 6 8 10 12 6"></polyline>
            </svg>
          </button>
        </div>

        <div id="dev-panel" class="dev-panel hidden">
          <div class="dev-tabs">
            <button id="dev-tab-logs" class="dev-tab active" type="button">Console Logs</button>
            <button id="dev-tab-units" class="dev-tab" type="button">Units JSON</button>
          </div>

          <div id="dev-logs-view" class="dev-view">
            <div class="dev-toolbar">
              <button id="clear-logs-btn" class="small-btn" type="button">Clear</button>
            </div>
            <div id="dev-log-output" class="dev-log-output"></div>
          </div>

          <div id="dev-units-view" class="dev-view hidden">
            <div class="dev-toolbar">
              <span id="units-json-error" class="json-error"></span>
              <div class="dev-toolbar-btns">
                <button id="reset-units-btn" class="small-btn" type="button">Reset Defaults</button>
                <button id="apply-units-btn" class="small-btn primary-small-btn" type="button">Apply</button>
              </div>
            </div>
            <textarea
              id="units-json-editor"
              class="units-json-editor"
              spellcheck="false"
              aria-label="Known units JSON"
            ></textarea>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
