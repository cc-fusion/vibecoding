<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Text Editor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="scroller">
      <div id="stack">
        <div id="mirror" class="text" aria-hidden="true"></div>
        <textarea
          id="editor"
          class="text"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          aria-label="Editor"
          autofocus
        ></textarea>
      </div>
    </main>

    <button id="settings-btn" type="button" aria-label="Open settings" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.2.64.8 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09c-.76 0-1.36.4-1.51 1z" />
      </svg>
    </button>

    <footer id="bar">
      <div id="chips" role="listbox" aria-label="Suggestions"></div>
      <div id="bar-right">
        <select id="unit-select" aria-label="Target unit" hidden></select>
        <div class="seg small" id="angle-seg" role="group" aria-label="Angle mode">
          <button type="button" data-v="rad">rad</button>
          <button type="button" data-v="deg">deg</button>
        </div>
      </div>
    </footer>

    <div id="overlay" hidden>
      <section id="panel" role="dialog" aria-label="Settings">
        <div class="row">
          <span class="label">Units</span>
          <div class="seg" data-setting="system">
            <button type="button" data-v="metric">Metric</button>
            <button type="button" data-v="imperial">Imperial</button>
          </div>
        </div>
        <div class="row">
          <span class="label">Angles</span>
          <div class="seg" data-setting="angle">
            <button type="button" data-v="rad">Radians</button>
            <button type="button" data-v="deg">Degrees</button>
          </div>
        </div>
        <div class="row">
          <span class="label">Theme</span>
          <div class="seg" data-setting="theme">
            <button type="button" data-v="light">Light</button>
            <button type="button" data-v="dark">Dark</button>
          </div>
        </div>
        <div class="row">
          <span class="label">Font size</span>
          <div class="range">
            <input id="font-size" type="range" min="12" max="32" step="1" aria-label="Font size" />
            <output id="font-size-out"></output>
          </div>
        </div>
        <div class="row">
          <span class="label">Inline suggestions</span>
          <button type="button" class="switch" role="switch" data-toggle="inline" aria-label="Inline suggestions"></button>
        </div>

        <button type="button" id="dev-toggle" class="disclosure" aria-expanded="false">
          <span>Developer</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
        </button>
        <div id="dev" hidden>
          <div class="row">
            <span class="label">Console logging</span>
            <button type="button" class="switch" role="switch" data-toggle="debug" aria-label="Console logging"></button>
          </div>
          <div class="field">
            <div class="field-head">
              <span class="label">Known units (JSON)</span>
              <button type="button" id="units-reset" class="link">Reset to defaults</button>
            </div>
            <textarea id="units-json" spellcheck="false" aria-label="Known units JSON"></textarea>
            <p id="units-error" class="error" hidden></p>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
