th:42px;height:24px;border:0;border-radius:999px;background:var(--line);transition:background .15s;flex:none}.switch:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #00000040;transition:transform .15s}.switch[aria-checked=true]{background:var(--fg)}[data-theme=dark] .switch[aria-checked=true]{background:#4b8bf5}.switch[aria-checked=true]:after{transform:translate(18px)}#overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 40%,transparent);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .14s ease-out}#overlay[hidden]{display:none}#panel{width:min(520px,100%);max-height:min(660px,82vh);overflow-y:auto;padding:6px 26px 18px;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);animation:rise .18s ease-out;scrollbar-width:thin}@keyframes fade{0%{opacity:0}}@keyframes rise{0%{opacity:0;transform:translateY(8px) scale(.985)}}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}.label{font-size:14px}.range{display:flex;align-items:center;gap:12px}.range input{width:150px;accent-color:var(--fg)}.range output{width:28px;text-align:right;font-family:var(--mono);font-size:13px;color:var(--muted)}.disclosure{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 0;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:14px;text-align:left}.disclosure svg{color:var(--muted);transition:transform .15s}.disclosure[aria-expanded=true] svg{transform:rotate(180deg)}#dev[hidden]{display:none}.field{padding:14px 0 4px}.field-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.link{border:0;background:transparent;color:var(--muted);font-size:13px;padding:2px 0;text-decoration:underline;text-underline-offset:3px}.link:hover{color:var(--fg)}#units-json{display:block;width:100%;height:220px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre;overflow:auto;outline:none}#units-json:focus{border-color:var(--muted)}.error{margin:10px 0 0;font-size:13px;color:#d4364b;line-height:1.45}.error[hidden]{display:none}.error button{margin-left:6px}</style>
  </head>
  <body>
    <main id="scroller">
      <div id="stack">
        <div id="mirror" class="text" aria-hidden="true"></div>
        <textarea
          id="editor"
          class="text"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          aria-label="Editor"
          autofocus
        ></textarea>
      </div>
    </main>

    <button id="settings-btn" type="button" aria-label="Open settings" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.2.64.8 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09c-.76 0-1.36.4-1.51 1z" />
      </svg>
    </button>

    <footer id="bar">
      <div id="chips" role="listbox" aria-label="Suggestions"></div>
      <div id="bar-right">
        <select id="unit-select" aria-label="Target unit" hidden></select>
        <div class="seg small" id="angle-seg" role="group" aria-label="Angle mode">
          <button type="button" data-v="rad">rad</button>
          <button type="button" data-v="deg">deg</button>
        </div>
      </div>
    </footer>

    <div id="overlay" hidden>
      <section id="panel" role="dialog" aria-label="Settings">
        <div class="row">
          <span class="label">Units</span>
          <div class="seg" data-setting="system">
            <button type="button" data-v="metric">Metric</button>
            <button type="button" data-v="imperial">Imperial</button>
          </div>
        </div>
        <div class="row">
          <span class="label">Angles</span>
          <div class="seg" data-setting="angle">
            <button type="button" data-v="rad">Radians</button>
            <button type="button" data-v="deg">Degrees</button>
          </div>
        </div>
        <div class="row">
          <span class="label">Theme</span>
          <div class="seg" data-setting="theme">
            <button type="button" data-v="light">Light</button>
            <button type="button" data-v="dark">Dark</button>
          </div>
        </div>
        <div class="row">
          <span class="label">Font size</span>
          <div class="range">
            <input id="font-size" type="range" min="12" max="32" step="1" aria-label="Font size" />
            <output id="font-size-out"></output>
          </div>
        </div>
        <div class="row">
          <span class="label">Inline suggestions</span>
          <button type="button" class="switch" role="switch" data-toggle="inline" aria-label="Inline suggestions"></button>
        </div>

        <button type="button" id="dev-toggle" class="disclosure" aria-expanded="false">
          <span>Developer</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
        </button>
        <div id="dev" hidden>
          <div class="row">
            <span class="label">Console logging</span>
            <button type="button" class="switch" role="switch" data-toggle="debug" aria-label="Console logging"></button>
          </div>
          <div class="field">
            <div class="field-head">
              <span class="label">Known units (JSON)</span>
              <button type="button" id="units-reset" class="link">Reset to defaults</button>
            </div>
            <textarea id="units-json" spellcheck="false" aria-label="Known units JSON"></textarea>
            <p id="units-error" class="error" hidden></p>
          </div>
        </div>
      </section>
    </div>

  </body>
</html>
