<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voxel Core — Minimal integration</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 14px system-ui;
        background: #e8eeeb;
        color: #365440;
      }
      #viewport {
        width: 100vw;
        height: 100vh;
      }
      header {
        position: absolute;
        z-index: 1;
        top: 24px;
        left: 28px;
      }
      h1 {
        font-weight: 500;
        font-size: 24px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        opacity: 0.75;
      }
      button {
        font: inherit;
        background: #f8fcf4;
        border: 1px solid #becfba;
        padding: 8px 12px;
        border-radius: 5px;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Just the engine.</h1>
      <p>No workbench UI. No game logic. View the source to get started.</p>
      <button id="edit">Add a voxel</button> <a href="./">Back to workbench</a>
    </header>
    <div id="viewport"></div>
    <script type="module">
      import { VoxelEngine, VoxelWorld } from "./engine/engine.js";
      const engine = new VoxelEngine(document.querySelector("#viewport"), {
        palette: ["#000000", "#8aaa69", "#c3ba91"],
        workers: 2,
      });
      const world = new VoxelWorld();
      for (let x = -8; x < 8; x++) {
        for (let z = -8; z < 8; z++) {
          const height = Math.max(1, Math.floor(6 - Math.hypot(x, z) / 2));
          for (let y = 0; y < height; y++)
            world.set(x, y, z, y === height - 1 ? 1 : 2);
        }
      }
      let framed = false;
      engine.on("ready", () => {
        if (!framed) {
          engine.frameWorld();
          framed = true;
        }
      });
      engine.setWorld(world);
      let nextY = 6;
      document.querySelector("#edit").onclick = () =>
        world.set(0, nextY++, 0, 2);
      window.addEventListener("beforeunload", () => engine.dispose());
    </script>
  </body>
</html>
