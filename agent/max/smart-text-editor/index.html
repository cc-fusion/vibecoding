<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A private, offline calculation notepad with inline math and unit conversions.">
  <title>Smart Text Editor</title>
  <style>
:root {
  --bg: #fbfbf9;
  --fg: #1f2328;
  --ghost: #9aa1a9;
  --bar: #f0f0ec;
  --bar-border: #dcdcd6;
  --chip: #e6e6e0;
  --chip-hover: #dcdcd4;
  --chip-active: #cfe0ff;
  --chip-active-border: #6b9bf5;
  --dim: #79808a;
  --ins: #0b3d91;
  --tag: #8a7a3a;
  --hint: #a3a8af;
  --caret: #1f2328;
  --sel: #b9d3ff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181b;
    --fg: #e6e8ea;
    --ghost: #6a717a;
    --bar: #1e2125;
    --bar-border: #2d3136;
    --chip: #2a2e33;
    --chip-hover: #343a40;
    --chip-active: #22406e;
    --chip-active-border: #4f86e6;
    --dim: #8b929b;
    --ins: #a9cbff;
    --tag: #c2b26a;
    --hint: #5d646c;
    --caret: #e6e8ea;
    --sel: #2f4f86;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); overflow: hidden; }

#ed, #mirror {
  position: absolute; left: 0; top: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 16px; line-height: 1.6; letter-spacing: 0;
  padding: 16px 18px 64px 18px;
  margin: 0; border: 0;
  white-space: pre-wrap; overflow-wrap: break-word; word-break: normal;
  tab-size: 4; -moz-tab-size: 4;
}
#ed {
  width: 100vw; height: 100vh;
  z-index: 2;
  background: transparent; color: var(--fg); caret-color: var(--caret);
  border: none; outline: none; resize: none; overflow: auto;
  -webkit-appearance: none; appearance: none; border-radius: 0;
}
#ed::selection { background: var(--sel); }
#mirror {
  height: 100vh; z-index: 1;
  overflow: hidden; pointer-events: none;
  color: transparent; background: transparent;
}
#mirror .ghost { color: var(--ghost); }

#bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  height: 38px; display: flex; align-items: stretch;
  background: var(--bar); border-top: 1px solid var(--bar-border);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px;
  padding-bottom: env(safe-area-inset-bottom);
  user-select: none; -webkit-user-select: none;
}
#chips {
  position: relative; flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 6px; padding: 0 8px;
  overflow-x: auto; overflow-y: hidden; white-space: nowrap;
  scrollbar-width: none;
}
#chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px; border-radius: 6px;
  background: var(--chip); border: 1px solid transparent;
  cursor: pointer; color: var(--dim);
  max-width: 70vw;
  overflow: hidden;
}
.chip:hover { background: var(--chip-hover); }
.chip.active { background: var(--chip-active); border-color: var(--chip-active-border); }
.chip .num { font-size: 10px; opacity: .55; flex: none; }
.chip .dim { color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .ins { color: var(--ins); font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .tag { font-size: 10px; color: var(--tag); opacity: .8; text-transform: lowercase; flex: none; }
.chip .kind { font-size: 10px; color: var(--tag); opacity: .8; flex: none; }
#hint {
  flex: none; display: none; align-items: center; padding: 0 12px;
  color: var(--hint); font-size: 11px; white-space: nowrap;
}
#bar.has #hint { display: flex; }
@media (max-width: 640px) { #hint { display: none !important; } }
@media (pointer: coarse) {
  #bar { height: 48px; }
  .chip { height: 38px; padding: 0 14px; font-size: 14px; }
  #ed, #mirror { padding-bottom: 76px; }
}

  </style>
</head>
<body>
  <div id="mirror" aria-hidden="true"><div id="mi"></div></div>
  <textarea id="ed" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="Notes" aria-describedby="hint"></textarea>
  <div id="bar">
    <div id="chips" role="group" aria-label="Calculation suggestions"></div>
    <div id="hint">Tab accept · ←→ switch</div>
  </div>

    if (dZero(q.d) && !q.t) continue;
    const long = r.st.long;
    let targets;
    if (!word) {
      const cu = candidateUnits(q);
      const own = new Set(cu.oper.map(o => o.sym));
      targets = cu.cur.filter(o => !own.has(o.sym)).map(ou => ({ text: targetWord(ou, long), ou }));
    } else {
      targets = matchTargets(q, lw, long);
    }
    for (const t of targets) {
      const ou = t.ou;
      const x = convValue(q, { f: ou.f, d: ou.dims, off: ou.offset });
      if (!x) continue;
      const l = formatValue(x);
      if (!l) continue;
      const unitText = (long && ou.def) ? longName(ou, l[0]) : ou.sym;
      const insertText = t.text.slice(word.length) + ' = ' + l[0] + r.st.sp + unitText;
      const dim = r.disp + tail;
      const key = insertText + '|' + dim;
      if (seen.has(key)) continue;
      seen.add(key);
      chips.push({
        insertText, dim, ins: insertText, tag: r.tag, replaceLen: 0,
        // completing a partly typed unit may be done inline; the bare list is cells only
        inlineEligible: !!word, kind: 'target'
      });
      if (chips.length >= MAX_TARGETS) return chips;
    }
  }
  return chips;
}

return { targetChips };
})();

// ---- src/prefs.js ----
const module_prefs = (() => {
// Persisted preferences (radians vs degrees for trig suggestions).
const KEY = 'calc-notes-angle-v1';
let angle = null;

function getAnglePref() {
  if (angle === null) {
    angle = 'rad';
    try {
      const v = localStorage.getItem(KEY);
      if (v === 'deg' || v === 'rad') angle = v;
    } catch (e) { /* storage unavailable */ }
  }
  return angle;
}

function setAnglePref(v) {
  if (v !== 'rad' && v !== 'deg') return;
  angle = v;
  try { localStorage.setItem(KEY, v); } catch (e) { /* storage unavailable */ }
}

return { getAnglePref, setAnglePref };
})();

// ---- src/suggest.js ----
const module_suggest = (() => {
// Suggestion engine: turns an analyzed line into chips (cells + optional inline ghost text).
const { D, configureFor } = module_numeric;
const { UNITS, PREFIXES, pfOK } = module_units;
const { isExact } = module_format;
const { analyzeLine } = module_analyze;
const { targetChips } = module_target;
const { getAnglePref } = module_prefs;
const NUM_ONLY = /^-?(?:\d+\.?\d*|\.\d+)$/;
const MAX_SIG = 20;          // default cap on extended digits; grows when the user types more than this

/* ---- progressive digits ----
   Typed "3.1" for pi -> inline "4" (3.14), cells "41" (3.141), ...
   Typed "3.14"       -> inline "15" (3.1415), cell "159" (3.14159), ...
   Digits are truncated (not rounded) so every rung literally extends what was typed.
   Returns null when not applicable, else { rungs: [string], replace: bool }. */
function ladderRungs(x, typedNum) {
  if (!x || !x.isFinite() || isExact(x)) return null;
  if (!NUM_ONLY.test(typedNum)) return null;
  const ax = x.abs();
  if (ax.gte('1e15') || ax.lt('1e-6')) return null;

  const dot = typedNum.indexOf('.');
  const d = dot < 0 ? 0 : typedNum.length - dot - 1;
  const intStr = dot < 0 ? typedNum : typedNum.slice(0, dot);
  // the integer part has to be complete before digits can be appended
  if (intStr !== x.toDecimalPlaces(0, D.ROUND_DOWN).toFixed()) return null;

  const tn = typedNum.endsWith('.') ? typedNum.slice(0, -1) : typedNum;
  const trunc = (r) => x.toDecimalPlaces(r, D.ROUND_DOWN).toFixed(r);

  let replace = false;
  if (trunc(d) !== tn) {
    // not a digit-prefix. A correctly rounded literal ends the ladder, except that a
    // long one (7+ digits) is offered a more precise replacement.
    if (x.toDecimalPlaces(d, D.ROUND_HALF_UP).toFixed(d) !== tn) return null;
    const sigTyped = tn.replace('-', '').replace('.', '').replace(/^0+/, '').length;
    if (sigTyped < 7) return { rungs: [], replace: false };
    replace = true;
  }

  const intDigits = ax.gte(1) ? ax.toDecimalPlaces(0, D.ROUND_DOWN).toFixed().length : 0;
  // "pi = 3.14" stops at 20 significant digits, but "pi = 3.1415926535897932384" (a user who
  // already wants more) keeps going, as far as the working precision allows.
  const sigTypedAll = typedNum.replace('-', '').replace('.', '').replace(/^0+/, '').length;
  const maxSig = sigTypedAll < 14 ? MAX_SIG : Math.min(D.precision - 8, Math.max(MAX_SIG, sigTypedAll + 24));
  const maxDec = intDigits ? Math.max(0, maxSig - intDigits) : maxSig + (-x.e - 1);
  const base = d === 0 ? [2, 5, 8, 12]
    : d === 1 ? [2, 3, 5, 8, 12]
    : [d + 2, d + 3, d + 5, d + 8, d + 12];

  const rungs = [];
  for (let r of base) {
    r = Math.min(r, maxDec);
    if (r <= d) continue;
    let s = trunc(r);
    for (let k = 0; k < 3 && s.endsWith('0') && r < maxDec; k++) { r++; s = trunc(r); }
    if (s.endsWith('0')) continue;
    if (s.length <= typedNum.length) continue;
    if (!replace && !s.startsWith(typedNum)) continue;
    if (!rungs.includes(s)) rungs.push(s);
    if (rungs.length >= 4) break;
  }
  return { rungs, replace };
}

/* ---- chips for an analyzed line ---- */
function buildChips(a) {
  // radians/degrees: the reading the user last picked comes first (and is the inline one)
  const pref = getAnglePref();
  const rank = (l) => (l.tag && l.tag !== pref ? 1 : 0);
  const lists = a.lists.slice().sort((p, q) => (p.ii - q.ii) || (rank(p) - rank(q)));

  let cands = [];
  for (const kind of ['primary', 'alt', 'ladder'])
    for (const L of lists) for (const it of L.items)
      if (it.kind === kind) cands.push(Object.assign({}, it, { tag: L.tag, disp: L.disp, ii: L.ii, sp: L.sp }));
  if (!cands.length) return [];

  const full = (c, sp) => c.num + (c.unit ? sp + c.unit : '');
  const seen = new Map(), uniq = [];
  for (const c of cands) {
    const key = c.disp + '|' + full(c, '\u0000');
    if (seen.has(key)) {
      const p = seen.get(key);
      if (p.kind === 'primary' && c.kind === 'primary' && p.ii === c.ii && p.tag !== c.tag) p.tag = null;
      continue;
    }
    seen.set(key, c); uniq.push(c);
  }
  cands = uniq;

  const chips = [];
  const mk = (o) => chips.push(Object.assign({ tag: null, replaceLen: 0 }, o));
  const inl = (c) => c.kind === 'primary' && a.cls === 'inline';

  if (a.shape === 'typed') {
    const t = a.typed;
    const tm = /^(-?[\d.]+(?:e[+-]?\d+)?)(\s*)(.*)$/.exec(t) || [t, t, '', ''];
    const spOf = (c) => tm[3] ? tm[2] : c.sp;
    const keys = new Set();
    const add = (o) => {
      const k = o.insertText + '|' + o.replaceLen + '|' + (o.tag || '') + '|' + o.dim;
      if (keys.has(k)) return;
      keys.add(k); mk(o);
    };
    let any = false;
    for (const c of cands) {
      const f = full(c, spOf(c));
      const lad = tm[3] ? null : ladderRungs(c.x, tm[1]);
      if (lad) {
        any = true;
        const u = c.unit ? c.sp + c.unit : '';
        lad.rungs.forEach((s, i) => {
          if (lad.replace) {
            add({ insertText: s + u, replaceLen: t.length, dim: c.disp + ' = ', ins: s + u, tag: c.tag,
                  inlineEligible: false, kind: 'replace' });
          } else {
            const rem = s.slice(t.length) + u;
            add({ insertText: rem, dim: c.disp + ' = ' + t, ins: rem, tag: c.tag, inlineEligible: i === 0 && inl(c), kind: c.kind });
          }
        });
        continue;
      }
      if (f.startsWith(t)) {
        any = true;
        if (f === t) continue;
        const rem = f.slice(t.length);
        add({ insertText: rem, dim: c.disp + ' = ' + t, ins: rem, tag: c.tag, inlineEligible: inl(c), kind: c.kind });
      }
    }
    if (!any) {
      const c = cands[0];
      mk({ insertText: full(c, c.sp), replaceLen: t.length, dim: c.disp + ' = ', ins: full(c, c.sp), tag: c.tag,
           inlineEligible: false, kind: 'replace' });
    }
  } else if (a.shape === 'eq') {
    const lead = (a.spaceBeforeEq && !a.trailing) ? ' ' : '';
    for (const c of cands) {
      const f = full(c, c.sp);
      mk({ insertText: lead + f, dim: c.disp + ' = ', ins: f, tag: c.tag, inlineEligible: inl(c), kind: c.kind });
    }
  } else {
    const lead = (a.trailing ? '' : (a.spaced ? ' ' : '')) + (a.spaced ? '= ' : '=');
    for (const c of cands) {
      const f = full(c, c.sp);
      mk({ insertText: lead + f, dim: c.disp + ' = ', ins: f, tag: c.tag, inlineEligible: inl(c), kind: c.kind });
    }
  }
  return chips;
}

/* ---- name autocomplete: functions, constants, units.
   These are offered as cells and accepted with Tab, but never shown inline. ---- */
const FN_WORDS = ['sqrt(', 'cbrt(', 'log(', 'ln(', 'log2(', 'sin(', 'cos(', 'tan(', 'csc(', 'sec(', 'cot(',
  'asin(', 'acos(', 'atan(', 'arcsin(', 'arccos(', 'arctan(', 'nPr(', 'nCr(', 'pi'];
const UNIT_WORDS = (() => {
  const s = new Set(['square', 'cubic', 'squared', 'cubed']);
  UNITS.forEach(u => u.names.forEach(n => s.add(n)));
  PREFIXES.forEach(p => s.add(p.n));
  return Array.from(s);
})();
function nameSuggest(value, caret) {
  const lineStart = value.lastIndexOf('\n', caret - 1) + 1;
  let lineEnd = value.indexOf('\n', caret); if (lineEnd < 0) lineEnd = value.length;
  if (/\S/.test(value.slice(caret, lineEnd))) return [];
  const before = value.slice(lineStart, caret);
  const m = /([A-Za-z\u00b5\u03bc]{2,})$/.exec(before);
  if (!m) return [];
  const w = m[1], lw = w.toLowerCase();
  const pre = before.slice(0, before.length - w.length);
  const unitCtx = /(?:[\d.)/\u00b7*^]|->|\u2192|\b(?:to|in|per))\s*$/i.test(pre);
  const fns = [], units = [];
  const push = (arr, full) => { if (full.length > lw.length && full.toLowerCase().startsWith(lw)) arr.push(full.slice(lw.length)); };
  FN_WORDS.forEach(f => push(fns, f));
  if (unitCtx) {
    UNIT_WORDS.forEach(f => push(units, f));
    for (const p of PREFIXES) {
      if (lw.length >= p.n.length && lw.startsWith(p.n)) {
        for (const u of UNITS) if (u.names[0] && pfOK(u, p)) push(units, p.n + u.names[0]);
      }
    }
  }
  const byLen = (x, y) => x.length - y.length || (x < y ? -1 : 1);
  fns.sort(byLen); units.sort(byLen);
  const ordered = unitCtx ? units.concat(fns) : fns;
  const seen = new Set(), out = [];
  for (const rest of ordered) {
    if (seen.has(rest)) continue;
    seen.add(rest);
    out.push({ insertText: rest, dim: w, ins: rest, tag: null, replaceLen: 0, inlineEligible: false, kind: 'name' });
    if (out.length >= 8) break;
  }
  return out;
}

function suggestFor(value, caret) {
  const lineStart = value.lastIndexOf('\n', caret - 1) + 1;
  try {
    // working precision follows what is on the line (long literals, big exponents, powers ...)
    configureFor(value.slice(lineStart, caret));
    const a = analyzeLine(value, caret);
    if (a) return buildChips(a);
    const t = targetChips(value, caret);
    return t.length ? t : nameSuggest(value, caret);
  } catch (e) {
    return [];                                   // never let a pathological number break typing
  }
}

return { suggestFor };
})();

// ---- src/controller.js ----
const module_controller = (() => {
// UI controller: wires the textarea, the ghost-text mirror and the suggestion bar together.
const { suggestFor } = module_suggest;
const { setAnglePref } = module_prefs;
const { analyzeLine, findExpression } = module_analyze;
const { formatValue } = module_format;
const { parseText, show } = module_parser;
const { resolveUnitWord } = module_units;
const { D } = module_numeric;
const STORAGE_KEY = 'calc-notes-v1';

function createEditor({ ta, mirror, mi, bar, chipsEl }) {
  const ac = new AbortController();
  const on = (target, type, fn) => target.addEventListener(type, fn, { signal: ac.signal });

  const state = { chips: [], hi: 0, sig: '', dismissed: false, composing: false };

  /* ---- rendering ---- */
  function ghostText() {
    const c = state.chips[state.hi];
    return (c && c.inlineEligible && !state.dismissed) ? c.insertText : '';
  }
  function mid(s, max) {
    if (s.length <= max) return s;
    const a = Math.ceil((max - 1) / 2), b = Math.floor((max - 1) / 2);
    return s.slice(0, a) + '\u2026' + s.slice(s.length - b);
  }
  function renderMirror() {
    mirror.style.width = ta.clientWidth + 'px';
    const g = ghostText();
    mi.textContent = '';
    if (g) {
      mi.appendChild(document.createTextNode(ta.value.slice(0, ta.selectionStart)));
      const sp = document.createElement('span');
      sp.className = 'ghost'; sp.textContent = g;
      mi.appendChild(sp);
    }
    mi.style.transform = 'translateY(' + (-ta.scrollTop) + 'px)';
  }
  function renderBar() {
    chipsEl.textContent = '';
    bar.classList.toggle('has', state.chips.length > 0);
    state.chips.forEach((c, i) => {
      const el = document.createElement('div');
      el.className = 'chip' + (i === state.hi ? ' active' : '');
      el.dataset.i = String(i);
      if (i < 9) { const n = document.createElement('span'); n.className = 'num'; n.textContent = String(i + 1); el.appendChild(n); }
      const d = document.createElement('span'); d.className = 'dim'; d.textContent = mid(c.dim, 44); el.appendChild(d);
      const s = document.createElement('span'); s.className = 'ins'; s.textContent = mid(c.ins, 34); el.appendChild(s);
      if (c.ins.length > 34 || c.dim.length > 44) el.title = c.dim + c.ins;   // clipped: full text on hover
      if (c.tag) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = c.tag; el.appendChild(t); }
      if (c.kind === 'replace') { const t = document.createElement('span'); t.className = 'kind'; t.textContent = 'replace'; el.appendChild(t); }
      chipsEl.appendChild(el);
    });
    const el = chipsEl.children[state.hi];
    if (el) {
      const l = el.offsetLeft, r = l + el.offsetWidth;
      if (l < chipsEl.scrollLeft) chipsEl.scrollLeft = Math.max(0, l - 8);
      else if (r > chipsEl.scrollLeft + chipsEl.clientWidth) chipsEl.scrollLeft = r - chipsEl.clientWidth + 8;
    }
  }
  function render() { renderBar(); renderMirror(); }

  function setChips(chips) {
    const sig = chips.map(c => c.insertText + '|' + c.replaceLen + '|' + (c.tag || '') + '|' + c.dim).join('\u00a6');
    if (sig !== state.sig) { state.hi = 0; state.sig = sig; }
    state.chips = chips;
    if (state.hi >= chips.length) state.hi = 0;
    render();
  }

  /* ---- suggestion scheduling ---- */
  function computeSuggestions() {
    if (state.composing || state.dismissed) return [];
    if (document.activeElement !== ta) return [];
    if (ta.selectionStart !== ta.selectionEnd) return [];
    return suggestFor(ta.value, ta.selectionStart);
  }
  let timer = null;
  function schedule() { clearTimeout(timer); timer = setTimeout(run, 30); }
  function run() {
    let chips = [];
    try { chips = computeSuggestions(); } catch (e) { chips = []; }
    setChips(chips);
  }
  function clearAll() { clearTimeout(timer); setChips([]); }

  /* ---- accepting ---- */
  function insertText(t) {
    ta.focus();
    let ok = false;
    try { ok = document.execCommand('insertText', false, t); } catch (e) { ok = false; }
    if (!ok) {
      ta.setRangeText(t, ta.selectionStart, ta.selectionEnd, 'end');
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }
  function accept(i) {
    const c = state.chips[i];
    if (!c) return;
    if (c.tag === 'rad' || c.tag === 'deg') setAnglePref(c.tag);   // remember radians vs degrees
    ta.focus();
    if (c.replaceLen) {
      const p = ta.selectionStart;
      ta.setSelectionRange(Math.max(0, p - c.replaceLen), p);
    }
    insertText(c.insertText);
  }

  /* ---- events ---- */
  on(ta, 'keydown', (e) => {
    if (e.isComposing || state.composing || e.keyCode === 229) return;
    const k = e.key;
    if (k === 'Shift' || k === 'Control' || k === 'Alt' || k === 'Meta' || k === 'CapsLock') return;

    if (k === 'Escape') { state.dismissed = true; clearAll(); return; }
    state.dismissed = false;

    if (e.altKey && !e.ctrlKey && !e.metaKey && /^(Digit|Numpad)[1-9]$/.test(e.code)) {
      const i = parseInt(e.code.slice(-1), 10) - 1;
      if (state.chips[i]) { e.preventDefault(); accept(i); }
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const have = state.chips.length > 0;

    if (k === 'Tab') {
      if (e.shiftKey) return;
      e.preventDefault();
      // Tab always accepts the selected cell, inline or not
      if (have) accept(state.hi); else insertText('\t');
      return;
    }
    if (have && !e.shiftKey) {
      if (k === 'ArrowLeft' && state.hi > 0) {
        e.preventDefault(); state.hi--; render(); return;
      }
      if (k === 'ArrowRight' && state.hi < state.chips.length - 1) {
        e.preventDefault(); state.hi++; render(); return;
      }
    }
  });

  on(chipsEl, 'mousedown', (e) => { if (e.target.closest('.chip')) e.preventDefault(); });
  on(chipsEl, 'click', (e) => {
    const el = e.target.closest('.chip');
    if (el) accept(parseInt(el.dataset.i, 10));
  });

  /* ---- persistence ---- */
  let saveT = null;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(flush, 250);
  }
  function flush() { try { localStorage.setItem(STORAGE_KEY, ta.value); } catch (e) { /* ignore */ } }

  on(ta, 'input', () => { state.dismissed = false; schedule(); save(); });
  on(document, 'selectionchange', () => { if (document.activeElement === ta) schedule(); });
  on(ta, 'focus', schedule);
  on(ta, 'blur', clearAll);
  on(ta, 'scroll', () => { mi.style.transform = 'translateY(' + (-ta.scrollTop) + 'px)'; });
  on(ta, 'compositionstart', () => { state.composing = true; clearAll(); });
  on(ta, 'compositionend', () => { state.composing = false; schedule(); });
  on(window, 'resize', renderMirror);
  on(window, 'beforeunload', flush);

  try { ta.value = localStorage.getItem(STORAGE_KEY) || ''; } catch (e) { /* ignore */ }
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  render();

  // debugging: calcDebug.suggest('1g + 2g = ') -> [{insertText, dim, ins, tag, inlineEligible, kind}]
  window.calcDebug = {
    suggest: (text) => suggestFor(text, text.length),
    analyzeLine, findExpression, formatValue, parseText, show, resolveUnitWord, D
  };

  return {
    destroy() {
      ac.abort();
      clearTimeout(timer);
      clearTimeout(saveT);
      flush();
      delete window.calcDebug;
    }
  };
}

return { createEditor };
})();

// ---- src/main.js ----
const module_main = (() => {
const { createEditor } = module_controller;
// Native DOM entry point; no framework, virtual DOM, or runtime loader.
createEditor({
  ta: document.getElementById('ed'),
  mirror: document.getElementById('mirror'),
  mi: document.getElementById('mi'),
  bar: document.getElementById('bar'),
  chipsEl: document.getElementById('chips')
});

return {  };
})();
})();
  </script>
