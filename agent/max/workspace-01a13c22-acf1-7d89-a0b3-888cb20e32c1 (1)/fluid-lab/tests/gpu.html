<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>FLUX · GPU validation</title
  ><style>
    body {
      background: #111b22;
      color: #c8d9dd;
      font: 14px system-ui;
      margin: 40px;
    }
    pre {
      line-height: 1.9;
      white-space: pre-wrap;
    }
    button {
      padding: 10px 15px;
      background: #e59470;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }
    canvas {
      display: none;
    }
    a {
      color: #e59470;
    }
  </style>
  <h1>GPU numerical validation</h1>
  <p>
    Tests the actual production GLSL kernels. Synchronous readback is used only
    for tests.
  </p>
  <button id="run">Run validation</button>
  <button id="large">Test 1024² + 2048²</button>
  <a href="../">Return to FLUX</a>
  <pre id="results">Ready.</pre>
  <canvas id="test-canvas" width="32" height="32"></canvas>
  <script type="module">
    import { runGPUChecks, runLargeGridChecks } from "./gpu-tests.js";
    window.runGPUChecks = runGPUChecks;
    document.getElementById("large").onclick = async () => {
      if (
        !confirm(
          "This test allocates up to 341 MiB of numerical textures. Continue?",
        )
      )
        return;
      const result = document.getElementById("results");
      result.textContent = "Running large-grid checks…";
      try {
        result.textContent = JSON.stringify(
          await runLargeGridChecks(document.getElementById("test-canvas")),
          null,
          2,
        );
      } catch (e) {
        result.textContent = "FAIL: " + e.stack;
      }
    };
    document.getElementById("run").onclick = async () => {
      const result = document.getElementById("results");
      result.textContent = "Running…";
      try {
        const report = await runGPUChecks(
          document.getElementById("test-canvas"),
        );
        result.textContent = JSON.stringify(report, null, 2);
      } catch (e) {
        result.textContent = "FAIL: " + e.stack;
      }
    };
  </script>
</html>
