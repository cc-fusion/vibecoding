<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Scratchpad</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #fbfbfa;
    --ink: #202124;
    --muted: #85888d;
    --ghost: #9a9da3;
    --bar: rgba(246, 247, 248, .97);
    --line: rgba(30, 35, 40, .12);
    --chip: #fff;
    --chip-hover: #f1f3f5;
    --chip-active: #e8f0fe;
    --accent: #356ac3;
    --shadow: 0 1px 4px rgba(20, 30, 40, .09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #171819;
      --ink: #e5e7e9;
      --muted: #8b9097;
      --ghost: #777d85;
      --bar: rgba(28, 30, 32, .98);
      --line: rgba(230, 235, 240, .12);
      --chip: #242729;
      --chip-hover: #303437;
      --chip-active: #26364b;
      --accent: #8ab4f8;
      --shadow: 0 1px 5px rgba(0, 0, 0, .28);
    }
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--paper); }
  body { color: var(--ink); }
  #shell { position: fixed; inset: 0; overflow: hidden; background: var(--paper); }
  #mirror, #editor {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    border: 0;
    padding: 22px 22px calc(76px + env(safe-area-inset-bottom)) 22px;
    font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    letter-spacing: 0;
    tab-size: 4;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: normal;
    text-align: left;
  }
  #mirror {
    z-index: 1;
    color: var(--ink);
    overflow: hidden;
    pointer-events: none;
    scrollbar-width: none;
  }
  #mirror .ghost { color: var(--ghost); }
  #editor {
    z-index: 2;
    display: block;
    resize: none;
    outline: none;
    box-shadow: none;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    color: var(--ink);
    caret-color: var(--ink);
    -webkit-text-fill-color: currentColor;
    overflow: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--muted) transparent;
  }
  #editor.ghost-active { color: transparent; -webkit-text-fill-color: transparent; }
  #editor::selection { background: rgba(74, 126, 201, .24); }
  #suggestion-bar {
    position: absolute;
    z-index: 5;
    left: 0;
    right: 0;
    bottom: 0;
    display: none;
    align-items: center;
    gap: 10px;
    min-height: calc(54px + env(safe-area-inset-bottom));
    padding: 7px 12px calc(7px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--bar);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  #suggestion-bar.visible { display: flex; }
  #chips {
    display: flex;
    flex: 1 1 auto;
    min-width: 0;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  #chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    min-width: 52px;
    max-width: min(76vw, 440px);
    min-height: 38px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 7px 11px;
    background: var(--chip);
    color: var(--ink);
    box-shadow: var(--shadow);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font: 13px/1.25 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  }
  .chip:hover { background: var(--chip-hover); }
  .chip.active { border-color: color-mix(in srgb, var(--accent) 64%, transparent); background: var(--chip-active); }
  .chip-label { white-space: pre; }
  .chip-dim { color: var(--muted); }
  .chip-em { color: var(--accent); font-weight: 700; }
  .chip-tag { flex: 0 0 auto; color: var(--muted); font: 10px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .04em; }
  #key-hint {
    flex: 0 0 auto;
    padding-left: 2px;
    color: var(--muted);
    white-space: nowrap;
    font: 11px/1.2 ui-sans-serif, system-ui, sans-serif;
  }
  @media (max-width: 560px) {
    #mirror, #editor { padding: 16px 15px calc(72px + env(safe-area-inset-bottom)) 15px; font-size: 15px; }
    #suggestion-bar { gap: 7px; padding-left: 8px; padding-right: 8px; }
    .chip { max-width: 80vw; min-height: 42px; padding: 9px 10px; }
    #key-hint { font-size: 10px; }
  }
</style>
</head>
<body>
<main id="shell">
  <div id="mirror" aria-hidden="true"></div>
  <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Scratchpad"></textarea>
  <div id="suggestion-bar" aria-live="polite">
    <div id="chips"></div>
    <div id="key-hint">Tab/Enter accept · ←→ switch</div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/decimal.js@10.4.3/decimal.min.js"></script>
<script>

    const explicitEquals=content.trimEnd().endsWith('=');
    const lastEq=content.lastIndexOf('=');
    const config={explicitEquals,rawExpr:'',lineStart,caret,rawLine:originalBefore,bulletPrefix,insertAt:caret};
    // Shape B: typed partial result after an equals.
    if(!explicitEquals && parts.length>1) {
      const typed=parts[parts.length-1]; const previous=parts[parts.length-2];
      if(partialResultPattern(typed)) {
        const parsedPrev=findParsedSuffix(previous);
        if(parsedPrev) {
          const first=parsedPrev.variants[0]; let validQ=null;
          try { validQ=cleanQ(evaluate(first.ast,'rad')); } catch(_) {}
          if(validQ) {
            const expr=formatAst(first.ast);
            const result=buildResultForAst(first.ast,parsedPrev,expr,{...config,explicitEquals:true,rawExpr:previous},{unitAmbiguous:parsedPrev.variants.length>1,rawExpr:previous,onlyPrimary:false});
            result.expression=expr;
            const leading=(typed.match(/^\s*/)||[''])[0].length;
            const trailing=(typed.match(/\s*$/)||[''])[0].length;
            const start=lineStart+bulletPrefix.length+lastEq+1+leading;
            const end=lineStart+bulletPrefix.length+lastEq+1+typed.length-trailing;
            const chips=makePartialResultChips(result,typed,{start,end},config);
            return {chips,ghost:null,partial:true};
          }
        }
      }
    }
    let exprSegment, rawExpr;
    if(explicitEquals) {
      exprSegment=parts.length>=2?parts[parts.length-2]:''; rawExpr=exprSegment;
      if(!exprSegment.trim()) return {chips:[],ghost:null};
    } else {
      exprSegment=parts[parts.length-1]||''; rawExpr=exprSegment;
    }
    const conversion=explicitEquals?null:findExplicitConversion(exprSegment);
    let mathSegment=conversion?conversion.base:exprSegment;
    if(!mathSegment.trim()) {
      const ac=autocompleteChips(exprSegment,lineStart,caret,originalBefore);
      return {chips:ac,ghost:null};
    }
    const parsed=findParsedSuffix(mathSegment);
    if(!parsed) {
      const ac=autocompleteChips(exprSegment,lineStart,caret,originalBefore);
      return {chips:ac,ghost:null};
    }
    const firstAst=parsed.variants[0].ast;
    const exprDisplay=formatAst(firstAst);
    if(isLoneLiteral(firstAst)||isLonePercent(firstAst)) return {chips:[],ghost:null};
    const suffix=parsed.raw;
    const bareUnit=simpleUnitQuantity(firstAst);
    const phoneDate=isPhoneOrDate(suffix);
    const unitAmbiguous=parsed.variants.length>1;
    let category='inline';
    if(unitAmbiguous) category='ambiguous';
    else if(bareUnit&&!conversion) category='bareUnit';
    else if(!explicitEquals&&bullet) category='bullet';
    else if(!explicitEquals&&phoneDate) category='phoneDate';
    const primaryEligible=category==='inline' && !unitAmbiguous;
    config.rawExpr=rawExpr;
    if(conversion) {
      const baseParsed=parsed;
      const conversionDisplay={...conversion,target:conversion.target};
      const data=buildExplicitConversion(baseParsed,mathSegment,conversionDisplay,config,{primaryEligible:primaryEligible||!bareUnit,rawExpr});
      if(data.chips.length) return {chips:data.chips,ghost:null,inlineShape:true};
      return {chips:autocompleteChips(exprSegment,lineStart,caret,originalBefore),ghost:null};
    }
    // Longest valid suffix is selected before semantic evaluation. An evaluator
    // error here is deliberately silent; it never retries a shorter suffix.
    const scientificAmbiguous=/\d+(?:\.\d+)?[eE]-\d+(?![A-Za-z0-9_])/.test(mathSegment);
    const hasAnyUnitAmbiguity=unitAmbiguous;
    const normalFlags={unitAmbiguous:hasAnyUnitAmbiguity,bareUnit:category==='bareUnit',primaryEligible,rawExpr};
    const data=buildResultForAst(firstAst,parsed,exprDisplay,config,normalFlags);
    let chips=data.chips.slice();
    // A negative-exponent e token also has a valid ordinary-constant reading.
    // Scientific notation stays first; the alternate is a bar-only chip.
    if(scientificAmbiguous&&!unitAmbiguous) {
      const alt=findParsedSuffix(mathSegment,false);
      if(alt && alt.variants.length && !isLoneLiteral(firstAst)) {
        const altAst=alt.variants[0].ast;
        try {
          const altQ=cleanQ(evaluate(altAst,'rad'));
          const altExpr=formatAst(altAst);
          let altChip=null;
          if(!hasDimension(altQ.dims)) {
            const f=formatDecimal(altQ.d,'inline',{minDecimals:2});
            altChip=equationChip(altExpr,f.text,config,{inlineEligible:false,kind:'ambiguity'});
          } else {
            const altData=buildResultForAst(altAst,{variants:[{ast:altAst}]},altExpr,config,{onlyPrimary:true,primaryEligible:false,rawExpr,groupKind:'ambiguity'});
            altChip=altData.chips[0]||null;
          }
          if(altChip) { altChip.kind='ambiguity'; altChip.inlineEligible=false; chips.push(altChip); }
        } catch(_) {}
      }
    }
    return {chips:dedupeChips(chips),ghost:null,category};
  }

  const editor=document.getElementById('editor');
  const mirror=document.getElementById('mirror');
  const bar=document.getElementById('suggestion-bar');
  const chipsBox=document.getElementById('chips');
  let suggestions=[],activeIndex=0,movedHighlight=false,ghostVisible=false,dismissed=false,composing=false,evalTimer=0,saveTimer=0,edgeCaret=null;
  const STORAGE_KEY='arena.scratchpad.calc.v1';
  try { const saved=localStorage.getItem(STORAGE_KEY); if(saved!==null) editor.value=saved; } catch(_) {}

  function clearSuggestions() {
    suggestions=[]; activeIndex=0; movedHighlight=false; ghostVisible=false;
    renderBar(); renderGhost();
  }
  function clippedEquation(chip,max=72) {
    const text=chip.displayEquation||'';
    if(text.length<=max) return {text,start:0,end:text.length,left:false,right:false};
    const hs=Math.max(0,Math.min(text.length,chip.highlightStart||0));
    const he=Math.max(hs,Math.min(text.length,chip.highlightEnd||text.length));
    let leftBudget=20,rightBudget=30;
    if(he-hs>max-4) { leftBudget=1; rightBudget=max-5; }
    let start=Math.max(0,hs-leftBudget), end=Math.min(text.length,he+rightBudget);
    const budget=max-(start>0?1:0)-(end<text.length?1:0);
    if(end-start>budget) end=start+budget;
    if(he>end) { end=Math.min(text.length,he); start=Math.max(0,end-budget); }
    if(hs<start) start=hs;
    return {text,start,end,left:start>0,right:end<text.length};
  }
  function appendChipText(container,text,chip,visStart,visEnd,leftEllipsis,rightEllipsis) {
    if(leftEllipsis) container.appendChild(document.createTextNode('…'));
    const a=Math.max(visStart,chip.highlightStart||0), b=Math.min(visEnd,chip.highlightEnd||chip.displayEquation.length);
    if(a>=b) container.appendChild(document.createTextNode(text.slice(visStart,visEnd)));
    else {
      if(a>visStart) container.appendChild(document.createTextNode(text.slice(visStart,a)));
      const em=document.createElement('span'); em.className='chip-em'; em.textContent=text.slice(a,b); container.appendChild(em);
      if(b<visEnd) container.appendChild(document.createTextNode(text.slice(b,visEnd)));
    }
    if(rightEllipsis) container.appendChild(document.createTextNode('…'));
  }
  function renderBar() {
    chipsBox.replaceChildren();
    if(!suggestions.length) { bar.classList.remove('visible'); return; }
    bar.classList.add('visible');
    suggestions.forEach((chip,index)=>{
      const button=document.createElement('button'); button.type='button'; button.className='chip'+(index===activeIndex?' active':'');
      button.setAttribute('aria-label',chip.displayEquation||chip.insertText);
      const label=document.createElement('span'); label.className='chip-label';
      const clip=clippedEquation(chip);
      appendChipText(label,chip.displayEquation||'',chip,clip.start,clip.end,clip.left,clip.right);
      button.appendChild(label);
      if(chip.tag) { const tag=document.createElement('span'); tag.className='chip-tag'; tag.textContent=chip.tag; button.appendChild(tag); }
      button.addEventListener('mousedown',e=>e.preventDefault());
      let touchStart=null,touchHandled=false,touchMoved=false;
      button.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch') { touchStart={id:e.pointerId,x:e.clientX,y:e.clientY}; touchHandled=false; touchMoved=false; } });
      button.addEventListener('pointermove',e=>{ if(touchStart&&e.pointerId===touchStart.id&&Math.hypot(e.clientX-touchStart.x,e.clientY-touchStart.y)>9) { touchStart=null; touchMoved=true; } });
      button.addEventListener('pointerup',e=>{ if(touchStart&&e.pointerId===touchStart.id) { touchStart=null; touchHandled=true; e.preventDefault(); acceptChip(index); } });
      button.addEventListener('pointercancel',()=>{ touchStart=null; touchMoved=true; });
      button.addEventListener('click',e=>{ e.preventDefault(); if(touchHandled||touchMoved) { touchHandled=false; touchMoved=false; return; } acceptChip(index); });
      chipsBox.appendChild(button);
    });
    const active=chipsBox.children[activeIndex];
    if(active && active.scrollIntoView) active.scrollIntoView({block:'nearest',inline:'nearest'});
  }
  function syncMirrorBox() {
    const w=editor.clientWidth,h=editor.clientHeight;
    if(w>0) { mirror.style.width=w+'px'; mirror.style.right='auto'; }
    if(h>0) mirror.style.height=h+'px';
  }
  function renderGhost() {
    syncMirrorBox();
    const caret=editor.selectionStart;
    const chip=suggestions[activeIndex];
    ghostVisible=!!(!dismissed && chip && chip.inlineEligible && editor.selectionStart===editor.selectionEnd && !composing);
    if(!ghostVisible) {
      editor.classList.remove('ghost-active');
      mirror.replaceChildren();
      return;
    }
    editor.classList.add('ghost-active');
    const before=editor.value.slice(0,caret), after=editor.value.slice(caret);
    const ghost=document.createElement('span'); ghost.className='ghost'; ghost.textContent=chip.insertText;
    mirror.replaceChildren(document.createTextNode(before),ghost,document.createTextNode(after));
    mirror.scrollTop=editor.scrollTop; mirror.scrollLeft=editor.scrollLeft;
  }
  function setSuggestions(items) {
    suggestions=items||[]; activeIndex=0; movedHighlight=false;
    renderBar(); renderGhost();
  }
  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{ try { localStorage.setItem(STORAGE_KEY,editor.value); } catch(_){} },120);
  }
  function scheduleAnalysis() {
    clearTimeout(evalTimer);
    evalTimer=setTimeout(()=>analyzeAndRender(),30);
  }
  function analyzeAndRender() {
    if(composing||dismissed) { renderGhost(); return; }
    if(editor.selectionStart!==editor.selectionEnd) { clearSuggestions(); return; }
    try {
      const result=analyzeCurrentLine(editor.value,editor.selectionStart);
      setSuggestions(result.chips||[]);
    } catch(_) { clearSuggestions(); }
  }
  function insertTextAtRange(text,start=editor.selectionStart,end=editor.selectionEnd) {
    try { editor.focus({preventScroll:true}); } catch(_) { editor.focus(); }
    start=Math.max(0,Math.min(editor.value.length,start)); end=Math.max(start,Math.min(editor.value.length,end));
    editor.setSelectionRange(start,end);
    const before=editor.value;
    try { document.execCommand('insertText',false,text); } catch(_) {}
    if(editor.value===before) {
      editor.setRangeText(text,start,end,'end');
      try { editor.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:text})); }
      catch(_) { editor.dispatchEvent(new Event('input',{bubbles:true})); }
    }
    const caret=start+text.length;
    editor.setSelectionRange(caret,caret);
    dismissed=false; movedHighlight=false;
    saveSoon(); scheduleAnalysis(); renderGhost();
  }
  function acceptChip(index=activeIndex) {
    const chip=suggestions[index]; if(!chip) return;
    const range=chip.replaceRange||{start:editor.selectionStart,end:editor.selectionStart};
    clearTimeout(evalTimer);
    setSuggestions([]);
    insertTextAtRange(chip.insertText,range.start,range.end);
  }
  function acceptableChip() { return !!(suggestions[activeIndex] && (ghostVisible||movedHighlight)); }
  editor.addEventListener('input',()=>{ dismissed=false; saveSoon(); scheduleAnalysis(); });
  editor.addEventListener('keyup',()=>{ if(edgeCaret!==null) { const moved=editor.selectionStart!==edgeCaret; edgeCaret=null; if(moved) clearSuggestions(); } scheduleAnalysis(); });
  editor.addEventListener('click',()=>{ dismissed=false; scheduleAnalysis(); });
  editor.addEventListener('select',()=>{ if(editor.selectionStart!==editor.selectionEnd) clearSuggestions(); else scheduleAnalysis(); });
  editor.addEventListener('scroll',()=>{ mirror.scrollTop=editor.scrollTop; mirror.scrollLeft=editor.scrollLeft; });
  if(typeof window!=='undefined') {
    window.addEventListener('resize',()=>{ syncMirrorBox(); renderGhost(); });
    window.addEventListener('pagehide',()=>{ try { localStorage.setItem(STORAGE_KEY,editor.value); } catch(_){} });
  }
  editor.addEventListener('compositionstart',()=>{ composing=true; clearSuggestions(); });
  editor.addEventListener('compositionend',()=>{ composing=false; dismissed=false; scheduleAnalysis(); });
  editor.addEventListener('keydown',e=>{
    if(e.key==='Escape') { dismissed=true; clearSuggestions(); e.preventDefault(); return; }
    if(dismissed && !e.ctrlKey && !e.metaKey && !e.altKey) dismissed=false;
    if(composing) return;
    if(e.altKey && /^[1-9]$/.test(e.key)) {
      const n=Number(e.key)-1;
      if(suggestions[n]) { e.preventDefault(); acceptChip(n); }
      return;
    }
    if(e.key==='Tab') {
      if(acceptableChip()) { e.preventDefault(); acceptChip(activeIndex); }
      else { e.preventDefault(); insertTextAtRange('\t'); }
      return;
    }
    if(e.key==='Enter' && acceptableChip()) { e.preventDefault(); acceptChip(activeIndex); return; }
    if(suggestions.length) {
      if((e.key==='ArrowLeft'||e.key==='ArrowUp') && activeIndex>0) {
        e.preventDefault(); activeIndex--; movedHighlight=true; renderBar(); renderGhost(); return;
      }
      if((e.key==='ArrowLeft'||e.key==='ArrowUp') && activeIndex===0) { dismissed=true; edgeCaret=editor.selectionStart; renderGhost(); return; }
      if((e.key==='ArrowRight'||e.key==='ArrowDown') && activeIndex<suggestions.length-1) {
        e.preventDefault(); activeIndex++; movedHighlight=true; renderBar(); renderGhost(); return;
      }
      if((e.key==='ArrowRight'||e.key==='ArrowDown') && activeIndex===suggestions.length-1) { dismissed=true; edgeCaret=editor.selectionStart; renderGhost(); return; }
    }
  });
  document.addEventListener('selectionchange',()=>{
    if(document.activeElement===editor && !composing) {
      if(editor.selectionStart!==editor.selectionEnd) clearSuggestions(); else scheduleAnalysis();
    }
  });
  // The bar is intentionally the only auxiliary UI; no toolbar, title, or controls are present.
  scheduleAnalysis();
})();
</script>
</body>
</html>
