<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f6">
  <title></title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #fafaf8;
      --ink: #27313b;
      --muted: #7a8795;
      --ghost: #aeb8c3;
      --line: rgba(74, 90, 108, .13);
      --chip: rgba(255, 255, 255, .83);
      --chip-hover: #fff;
      --accent: #3d6fa5;
      --accent-soft: rgba(61, 111, 165, .10);
      --shadow: 0 3px 14px rgba(22, 36, 52, .06);
      --selection: rgba(96, 143, 190, .24);
      --code-font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background: var(--paper);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #111417;
        --ink: #dce2e8;
        --muted: #87929e;
        --ghost: #687480;
        --line: rgba(215, 226, 238, .13);
        --chip: rgba(32, 38, 44, .94);
        --chip-hover: #262d34;
        --accent: #8ab5e3;
        --accent-soft: rgba(138, 181, 227, .13);
        --shadow: 0 4px 18px rgba(0, 0, 0, .2);
        --selection: rgba(103, 154, 204, .28);
      }
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--paper); }
    body { color: var(--ink); -webkit-font-smoothing: antialiased; }
    #mirror, #editor {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      border: 0;
      padding: clamp(30px, 7.2vh, 76px) clamp(22px, 7.5vw, 112px) 92px;
      font-family: var(--code-font);
      font-size: clamp(15px, 1.35vw, 18px);
      font-weight: 400;
      line-height: 1.72;
      letter-spacing: 0;
      tab-size: 4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: normal;
      text-align: left;
      box-sizing: border-box;
    }
    #mirror {
      z-index: 1;
      overflow: auto;
      color: var(--ink);
      pointer-events: none;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #mirror::-webkit-scrollbar { display: none; }
    #mirror .ghost { color: var(--ghost); font-style: normal; }
    #editor {
      z-index: 2;
      display: block;
      resize: none;
      outline: none;
      color: transparent;
      -webkit-text-fill-color: transparent;
      caret-color: var(--accent);
      background: transparent;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-color: transparent transparent;
      scrollbar-width: none;
      -webkit-appearance: none;
      border-radius: 0;
    }
    #editor::-webkit-scrollbar { display: none; }
    #editor::selection { background: var(--selection); -webkit-text-fill-color: transparent; }
    #editor:focus { outline: none; }
    #bottomBar {
      position: fixed;
      z-index: 4;
      left: 0;
      right: 0;
      bottom: 0;
      height: 62px;
      padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 18px;
      border-top: 1px solid var(--line);
      background: var(--paper);
      background: color-mix(in srgb, var(--paper) 91%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: height .12s ease, border-color .12s ease;
    }
    #bottomBar.is-empty {
      height: max(3px, env(safe-area-inset-bottom));
      min-height: 3px;
      padding: 0;
      gap: 0;
      border-top-color: rgba(122, 135, 149, .16);
      background: var(--paper);
      backdrop-filter: none;
    }
    #chips {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      overscroll-behavior-x: contain;
    }
    #chips::-webkit-scrollbar { display: none; }
    .chip {
      appearance: none;
      flex: 0 0 auto;
      min-height: 38px;
      max-width: min(620px, 68vw);
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--chip);
      box-shadow: var(--shadow);
      color: var(--muted);
      font: 500 13px/1 var(--code-font);
      text-align: left;
      cursor: pointer;
      transition: border-color .12s ease, background .12s ease, transform .12s ease, color .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:hover { background: var(--chip-hover); border-color: color-mix(in srgb, var(--accent) 42%, var(--line)); }
    .chip:active { transform: translateY(1px); }
    .chip.selected {
      border-color: color-mix(in srgb, var(--accent) 62%, var(--line));
      background: var(--accent-soft);
      color: var(--ink);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 8%, transparent), var(--shadow);
    }
    .equation {
      display: inline-block;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      vertical-align: middle;
      white-space: nowrap;
      text-overflow: clip;
    }
    .known { color: var(--muted); opacity: .82; }
    .fresh { color: var(--accent); font-weight: 650; }
    .ellipsis { color: var(--muted); opacity: .72; }
    .tag {
      display: inline-block;
      margin-left: 10px;
      padding-left: 9px;
      border-left: 1px solid var(--line);
      color: var(--muted);
      opacity: .72;
      font: 11px/1 var(--code-font);
      text-transform: lowercase;
      vertical-align: middle;
    }
    #keyHint {
      flex: 0 0 auto;
      padding-right: 2px;
      color: var(--muted);
      opacity: .64;
      font: 11px/1.2 var(--code-font);
      white-space: nowrap;
      user-select: none;
    }
    #keyHint[hidden] { display: none; }
    @media (max-width: 640px) {
      #mirror, #editor { padding: 32px 22px 84px; font-size: 16px; line-height: 1.68; }
      #bottomBar { height: 58px; gap: 10px; padding-left: 10px; padding-right: max(10px, env(safe-area-inset-right)); }
      .chip { min-height: 42px; max-width: 76vw; padding: 0 12px; font-size: 12px; border-radius: 9px; }
      #keyHint { max-width: 80px; text-align: right; white-space: normal; line-height: 1.35; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <div id="mirror" aria-hidden="true"></div>
  <textarea id="editor" aria-label="Math notepad" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" wrap="soft" autofocus></textarea>
  <div id="bottomBar" class="is-empty" aria-label="Suggestions">
    <div id="chips" role="listbox" aria-label="Math suggestions"></div>
    <div id="keyHint" hidden>Tab/Enter accept · ←→ switch</div>
  </div>

    standardResult.q._sourceText = expressionRaw;
    if (classInfo.bareUnit && !conversion) {
      // A lone measured quantity shows conversions only, never a ghost or the same-value primary.
      const qv = standardResult.q;
      const chips = [];
      const display = qv.display;
      const altUnits = unitAlternativesFor(qv);
      for (const alt of altUnits) {
        const f = displaySuffix(qv, alt, expressionRaw, 'alt', true);
        const ins = insertShape(f.full, explicit, expressionRaw);
        const eq = resultEquation(sourceExpr, f.full);
        addChip(chips, makeChip({ insertText: ins, equation: eq, highlightStart: explicit ? eq.lastIndexOf(' = ') + 3 : sourceExpr.length, inlineEligible: false, kind: 'alternate' }));
      }
      return chips;
    }
    return makePrimaryAndLadder(standardResult, sourceExpr, expressionRaw, explicit, partial, classInfo, null, '', conversion ? 'alt' : 'primary');
  }

  function isPartialAnswerText(s) {
    if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?(?:\s*[A-Za-zµμΩ°][A-Za-z0-9_µμΩ°]*(?:\s*\^?\s*[+-]?\d+)?)?$/.test(s)) return false;
    return true;
  }

  let suggestions = [];
  let selectedIndex = 0;
  let explicitlyMoved = false;
  let dismissed = false;
  let composing = false;
  let timer = 0;
  let saveTimer = 0;
  const STORAGE_KEY = 'quiet-math-notepad-v1';

  try { const saved = localStorage.getItem(STORAGE_KEY); if (saved !== null) editor.value = saved; } catch (_) {}
  function save() { try { localStorage.setItem(STORAGE_KEY, editor.value); } catch (_) {} }
  function scheduleAnalyze(delay = 30) {
    clearTimeout(timer); timer = setTimeout(() => analyzeNow(), delay);
  }
  function analyzeNow() {
    if (composing || editor.selectionStart !== editor.selectionEnd) { setSuggestions([]); return; }
    const found = analyzeLine(editor.value, editor.selectionStart);
    if (dismissed) { setSuggestions([]); return; }
    setSuggestions(found);
  }
  function renderMiddle(el, chip) {
    const full = chip.displayEquation || '';
    const start = chip.highlightStart || 0;
    const max = 76;
    let prefix = full.slice(0, start), highlight = full.slice(start);
    const combined = prefix + highlight;
    if (combined.length <= max) {
      if (prefix) { const s = document.createElement('span'); s.className = 'known'; s.textContent = prefix; el.appendChild(s); }
      if (highlight) { const s = document.createElement('span'); s.className = 'fresh'; s.textContent = highlight; el.appendChild(s); }
      return;
    }
    const leftN = 34, rightN = 36;
    const left = combined.slice(0, leftN), right = combined.slice(-rightN);
    const leftSpan = document.createElement('span'); leftSpan.className = 'known'; leftSpan.textContent = left; el.appendChild(leftSpan);
    const ell = document.createElement('span'); ell.className = 'ellipsis'; ell.textContent = ' … '; el.appendChild(ell);
    const hStart = Math.max(0, start - (combined.length - rightN));
    const rightPrefix = right.slice(0, hStart), rightFresh = right.slice(hStart);
    if (rightPrefix) { const s = document.createElement('span'); s.className = 'known'; s.textContent = rightPrefix; el.appendChild(s); }
    if (rightFresh) { const s = document.createElement('span'); s.className = 'fresh'; s.textContent = rightFresh; el.appendChild(s); }
  }
  function setSuggestions(next, preserveSelection = false) {
    const old = selectedIndex;
    suggestions = Array.isArray(next) ? next : [];
    if (!preserveSelection) { selectedIndex = 0; explicitlyMoved = false; }
    else selectedIndex = Math.min(old, Math.max(0, suggestions.length - 1));
    renderChips(); syncMirror();
  }
  function renderChips() {
    chipsNode.replaceChildren();
    bar.classList.toggle('is-empty', suggestions.length === 0);
    hintNode.hidden = suggestions.length === 0;
    for (let i = 0; i < suggestions.length; i++) {
      const chip = suggestions[i];
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'chip' + (i === selectedIndex ? ' selected' : '');
      button.setAttribute('aria-label', chip.aria || chip.displayEquation || chip.insertText);
      button.setAttribute('aria-pressed', i === selectedIndex ? 'true' : 'false');
      button.addEventListener('mousedown', e => e.preventDefault());
      button.addEventListener('click', () => { acceptChip(i); editor.focus({ preventScroll: true }); });
      const equation = document.createElement('span'); equation.className = 'equation'; renderMiddle(equation, chip); button.appendChild(equation);
      if (chip.tag) { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = chip.tag; button.appendChild(tag); }
      chipsNode.appendChild(button);
    }
    if (selectedIndex >= 0 && chipsNode.children[selectedIndex]) {
      const el = chipsNode.children[selectedIndex];
      const rect = el.getBoundingClientRect(), parent = chipsNode.getBoundingClientRect();
      if (rect.left < parent.left) chipsNode.scrollLeft -= parent.left - rect.left + 12;
      else if (rect.right > parent.right) chipsNode.scrollLeft += rect.right - parent.right + 12;
    }
  }
  function ghostText() {
    if (!suggestions.length) return '';
    const chip = suggestions[selectedIndex];
    if (!chip || !chip.inlineEligible) return '';
    return chip.insertText;
  }
  function syncMirror() {
    const value = editor.value;
    const start = editor.selectionStart || 0;
    const end = editor.selectionEnd || start;
    const ghost = (start === end) ? ghostText() : '';
    mirror.replaceChildren();
    const before = document.createTextNode(value.slice(0, start)); mirror.appendChild(before);
    if (ghost) { const span = document.createElement('span'); span.className = 'ghost'; span.textContent = ghost; mirror.appendChild(span); }
    mirror.appendChild(document.createTextNode(value.slice(start)));
    if (value.endsWith('\n')) mirror.appendChild(document.createTextNode('\u200b'));
    mirror.scrollTop = editor.scrollTop; mirror.scrollLeft = editor.scrollLeft;
  }
  function insertTextAtSelection(text, replaceRange = null) {
    let start = editor.selectionStart, end = editor.selectionEnd;
    if (replaceRange) { start = replaceRange.start; end = replaceRange.end; editor.setSelectionRange(start, end); }
    const before = editor.value.slice(0, start), after = editor.value.slice(end);
    const oldLength = end - start;
    let ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch (_) {}
    if (!ok) {
      editor.setRangeText(text, start, end, 'end');
      editor.dispatchEvent(new Event('input', { bubbles: true }));
    } else if (editor.value === before + text + after && editor.selectionStart === start + text.length) {
      // native command already placed the caret.
    } else if (editor.value === before + after) {
      editor.setRangeText(text, start, end, 'end');
      editor.dispatchEvent(new Event('input', { bubbles: true }));
    }
    const target = Math.min(editor.value.length, start + text.length);
    editor.setSelectionRange(target, target);
    dismissed = false; explicitlyMoved = false;
    save(); scheduleAnalyze(30); syncMirror();
  }
  function acceptChip(index = selectedIndex) {
    const chip = suggestions[index]; if (!chip) return false;
    const replace = chip.replaceRange || null;
    setSuggestions([]);
    insertTextAtSelection(chip.insertText, replace);
    return true;
  }

  editor.addEventListener('input', () => {
    dismissed = false; explicitlyMoved = false;
    clearTimeout(saveTimer); saveTimer = setTimeout(save, 100);
    scheduleAnalyze(30); syncMirror();
  });
  editor.addEventListener('scroll', syncMirror, { passive: true });
  editor.addEventListener('select', () => { scheduleAnalyze(0); syncMirror(); });
  editor.addEventListener('click', () => { scheduleAnalyze(0); syncMirror(); });
  editor.addEventListener('keyup', e => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'PageUp', 'PageDown'].includes(e.key)) { scheduleAnalyze(0); syncMirror(); }
  });
  editor.addEventListener('compositionstart', () => { composing = true; setSuggestions([]); });
  editor.addEventListener('compositionend', () => { composing = false; dismissed = false; scheduleAnalyze(30); });
  editor.addEventListener('keydown', e => {
    if (e.isComposing || composing) return;
    if (e.key === 'Escape') { dismissed = true; setSuggestions([]); e.preventDefault(); return; }
    if (dismissed) dismissed = false;
    if (e.altKey && /^[1-9]$/.test(e.key)) {
      const i = Number(e.key) - 1; if (suggestions[i]) { e.preventDefault(); acceptChip(i); }
      return;
    }
    if ((e.key === 'Tab' || e.key === 'Enter') && (ghostText() || explicitlyMoved) && suggestions[selectedIndex]) {
      e.preventDefault(); acceptChip(selectedIndex); return;
    }
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); insertTextAtSelection('\t'); return; }
    if (e.key === 'Enter') { e.preventDefault(); insertTextAtSelection('\n'); return; }
    if (suggestions.length && ['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown'].includes(e.key)) {
      const dir = (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ? -1 : 1;
      const next = selectedIndex + dir;
      if (next >= 0 && next < suggestions.length) {
        e.preventDefault(); selectedIndex = next; explicitlyMoved = true; renderChips(); syncMirror(); return;
      }
      // At the ends, let the textarea move its caret and dismiss its inline preview.
      explicitlyMoved = false; dismissed = true; setTimeout(() => { scheduleAnalyze(0); }, 0); return;
    }
    // Any real keystroke clears a one-shot dismissal; normal typing then re-evaluates on input.
    if (e.key.length === 1 || ['Backspace', 'Delete'].includes(e.key)) {
      dismissed = false; explicitlyMoved = false;
    }
  });
  editor.addEventListener('keyup', () => { syncMirror(); });
  window.addEventListener('resize', syncMirror);

  // Exposed only to make manual smoke-testing of the standalone document convenient.
  window.__quietMath = { analyzeLine, tokenize, findValidSuffix, parseAndEvaluate, resolveUnitToken, formatExactOrInline };
  setSuggestions([]); syncMirror();
  scheduleAnalyze(100);
})();

  </script>
</body>
</html>
