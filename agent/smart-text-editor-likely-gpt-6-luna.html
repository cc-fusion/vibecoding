<body>

<script>
(() => {
  'use strict';

      try { n = BigInt((whole + frac).replace(/^0+(?=\d)/, '') || '0') * sign; } catch (_) { return null; }

      if (scale < 0) { n *= 10n ** BigInt(-scale); scale = 0; }

        if (digits.length <= scale) digits = '0'.repeat(scale + 1 - digits.length) + digits;

    if (!a || !b) return null;

      if (op === '-') return a.sub(b);
      if (op === '*') return a.mul(b);
      if (op === '/') return a.div(b);

     ----------------------------------------------------------------------- */
  const DIM_COUNT = 7;
  const DIM = { L: 0, M: 1, T: 2, I: 3, TEMP: 4, DATA: 5, ANGLE: 6 };
  const zeroDims = () => [0, 0, 0, 0, 0, 0, 0];

  const units = [];

  const powerUnits = new Map();
  const PREFIXES = [
    { symbol: 'q', name: 'quecto', factor: '1e-30' }, { symbol: 'r', name: 'ronto', factor: '1e-27' },
    { symbol: 'y', name: 'yocto', factor: '1e-24' }, { symbol: 'z', name: 'zepto', factor: '1e-21' },
    { symbol: 'a', name: 'atto', factor: '1e-18' }, { symbol: 'f', name: 'femto', factor: '1e-15' },
    { symbol: 'p', name: 'pico', factor: '1e-12' }, { symbol: 'n', name: 'nano', factor: '1e-9' },
    { symbol: 'µ', name: 'micro', factor: '1e-6' }, { symbol: 'm', name: 'milli', factor: '1e-3' },
    { symbol: 'c', name: 'centi', factor: '1e-2' }, { symbol: 'd', name: 'deci', factor: '1e-1' },
    { symbol: 'da', name: 'deca', factor: '1e1' }, { symbol: 'h', name: 'hecto', factor: '1e2' },
    { symbol: 'k', name: 'kilo', factor: '1e3' }, { symbol: 'M', name: 'mega', factor: '1e6' },
    { symbol: 'G', name: 'giga', factor: '1e9' }, { symbol: 'T', name: 'tera', factor: '1e12' },
    { symbol: 'P', name: 'peta', factor: '1e15' }, { symbol: 'E', name: 'exa', factor: '1e18' },
    { symbol: 'Z', name: 'zetta', factor: '1e21' }, { symbol: 'Y', name: 'yotta', factor: '1e24' },
    { symbol: 'R', name: 'ronna', factor: '1e27' }, { symbol: 'Q', name: 'quetta', factor: '1e30' }
  ];
  const LARGE_PREFIXES = new Set(['k', 'M', 'G', 'T', 'P', 'E', 'Z', 'Y', 'R', 'Q']);

  function normalizeUnitName(s) {
    return String(s).toLowerCase().replace(/[µμ]/g, 'u').replace(/[._]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function pluralOf(name) {
    if (!name || /\s/.test(name)) {

      if (/\binch$/.test(name)) return name + 'es';
      return /s$/.test(name) ? name : name + 's';

    for (const item of names || []) {

      factorDec: spec.factorDec || decFromRat(factorRat) || decFromString(factor),
      offset: Number(spec.offset || 0),
      offsetRat: (spec.offsetRat !== undefined) ? spec.offsetRat : Rat.fromDecimal(String(spec.offset || 0)),

      prefixable: spec.prefixable || 'none',

      longPlural: spec.longPlural || pluralOf(spec.longName || ((spec.names || [])[0] || spec.symbol || '')),

    pressure: dim([['M', 1], ['L', -1], ['T', -2]]), voltage: dim([['M', 1], ['L', 2], ['T', -3], ['I', -1]]),

          for(const scored of alt.scored.slice(0,1)){
            const rendered=prettyAst(scored.variant.ast);
            chips.push(...createFullSuggestions(scored,alt.info,{...shape,partial:false},'ambiguous',{forceChipOnly:true,displayExpr:rendered}));
          }
        }
      }
    }
    return {chips:addDedupe(chips),ghost:''};
  }
  function isDatePattern(s) {
    const x=s.trim();
    return /^\d{4}-\d{1,2}-\d{1,2}$/.test(x)||/^\d{1,2}[/.\-]\d{1,2}[/.\-]\d{2,4}$/.test(x);
  }
  function toSuperscript(value) {
    const map={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
    return String(value).split('').map(c=>map[c]||c).join('');
  }
  function prettyAst(ast, parent=0) {
    const prec={'+':40,'-':40,'*':60,'/':50,'%':50,'npr':55,'ncr':55,'^':80};
    if(ast.type==='num'){
      if(ast.sci&&/[eE]-/.test(ast.raw)){
        const m=ast.raw.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))[eE]-(\d+)$/);
        if(m){const exponent=Number(m[2]);const coefficient=Number(m[1])===1?'':`${m[1]}·`;return `${coefficient}10${toSuperscript(-exponent)}`;}
      }
      return ast.raw;
    }
    if(ast.type==='const')return ast.name==='pi'?'π':'e';
    if(ast.type==='unit')return ast.unit.symbol;
    if(ast.type==='unary')return ast.op+prettyAst(ast.child,70);
    if(ast.type==='postfix')return prettyAst(ast.child,100)+ast.op;
    if(ast.type==='func'){
      const arg=prettyAst(ast.arg,0);
      const base=ast.base?`log_${ast.base}`:ast.name;
      return `${base}${ast.power&&ast.power!==1?`^${ast.power}`:''}(${arg})`;
    }
    if(ast.type==='call2')return `${ast.name==='npr'?'nPr':'nCr'}(${prettyAst(ast.a)}, ${prettyAst(ast.b)})`;
    if(ast.type==='binary'){
      const p=prec[ast.op]||50;
      const left=prettyAst(ast.left,p),right=prettyAst(ast.right,p+(ast.op==='^'?0:1));
      const op=ast.op==='npr'?' nPr ':ast.op==='ncr'?' nCr ':(ast.op==='*'||ast.implicit)?'·':` ${ast.op} `;
      const s=left+op+right;return p<parent?`(${s})`:s;
    }
    return '';
  }

  /* -----------------------------------------------------------------------
     UI: ghost mirror, chip strip, key policy, insertion and autosave.
     ----------------------------------------------------------------------- */
  const editor=document.getElementById('editor');
  const mirror=document.getElementById('mirror');
  const bar=document.getElementById('suggestionBar');
  const strip=document.getElementById('chipStrip');
  const STORAGE_KEY='quiet-calc-notes-v1';
  let composing=false, dismissed=false, timer=0, saveTimer=0;
  let suggestions=[], highlighted=0, explicitlyMoved=false, currentGhost='', signature='';
  let lastRenderedCaret=-1;
  try { editor.value=localStorage.getItem(STORAGE_KEY)||''; } catch (_) { editor.value=''; }

  function renderMirror() {
    const text=editor.value;
    const start=editor.selectionStart||0;
    const end=editor.selectionEnd||start;
    mirror.replaceChildren();
    mirror.appendChild(document.createTextNode(text.slice(0,start)));
    if(start===end&&currentGhost){
      const span=document.createElement('span');span.className='ghost';span.textContent=currentGhost;mirror.appendChild(span);
    }
    mirror.appendChild(document.createTextNode(text.slice(end)));
    mirror.scrollTop=editor.scrollTop;mirror.scrollLeft=editor.scrollLeft;
  }
  function chipSignature(list) { return list.map(c=>`${c.kind}:${c.insertText}:${c.displayEquation}:${c.tag}`).join('\u0001'); }
  function renderChip(chip,index) {
    const button=document.createElement('button');button.type='button';button.className='chip';
    button.setAttribute('role','option');button.setAttribute('aria-selected',index===highlighted?'true':'false');button.setAttribute('aria-label',chip.ariaLabel);
    if(index===highlighted)button.classList.add('highlighted');
    if(chip.kind==='autocomplete'){
      const label=document.createElement('span');label.className='chip-label';label.textContent=chip.displayEquation;button.appendChild(label);
    }else{
      const equation=document.createElement('span');equation.className='equation';
      const left=document.createElement('span');left.className='eq-left';left.textContent=chip.displayExpr;
      const eq=document.createElement('span');eq.className='eq-equals';eq.textContent=' = ';
      const result=document.createElement('span');result.className='eq-result';
      if(chip.typedPrefixLen>0){
        const typed=document.createElement('span');typed.className='typed-result';typed.textContent=chip.typedPrefix;
        const rest=document.createElement('span');rest.className='inserted-result';rest.textContent=chip.resultText.slice(chip.typedPrefixLen);
        result.append(typed,rest);
      }else{
        const inserted=document.createElement('span');inserted.className='inserted-result';inserted.textContent=chip.resultText;result.appendChild(inserted);
      }
      equation.append(left,eq,result);button.appendChild(equation);
    }
    if(chip.tag){const tag=document.createElement('span');tag.className='chip-tag';tag.textContent=chip.tag;button.appendChild(tag);}
    button.addEventListener('mousedown',e=>e.preventDefault());
    button.addEventListener('touchstart',()=>{}, {passive:true});
    button.addEventListener('click',()=>acceptChip(index));
    return button;
  }
  function showSuggestions(list) {
    const nextSig=chipSignature(list);
    if(nextSig!==signature){highlighted=0;explicitlyMoved=false;signature=nextSig;}
    suggestions=list;
    if(!suggestions.length){
      bar.hidden=true;strip.replaceChildren();currentGhost='';renderMirror();return;
    }
    highlighted=clamp(highlighted,0,suggestions.length-1);
    strip.replaceChildren();
    suggestions.forEach((c,i)=>strip.appendChild(renderChip(c,i)));
    bar.hidden=false;
    const btn=strip.children[highlighted];
    if(btn){
      const r=btn.getBoundingClientRect(), s=strip.getBoundingClientRect();
      if(r.left<s.left||r.right>s.right)btn.scrollIntoView({block:'nearest',inline:'nearest'});
    }
    const selected=suggestions[highlighted];
    currentGhost=(!dismissed&&selected&&selected.inlineEligible)?selected.insertText:'';
    renderMirror();
  }
  function clearSuggestions() {
    suggestions=[];highlighted=0;explicitlyMoved=false;currentGhost='';signature='';
    bar.hidden=true;strip.replaceChildren();renderMirror();
  }
  function scheduleAnalysis() {
    clearTimeout(timer);
    timer=setTimeout(runEngine,30);
  }
  function runEngine() {
    if(dismissed||composing){clearSuggestions();return;}
    const text=editor.value, caret=editor.selectionStart||0;
    if(editor.selectionStart!==editor.selectionEnd){clearSuggestions();return;}
    const lineStart=text.lastIndexOf('\n',Math.max(0,caret-1))+1;
    let lineEnd=text.indexOf('\n',caret);if(lineEnd<0)lineEnd=text.length;
    if(text.slice(caret,lineEnd).trim()!==''){clearSuggestions();return;}
    const rawLine=text.slice(lineStart,caret);
    const result=runAnalysis(text,caret,lineStart,rawLine,composing);
    showSuggestions(result.chips||[]);
    lastRenderedCaret=caret;
  }
  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{try{localStorage.setItem(STORAGE_KEY,editor.value);}catch(_){}},180);
  }
  function insertText(text, range) {
    if(!text)return;
    editor.focus({preventScroll:true});
    const start=range?range.start:editor.selectionStart;
    const end=range?range.end:editor.selectionEnd;
    editor.setSelectionRange(start,end);
    const before=editor.value;
    let usedExec=false;
    try {
      if(document.execCommand){
        usedExec=document.execCommand('insertText',false,text);
      }
    } catch (_) { usedExec=false; }
    if(editor.value===before){
      editor.setRangeText(text,start,end,'end');
    }
    const pos=start+text.length;
    editor.setSelectionRange(pos,pos);
    saveSoon();
    dismissed=false;
    scheduleAnalysis();
    renderMirror();
  }
  function acceptChip(index=highlighted) {
    const chip=suggestions[index];if(!chip)return;
    const range=chip.replaceRange?chip.replaceRange:null;
    const insertion=chip.insertText;
    if(!insertion&&range){clearSuggestions();return;}
    insertText(insertion,range);
  }
  function moveHighlight(delta) {
    const next=highlighted+delta;
    if(next<0||next>=suggestions.length){dismissed=true;clearSuggestions();return false;}
    highlighted=next;explicitlyMoved=true;
    strip.querySelectorAll('.chip').forEach((b,i)=>{
      b.classList.toggle('highlighted',i===highlighted);b.setAttribute('aria-selected',i===highlighted?'true':'false');
    });
    const selected=suggestions[highlighted];
    currentGhost=(!dismissed&&selected&&selected.inlineEligible)?selected.insertText:'';
    const btn=strip.children[highlighted];if(btn)btn.scrollIntoView({block:'nearest',inline:'nearest'});
    renderMirror();return true;
  }
  editor.addEventListener('input',()=>{dismissed=false;saveSoon();scheduleAnalysis();renderMirror();});
  editor.addEventListener('scroll',()=>{mirror.scrollTop=editor.scrollTop;mirror.scrollLeft=editor.scrollLeft;});
  editor.addEventListener('click',()=>{if(!dismissed)scheduleAnalysis();renderMirror();});
  editor.addEventListener('keyup',e=>{
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key))scheduleAnalysis();
    renderMirror();
  });
  editor.addEventListener('compositionstart',()=>{composing=true;clearSuggestions();});
  editor.addEventListener('compositionend',()=>{composing=false;dismissed=false;scheduleAnalysis();});
  editor.addEventListener('keydown',e=>{
    if(e.isComposing||composing)return;
    if(dismissed&&e.key!=='Escape')dismissed=false;
    if(e.key==='Escape'){
      if(suggestions.length){e.preventDefault();dismissed=true;clearSuggestions();}
      return;
    }
    if((e.altKey)&&/^[1-9]$/.test(e.key)){
      const i=Number(e.key)-1;if(suggestions[i]){e.preventDefault();acceptChip(i);}return;
    }
    if(suggestions.length&&['ArrowLeft','ArrowUp'].includes(e.key)){
      if(moveHighlight(-1))e.preventDefault();return;
    }
    if(suggestions.length&&['ArrowRight','ArrowDown'].includes(e.key)){
      if(moveHighlight(1))e.preventDefault();return;
    }
    if(e.key==='Tab'){
      const chip=suggestions[highlighted];
      if(chip&&((currentGhost&&chip.inlineEligible)||explicitlyMoved)){
        e.preventDefault();acceptChip(highlighted);
      }else{
        e.preventDefault();insertText('\t');
      }
      return;
    }
    if(e.key==='Enter'){
      const chip=suggestions[highlighted];
      if(chip&&((currentGhost&&chip.inlineEligible)||explicitlyMoved)){
        e.preventDefault();acceptChip(highlighted);
      }
      return;
    }
  });
  document.addEventListener('selectionchange',()=>{
    if(document.activeElement===editor){
      renderMirror();
      if(editor.selectionStart!==editor.selectionEnd)clearSuggestions();
      else if(!composing&&!dismissed)scheduleAnalysis();
    }
  });
  window.addEventListener('resize',renderMirror);
  window.addEventListener('beforeunload',()=>{try{localStorage.setItem(STORAGE_KEY,editor.value);}catch(_){}});
  renderMirror();
  scheduleAnalysis();

})();
</script>
</body>
</html>
