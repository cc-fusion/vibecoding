<style type="text/tailwindcss">
/* /src/index.css */
/* ------------------------------------------------------------------ */
/* Forge IDE — theme + layout system                                   */
/* ------------------------------------------------------------------ */

:root {
  --font-ui: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;

  --menubar-h: 34px;
  --tabs-h: 35px;
  --statusbar-h: 22px;
  --activitybar-w: 44px;
  --sidebar-w: 260px;
  --panel-h: 220px;
  --preview-w: 50%;

  --radius: 4px;
  --transition: 120ms ease;

  /* Dark (default) */
  --bg-0: #0f1115;
  --bg-1: #15181e;
  --bg-2: #1b1f27;
  --bg-3: #232833;
  --bg-4: #2b313d;
  --border: #262b35;
  --border-strong: #343b48;
  --fg-0: #e6e9ef;
  --fg-1: #aeb4c0;
  --fg-2: #737a88;
  --accent: #5b9cff;
  --accent-soft: rgba(91, 156, 255, 0.16);
  --accent-fg: #0b1220;
  --danger: #ff6b6b;
  --warn: #f0b542;
  --success: #4fd18b;
  --info: #62b8ff;
  --selection: rgba(91, 156, 255, 0.28);
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
  --scrollbar: #3a4150;
}

:root[data-theme="dimmed"] {
  --bg-0: #1c1f26;
  --bg-1: #22262e;
  --bg-2: #282d36;
  --bg-3: #30363f;
  --bg-4: #3a414c;
  --border: #333943;
  --border-strong: #434b57;
  --fg-0: #e9ecf1;
  --fg-1: #b8bec9;
  --fg-2: #848c99;
  --accent: #e0a458;
  --accent-soft: rgba(224, 164, 88, 0.16);
  --accent-fg: #1a1408;
  --selection: rgba(224, 164, 88, 0.28);
  --scrollbar: #4a515e;
}

:root[data-theme="light"] {
  --bg-0: #e9ebef;
  --bg-1: #f3f4f7;
  --bg-2: #ffffff;
  --bg-3: #e4e7ec;
  --bg-4: #d7dbe2;
  --border: #d4d8df;
  --border-strong: #b9bfc9;
  --fg-0: #1b1f27;
  --fg-1: #454c59;
  --fg-2: #7b8393;
  --accent: #2a6ee8;
  --accent-soft: rgba(42, 110, 232, 0.14);
  --accent-fg: #ffffff;
  --danger: #d1373f;
  --warn: #b8770a;
  --success: #1f9d5a;
  --info: #1c7ed6;
  --selection: rgba(42, 110, 232, 0.22);
  --shadow: 0 8px 28px rgba(20, 30, 50, 0.18);
  --scrollbar: #b9bfc9;
}

* {
  box-sizing: border-box;
}
html,
body,
#root,
.ide-host {
  height: 100%;
  margin: 0;
  padding: 0;
}
body {
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--fg-0);
  background: var(--bg-0);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}
:focus-visible {
  outline: 1px solid var(--accent);
  outline-offset: -1px;
}
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-thumb {
  background: var(--scrollbar);
  border: 2px solid transparent;
  background-clip: content-box;
  border-radius: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
.hidden {
  display: none !important;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

/* ---------- Shell ---------- */
.ide {
  height: 100%;
  display: grid;
  grid-template-rows: var(--menubar-h) 1fr var(--statusbar-h);
  background: var(--bg-0);
  color: var(--fg-0);
  position: relative;
}
.ide-body {
  display: flex;
  min-height: 0;
  position: relative;
}

/* ---------- Menu bar ---------- */
.menubar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 8px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  user-select: none;
}
.menubar .brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 12.5px;
  letter-spacing: 0.2px;
  margin-right: 10px;
  color: var(--fg-0);
}
.menubar .brand .logo {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  background: linear-gradient(135deg, var(--accent), #8f5bff);
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}
.menu {
  position: relative;
}
.menu > button {
  padding: 4px 8px;
  border-radius: var(--radius);
  color: var(--fg-1);
  font-size: 12.5px;
}
.menu > button:hover,
.menu.open > button {
  background: var(--bg-3);
  color: var(--fg-0);
}
.menu-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  min-width: 220px;
  background: var(--bg-2);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  box-shadow: var(--shadow);
  padding: 4px;
  z-index: 60;
  display: none;
}
.menu.open .menu-dropdown {
  display: block;
}
.menu-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 24px;
  padding: 5px 8px;
  border-radius: var(--radius);
  color: var(--fg-0);
  font-size: 12.5px;
  text-align: left;
}
.menu-item:hover,
.menu-item:focus-visible {
  background: var(--accent-soft);
}
.menu-item kbd {
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--fg-2);
}
.menu-separator {
  height: 1px;
  background: var(--border);
  margin: 4px 2px;
}
.menubar .spacer {
  flex: 1;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 4px;
}
.tb-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 24px;
  padding: 0 8px;
  border-radius: var(--radius);
  color: var(--fg-1);
  font-size: 12px;
  border: 1px solid transparent;
  transition: background var(--transition), color var(--transition);
}
.tb-btn svg {
  width: 14px;
  height: 14px;
  flex: none;
}
.tb-btn:hover:not(:disabled) {
  background: var(--bg-3);
  color: var(--fg-0);
}
.tb-btn.primary {
  color: var(--success);
}
.tb-btn.primary:hover:not(:disabled) {
  background: rgba(79, 209, 139, 0.14);
}
.tb-btn.danger {
  color: var(--danger);
}
.tb-btn.danger:hover:not(:disabled) {
  background: rgba(255, 107, 107, 0.14);
}
.tb-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
}
.run-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--fg-2);
  padding: 0 8px;
  max-width: 260px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.run-status .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--fg-2);
}
.run-status.running .dot {
  background: var(--success);
  animation: pulse 1.1s infinite;
}
.run-status.building .dot {
  background: var(--warn);
  animation: pulse 1.1s infinite;
}
@keyframes pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.35;
  }
}

/* ---------- Activity bar ---------- */
.activitybar {
  width: var(--activitybar-w);
  flex: none;
  background: var(--bg-1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 0;
  gap: 2px;
}
.activitybar .spacer {
  flex: 1;
}
.act-btn {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  color: var(--fg-2);
  position: relative;
}
.act-btn svg {
  width: 20px;
  height: 20px;
}
.act-btn:hover {
  color: var(--fg-0);
  background: var(--bg-3);
}
.act-btn.active {
  color: var(--accent);
}
.act-btn.active::before {
  content: "";
  position: absolute;
  left: -4px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: var(--accent);
  border-radius: 2px;
}
.act-btn .badge {
  position: absolute;
  top: 3px;
  right: 3px;
  min-width: 14px;
  height: 14px;
  padding: 0 3px;
  font-size: 9.5px;
  font-weight: 600;
  border-radius: 7px;
  background: var(--danger);
  color: #fff;
  display: grid;
  place-items: center;
}

/* ---------- Sidebar ---------- */
.sidebar {
  width: var(--sidebar-w);
  flex: none;
  background: var(--bg-1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
}
.ide.sidebar-hidden .sidebar,
.ide.sidebar-hidden .sidebar-resizer {
  display: none;
}
.sidebar-header {
  height: 32px;
  display: flex;
  align-items: center;
  padding: 0 8px 0 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--fg-1);
  gap: 4px;
}
.sidebar-header .title {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  width: 22px;
  height: 22px;
  display: inline-grid;
  place-items: center;
  border-radius: var(--radius);
  color: var(--fg-2);
  flex: none;
}
.icon-btn svg {
  width: 14px;
  height: 14px;
}
.icon-btn:hover:not(:disabled) {
  background: var(--bg-3);
  color: var(--fg-0);
}
.icon-btn.active {
  color: var(--accent);
  background: var(--accent-soft);
}
.sidebar-body {
  flex: 1;
  overflow: auto;
  min-height: 0;
}

/* Explorer tree */
.tree {
  padding: 2px 0 12px;
  user-select: none;
}
.tree-row {
  display: flex;
  align-items: center;
  height: 24px;
  padding-right: 8px;
  gap: 4px;
  cursor: pointer;
  color: var(--fg-1);
  white-space: nowrap;
  border: 1px solid transparent;
}
.tree-row:hover {
  background: var(--bg-3);
  color: var(--fg-0);
}
.tree-row.selected {
  background: var(--accent-soft);
  color: var(--fg-0);
}
.tree-row.active {
  color: var(--fg-0);
}
.tree-row:focus-visible {
  border-color: var(--accent);
}
.tree-row .chev {
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  color: var(--fg-2);
  flex: none;
}
.tree-row .chev svg {
  width: 12px;
  height: 12px;
  transition: transform var(--transition);
}
.tree-row.expanded .chev svg {
  transform: rotate(90deg);
}
.tree-row .file-icon {
  width: 16px;
  height: 16px;
  flex: none;
  display: grid;
  place-items: center;
  font-size: 8.5px;
  font-weight: 700;
  font-family: var(--font-mono);
  border-radius: 3px;
  color: #fff;
  letter-spacing: -0.2px;
}
.tree-row .folder-icon {
  width: 16px;
  height: 16px;
  flex: none;
  color: var(--fg-2);
}
.tree-row .folder-icon svg {
  width: 16px;
  height: 16px;
}
.tree-row .label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12.5px;
}
.tree-row input.inline-edit {
  flex: 1;
  height: 20px;
  background: var(--bg-0);
  border: 1px solid var(--accent);
  border-radius: 3px;
  padding: 0 4px;
  font-size: 12.5px;
  outline: none;
  min-width: 0;
}
.tree-empty {
  padding: 16px;
  color: var(--fg-2);
  font-size: 12px;
}

/* ---------- Main / Editor ---------- */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  position: relative;
}
.workbench {
  flex: 1;
  display: flex;
  min-height: 0;
  min-width: 0;
}
.editor-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--bg-0);
}
.tabs {
  height: var(--tabs-h);
  display: flex;
  align-items: stretch;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
  flex: none;
}
.tabs::-webkit-scrollbar {
  height: 4px;
}
.tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px 0 10px;
  min-width: 110px;
  max-width: 220px;
  border-right: 1px solid var(--border);
  color: var(--fg-2);
  cursor: pointer;
  position: relative;
  font-size: 12.5px;
  background: var(--bg-1);
  user-select: none;
  flex: none;
}
.tab:hover {
  color: var(--fg-1);
  background: var(--bg-2);
}
.tab.active {
  color: var(--fg-0);
  background: var(--bg-0);
}
.tab.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 2px;
  background: var(--accent);
}
.tab .file-icon {
  width: 14px;
  height: 14px;
  font-size: 7.5px;
  font-weight: 700;
  font-family: var(--font-mono);
  border-radius: 3px;
  color: #fff;
  display: grid;
  place-items: center;
  flex: none;
}
.tab .name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tab .save-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: transparent;
  flex: none;
}
.tab .save-dot.pending {
  background: var(--warn);
}
.tab .save-dot.error {
  background: var(--danger);
}
.tab .close {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  border-radius: 3px;
  color: var(--fg-2);
  opacity: 0;
  flex: none;
}
.tab .close svg {
  width: 12px;
  height: 12px;
}
.tab:hover .close,
.tab.active .close,
.tab .close:focus-visible {
  opacity: 1;
}
.tab .close:hover {
  background: var(--bg-4);
  color: var(--fg-0);
}
.editor-container {
  flex: 1;
  min-height: 0;
  position: relative;
}
.editor-container .monaco-host {
  position: absolute;
  inset: 0;
}
.editor-empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--fg-2);
  gap: 10px;
  text-align: center;
  padding: 20px;
}
.editor-empty h2 {
  margin: 0;
  font-weight: 600;
  font-size: 15px;
  color: var(--fg-1);
}
.editor-empty .hints {
  display: grid;
  grid-template-columns: auto auto;
  gap: 6px 14px;
  font-size: 12px;
  text-align: left;
}
.editor-empty kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-2);
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--fg-1);
}
.editor-loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--fg-2);
  font-size: 12.5px;
  gap: 8px;
}
.editor-loading .spinner,
.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid var(--border-strong);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: inline-block;
  vertical-align: middle;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.editor-error {
  position: absolute;
  inset: 0;
  padding: 24px;
  color: var(--danger);
  font-family: var(--font-mono);
  font-size: 12px;
  white-space: pre-wrap;
  overflow: auto;
}

/* Preview */
.preview {
  flex: none;
  width: var(--preview-w);
  display: none;
  flex-direction: column;
  min-width: 0;
  border-left: 1px solid var(--border);
  background: var(--bg-1);
}
.ide.preview-split .preview,
.ide.preview-only .preview,
.ide.preview-fullscreen .preview {
  display: flex;
}
.ide.preview-only .editor-area,
.ide.preview-only .preview-resizer {
  display: none;
}
.ide.preview-only .preview {
  flex: 1;
  width: auto;
  border-left: none;
}
.ide.preview-fullscreen .preview {
  position: fixed;
  inset: 0;
  z-index: 90;
  width: auto;
  border: none;
}
.ide:not(.preview-split) .preview-resizer {
  display: none;
}
.preview-toolbar {
  height: var(--tabs-h);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 6px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-1);
  flex: none;
}
.preview-toolbar .target {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--fg-1);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 6px;
}
.preview-frame-wrap {
  flex: 1;
  min-height: 0;
  background: #fff;
  position: relative;
}
.preview-frame-wrap iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  background: #fff;
}

/* Resizers */
.sidebar-resizer,
.panel-resizer,
.preview-resizer {
  flex: none;
  background: transparent;
  position: relative;
  z-index: 5;
  transition: background var(--transition);
}
.sidebar-resizer,
.preview-resizer {
  width: 4px;
  cursor: col-resize;
  margin-left: -2px;
  margin-right: -2px;
}
.panel-resizer {
  height: 4px;
  cursor: row-resize;
  margin-top: -2px;
  margin-bottom: -2px;
}
.sidebar-resizer:hover,
.panel-resizer:hover,
.preview-resizer:hover,
.resizer-active {
  background: var(--accent);
}
body.resizing {
  cursor: col-resize;
  user-select: none;
}
body.resizing-v {
  cursor: row-resize;
  user-select: none;
}
body.resizing iframe,
body.resizing-v iframe {
  pointer-events: none;
}

/* ---------- Bottom panel ---------- */
.panel {
  height: var(--panel-h);
  flex: none;
  display: flex;
  flex-direction: column;
  background: var(--bg-1);
  border-top: 1px solid var(--border);
  min-height: 0;
}
.ide.panel-hidden .panel,
.ide.panel-hidden .panel-resizer {
  display: none;
}
.panel-header {
  height: 30px;
  display: flex;
  align-items: center;
  padding: 0 6px 0 4px;
  border-bottom: 1px solid var(--border);
  flex: none;
  gap: 2px;
}
.panel-tab {
  padding: 0 10px;
  height: 30px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--fg-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  position: relative;
  font-weight: 500;
}
.panel-tab:hover {
  color: var(--fg-0);
}
.panel-tab.active {
  color: var(--fg-0);
}
.panel-tab.active::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: -1px;
  height: 1px;
  background: var(--accent);
}
.panel-tab .count {
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--bg-3);
  color: var(--fg-1);
  font-size: 10px;
  display: inline-grid;
  place-items: center;
  letter-spacing: 0;
}
.panel-tab .count.errors {
  background: rgba(255, 107, 107, 0.2);
  color: var(--danger);
}
.panel-header .spacer {
  flex: 1;
}
.panel-body {
  flex: 1;
  min-height: 0;
  position: relative;
}
.channel {
  position: absolute;
  inset: 0;
  overflow: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  padding: 6px 10px;
  display: none;
  background: var(--bg-0);
}
.channel.active {
  display: block;
}
.channel .line {
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--fg-1);
}
.channel .line.stdout {
  color: var(--fg-0);
}
.channel .line.stderr,
.channel .line.error {
  color: var(--danger);
}
.channel .line.warn {
  color: var(--warn);
}
.channel .line.info {
  color: var(--info);
}
.channel .line.success {
  color: var(--success);
}
.channel .line.system {
  color: var(--fg-2);
}
.channel .line.system::before {
  content: "› ";
  opacity: 0.7;
}
.channel .line.cmd {
  color: var(--accent);
}
.channel .line.cmd::before {
  content: "$ ";
  color: var(--fg-2);
}
.channel.terminal {
  display: none;
  flex-direction: column;
  padding: 0;
}
.channel.terminal.active {
  display: flex;
}
.terminal-log {
  flex: 1;
  overflow: auto;
  padding: 6px 10px;
}
.terminal-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px;
  border-top: 1px solid var(--border);
  background: var(--bg-1);
  flex: none;
}
.terminal-input-row .prompt {
  color: var(--accent);
}
.terminal-input-row input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--fg-0);
}

/* Problems */
.problems {
  font-family: var(--font-ui);
  padding: 2px 0;
}
.problem-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 3px 10px;
  cursor: pointer;
  font-size: 12.5px;
  color: var(--fg-1);
  width: 100%;
  text-align: left;
  border-radius: 0;
}
.problem-row:hover,
.problem-row:focus-visible {
  background: var(--bg-3);
  color: var(--fg-0);
}
.problem-row .sev {
  width: 14px;
  height: 14px;
  flex: none;
  margin-top: 2px;
}
.problem-row .sev.error {
  color: var(--danger);
}
.problem-row .sev.warning {
  color: var(--warn);
}
.problem-row .sev.info {
  color: var(--info);
}
.problem-row .msg {
  flex: 1;
  min-width: 0;
  word-break: break-word;
}
.problem-row .loc {
  color: var(--fg-2);
  font-family: var(--font-mono);
  font-size: 11px;
  white-space: nowrap;
}
.problem-row .src {
  color: var(--fg-2);
  font-size: 11px;
}
.problems-empty,
.channel-empty {
  color: var(--fg-2);
  padding: 8px 10px;
  font-size: 12px;
  font-family: var(--font-ui);
}

/* ---------- Status bar ---------- */
.statusbar {
  display: flex;
  align-items: center;
  background: var(--bg-1);
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--fg-1);
  padding: 0 6px;
  user-select: none;
  gap: 2px;
}
.statusbar .spacer {
  flex: 1;
}
.sb-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: var(--statusbar-h);
  padding: 0 7px;
  border-radius: 3px;
  white-space: nowrap;
  color: inherit;
}
.sb-item svg {
  width: 12px;
  height: 12px;
}
button.sb-item:hover {
  background: var(--bg-3);
  color: var(--fg-0);
}
.sb-item.saving {
  color: var(--warn);
}
.sb-item.saved {
  color: var(--fg-1);
}
.sb-item.error {
  color: var(--danger);
  font-weight: 600;
}
.sb-item.running {
  color: var(--success);
}
.sb-item.building {
  color: var(--warn);
}
.sb-item .problems-err {
  color: var(--danger);
}
.sb-item .problems-warn {
  color: var(--warn);
}

/* ---------- Overlays ---------- */
.overlay-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.35);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 10vh;
}
.overlay-backdrop.center {
  align-items: center;
  padding-top: 0;
}
.dialog {
  background: var(--bg-2);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  box-shadow: var(--shadow);
  min-width: 320px;
  max-width: min(520px, 92vw);
  padding: 16px;
}
.dialog h3 {
  margin: 0 0 8px;
  font-size: 14px;
  font-weight: 600;
}
.dialog p {
  margin: 0 0 14px;
  color: var(--fg-1);
  font-size: 12.5px;
  line-height: 1.5;
  word-break: break-word;
}
.dialog .actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.btn {
  height: 28px;
  padding: 0 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border-strong);
  background: var(--bg-3);
  color: var(--fg-0);
  font-size: 12.5px;
}
.btn:hover {
  background: var(--bg-4);
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-fg);
}
.btn.primary:hover {
  filter: brightness(1.08);
}
.btn.danger {
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
}
.dialog input.text {
  width: 100%;
  height: 30px;
  background: var(--bg-0);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 0 8px;
  margin-bottom: 14px;
  outline: none;
}
.dialog input.text:focus {
  border-color: var(--accent);
}

/* Quick open */
.quick-open {
  width: min(600px, 92vw);
  background: var(--bg-2);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.quick-open input {
  width: 100%;
  height: 38px;
  background: var(--bg-0);
  border: none;
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  outline: none;
  font-size: 13.5px;
}
.quick-open .results {
  max-height: 50vh;
  overflow: auto;
  padding: 4px;
}
.qo-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 6px 8px;
  border-radius: var(--radius);
  text-align: left;
  color: var(--fg-1);
}
.qo-item.selected,
.qo-item:hover {
  background: var(--accent-soft);
  color: var(--fg-0);
}
.qo-item .file-icon {
  width: 16px;
  height: 16px;
  font-size: 8px;
  font-weight: 700;
  font-family: var(--font-mono);
  border-radius: 3px;
  color: #fff;
  display: grid;
  place-items: center;
  flex: none;
}
.qo-item .name {
  font-size: 13px;
}
.qo-item .name mark,
.qo-item .path mark {
  background: none;
  color: var(--accent);
  font-weight: 600;
}
.qo-item .path {
  color: var(--fg-2);
  font-size: 11.5px;
  font-family: var(--font-mono);
  margin-left: auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 50%;
}
.qo-empty {
  padding: 12px;
  color: var(--fg-2);
  font-size: 12.5px;
}

/* Context menu */
.context-menu {
  position: fixed;
  z-index: 120;
  min-width: 180px;
  background: var(--bg-2);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  box-shadow: var(--shadow);
  padding: 4px;
}
.context-menu .menu-item.danger {
  color: var(--danger);
}

/* Settings panel */
.settings-panel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(380px, 100%);
  background: var(--bg-1);
  border-left: 1px solid var(--border);
  z-index: 70;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
}
.settings-panel header {
  height: 40px;
  display: flex;
  align-items: center;
  padding: 0 8px 0 16px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 13px;
}
.settings-panel header .title {
  flex: 1;
}
.settings-body {
  flex: 1;
  overflow: auto;
  padding: 8px 16px 24px;
}
.settings-group {
  margin-top: 14px;
}
.settings-group h4 {
  margin: 0 0 6px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--fg-2);
  font-weight: 600;
}
.setting {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
}
.setting:last-child {
  border-bottom: none;
}
.setting .lbl {
  font-size: 12.5px;
  color: var(--fg-0);
}
.setting .desc {
  font-size: 11px;
  color: var(--fg-2);
  margin-top: 2px;
}
.setting select,
.setting input[type="number"] {
  height: 26px;
  background: var(--bg-0);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 0 6px;
  min-width: 110px;
  outline: none;
}
.setting select:focus,
.setting input:focus {
  border-color: var(--accent);
}
.setting input[type="range"] {
  width: 120px;
  accent-color: var(--accent);
}
.switch {
  position: relative;
  width: 34px;
  height: 18px;
  border-radius: 9px;
  background: var(--bg-4);
  border: 1px solid var(--border-strong);
  transition: background var(--transition);
  flex: none;
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--fg-1);
  transition: transform var(--transition), background var(--transition);
}
.switch[aria-checked="true"] {
  background: var(--accent);
  border-color: var(--accent);
}
.switch[aria-checked="true"]::after {
  transform: translateX(16px);
  background: #fff;
}
.switch:disabled {
  opacity: 0.7;
}
.settings-note {
  margin-top: 16px;
  padding: 10px 12px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg-1);
  font-size: 11.5px;
  line-height: 1.5;
}

/* Language picker */
.picker {
  position: fixed;
  z-index: 120;
  background: var(--bg-2);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  box-shadow: var(--shadow);
  padding: 4px;
  max-height: 60vh;
  overflow: auto;
  min-width: 200px;
}

/* Toasts */
.toasts {
  position: fixed;
  right: 12px;
  bottom: calc(var(--statusbar-h) + 10px);
  z-index: 130;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 360px;
}
.toast {
  background: var(--bg-2);
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--info);
  border-radius: 6px;
  box-shadow: var(--shadow);
  padding: 8px 12px;
  font-size: 12.5px;
  color: var(--fg-0);
  word-break: break-word;
}
.toast.error {
  border-left-color: var(--danger);
}
.toast.warn {
  border-left-color: var(--warn);
}
.toast.success {
  border-left-color: var(--success);
}

/* ---------- Responsive ---------- */
.sidebar-backdrop {
  display: none;
}
@media (max-width: 900px) {
  .sidebar {
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--activitybar-w);
    z-index: 40;
    width: min(var(--sidebar-w), calc(100vw - var(--activitybar-w)));
    box-shadow: var(--shadow);
  }
  .sidebar-resizer {
    display: none;
  }
  .ide:not(.sidebar-hidden) .sidebar-backdrop {
    display: block;
    position: absolute;
    inset: 0;
    z-index: 39;
    background: rgba(0, 0, 0, 0.3);
  }
  .ide.preview-split .workbench {
    flex-direction: column;
  }
  .ide.preview-split .preview {
    width: auto;
    height: 50%;
    border-left: none;
    border-top: 1px solid var(--border);
  }
  .preview-resizer {
    display: none !important;
  }
  .menu-dropdown {
    min-width: 200px;
  }
}
@media (max-width: 640px) {
  :root {
    --sidebar-w: 240px;
  }
  .tb-btn .lbl,
  .run-status,
  .menubar .brand .name {
    display: none;
  }
  .menubar {
    padding: 0 4px;
  }
  .menu > button {
    padding: 4px 6px;
  }
  .sb-item.optional {
    display: none;
  }
  .tab {
    min-width: 90px;
  }
  .settings-panel {
    width: 100%;
  }
  .panel {
    max-height: 60vh;
  }
}

/* Monaco tweaks */
.monaco-host .monaco-editor .margin,
.monaco-host .monaco-editor {
  outline: none;
}
</style>

function installShortcuts(actions) {
  const handler = (e) => {
    if (e.defaultPrevented) return;
    const mod = e.ctrlKey || e.metaKey;
    const key = e.key.toLowerCase();
    if (e.key === "F5" && !mod && !e.shiftKey && !e.altKey) {
      e.preventDefault();
      actions.runProject();
      return;
    }
    if (!mod || e.altKey) return;
    if (key === "p" && !e.shiftKey) {
      e.preventDefault();
      actions.quickOpen();
    } else if (key === "b" && !e.shiftKey) {
      e.preventDefault();
      actions.toggleSidebar();
    } else if (key === "j" && !e.shiftKey) {
      e.preventDefault();
      actions.togglePanel();
    } else if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      actions.runFile();
    } else if ((key === "f" || key === "h") && !e.shiftKey && !actions.editorHasFocus()) {
      const target = e.target;
      if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA")) return;
      e.preventDefault();
      if (key === "f") actions.find();
      else actions.replace();
    }
  };
  document.addEventListener("keydown", handler);
  return () => document.removeEventListener("keydown", handler);
}
