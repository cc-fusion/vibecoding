y free rod. Decay heat (about 6%) keeps coming for minutes — cooling must continue. A tripped reactor stays latched until you press RESET TRIP."]},{title:"Coolant, Steam, Grid",body:["Two coolant pumps move heat from the core to the steam generator. Less flow = hotter coolant. Pressurizer heaters/spray hold primary pressure (Auto does it for you). Low pressure + hot coolant = boiling voids.","Steam pressure feeds the turbine governor. Auto governor opens the valve to meet demand; manual lets you set it. Bypass dumps surplus steam to the condenser; the cooling tower sets how much heat the condenser can shed (heat waves hurt).","Feedwater keeps SG level. If the feed pump is down, switch on AFW. Safety: ECCS injects borated water (and poisons the core), RHR adds cooling, containment spray cuts building pressure, Vent dumps pressure but releases activity.","Power sources: offsite grid or the emergency diesel (60% pump speed, finite fuel). Without any power pumps coast down and rods can't move — but SCRAM always works."]},{title:"Wear & Maintenance",body:["Every component has health. Stress wears it: pump speed, turbine load, thermal cycling, rod travel, fan speed. Below 40% it runs degraded; at low health it can fail at random.","Assign a crew in the Maintenance tab: the part is tagged out (offline) while crews work, then restored to 100% for a parts cost. Choose your moment — taking a pump offline mid-ramp has consequences."]},{title:"Alarms & Events",body:["Annunciator tiles flash until acknowledged (A key or ACK button). Unacknowledged alarms sound the horn repeatedly. Events: pump seizure, coolant leak (pipe), SG tube leak, stuck rod, turbine trip, loss of offsite power, earthquake, heat wave, demand surge, diesel jam, flood.","Leaks must be isolated (takes a few seconds). Pipe leaks fill containment; tube leaks release activity out the secondary side.","Modifiers on the briefing screen add risk and credit multipliers. Difficulty can be changed live in Settings."]}]
