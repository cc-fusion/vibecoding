<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLS–MPM API · Basic example</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #dce8ee; background: #060d13; font: 14px/1.5 system-ui, sans-serif; }
      main { width: min(1000px, 94vw); margin: 30px auto; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
      h1 { margin: 0; font-size: 22px; font-weight: 600; }
      p { margin: 4px 0 0; color: #78909e; }
      #stats { color: #78909e; font-variant-numeric: tabular-nums; }
      canvas { display: block; width: 100%; height: min(68vh, 680px); min-height: 380px; border: 1px solid #1b303d; border-radius: 12px; }
      .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 14px; }
      button { padding: 8px 14px; border: 1px solid #27404e; border-radius: 6px; color: #c6d7df; background: #10202a; cursor: pointer; }
      button:hover { background: #172c38; }
      label { display: flex; align-items: center; gap: 8px; color: #8da3af; font-size: 12px; }
      input { accent-color: #55c8e9; }
      output { min-width: 30px; color: #c6d7df; font-variant-numeric: tabular-nums; }
      #error { color: #ff9c92; }
      code { color: #8fdcf3; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>MLS–MPM <code>2D API</code></h1>
          <p>One script file. Procedural particles. No assets.</p>
        </div>
        <span id="stats">Initializing…</span>
      </header>
      <canvas id="simulation"></canvas>
      <div class="controls">
        <button id="toggle">Pause</button>
        <button id="reset">Reset</button>
        <button id="step">Step</button>
        <label>Gravity <input id="gravity" type="range" min="0" max="20" step="0.1" value="9.8" /><output id="gravity-value">9.8</output></label>
        <label>Viscosity <input id="viscosity" type="range" min="0" max="0.4" step="0.01" value="0.3" /><output id="viscosity-value">0.30</output></label>
        <label><input id="grid" type="checkbox" /> Grid</label>
        <span id="error" role="alert"></span>
      </div>
    </main>

    <script src="../dist/mls-mpm.js"></script>
    <script>
      const simulation = new MLSMPM.Simulation({
        canvas: '#simulation',
        gridSize: 80,
        maxParticles: 20000,
        substepsPerFrame: 20,
        gravity: { x: 0, y: -9.8 },
        viscosity: 0.3,
        fluid: { bulkModulus: 400 },
        elastic: { youngsModulus: 5000, poissonRatio: 0.2 },
        snow: { youngsModulus: 5000, poissonRatio: 0.2, hardening: 10 },
        renderer: { particleSize: 2.1 },
        onFrame(info) {
          document.querySelector('#stats').textContent =
            `${simulation.world.count.toLocaleString()} particles · ${info.simulationTime.toFixed(3)} s`;
        },
        onError(error) {
          document.querySelector('#error').textContent = error.message;
        },
      });

      simulation.addRectangle({
        x: 0.07, y: 0.04, width: 0.24, height: 0.45,
        material: 'fluid',
      });
      simulation.addCircle({
        x: 0.7, y: 0.76, radiusX: 0.09,
        material: 'elastic', vy: -0.2,
      });
      simulation.addEllipse({
        x: 0.47, y: 0.72, radiusX: 0.11, radiusY: 0.075,
        material: 'snow',
      });

      // start() captures this scene for reset(). You can also call
      // simulation.captureInitialState() explicitly after changing a scene.
      simulation.start();

      document.querySelector('#toggle').addEventListener('click', (event) => {
        if (simulation.running) simulation.stop();
        else simulation.start();
        event.currentTarget.textContent = simulation.running ? 'Pause' : 'Play';
      });
      document.querySelector('#reset').addEventListener('click', () => simulation.reset());
      document.querySelector('#step').addEventListener('click', () => {
        simulation.stop();
        document.querySelector('#toggle').textContent = 'Play';
        simulation.step(1);
      });
      document.querySelector('#gravity').addEventListener('input', (event) => {
        const value = Number(event.currentTarget.value);
        document.querySelector('#gravity-value').textContent = value.toFixed(1);
        simulation.setParameters({ gravity: { y: -value } });
      });
      document.querySelector('#viscosity').addEventListener('input', (event) => {
        const value = Number(event.currentTarget.value);
        document.querySelector('#viscosity-value').textContent = value.toFixed(2);
        simulation.setParameters({ viscosity: value });
      });
      document.querySelector('#grid').addEventListener('change', (event) => {
        simulation.setRendererOptions({ showGrid: event.currentTarget.checked });
      });
    </script>
  </body>
</html>
