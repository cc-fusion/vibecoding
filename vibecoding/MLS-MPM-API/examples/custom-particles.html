<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLS–MPM API · Custom particles</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #dce8ee; background: #060d13; font: 14px system-ui, sans-serif; }
      main { width: min(900px, 94vw); }
      h1 { font-size: 20px; font-weight: 500; }
      p { color: #78909e; }
      canvas { display: block; width: 100%; height: min(70vh, 650px); min-height: 360px; border: 1px solid #1b303d; border-radius: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Custom particle arrays</h1>
      <p>Positions and velocities are flat XY arrays. Drag to interact.</p>
      <canvas id="simulation"></canvas>
    </main>
    <script src="../dist/mls-mpm.js"></script>
    <script>
      const simulation = new MLSMPM.Simulation({
        canvas: '#simulation',
        gridSize: 72,
        substepsPerFrame: 20,
        gravity: { x: 0.4, y: -7 },
        renderer: {
          particleSize: 2.2,
          colors: { fluid: '#63d5ff', elastic: '#ffbf69', snow: '#a7f3d0' },
        },
      });

      const positions = [];
      const velocities = [];
      const spacing = 0.5 / 72;
      // A custom wave-shaped fluid body, without any mesh or image assets.
      for (let y = 0.12; y < 0.58; y += spacing) {
        for (let x = 0.08; x < 0.43; x += spacing) {
          const surface = 0.48 + 0.06 * Math.sin(x * 45);
          if (y > surface) continue;
          positions.push(x, y);
          velocities.push(0.15, 0);
        }
      }
      simulation.addParticles({
        positions,
        velocities,
        material: 'fluid',
        volume: spacing * spacing,
      });
      simulation.addCircle({ x: 0.72, y: 0.7, radiusX: 0.12, material: 'elastic' });
      simulation.start();
    </script>
  </body>
</html>
