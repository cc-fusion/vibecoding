<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLS–MPM JavaScript API · Native module</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #dce8ee; background: #060d13; font: 14px system-ui, sans-serif; }
      main { width: min(900px, 94vw); }
      h1 { font-size: 20px; font-weight: 500; }
      p { color: #78909e; }
      canvas { display: block; width: 100%; height: min(70vh, 650px); min-height: 360px; border: 1px solid #1b303d; border-radius: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Native JavaScript modules</h1>
      <p>This example imports the readable <code>src/index.js</code> source directly—no bundle.</p>
      <canvas id="simulation"></canvas>
    </main>
    <script type="module">
      import { Simulation } from '../src/index.js';

      const simulation = new Simulation({
        canvas: '#simulation',
        gridSize: 72,
        substepsPerFrame: 20,
        gravity: { x: 0, y: -9.8 },
        renderer: { particleSize: 2.3, showGrid: true },
      });

      simulation.addRectangle({
        x: 0.08, y: 0.04, width: 0.23, height: 0.42,
        material: 'fluid',
      });
      simulation.addCircle({
        x: 0.55, y: 0.72, radiusX: 0.11,
        material: 'elastic',
      });
      simulation.addEllipse({
        x: 0.78, y: 0.7, radiusX: 0.1, radiusY: 0.07,
        material: 'snow',
      });
      simulation.start();

      // Optional: expose the instance for console experimentation.
      window.mlsMpm = simulation;
    </script>
  </body>
</html>
