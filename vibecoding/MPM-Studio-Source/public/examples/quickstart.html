<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPM Studio quick start</title>
<style>body{margin:0;background:#11121a;color:#f1f2f8;font:14px system-ui;padding:24px}#simulation{height:min(74vh,650px);min-height:360px;border:1px solid #33364a;border-radius:12px;overflow:hidden}#simulation canvas{width:100%;height:100%;display:block}.bar{display:flex;gap:8px;align-items:center;padding:12px 0}button{background:#312a50;border:1px solid #6456a3;color:#fff;border-radius:7px;padding:8px 12px;cursor:pointer}small{color:#9da1b2}</style>
</head>
<body>
  <h1>MPM Studio · quick start</h1><small>One script tag, no framework dependencies.</small>
  <div class="bar"><button id="play">Play</button><button id="pause">Pause</button><button id="add">Add water</button><small id="status">Starting…</small></div>
  <div id="simulation"></div>
  <script type="module">
    import * as TaichiMPM from "/taichi-mpm.mjs";
    TaichiMPM.create({container:'#simulation',scene:'water-wheel-2d',quality:'low',autoPlay:false})
      .then(sim=>{
        window.sim=sim;
        sim.on('ready',info=>document.querySelector('#status').textContent=info.simd?'WASM SIMD ready':'WASM scalar ready');
        sim.on('error',err=>document.querySelector('#status').textContent=err.message);
        document.querySelector('#play').onclick=()=>sim.play();
        document.querySelector('#pause').onclick=()=>sim.pause();
        document.querySelector('#add').onclick=()=>sim.emitParticles([.5,.8],[0,.6],'water');
      }).catch(err=>document.querySelector('#status').textContent=err.message);
  </script>
</body>
</html>
