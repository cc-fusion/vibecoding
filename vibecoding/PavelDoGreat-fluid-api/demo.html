<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FluidSimulation — merged API demo</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #070914; color: #eef1ff; }
    #fluid { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; touch-action: none; }
    .panel {
      position: fixed; z-index: 1; top: 20px; left: 20px; width: min(360px, calc(100vw - 40px));
      padding: 18px; border: 1px solid rgba(215,223,255,.18); border-radius: 16px;
      background: rgba(9, 12, 30, .78); box-shadow: 0 18px 60px rgba(0,0,0,.28); backdrop-filter: blur(16px);
    }
    h1 { font-size: 18px; margin: 0 0 6px; letter-spacing: -.02em; }
    p { color: #b8c0e0; font-size: 13px; line-height: 1.5; margin: 0 0 14px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: grid; gap: 5px; font-size: 12px; color: #cdd4f2; }
    select, button { width: 100%; border: 1px solid rgba(225,230,255,.18); border-radius: 9px; padding: 9px 10px; color: #f7f8ff; background: #151a35; font: inherit; font-size: 13px; }
    button { cursor: pointer; transition: transform .12s ease, background .12s ease; }
    button:hover { background: #252d51; }
    button:active { transform: translateY(1px); }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    #status { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(225,230,255,.13); color: #8ee8d9; font-size: 11px; min-height: 26px; }
    .hint { position: fixed; right: 20px; bottom: 18px; z-index: 1; font-size: 12px; color: rgba(235,239,255,.72); text-shadow: 0 1px 8px #000; }
    @media (max-width: 520px) { .panel { top: 10px; left: 10px; width: calc(100vw - 20px); padding: 14px; } .hint { right: 12px; bottom: 10px; } }
  </style>
</head>
<body>
  <canvas id="fluid" aria-label="Interactive fluid simulation"></canvas>
  <section class="panel" aria-label="Fluid simulation controls">
    <h1>FluidSimulation <span style="color:#8ee8d9">2.0</span></h1>
    <p>Drag across the canvas to stir the flow. Change a preset or quality level without recreating the simulation.</p>
    <div class="fields">
      <label>Visual preset
        <select id="preset">
          <option value="neon" selected>Neon</option><option value="ocean">Ocean</option>
          <option value="fire">Fire</option><option value="smoke">Smoke</option>
          <option value="ink">Ink</option><option value="calm">Calm</option>
          <option value="vivid">Vivid</option><option value="classic">Classic</option>
        </select>
      </label>
      <label>Quality
        <select id="quality">
          <option value="performance">Performance</option><option value="low">Low</option>
          <option value="medium" selected>Medium</option><option value="high">High</option><option value="ultra">Ultra</option>
        </select>
      </label>
    </div>
    <div class="actions">
      <button id="pause">Pause</button>
      <button id="burst">Add color</button>
      <button id="clear">Clear</button>
    </div>
    <div class="actions">
      <button id="transparent">Transparent</button>
      <button id="capture">Save PNG</button>
      <button id="destroy">Destroy</button>
    </div>
    <div id="status" role="status" aria-live="polite">Starting WebGL…</div>
  </section>
  <div class="hint">Interactive WebGL fluid · drag the background</div>

  <script src="fluid-simulation-merged.js"></script>
  <script>
    (function () {
      const status = document.getElementById('status');
      let fluid = null;
      let transparent = false;
      const say = message => { status.textContent = message; };

      fluid = FluidSimulation.createIfSupported({
        canvas: '#fluid', preset: 'neon', quality: 'medium',
        input: true, initialSplats: 9, maxPixelRatio: 1.75,
        onError(error) { say('Could not initialize: ' + error.message); }
      });

      if (!fluid) {
        say('WebGL fluid is unavailable in this browser/device.');
        return;
      }

      fluid.on('ready', () => say('Ready · ' + (fluid.isWebGL2 ? 'WebGL 2' : 'WebGL 1')));
      fluid.on('error', error => say('WebGL event · ' + error.code));
      fluid.on('resize', size => say('Canvas · ' + size.width + ' × ' + size.height));

      document.getElementById('preset').addEventListener('change', event => {
        if (!fluid || fluid.destroyed) return;
        fluid.applyPreset(event.target.value);
        say('Preset · ' + event.target.value);
      });
      document.getElementById('quality').addEventListener('change', event => {
        if (!fluid || fluid.destroyed) return;
        fluid.setQuality(event.target.value);
        say('Quality · ' + event.target.value);
      });
      document.getElementById('pause').addEventListener('click', event => {
        if (!fluid || fluid.destroyed) return;
        fluid.togglePause();
        event.currentTarget.textContent = fluid.isPaused() ? 'Resume' : 'Pause';
        say(fluid.isPaused() ? 'Physics paused · render remains active' : 'Simulation resumed');
      });
      document.getElementById('burst').addEventListener('click', () => {
        if (!fluid || fluid.destroyed) return;
        fluid.randomSplats(8);
        say('Added 8 splats');
      });
      document.getElementById('clear').addEventListener('click', () => {
        if (!fluid || fluid.destroyed) return;
        fluid.clear();
        say('Fluid fields cleared');
      });
      document.getElementById('transparent').addEventListener('click', () => {
        if (!fluid || fluid.destroyed) return;
        transparent = !transparent;
        fluid.setTransparent(transparent).setConfig({ checkerboard: false });
        document.body.style.background = transparent ? 'radial-gradient(circle at 75% 25%, #252d56, #080b18 55%)' : '#070914';
        say(transparent ? 'Transparent mode enabled' : 'Opaque background restored');
      });
      document.getElementById('capture').addEventListener('click', () => {
        if (!fluid || fluid.destroyed) return;
        try { fluid.download('fluid-simulation.png', { resolution: 1024 }); say('Saved PNG'); }
        catch (error) { say('Capture failed · ' + error.message); }
      });
      document.getElementById('destroy').addEventListener('click', event => {
        if (fluid && !fluid.destroyed) {
          fluid.destroy();
          event.currentTarget.textContent = 'Destroyed';
          say('Instance destroyed · reload the page to restart');
        }
      });

      window.fluidDemo = { get instance() { return fluid; } };
    })();
  </script>
</body>
</html>
